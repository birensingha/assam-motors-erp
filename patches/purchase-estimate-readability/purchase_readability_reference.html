<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parts Purchase — Comfortable View</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17344f;font-family:Arial,sans-serif}:root{--am-ui-scale:1.15;--am-page-font:calc(15px * var(--am-ui-scale));--am-label-font:calc(12px * var(--am-ui-scale));--am-title-font:calc(24px * var(--am-ui-scale));--am-table-font:calc(13px * var(--am-ui-scale));--am-control-h:calc(44px * var(--am-ui-scale))}
.page{width:min(100%,1700px);margin:auto;padding:20px;font-size:var(--am-page-font)}.head{background:#0b315b;color:#fff;border-radius:14px;padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{margin:0;font-size:var(--am-title-font)}.head p{margin:5px 0 0;opacity:.8}.panel{background:#fff;border:1px solid #dbe5ee;border-radius:12px;padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}label{font-size:var(--am-label-font);font-weight:800;color:#5b7084}input,select,textarea{width:100%;margin-top:5px;min-height:var(--am-control-h);padding:10px 11px;border:1px solid #cad8e5;border-radius:8px;font-size:var(--am-page-font)}.table{overflow:auto;border:1px solid #dbe5ee;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:1450px;font-size:var(--am-table-font)}th{position:sticky;top:0;background:#eaf2fb;padding:10px;white-space:nowrap;text-align:left}td{border-top:1px solid #e7edf3;padding:8px}td input,td select{margin:0;min-height:calc(40px * var(--am-ui-scale));font-size:var(--am-table-font)}.num{text-align:right}.footer{display:flex;gap:14px;margin-top:14px;align-items:flex-start}.notes{flex:1}.totals{min-width:380px;background:#f8fbfe;border:1px solid #dbe5ee;border-radius:10px;padding:13px}.totals div{display:flex;justify-content:space-between;padding:7px}.totals .grand{font-size:calc(20px * var(--am-ui-scale));font-weight:900;border-top:1px solid #dbe5ee}.actions,.size{display:flex;gap:7px;flex-wrap:wrap}.btn,.size button{border:0;border-radius:8px;min-height:40px;padding:0 13px;font-weight:850}.save{background:#168445;color:#fff}.add{background:#f59e0b;color:#fff}.size button{background:#fff;color:#244966;border:1px solid #cbd8e5}.size button[aria-pressed=true]{background:#0b315b;color:#fff}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.footer{flex-direction:column}.totals{width:100%;min-width:0}}@media print{.size,.screen-only{display:none!important}:root{--am-ui-scale:1}}
</style></head><body><div class="page">
<div class="head"><div><h1>Parts Purchase Entry</h1><p>Comfortable in-page view · no separate popup</p></div><div class="size screen-only"><button data-am-scale="1">100%</button><button data-am-scale="1.15">115%</button><button data-am-scale="1.25">125%</button></div></div>
<div class="panel grid"><label>Vendor<input placeholder="Search vendor"></label><label>Bill No.<input></label><label>Invoice Date<input type="date"></label><label>Purchase Date<input type="date"></label></div>
<div class="panel"><div class="table"><table><thead><tr><th>#</th><th>Part Code</th><th>Part Name</th><th>Purchase Against</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Disc %</th><th class="num">Tax %</th><th class="num">Amount</th><th></th></tr></thead><tbody>
<tr><td>1</td><td><input placeholder="Search code"></td><td><input placeholder="Search part name"></td><td><input placeholder="Job Card / Vehicle"></td><td><input value="1"></td><td><input value="0"></td><td><input value="0"></td><td><input value="0"></td><td class="num"><b>0.00</b></td><td>×</td></tr>
<tr><td>2</td><td><input placeholder="Search code"></td><td><input placeholder="Search part name"></td><td><input placeholder="Job Card / Vehicle"></td><td><input value="1"></td><td><input value="0"></td><td><input value="0"></td><td><input value="0"></td><td class="num"><b>0.00</b></td><td>×</td></tr>
</tbody></table></div><div class="actions screen-only" style="margin-top:12px"><button class="btn add">+ Add Line</button></div>
<div class="footer"><label class="notes">Remarks<textarea rows="4"></textarea></label><div class="totals"><div><span>Subtotal</span><b>0.00</b></div><div><span>Tax</span><b>0.00</b></div><div class="grand"><span>Grand Total</span><b>0.00</b></div></div></div>
<div class="actions screen-only"><button class="btn save">Save Purchase</button></div></div>
</div><script>
(function(){const k='am_workshop_ui_scale',a=['1','1.15','1.25'];function s(v){v=a.includes(String(v))?String(v):'1.15';document.documentElement.style.setProperty('--am-ui-scale',v);document.querySelectorAll('[data-am-scale]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.amScale)===v?'true':'false'));try{localStorage.setItem(k,v)}catch(e){}}let v='1.15';try{const x=localStorage.getItem(k);if(a.includes(x))v=x}catch(e){}s(v);document.querySelectorAll('[data-am-scale]').forEach(b=>b.onclick=()=>s(b.dataset.amScale));})();
</script></body></html>
