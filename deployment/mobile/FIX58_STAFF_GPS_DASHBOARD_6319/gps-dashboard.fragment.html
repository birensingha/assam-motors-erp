<!-- FIX58_APP_MOBILE_GPS_DASHBOARD : injected into existing signed-app SOURCE only -->
<template id="amGps6320Template">
<header class="amg-head"><div><div class="amg-heading">📍 Staff Live Location</div><div class="amg-sub">ASSAM MOTORS · WORKFORCE INTELLIGENCE</div></div><div class="amg-clock"><span class="amg-badge stale" id="amgLive">WAITING GPS</span><div id="amgClock">IST</div><div id="amgServerAge">Waiting for ERP</div></div></header>
<div class="amg-kpis" aria-label="Staff GPS overview"><div class="amg-kpi"><label>👥 Active Staff</label><strong id="amgTotal">—</strong></div><div class="amg-kpi"><label>📡 Fresh GPS</label><strong id="amgFresh">—</strong></div><div class="amg-kpi"><label>🕒 Delayed / Stale</label><strong id="amgStale">—</strong></div><div class="amg-kpi"><label>✅ Checked In</label><strong id="amgChecked">—</strong></div><div class="amg-kpi"><label>🔧 ROT Active</label><strong id="amgRot">—</strong></div></div>
<section class="amg-card amg-person" aria-live="polite"><span class="amg-avatar" id="amgAvatar">—</span><div class="amg-person-content"><strong id="amgName">Select a staff member</strong><small id="amgSelectedInfo">Latest GPS and accuracy appear here.</small></div><span class="amg-badge stale" id="amgSelectedBadge">NO GPS</span></section>
<section class="amg-card amg-map-shell" aria-label="Selected staff reported GPS map"><div class="amg-map-toolbar"><button id="amgFollow" type="button" aria-pressed="true">◎ Follow ON</button><button id="amgFocus" type="button">⌖ Focus</button><button id="amgWorkshop" type="button" disabled>⌂ Workshop</button><button class="amg-primary" id="amgRefresh" type="button">↻ Refresh</button></div><div class="amg-map-frame" id="amgMap"><div class="amg-map-empty">Select staff to view a reported GPS point.</div></div><div class="amg-map-note" id="amgMapNote">Only real coordinates are shown. Weak and stale GPS is not verified LIVE.</div></section>
<section class="amg-card"><div class="amg-section-title"><strong>👥 Staff Location Register</strong><span><small id="amgUpdated">Not synced</small><button id="amgSolo" class="amg-clear" type="button">Focus one</button></span></div><input class="amg-search" id="amgSearch" placeholder="Search staff name / code" autocomplete="off" type="search"><div class="amg-filters"><select id="amgPresence" aria-label="Filter location"><option value="all">All staff</option><option value="fresh">Fresh GPS</option><option value="stale">Delayed / Stale</option><option value="none">No GPS</option></select><select id="amgAttendance" aria-label="Filter attendance"><option value="all">All attendance</option><option value="in">Checked In</option><option value="out">Not Checked In</option></select></div><div class="amg-staff-list" id="amgList" aria-live="polite"><div class="amg-empty">Loading Staff from ERP…</div></div><div id="amgError" class="amg-error" style="display:none"></div></section>
<section class="amg-card amg-detail"><div class="amg-section-title"><strong>Selected Staff GPS Details</strong><button class="amg-clear" id="amgAll" type="button">All Staff</button></div><div class="amg-detail-grid"><div class="amg-datum"><small>Last GPS Fix</small><strong id="amgFixAge">—</strong></div><div class="amg-datum"><small>GPS Accuracy</small><strong id="amgAccuracy">—</strong></div><div class="amg-datum"><small>Fix Quality</small><strong id="amgQuality">—</strong></div><div class="amg-datum"><small>Attendance</small><strong id="amgAttendanceText">—</strong></div></div><p class="amg-map-note">GPS recorded time and server refresh time are different. Refreshing the screen does not make an old fix fresh.</p></section>
</template>
