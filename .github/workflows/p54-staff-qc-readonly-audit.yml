name: P54 Staff QC and Job Card Index — STAGING Readonly Audit
on:
  push:
    branches: [feature/p54-staff-qc-flow-and-clean-jc-20261018]
    paths:
      - '.github/workflows/p54-staff-qc-readonly-audit.yml'
      - 'deployment/live-fixes/P54_QC_STAFF/READONLY_AUDIT.php'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      APP_ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: php -l deployment/live-fixes/P54_QC_STAFF/READONLY_AUDIT.php
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          install -d -m 700 ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ];then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          fi
      - name: Read only selected Job Card and source file references
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ];then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
            SCP=(scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -P "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
            SCP=(sshpass -e scp -o StrictHostKeyChecking=accept-new -P "$SSH_PORT")
          fi
          REMOTE="$SSH_USER@$SSH_HOST"
          TEMP="/home/$SSH_USER/p54-qc-audit-$GITHUB_RUN_ID"
          "${SSH[@]}" "$REMOTE" "mkdir -p '$TEMP'"
          "${SCP[@]}" deployment/live-fixes/P54_QC_STAFF/READONLY_AUDIT.php "$REMOTE:$TEMP/READONLY_AUDIT.php"
          "${SSH[@]}" "$REMOTE" "APP_ROOT='$APP_ROOT' TEMP='$TEMP' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -rf "$TEMP"' EXIT
          php "$TEMP/READONLY_AUDIT.php" "$APP_ROOT"
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
