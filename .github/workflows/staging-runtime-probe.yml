name: Assam Motors Staging Runtime Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/staging-runtime-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      APP_ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.assammotors.com' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi

      - name: Collect sanitized runtime report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/runtime
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH_CMD=(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH_CMD=(sshpass -e ssh -p "$SSH_PORT")
          fi

          "${SSH_CMD[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- '$APP_ROOT' '$STAGING_BASE_URL'" > deployment/runtime/STAGING_RUNTIME_PROBE.md <<'REMOTE'
          set -euo pipefail
          APP_ROOT="$1"
          BASE="$2"
          TARGET="$APP_ROOT/public/legacy/workshop/customers.php"

          echo "# Assam Motors Staging Runtime Probe"
          echo
          echo "Generated: $(date -Is)"
          echo
          echo "APP_TARGET_EXISTS=$(test -f "$TARGET" && echo yes || echo no)"
          echo "APP_TARGET_FIX40=$(test -f "$TARGET" && grep -q 'FIX40_DIRECT_BROWSER_REDIRECT' "$TARGET" && echo present || echo missing)"

          mapfile -t FILES < <(find "$HOME/domains/assammotors.com" -type f -path '*/legacy/workshop/customers.php' -print 2>/dev/null | head -20)
          echo "CANDIDATE_COUNT=${#FILES[@]}"

          PROBE="am-staging-path-probe-$$.txt"
          created=()
          idx=0
          for f in "${FILES[@]}"; do
            idx=$((idx+1))
            d="$(dirname "$f")"
            rel="${f#"$HOME/domains/assammotors.com/"}"
            marker="$(grep -q 'FIX40_DIRECT_BROWSER_REDIRECT' "$f" && echo present || echo missing)"
            echo "CANDIDATE_${idx}_REL=${rel}"
            echo "CANDIDATE_${idx}_FIX40=${marker}"
            if [ -w "$d" ]; then
              printf 'CANDIDATE_%s' "$idx" > "$d/$PROBE"
              created+=("$d/$PROBE")
            fi
          done

          served="$(curl -fsS --max-time 15 "$BASE/legacy/workshop/$PROBE" 2>/dev/null || true)"
          echo "SERVED_CANDIDATE=${served:-not_found}"

          for p in "${created[@]}"; do rm -f "$p"; done

          TMPH="$(mktemp)"
          TMPB="$(mktemp)"
          code="$(curl -sS --max-redirs 0 -D "$TMPH" -o "$TMPB" -w '%{http_code}' "$BASE/legacy/workshop/customers.php" || true)"
          echo "LEGACY_HTTP_CODE=$code"
          loc="$(awk 'BEGIN{IGNORECASE=1} /^Location:/{gsub(/\\r/,""); sub(/^Location:[[:space:]]*/,""); print; exit}' "$TMPH")"
          echo "LEGACY_LOCATION=${loc:-none}"
          if grep -qi 'Admin login required' "$TMPB"; then
            echo "LEGACY_ADMIN_LOGIN_ERROR=yes"
          else
            echo "LEGACY_ADMIN_LOGIN_ERROR=no"
          fi
          rm -f "$TMPH" "$TMPB"
          REMOTE

      - name: Commit sanitized runtime report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "assam-motors-staging-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deployment/runtime/STAGING_RUNTIME_PROBE.md
          if git diff --cached --quiet; then
            echo "No runtime report change"
            exit 0
          fi
          git commit -m "chore: update sanitized staging runtime probe [skip ci]"
          git push origin HEAD:main
