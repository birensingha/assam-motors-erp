name: Assam Motors Staging Runtime Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/staging-runtime-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      APP_ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.assammotors.com' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi

      - name: Collect sanitized runtime report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/runtime
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH_CMD=(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH_CMD=(sshpass -e ssh -p "$SSH_PORT")
          fi

          "${SSH_CMD[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- '$APP_ROOT' '$STAGING_BASE_URL'" > deployment/runtime/STAGING_RUNTIME_PROBE.md <<'REMOTE'
          set -euo pipefail
          APP_ROOT="$1"
          BASE="$2"
          TARGET="$APP_ROOT/public/legacy/workshop/customers.php"

          echo "# Assam Motors Staging Runtime Probe"
          echo
          echo "Generated: $(date -Is)"
          echo
          echo "## App target"
          echo "- APP_ROOT: `$APP_ROOT`"
          echo "- Target exists: $(test -f "$TARGET" && echo yes || echo no)"
          if [ -f "$TARGET" ]; then
            echo "- Target realpath: `$(readlink -f "$TARGET")`"
            echo "- FIX40 marker: $(grep -q 'FIX40_DIRECT_BROWSER_REDIRECT' "$TARGET" && echo present || echo missing)"
            echo "- SHA256: `$(sha256sum "$TARGET" | awk '{print $1}')`"
          fi
          echo
          echo "## Candidate legacy customer files"
          find "$HOME/domains/assammotors.com" -type f -path '*/legacy/workshop/customers.php' -print 2>/dev/null | head -20 | while read -r f; do
            echo "- `$f`"
            echo "  - realpath: `$(readlink -f "$f")`"
            echo "  - FIX40: $(grep -q 'FIX40_DIRECT_BROWSER_REDIRECT' "$f" && echo present || echo missing)"
            echo "  - SHA256: `$(sha256sum "$f" | awk '{print $1}')`"
          done
          echo
          echo "## Public webroot hints"
          for d in "$HOME/domains/assammotors.com/public_html" "$HOME/domains/assammotors.com/assam-erp-staging/public"; do
            if [ -e "$d" ]; then
              echo "- `$d` -> `$(readlink -f "$d")`"
            fi
          done
          echo
          echo "## HTTP legacy URL"
          TMPH="$(mktemp)"
          TMPB="$(mktemp)"
          code="$(curl -sS -L --max-redirs 0 -D "$TMPH" -o "$TMPB" -w '%{http_code}' "$BASE/legacy/workshop/customers.php" || true)"
          echo "- HTTP code without following redirect: `$code`"
          loc="$(awk 'BEGIN{IGNORECASE=1} /^Location:/{gsub(/\r/,""); sub(/^Location:[[:space:]]*/,""); print; exit}' "$TMPH")"
          if [ -n "$loc" ]; then echo "- Location: `$loc`"; fi
          if grep -qi 'Admin login required' "$TMPB"; then
            echo "- Body contains Admin login required: yes"
          else
            echo "- Body contains Admin login required: no"
          fi
          rm -f "$TMPH" "$TMPB"
          REMOTE

      - name: Commit sanitized runtime report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "assam-motors-staging-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deployment/runtime/STAGING_RUNTIME_PROBE.md
          if git diff --cached --quiet; then
            echo "No runtime report change"
            exit 0
          fi
          git commit -m "chore: update sanitized staging runtime probe [skip ci]"
          git push origin HEAD:main
