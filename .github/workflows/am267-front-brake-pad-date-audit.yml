name: AM267 Front Brake Pad Ledger Dates and Source Reconciliation
on:
  push:
    branches: [fix/am267-item-ledger-document-vs-posted-dates-20261117]
    paths: [.github/workflows/am267-front-brake-pad-date-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM267_LEDGER_SOURCE_HASH
          sha256sum app/Http/Controllers/Web/AdminMasterItemLedgerController.php resources/views/admin/native/item-ledger.blade.php
          echo AM267_PURCHASE_LEDGER_SOURCE_MATCHES
          grep -n -E 'purchase_date|created_at|GRN_RECEIPT_IN|sort_time|sort_id|usort|event\\(' app/Http/Controllers/Web/AdminMasterItemLedgerController.php | head -115
          echo AM267_SOURCE_DB_FACTS
          PHP="$(mktemp --suffix=.php)"
          trap 'rm -f "$PHP"' EXIT
          cat > "$PHP" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';
          $app=require getcwd().'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $D=\Illuminate\Support\Facades\DB::class;
          $S=\Illuminate\Support\Facades\Schema::class;
          $p=$D::table('parts_master')->where('part_code','AM-0234')->first(['id','part_code','part_name','stock_qty']);
          echo 'AM267_MASTER='.json_encode($p)."\n";
          if($p){
            $m=$D::table('inventory_movements as m')->leftJoin('job_cards as j','j.id','=','m.job_card_id')
              ->where('m.part_master_id',$p->id)->orderBy('m.created_at')->orderBy('m.id')
              ->get(['m.id','m.created_at','m.movement_type','m.qty_in','m.qty_out','m.balance_after','m.reference_no','m.note','j.job_no']);
            echo 'AM267_ALL_MOVEMENTS='.json_encode($m)."\n";
            $bills=$D::table('workshop_purchases as p')->leftJoin('workshop_vendors as v','v.id','=','p.vendor_id')
              ->where('p.part_master_id',$p->id)->orderBy('p.purchase_date')->orderBy('p.id')
              ->get(['p.id','p.purchase_no','p.purchase_batch_no','p.purchase_date','p.created_at','p.updated_at',
                  'p.supplier_invoice','p.supplier_name','v.vendor_name','p.vendor_id','p.qty','p.record_status','p.job_card_id','p.total_amount']);
            echo 'AM267_BILL_LINES='.json_encode($bills)."\n";
            $grn=$D::table('am260_grn_lines as l')->join('am260_grns as g','g.id','=','l.grn_id')
              ->leftJoin('workshop_vendors as v','v.id','=','g.vendor_id')
              ->where('l.part_master_id',$p->id)
              ->get(['l.id','l.qty_received','l.qty_billed','g.id as grn_id','g.grn_no','g.challan_no',
                    'g.challan_date','g.receipt_date','g.created_at','g.vendor_id','v.vendor_name']);
            echo 'AM267_GRN_LINES='.json_encode($grn)."\n";
            $links=$D::table('am260_grn_bill_allocations as a')
             ->join('am260_grn_lines as gl','gl.id','=','a.grn_line_id')
             ->join('am260_grn_bills as b','b.id','=','a.bill_id')
             ->where('gl.part_master_id',$p->id)->get(['a.purchase_id','a.grn_line_id','b.vendor_id','b.supplier_invoice','b.batch_no','b.purchase_date']);
            echo 'AM267_GRN_BILL_LINKS='.json_encode($links)."\n";
          }
          echo 'AM267_READONLY_DONE'."\n";
          PHP
          php "$PHP"

          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
