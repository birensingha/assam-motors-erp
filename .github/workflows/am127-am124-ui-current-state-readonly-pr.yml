name: AM127 OSL Visible Delete Staging State
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Read-only live UI and totals check
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=12)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=12);fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          if grep -Fq 'AM124_VISIBLE_OSL_DELETE' resources/views/job-cards/show.blade.php;then
            echo "AM127_VISIBLE_DELETE_CODE=INSTALLED"
            grep -nF 'data-am124-osl-delete' resources/views/job-cards/show.blade.php | head -n 5
          else echo "AM127_VISIBLE_DELETE_CODE=MISSING";fi
          if test -f "$HOME/AM124_OSL_VISIBLE_DELETE/apply.py";then
            echo "AM127_AM124_PATCH=ON_STAGING_HOST"
          else echo "AM127_AM124_PATCH=NOT_ON_STAGING_HOST";fi
          php artisan route:list --path=job-cards | grep 'osl-billing' || true
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $a=require 'bootstrap/app.php';
          $a->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          use Illuminate\Support\Facades\DB;
          $c=DB::table('job_cards')->where('job_no','JC-20261025-00042')->first();
          echo 'AM127_BILLING_ROW_IDS='.json_encode(DB::table('job_card_labour')->where('job_card_id',$c->id)->orderBy('id')->pluck('id')->all()).PHP_EOL;
          echo 'AM127_SAVED_GRAND_TOTAL='.$c->grand_total.PHP_EOL;
          echo 'AM127_SAVED_GST='.$c->gst_total.PHP_EOL;
          echo 'AM127_CURRENT_SERVICE_TOTAL='.\App\Services\JobCardTaxTotals::forJob($c->id)['grand_total'].PHP_EOL;
          echo 'AM127_ACTIVE_OSL_PURCHASES='.DB::table('workshop_purchases')->where('job_card_id',$c->id)->where('purchase_type','OSL')->where('record_status','ACTIVE')->whereNull('deleted_at')->count().PHP_EOL;
          echo "AM127_READ_ONLY_DONE\n";
          PHP
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519