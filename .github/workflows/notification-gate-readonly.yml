name: Assam Motors Notification Gate Readonly Audit
on:
  push:
    branches: [fix/hr-attendance-403-20261013]
    paths: [.github/workflows/notification-gate-readonly.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Simulate authenticated HR web requests with Laravel middleware (read-only)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$APP"
          echo '=== NOTIFICATION GATE SOURCE ==='
          grep -RsnFi --include='*.php' --exclude-dir=vendor --exclude-dir=storage --exclude-dir=node_modules 'mandatory notifications must be enabled' "$APP/app" "$APP/routes" "$HOME/domains/assammotors.com/public_html/staging/legacy" 2>/dev/null | head -18 || true
          grep -RsnEi --include='*.php' --exclude-dir=vendor --exclude-dir=storage --exclude-dir=node_modules 'notification_permission.*(required|false|deny)|notification.*(start|check.in|resume)|notifications.*must' "$APP/app" "$APP/routes" "$HOME/domains/assammotors.com/public_html/staging/legacy" 2>/dev/null | head -48 || true
          echo '=== STAGING DEVICE AUTH AND ATTENDANCE ROUTES ==='
          php artisan route:list --path=api/v1/staff/device --except-vendor | head -12
          php artisan route:list --path=api/v1/attendance --except-vendor | head -30
          echo '=== DEVICE AND USER SCHEMA METADATA ONLY ==='
          php -r '
          require "vendor/autoload.php";$app=require "bootstrap/app.php";$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          foreach(["staff_devices","staff_device_tokens","staff_device_registrations","staff","staff_login_events"] as $t){
            if(\Illuminate\Support\Facades\Schema::hasTable($t))echo "TABLE_SCHEMA ".$t."=".implode(",",\Illuminate\Support\Facades\Schema::getColumnListing($t))."\n";
          }'
          echo 'NOTIFICATION-GATE-SOURCE-AUDIT:PASS'
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"