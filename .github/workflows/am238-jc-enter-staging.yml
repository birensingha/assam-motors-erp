name: AM238 JC selection Enter keyboard fix STAGING guarded
on:
  push:
    branches: [feature/am238-purchase-jc-enter-fix]
    paths:
      - '.github/workflows/am238-jc-enter-staging.yml'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.assammotors.com' }}
      STAGING_LOGIN_PATH: ${{ vars.STAGING_LOGIN_PATH || '/erp/login' }}
      STAGING_ADMIN_LOGIN: ${{ secrets.STAGING_ADMIN_LOGIN }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      SMOKE_OUTPUT_DIR: am238-browser-proof
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch and browser-test syntax
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM238_PURCHASE_ENTER/apply.py
          node --check deployment/live-fixes/AM238_PURCHASE_ENTER/qa/browser-test.mjs
      - name: Configure SSH for guarded staging patch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Backup & patch source plus browser-served purchase JS, no business writes
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM238_ENTER"'
          "${SCP[@]}" deployment/live-fixes/AM238_PURCHASE_ENTER/apply.py "$REMOTE:~/AM238_ENTER/apply.py"
          CHECK=$("${SSH[@]}" "$REMOTE" "python3 ~/AM238_ENTER/apply.py check '$ROOT'")
          printf '%s\n' "$CHECK"
          grep -q AM238_PREFLIGHT_PASS <<<"$CHECK"
          RESULT=$("${SSH[@]}" "$REMOTE" "python3 ~/AM238_ENTER/apply.py apply '$ROOT' && cd '$ROOT' && php artisan view:clear")
          printf '%s\n' "$RESULT"
          grep -q AM238_APPLIED <<<"$RESULT"
          BACKUP=$(printf '%s\n' "$RESULT" | sed -n 's/^AM238_BACKUP=//p' | tail -1)
          test -n "$BACKUP"
          echo "AM238_BACKUP_PATH=$BACKUP" >> "$GITHUB_ENV"
          "${SSH[@]}" "$REMOTE" "cd '$ROOT' && grep -q 'AM238_JC_ENTER_SAFE_NEXT_LINE' public/js/purchase-entry.js && grep -q 'AM238_JC_ENTER_SAFE_NEXT_LINE' ../public_html/staging/js/purchase-entry.js"
          curl --silent --show-error --fail --location --max-time 25 -o "$RUNNER_TEMP/am238-public.js" 'https://staging.assammotors.com/js/purchase-entry.js?am238=1'
          grep -q AM238_JC_ENTER_SAFE_NEXT_LINE "$RUNNER_TEMP/am238-public.js"
          echo AM238_PUBLIC_JS_PROOF_PASS
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Chrome regression — selected JC Enter cannot change ID and must advance row
        run: node deployment/live-fixes/AM238_PURCHASE_ENTER/qa/browser-test.mjs
      - name: Rollback all three patched assets on failed browser QA
        if: failure() && env.AM238_BACKUP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" "python3 ~/AM238_ENTER/apply.py rollback '$ROOT' '$AM238_BACKUP_PATH' && cd '$ROOT' && php artisan view:clear"
      - name: Upload proof, including failure screenshot if applicable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am238-jc-enter-keyboard-browser-proof
          path: am238-browser-proof/
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
