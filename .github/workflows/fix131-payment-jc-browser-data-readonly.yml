name: FIX131 Payment Voucher JC Preview Data - READ ONLY
on:
  push:
    branches: [audit/fix131-voucher-jc-context-20261025]
    paths: ['.github/workflows/fix131-payment-jc-browser-data-readonly.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Verify selected PB source JC metadata and browser data attributes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX131_PREVIEW_READONLY_BEGIN'
          echo '=== CREATE PAGE SOURCE ==='
          sed -n '1,130p' resources/views/payments/create.blade.php
          echo '=== PAYMENT SOURCE CURRENT DATA FROM SERVICE ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $service=$app->make(\App\Services\ExpensePaymentService::class);
          $src=collect($service->payableSources())->firstWhere('key','PURCHASE_INVOICE::PB-261025124019-467');
          if(!$src){echo "FIX131_SOURCE_NOT_IN_OUTSTANDING_LIST\n";}
          else{
           foreach(['key','job_no','vehicle','outstanding','payee'] as $k)
             echo "SOURCE_{$k}=".($src[$k]??'NULL')."\n";
          }
          echo 'FIX131_PREVIEW_DATA_READ_ONLY_COMPLETE';
          PHP
          echo 'FIX131_PREVIEW_READONLY_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
