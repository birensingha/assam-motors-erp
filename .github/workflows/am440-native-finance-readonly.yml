name: AM440 STAGING Finance Backend Readonly Audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/am440-native-finance-readonly.yml'
      - 'deployment/audits/AM440_NATIVE_FINANCE_READONLY.sh'
      - 'deployment/audits/AM444_FINANCE_ENDPOINT_SHAPES_READONLY.sh'
      - 'deployment/audits/AM449_STAFF_NATIVE_ROUTE_READONLY.sh'
permissions:
  contents: read
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  inspect:
    name: Discover staging Laravel finance tables and routes without data changes
    if: github.head_ref == 'audit/am440-native-finance-schema-readonly-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the read-only audit script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n deployment/audits/AM440_NATIVE_FINANCE_READONLY.sh
          bash -n deployment/audits/AM444_FINANCE_ENDPOINT_SHAPES_READONLY.sh
          bash -n deployment/audits/AM449_STAFF_NATIVE_ROUTE_READONLY.sh
          test "$(grep -c 'AM440_AUDIT_NO_WRITES_COMPLETE' deployment/audits/AM440_NATIVE_FINANCE_READONLY.sh)" = 1
      - name: Configure SSH to the existing STAGING host
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Query metadata only, no ERP record values or modifications
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" < deployment/audits/AM440_NATIVE_FINANCE_READONLY.sh
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" < deployment/audits/AM444_FINANCE_ENDPOINT_SHAPES_READONLY.sh
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" < deployment/audits/AM449_STAFF_NATIVE_ROUTE_READONLY.sh
      - name: Remove transient SSH authentication material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
