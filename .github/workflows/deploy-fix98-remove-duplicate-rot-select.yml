name: FIX98 Remove Duplicate Native ROT Selection STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fix98-remove-duplicate-rot-select.yml'
      - 'deployment/live-fixes/FIX98_REMOVE_DUPLICATE_ROT_SELECT/apply.py'
      - 'deployment/live-fixes/FIX98_REMOVE_DUPLICATE_ROT_SELECT/render.php'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch and browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/FIX98_REMOVE_DUPLICATE_ROT_SELECT/apply.py
          php -l deployment/live-fixes/FIX98_REMOVE_DUPLICATE_ROT_SELECT/render.php
          python3 - <<'PY'
          from pathlib import Path
          import ast,re
          src=Path('deployment/live-fixes/FIX98_REMOVE_DUPLICATE_ROT_SELECT/apply.py').read_text()
          tree=ast.parse(src)
          addons=[n.value.value for n in ast.walk(tree) if isinstance(n,ast.Assign)
            and any(isinstance(t,ast.Name) and t.id=='addon' for t in n.targets)
            and isinstance(n.value,ast.Constant) and isinstance(n.value.value,str)]
          assert len(addons)==1
          js=re.findall(r'<script>(.*?)</script>',addons[0],re.S)
          assert len(js)==1
          Path('/tmp/fix98.js').write_text(js[0],encoding='utf8')
          for token in ['native.required=false','visible.required=true',
                        "native.style.setProperty('display','none','important')",
                        "form.addEventListener('submit'",
                        "name=\"labour_master_id\" hidden"]:
             assert token in (src+addons[0]),token
          print('FIX98_HIDE_DUPLICATE_AND_VALIDATE_VISIBLE_SEARCH_PREFLIGHT_PASS')
          PY
          node --check /tmp/fix98.js
      - name: Configure remote SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3 4; do
            if ssh-keyscan -T 14 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Backup deploy and verify with auto rollback
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX98_REMOVE_DUPLICATE_ROT_SELECT"'
          "${SCP[@]}" deployment/live-fixes/FIX98_REMOVE_DUPLICATE_ROT_SELECT/apply.py deployment/live-fixes/FIX98_REMOVE_DUPLICATE_ROT_SELECT/render.php "$REMOTE:~/FIX98_REMOVE_DUPLICATE_ROT_SELECT/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"; cd "$APP"; test -f artisan && test -d vendor
          PATCH="$HOME/FIX98_REMOVE_DUPLICATE_ROT_SELECT"
          python3 "$PATCH/apply.py" check "$APP"
          # Compile proposed source BEFORE touching the live Blade file.
          TMPB="$(mktemp "$APP/storage/app/.fix98_proposed_XXXXXX.blade.php")"
          TMPC="$(mktemp "$APP/storage/app/.fix98_compiled_XXXXXX.php")"
          FIX98_PREVIEW_PATH="$TMPB" python3 "$PATCH/apply.py" check "$APP"
          php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            file_put_contents($argv[2],\Illuminate\Support\Facades\Blade::compileString(file_get_contents($argv[1])));
          ' "$TMPB" "$TMPC"
          set +e
          PHP_LINT="$(php -d display_errors=1 -d log_errors=0 -l "$TMPC" 2>&1)"
          LINT_CODE=$?
          set -e
          if [ "$LINT_CODE" -ne 0 ]; then
            echo FIX98_COMPILED_BLADE_SYNTAX_FAIL
            printf '%s\n' "$PHP_LINT"
            echo FIX98_FOREACH_STACK_DEBUG
            grep -nE '__currentLoopData|__empty_|foreach|endforeach' "$TMPC" | head -75 | cut -c1-340 || true
            LINE="$(printf '%s\n' "$PHP_LINT" | sed -n 's/.*on line \([0-9][0-9]*\).*/\1/p' | tail -1)"
            if [ -n "$LINE" ]; then
              A=$((LINE>18?LINE-18:1))
              B=$((LINE+18))
              sed -n "${A},${B}p" "$TMPC" | head -n 40 | cut -c1-320
            fi
            rm -f "$TMPB" "$TMPC"
            exit 1
          fi
          rm -f "$TMPB" "$TMPC"
          echo FIX98_PROPOSED_BLADE_COMPILES_CLEAN
          BACKUP="storage/app/FIX98_SINGLE_ROT_FIELD_BACKUP_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP"; chmod 700 "$BACKUP"
          cp -p resources/views/job-cards/show.blade.php "$BACKUP/show.blade.php"
          rollback(){
            echo FIX98_ROLLBACK_BEGIN
            cp -p "$BACKUP/show.blade.php" resources/views/job-cards/show.blade.php
            php artisan view:clear >/dev/null 2>&1 || true
            php artisan view:cache >/dev/null 2>&1 || true
          }
          trap rollback ERR
          python3 "$PATCH/apply.py" apply "$APP"
          php artisan view:clear
          php artisan view:cache
          php "$PATCH/render.php" "$APP"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('resources/views/job-cards/show.blade.php').read_text(errors='replace')
          for token in ('id="FIX98_ONE_SEARCHABLE_ROT_ONLY"',
                        'data-am98-hidden-native="1"',
                        'style="display:none !important;"',
                        'native.required=false','visible.required=true',
                        'id="FIX97_ONE_VISIBLE_ROT_COMBO"',
                        'id="FIX96_SINGLE_ROW_LABOUR_COMBO"',
                        'am96-visible-search','am96-arrow',
                        'id="am82-rot-select"','id="am82-rot-search"',
                        'id="am90-labour-billing"','id="am91-add-osl"',
                        'id="FIX95_ROT_ONE_ROW_NO_BILLING_BOX"',
                        "route('erp.job-cards.labour.direct',$job->id)"):
             assert token in s,token
          assert s.count('id="FIX98_ONE_SEARCHABLE_ROT_ONLY"')==1
          assert s.count('id="am82-rot-select"')==1
          assert s.count('data-am98-hidden-native="1"')==1
          assert 'id="am82-rot-select" name="labour_master_id" required' not in s
          assert "native.dispatchEvent(new Event('change',{bubbles:true}))" in s
          print('FIX98_ONE_USER_VISIBLE_ROT_SEARCH_WITH_AUTOFILL_AND_AJAX_PRESERVED_PASS')
          PY
          for path in /erp/login /staff/login; do
            status="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")"
            echo "FIX98_HEALTH_$path=$status"
            test "$status" = 200
          done
          trap - ERR
          echo "FIX98_STAGING_DEPLOY_SUCCESS BACKUP=$BACKUP UI_ONLY_NO_FINANCIAL_OR_ROT_WRITES"
          REMOTE
      - name: Cleanup SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
