name: Assam Motors P21 Inspection/Nav Focus Audit
on:
  push:
    branches: [feature/p21-inspection-manager-sequential-workflow-20261014]
    paths: [.github/workflows/p21-inspection-nav-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only auth mapping, routes and attendance source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          test -f "$ROOT/artisan"
          cd "$ROOT"
          echo '== ALL ROUTE INSPECTION MATCHES =='
          php artisan route:list --json | php -r '$r=json_decode(stream_get_contents(STDIN),true);foreach($r as $x){if(stripos($x["uri"].$x["name"],"inspection")!==false)echo $x["method"]." ".$x["uri"]." ".$x["name"].PHP_EOL;}'
          echo '== ERP NAV INSPECTION MARKERS =='
          grep -nEi -C 3 'vehicle inspection|inspections|staff.portal|attendance' resources/views/layouts/erp.blade.php | head -n 95 || true
          echo '== INSPECTION ITEM TABLE =='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $schema=\Illuminate\Support\Facades\Schema::class;
          foreach(['job_card_inspection','job_card_inspection_assignments','job_card_diagnosis_events','job_card_labour','job_card_parts'] as $t){
            echo $t.'='.(int)$schema::hasTable($t).PHP_EOL;
            if($schema::hasTable($t))echo implode(',',$schema::getColumnListing($t)).PHP_EOL;
          }
          PHP
          echo '== ESTIMATE STORE RAW TOP =='
          sed -n '1,130p' app/Http/Controllers/Web/AdminEstimatePageController.php
          echo '== ESTIMATE SERVICE GATES =='
          grep -nEi -C 3 'inspection_status|diagnosis_status|decision_status|estimate_allowed' app/Services/EstimateService.php | head -n 100 || true
          echo 'P21_NAV_AUDIT_PASS'
          REMOTE
      - if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
