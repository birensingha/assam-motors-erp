name: Inspect Web Route Anchors Lifecycle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-web-route-anchors-lifecycle.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact route/view anchors
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          fi
          ROOT="/home/$SSH_USER/domains/assammotors.com/assam-erp-staging"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "ROOT='$ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$ROOT"
          echo '=== WEB IMPORTS FIRST 120 ==='
          sed -n '1,120p' routes/web.php
          echo '=== WEB JOBCARD ROUTE AREA ==='
          grep -n "erp.job-cards" routes/web.php | head -n 120
          line=$(grep -n "erp.job-cards.show" routes/web.php | head -1 | cut -d: -f1 || true)
          if [ -n "$line" ]; then start=$((line-45)); [ "$start" -lt 1 ] && start=1; end=$((line+120)); sed -n "${start},${end}p" routes/web.php; fi
          echo '=== SHOW BLADE 100-230 ==='
          sed -n '100,230p' resources/views/job-cards/show.blade.php
          echo '=== SHOW BLADE LAST 220 ==='
          tail -n 220 resources/views/job-cards/show.blade.php
          echo '=== ADMIN NATIVE CUSTOMER DETAIL METHODS ==='
          sed -n '430,590p' app/Http/Controllers/Web/AdminNativeModuleController.php
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
