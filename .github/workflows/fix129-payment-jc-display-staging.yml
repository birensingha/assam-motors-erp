name: FIX129 Payment Voucher JC Vehicle Display - STAGING
on:
  push:
    branches: [fix/fix129-payment-jc-display-20261025]
    paths: ['.github/workflows/fix129-payment-jc-display-staging.yml']
permissions:
  contents: read
jobs:
  deploy-staging-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Correct purchase bill JC and Vehicle display in Payment Voucher without payment writes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX129_STAGING_CHECK_START'
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/birensingha/assam-motors-erp/e08bcfa87cee4f20303933b55008d16ff180c4e0/deployment/live-fixes/FIX129_PAYMENT_JC_LINK/apply_fix129.py' -o /tmp/fix129-payment-jc.py
          python3 -m py_compile /tmp/fix129-payment-jc.py
          python3 /tmp/fix129-payment-jc.py check "$PWD"
          python3 /tmp/fix129-payment-jc.py apply "$PWD"
          echo '=== PAYMENT SOURCE PHP VERIFY ==='
          php -l app/Services/ExpensePaymentService.php
          echo 'FIX129_STAGING_DEPLOY_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
