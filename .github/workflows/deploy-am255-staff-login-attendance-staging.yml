name: AM255 New Staff Login & Attendance Incident — STAGING
on:
  push:
    branches: [fix/am255-new-staff-portal-login-20261113]
    paths:
      - .github/workflows/deploy-am255-staff-login-attendance-staging.yml
      - deployment/live-fixes/AM255_NEW_STAFF_PORTAL_LOGIN/install.py
      - deployment/live-fixes/AM255_NEW_STAFF_PORTAL_LOGIN/repair_am5848.php
      - deployment/live-fixes/AM255_NEW_STAFF_PORTAL_LOGIN/attendance_probe.php
      - deployment/live-fixes/AM255_NEW_STAFF_PORTAL_LOGIN/files/**
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax, Python installer and safety preflight
        run: |
          set -euo pipefail
          P=deployment/live-fixes/AM255_NEW_STAFF_PORTAL_LOGIN
          python3 -m py_compile "$P/install.py"
          php -l "$P/repair_am5848.php"
          php -l "$P/attendance_probe.php"
          php -l "$P/files/app/Services/StaffLoginBootstrapService.php"
          echo AM255_PACKAGE_SYNTAX_PASS
      - name: Configure Hostinger SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$PORT"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4 5 6; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: STAGING backup, secure Web/App login source fix, reconcile AM5848, attendance audit
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = "assam-erp-staging"
          test -f "$APP/artisan"
          cd "$HOME/assam-motors-deploy"
          git fetch origin fix/am255-new-staff-portal-login-20261113
          PATCH_DIR="$(mktemp -d)"
          git archive FETCH_HEAD deployment/live-fixes/AM255_NEW_STAFF_PORTAL_LOGIN | tar -x -C "$PATCH_DIR"
          PKG="$PATCH_DIR/deployment/live-fixes/AM255_NEW_STAFF_PORTAL_LOGIN"
          SCRIPT="$PKG/install.py"
          if [ -f "$APP/app/Services/StaffLoginBootstrapService.php" ]; then
            echo AM255_STAFF_AUTH_BOOTSTRAP_PRESENT_VERIFY_ONLY
          else
            python3 "$SCRIPT" check "$APP"
          fi
          # A fresh complete SQL export is required BEFORE any account row changes.
          git fetch origin feature/am246-complaint-rework-assign-20261110
          git archive FETCH_HEAD deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN | tar -x -C "$PATCH_DIR"
          BACKUP="$PATCH_DIR/deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN"
          bash "$BACKUP/staging_db_backup_shell.sh" "$APP"
          if [ ! -f "$APP/app/Services/StaffLoginBootstrapService.php" ]; then
            python3 "$SCRIPT" apply "$APP"
          fi
          # Only Staff Master ID 9 / AM5848 may be provisioned here.
          php "$PKG/repair_am5848.php" "$APP"
          python3 "$SCRIPT" verify "$APP"
          php "$PKG/attendance_probe.php" "$APP"
          echo AM255_STAGING_STAFF_LOGIN_AND_ATTENDANCE_DIAGNOSTIC_COMPLETE
          REMOTE
      - name: Erase ephemeral SSH identity
        if: always()
        run: rm -f ~/.ssh/id_ed25519
