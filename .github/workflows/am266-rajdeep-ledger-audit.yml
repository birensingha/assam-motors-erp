name: AM271 Staff-paid Vendor Accounting — Read Only
on:
  push:
    branches: [audit/am271-staff-paid-vendor-accounting-20261118]
    paths: [.github/workflows/am266-rajdeep-ledger-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM271_ACCOUNTING_ROUTES
          PHP="$(mktemp --suffix=.php)"
          trap 'rm -f "$PHP"' EXIT
          cat > "$PHP" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';
          $app=require getcwd().'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $routes=\Illuminate\Support\Facades\Route::getRoutes();
          foreach($routes as $r){
            $uri=$r->uri();
            if(preg_match('~(payment|journal|reimburs|advance|vendor|expense|ledger)~i',$uri))
             echo implode(',',$r->methods()).' '.$uri.' NAME='.$r->getName().' ACTION='.$r->getActionName()."\n";
          }
          $S=\Illuminate\Support\Facades\Schema::class;
          $D=\Illuminate\Support\Facades\DB::class;
          $tables=$D::select('SHOW TABLES');
          foreach($tables as $t){
             $name=(string)array_values((array)$t)[0];
             if(preg_match('~(payment|journal|voucher|ledger|reimburse|staff.*expense|vendor.*pay)~i',$name)){
                echo 'AM271_TABLE '.$name.' COLUMNS='.implode(',',$S::getColumnListing($name))."\n";
             }
          }
          echo 'AM271_ROUTE_SCHEMA_AUDIT_PASS'."\n";
          PHP
          php "$PHP" | head -160
          echo AM271_CONTROLLER_AND_VIEW_FILENAMES
          find app/Http/Controllers resources/views -type f \( -iname '*payment*' -o -iname '*journal*' -o -iname '*expense*' \) | head -120
          echo AM271_REIMBURSEMENT_IMPLEMENTATION_CANDIDATES
          grep -R -n -i -E 'staff paid|paid by staff|paid_by_staff|on behalf|reimburse|staff payable|journal voucher' app/Http/Controllers/Web resources/views/payments resources/views/expenses 2>/dev/null | head -95 || true
          echo AM271_CURRENT_PAYMENT_CONTROLLER_FUNCTIONS
          for file in app/Http/Controllers/Web/*Payment*php app/Http/Controllers/Web/*Journal*php;do test -f "$file" || continue;echo "FILE=$file";grep -n -E 'function |staff|vendor|against|account|journal' "$file" | head -115;done
          echo AM271_AUDIT_DONE
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
