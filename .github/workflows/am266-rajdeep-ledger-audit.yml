name: AM274 Tally Journal Vendor Staff Outstanding Source Read Only
on:
  push:
    branches: [feature/am274-tally-vendor-to-staff-journal-20261118]
    paths: [.github/workflows/am266-rajdeep-ledger-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM274_VENDOR_DUE_REFERENCES
          grep -R -n -E 'workshop_payment_allocations|workshop_payment_vouchers' app/Services app/Http/Controllers/Web | head -230
          echo AM274_STAFF_PAYMENT_VOUCHER_SOURCE
          sed -n '1,375p' app/Services/StaffPaymentVoucherService.php
          echo AM274_PAYMENT_MODEL
          sed -n '1,240p' app/Models/WorkshopPaymentVoucher.php
          echo AM274_LAYOUT_ROUTE_GROUP
          sed -n '235,310p' routes/web.php
          sed -n '327,390p' routes/web.php
          echo AM274_CURRENT_ADMIN_LAYOUT_LINKS
          sed -n '1,170p' resources/views/layouts/new-admin.blade.php
          echo AM274_EXPENSE_PAYMENT_SERVICE_VOID
          grep -n -E 'function paymentSummary|function voidPayment|function searchPayments|workshop_payment_vouchers' app/Services/ExpensePaymentService.php | head -85
          echo AM274_DEEP_AUDIT_COMPLETE
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
