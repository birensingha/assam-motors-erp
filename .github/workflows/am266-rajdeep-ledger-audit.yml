name: AM275 Expense Donation and Category Master Source Audit
on:
  push:
    branches: [feature/am275-expense-category-master-20261118]
    paths: [.github/workflows/am266-rajdeep-ledger-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM275_SOURCE_AND_ROUTE_FACTS
          sha256sum app/Http/Controllers/Web/AdminExpensePaymentPageController.php app/Services/ExpensePaymentService.php resources/views/expenses/create.blade.php resources/views/layouts/erp.blade.php routes/web.php
          echo AM275_EXPENSE_CREATE_AND_VALIDATION
          sed -n '1,180p' app/Http/Controllers/Web/AdminExpensePaymentPageController.php
          echo AM275_CATEGORY_USAGE
          grep -R -n -m 20 -E 'expense_category|Expense Category|category_options|category.*Select|DONATION|Donation' app/Services/ExpensePaymentService.php app/Http/Controllers/Web/AdminExpensePaymentPageController.php resources/views/expenses resources/views/configuration resources/views/layouts/erp.blade.php | head -145 || true
          echo AM275_EXPENSE_FORM
          sed -n '1,290p' resources/views/expenses/create.blade.php
          echo AM275_CONFIGURATION
          grep -n -E 'function configuration|erp.configuration|CONFIGURATION|Configuration' app/Http/Controllers/Web/AdminNativeModuleController.php routes/web.php resources/views/layouts/erp.blade.php | head -80 || true
          echo AM275_SCHEMA_AND_CATEGORIES
          PHP="$(mktemp --suffix=.php)"
          trap 'rm -f "$PHP"' EXIT
          cat > "$PHP" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';$app=require getcwd().'/bootstrap/app.php';$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $D=\Illuminate\Support\Facades\DB::class;$S=\Illuminate\Support\Facades\Schema::class;
          foreach(['workshop_expenses','workshop_expense_categories','erp_expense_categories','workshop_settings'] as $table)if($S::hasTable($table))echo 'AM275_TABLE '.$table.'='.implode(',',$S::getColumnListing($table))."\n";
          echo 'AM275_EXISTING_CATEGORY_DISTRIBUTION='.json_encode($D::table('workshop_expenses')->selectRaw('expense_category,COUNT(*) n')->groupBy('expense_category')->orderBy('expense_category')->get())."\n";
          PHP
          php "$PHP"
          echo AM275_AUDIT_DONE
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
