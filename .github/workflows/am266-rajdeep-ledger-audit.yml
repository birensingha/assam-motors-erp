name: AM274 Tally Journal Vendor Staff Outstanding Source Read Only
on:
  push:
    branches: [feature/am274-tally-vendor-to-staff-journal-20261118]
    paths: [.github/workflows/am266-rajdeep-ledger-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM274_GENERAL_JOURNAL_SOURCE_MAP
          grep -n -E 'AdminStaffFinanceLedgerController|AdminExpensePaymentPageController|staff-finance|payment-voucher|erp.payments|erp.staff-finance' routes/web.php | head -130 || true
          echo AM274_LAYOUT_MENU_SOURCE
          grep -R -n -m 8 -E 'Staff Finance|Payment Voucher|Staff Ledger|Payment Register' resources/views/layouts resources/views/admin 2>/dev/null | head -110 || true
          echo AM274_ACCOUNTING_SERVICE_CLASS_NAMES
          find app/Services app/Http/Controllers/Web -maxdepth 1 -iname '*Bank*' -o -iname '*Ledger*' -o -iname '*Payment*' -o -iname '*Finance*' -o -iname '*Expense*' | head -120
          echo AM274_STAFF_FINANCE_CONTROLLER
          sed -n '1,255p' app/Http/Controllers/Web/AdminStaffFinanceLedgerController.php
          echo AM274_EXPENSE_PAYMENT_PAGE
          sed -n '1,240p' app/Http/Controllers/Web/AdminExpensePaymentPageController.php
          echo AM274_LEDGER_SCHEMA
          PHP="$(mktemp --suffix=.php)"
          trap 'rm -f "$PHP"' EXIT
          cat > "$PHP" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';$app=require getcwd().'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $S=\Illuminate\Support\Facades\Schema::class;$D=\Illuminate\Support\Facades\DB::class;
          foreach(['workshop_purchase_batches','workshop_purchases','workshop_payment_vouchers','workshop_payment_allocations','workshop_staff_finance_journals','workshop_staff_finance_lines','workshop_expenses','workshop_vendor_debit_uses','workshop_bank_accounts','staff','workshop_vendor_ledger','workshop_vendor_balances'] as $t){if($S::hasTable($t))echo 'AM274_SCHEMA '.$t.'='.implode(',',$S::getColumnListing($t))."\n";}
          $tables=$D::select('SHOW TABLES');
          foreach($tables as $t){$name=(string)array_values((array)$t)[0];if(preg_match('/(account|cash|bank|journal|ledger)/i',$name))echo 'AM274_EXISTING_TABLE '.$name."\n";}
          echo 'AM274_ACCOUNT_PICKER_SOURCE_DONE'."\n";
          PHP
          php "$PHP"
          echo AM274_FINAL_AUDIT_DONE
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
