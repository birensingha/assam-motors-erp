name: AM272 Staff New Reference Payment Posting Rule Audit
on:
  push:
    branches: [audit/am271-staff-paid-vendor-accounting-20261118]
    paths: [.github/workflows/am266-rajdeep-ledger-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM272_PAYMENT_VOUCHER_HTML_SOURCE
          grep -R -l -m 1 'COMPLETE STAFF PAYMENT DETAILS\|Staff Payment / Advance.*Linked Financial Ledger\|New Reference / On Account Staff' resources/views app/Http/Controllers | head -20 || true
          echo AM272_PAYMENT_PAGE_STORE_FUNCTION
          sed -n '175,430p' app/Http/Controllers/Web/AdminExpensePaymentPageController.php
          echo AM272_STAFF_FINANCE_LEDGER_CONTROLLER
          sed -n '1,310p' app/Http/Controllers/Web/AdminStaffFinanceLedgerController.php
          echo AM272_EXPENSE_PAYMENT_SERVICE
          sed -n '1,350p' app/Services/ExpensePaymentService.php
          echo AM272_STAFF_PAYMENT_SERVICE_CLASS
          find app/Services -maxdepth 1 -iname '*Staff*' -o -iname '*Payment*'
          echo AM272_PAYMENT_STAFF_CHECKS
          grep -R -n -E 'Staff payment|staff_new_reference|STAFF_ADVANCE|staff.*reference|staff.*posting|staff.*payment|new_reference' app/Http/Controllers/Web/AdminExpensePaymentPageController.php app/Services/ExpensePaymentService.php resources/views/expenses 2>/dev/null | head -125 || true
          echo AM272_STAFF_PAYMENT_AUDIT_END
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
