name: AM273 Journal Access Route and Permission Audit
on:
  push:
    branches: [audit/am271-staff-paid-vendor-accounting-20261118]
    paths: [.github/workflows/am266-rajdeep-ledger-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM273_JOURNAL_ROUTES
          php -r 'require "vendor/autoload.php";$app=require "bootstrap/app.php";$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();foreach(\Illuminate\Support\Facades\Route::getRoutes() as $r)if(str_contains($r->uri(),"staff-finance")||str_contains($r->uri(),"journal")){echo implode(",",$r->methods())." ".$r->uri()." | ".$r->getName()." | ".$r->getActionName()." | ".implode(",",$r->gatherMiddleware())."\n";}'
          echo AM273_STAFF_FINANCE_VIEW
          sed -n '1,270p' resources/views/staff-finance/index.blade.php
          echo AM273_STAFF_FINANCE_SCHEMA
          php -r 'require "vendor/autoload.php";$app=require "bootstrap/app.php";$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();$S=\Illuminate\Support\Facades\Schema::class;foreach(["workshop_staff_finance_journals","workshop_staff_finance_lines","workshop_payment_vouchers","workshop_vendor_ledger","workshop_vendor_balances"] as $t){if($S::hasTable($t))echo $t."=".implode(",",$S::getColumnListing($t))."\n";}'
          echo AM273_NAV_JOURNAL
          grep -R -n -m 8 -E 'staff-finance.index|Staff Finance Ledger|Journal Entry' resources/views/layouts resources/views/admin | head -75 || true
          echo AM273_READONLY_DONE
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
