name: AM266 Rajdeep Purchase vs Item Transaction Ledger Read Only
on:
  push:
    branches: [feature/am265-full-grn-header-edit-20261117]
    paths: [.github/workflows/am266-rajdeep-ledger-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM266_READONLY_LEDGER_VENDOR_AUDIT
          PHP="$(mktemp --suffix=.php)"
          trap 'rm -f "$PHP"' EXIT
          cat > "$PHP" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';
          $app=require getcwd().'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $D=\Illuminate\Support\Facades\DB::class;
          $S=\Illuminate\Support\Facades\Schema::class;
          echo 'AM266_SCHEMA_PURCHASE='.implode(',',$S::getColumnListing('workshop_purchases'))."\n";
          echo 'AM266_SCHEMA_MOVEMENTS='.implode(',',$S::getColumnListing('inventory_movements'))."\n";
          echo 'AM266_SCHEMA_VENDOR='.implode(',',$S::getColumnListing('workshop_vendors'))."\n";
          $vendors=$D::table('workshop_vendors')->where('vendor_name','like','%RAJDEEP%')->get(['id','vendor_name','vendor_code']);
          echo 'AM266_RAJDEEP_VENDORS='.json_encode($vendors)."\n";
          $purchases=$D::table('workshop_purchases as p')->leftJoin('parts_master as m','m.id','=','p.part_master_id')
            ->where(function($q)use($vendors){$ids=$vendors->pluck('id')->all();
              $q->where('p.supplier_name','like','%RAJDEEP%');
              if($ids)$q->orWhereIn('p.vendor_id',$ids);
            })
            ->orderByDesc('p.id')->limit(70)
            ->get(['p.id','p.purchase_no','p.purchase_batch_no','p.purchase_date','p.created_at',
                'p.supplier_name','p.supplier_invoice','p.part_master_id','m.part_code','m.part_name','m.stock_qty',
                'p.qty','p.job_card_id','p.record_status']);
          echo 'AM266_RAJDEEP_PURCHASE_LINES='.json_encode($purchases)."\n";
          $ids=$purchases->pluck('part_master_id')->filter()->unique()->values()->all();
          if($ids){
            $movements=$D::table('inventory_movements as i')
              ->leftJoin('job_cards as j','j.id','=','i.job_card_id')
              ->whereIn('i.part_master_id',$ids)->orderByDesc('i.id')->limit(160)
              ->get(['i.id','i.part_master_id','i.movement_type','i.qty_in','i.qty_out','i.balance_after',
                'i.reference_no','i.note','i.job_card_id','j.job_no','i.created_at']);
            echo 'AM266_MATCHED_ITEM_LEDGER_MOVEMENTS='.json_encode($movements)."\n";
          }
          echo 'AM266_AUDIT_COMPLETE_READONLY'."\n";
          PHP
          php "$PHP"

          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
