name: AM275 Donation Expense Category and Configuration Read Only
on:
  push:
    branches: [feature/am275-expense-donation-category-settings-20261118]
    paths: [.github/workflows/am266-rajdeep-ledger-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM275_EXPENSE_CATEGORIES_SERVICE
          sed -n '1,125p' app/Services/ExpensePaymentService.php
          sed -n '160,195p' app/Services/ExpensePaymentService.php
          echo AM275_EXPENSE_ENTRY_VIEW
          sed -n '1,250p' resources/views/expenses/create.blade.php
          echo AM275_EXPENSE_INDEX_FILTERS
          grep -n -C 4 -E 'categor|Categor|select|@foreach' resources/views/expenses/index.blade.php | head -115 || true
          echo AM275_CONFIGURATION_ROUTES
          grep -n -E 'configuration|config|expense' routes/web.php | head -75
          echo AM275_CONFIG_CONTROLLER_VIEW
          grep -R -n -m 4 'Configuration' app/Http/Controllers/Web/AdminConfiguration* resources/views/configuration 2>/dev/null | head -50 || true
          echo AM275_SETTINGS_FILE_CANDIDATES
          find resources/views -maxdepth 3 -iname '*config*' -o -iname '*setting*' | head -60
          echo AM275_EXISTING_CATEGORY_SCHEMA
          PHP="$(mktemp --suffix=.php)"
          trap 'rm -f "$PHP"' EXIT
          cat > "$PHP" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';$app=require getcwd().'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $S=\Illuminate\Support\Facades\Schema::class;$D=\Illuminate\Support\Facades\DB::class;
          foreach(['workshop_expenses','workshop_expense_categories','expense_categories','erp_settings'] as $t){if($S::hasTable($t))echo 'AM275_SCHEMA '.$t.'='.implode(',',$S::getColumnListing($t))."\n";}
          if($S::hasTable('workshop_expenses'))echo 'AM275_CATEGORIES_IN_USE='.json_encode($D::table('workshop_expenses')->select('expense_category')->selectRaw('COUNT(*) as usage_count')->groupBy('expense_category')->orderByDesc('usage_count')->get())."\n";
          PHP
          php "$PHP"
          echo AM275_SOURCE_SHA
          sha256sum app/Services/ExpensePaymentService.php resources/views/expenses/create.blade.php resources/views/expenses/index.blade.php routes/web.php
          echo AM275_AUDIT_COMPLETE
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
