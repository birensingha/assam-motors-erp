name: AM274 Tally Journal Vendor Staff Outstanding Source Read Only
on:
  push:
    branches: [feature/am274-tally-vendor-to-staff-journal-20261118]
    paths: [.github/workflows/am266-rajdeep-ledger-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM274_PAYMENT_SERVICES_AND_VENDOR_CALC
          grep -R -l -E 'function outstanding|purchase.*outstanding|due_amount|balance.*vendor|paid_amount' app/Services/*Payment* app/Http/Controllers/Web/*Purchase*php app/Http/Controllers/Web/*Vendor*php | head -50 || true
          echo AM274_VENDOR_SOURCE_SERVICE
          sed -n '1,320p' app/Services/MultiPurchasePaymentService.php
          echo AM274_VENDOR_PAYMENT_SOURCE
          sed -n '1,355p' app/Services/ExpensePaymentService.php
          echo AM274_VENDOR_REGISTER_REPORT
          grep -R -n -E 'workshop_payment_allocations|workshop_payment_vouchers|paid_amount|outstanding' app/Http/Controllers/Web/*Purchase*php app/Http/Controllers/Web/*Vendor*php | head -130 || true
          echo AM274_PURCHASE_SCHEMA
          PHP="$(mktemp --suffix=.php)"
          trap 'rm -f "$PHP"' EXIT
          cat > "$PHP" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';
          $app=require getcwd().'/bootstrap/app.php';$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $D=\Illuminate\Support\Facades\DB::class;$S=\Illuminate\Support\Facades\Schema::class;
          foreach(['workshop_purchases','workshop_payment_vouchers','workshop_payment_allocations','workshop_vendors','staff','workshop_staff_finance_journals','workshop_staff_finance_lines','workshop_vendor_debit_uses','workshop_vendor_ledger'] as $t){
             if($S::hasTable($t))echo 'AM274_SCHEMA '.$t.' = '.implode(',',$S::getColumnListing($t))."\n";
          }
          PHP
          php "$PHP"
          echo AM274_ACCOUNTING_SOURCE_AUDIT_DONE
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
