name: AM271 Staff-paid Vendor Accounting — Read Only
on:
  push:
    branches: [audit/am271-staff-paid-vendor-accounting-20261118]
    paths: [.github/workflows/am266-rajdeep-ledger-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM271_STAFF_FINANCE_ROUTES
          php artisan route:list --path=erp/staff-finance --compact 2>/dev/null || true
          echo AM271_STAFF_FINANCE_CONTROLLER_FUNCTIONS
          grep -n -E 'function |journal|vendor|expense|salary|STAFF|PAYABLE' app/Http/Controllers/Web/AdminStaffFinanceLedgerController.php | head -175 || true
          echo AM271_PAYMENT_SERVICE_CLASSES
          find app/Services -maxdepth 1 -iname '*Payment*' -o -iname '*StaffFinance*'
          echo AM271_PAYMENT_SOURCE_TERMS
          grep -R -n -i -E 'STAFF_PAID|VENDOR_PAID_BY|PAID_ON_BEHALF|staff.*vendor|vendor.*staff|staff.*reimburs|EXPENSE_REIMBURSEMENT|STAFF_EXPENSE' app/Services/ExpensePaymentService.php app/Services/StaffFinance* app/Http/Controllers/Web/AdminExpensePaymentPageController.php 2>/dev/null | head -140 || true
          echo AM271_JOURNAL_SOURCE
          sed -n '1,225p' app/Http/Controllers/Web/AdminStaffFinanceLedgerController.php
          echo AM271_PAYMENT_STORE_SOURCE
          sed -n '155,247p' app/Http/Controllers/Web/AdminExpensePaymentPageController.php
          echo AM271_STAFF_FINANCE_SCHEMA
          PHP="$(mktemp --suffix=.php)"
          trap 'rm -f "$PHP"' EXIT
          cat > "$PHP" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';$app=require getcwd().'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $S=\Illuminate\Support\Facades\Schema::class;
          foreach(['workshop_staff_finance_lines','workshop_expenses','workshop_vendor_debit_uses','workshop_payment_allocations','workshop_vendor_ledger'] as $table){
            if($S::hasTable($table))echo 'AM271_SCHEMA_'.$table.'='.implode(',',$S::getColumnListing($table))."\n";
          }
          PHP
          php "$PHP"
          echo AM271_DEEP_READONLY_AUDIT_PASS
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
