name: AM274 Tally Journal Vendor Staff Outstanding Source Read Only
on:
  push:
    branches: [feature/am274-tally-vendor-to-staff-journal-20261118]
    paths: [.github/workflows/am266-rajdeep-ledger-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM274_FINANCIAL_SCHEMA
          PHP="$(mktemp --suffix=.php)"
          trap 'rm -f "$PHP"' EXIT
          cat > "$PHP" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';$app=require getcwd().'/bootstrap/app.php';$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $S=\Illuminate\Support\Facades\Schema::class;
          foreach(['workshop_vendors','staff','workshop_purchases','workshop_payment_vouchers','workshop_payment_allocations','workshop_vendor_payments','workshop_staff_finance_journals','workshop_staff_finance_lines','workshop_vendor_debit_uses','workshop_vendor_debit_notes'] as $t)if($S::hasTable($t))echo 'TABLE '.$t.': '.implode(',',$S::getColumnListing($t))."\n";
          PHP
          php "$PHP"
          echo AM274_VENDOR_SERVICE_CORE
          sed -n '1,260p' app/Services/VendorService.php
          echo AM274_MULTI_PURCHASE_PAYMENT_CORE
          sed -n '1,230p' app/Services/MultiPurchasePaymentService.php
          echo AM274_VENDOR_LEDGER_PAGE_CORE
          grep -n -E 'function ledger|vendorLedger|function show' app/Http/Controllers/Web/AdminVendorPageController.php
          sed -n '1,230p' app/Http/Controllers/Web/AdminVendorPageController.php
          echo AM274_STAFF_FINANCE_INDEX_CORE
          sed -n '1,160p' app/Http/Controllers/Web/AdminStaffFinanceLedgerController.php
          echo AM274_FINANCE_AUDIT_END
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
