name: AM275 Donation Expense Category and Configuration Read Only
on:
  push:
    branches: [feature/am275-expense-donation-category-settings-20261118]
    paths: [.github/workflows/am266-rajdeep-ledger-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM275_CONFIG_VIEW
          sed -n '1,240p' resources/views/dashboard/configuration.blade.php
          echo AM275_CONFIG_ROUTE_CONTEXT
          sed -n '35,93p' routes/web.php
          sed -n '450,495p' routes/web.php
          echo AM275_CONFIG_CONTROLLER_METHOD
          grep -n -C 10 'function configuration' app/Http/Controllers/Web/AdminDashboardPageController.php
          echo AM275_PAYMENT_SERVICE_METHODS
          grep -n -E 'function admin\(|function actor|private function admin' app/Http/Controllers/Web/AdminExpensePaymentPageController.php
          echo AM275_LOGIN_SECURITY_SESSION
          sed -n '1,105p' app/Http/Controllers/Web/AdminExpensePaymentPageController.php
          echo AM275_ERP_ADMIN_LAYOUT_EXPENSE_NAV
          grep -n -C 4 'erp.configuration\|erp.expenses' resources/views/layouts/erp.blade.php | head -95
          echo AM275_EXPENSE_TABLE_DB_COLUMNS
          php -r 'require "vendor/autoload.php";$app=require "bootstrap/app.php";$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();$r=\Illuminate\Support\Facades\DB::select("SHOW COLUMNS FROM workshop_expenses LIKE \"expense_category\"");echo json_encode($r);'
          echo AM275_CONFIG_EXTRA_DONE
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
