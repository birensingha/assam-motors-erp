name: AM130 Admin Register Staging Deploy and QA Audit
on:
  pull_request:
    paths:
      - '.github/workflows/qa-am130-admin-register-staging.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    name: Install if needed, verify Admin register + audit guards
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate gated PHP source and deploy script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM130_MISSED_CHECKOUT_ADMIN/apply.py
          php -l deployment/live-fixes/AM130_MISSED_CHECKOUT_ADMIN/verify.php
          bash -n deployment/live-fixes/AM130_MISSED_CHECKOUT_ADMIN/DEPLOY_STAGING.sh
          grep -q 'AM130_MISSED_CHECKOUT_ADMIN_AUDITED_CORRECTION' deployment/live-fixes/AM130_MISSED_CHECKOUT_ADMIN/apply.py
      - name: Configure STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Backup, add missed checkout register and QA audited Admin correction
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM130_ADMIN_REGISTER"'
          "${SCP[@]}" deployment/live-fixes/AM130_MISSED_CHECKOUT_ADMIN/apply.py deployment/live-fixes/AM130_MISSED_CHECKOUT_ADMIN/verify.php deployment/live-fixes/AM130_MISSED_CHECKOUT_ADMIN/DEPLOY_STAGING.sh deployment/live-fixes/AM130_MISSED_CHECKOUT_ADMIN/register.blade.php "$REMOTE:~/AM130_ADMIN_REGISTER/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'STAGING'
          set -euo pipefail
          APP="$1"
          cd "$APP"
          test -f artisan
          if grep -q AM130_MISSED_CHECKOUT_ADMIN_AUDITED_CORRECTION app/Http/Controllers/Web/AdminNativeModuleController.php;then
            test -f resources/views/admin/native/partials/am130-missed-checkout.blade.php
            echo AM130_ALREADY_INSTALLED_IN_STAGING
          else
            bash ~/AM130_ADMIN_REGISTER/DEPLOY_STAGING.sh "$APP"
          fi
          OUTPUT="$(php ~/AM130_ADMIN_REGISTER/verify.php 2>&1)"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -Fxq AM130_VERIFICATION_COMPLETE_NO_ATTENDANCE_DATA_WRITES
          echo AM130_INDEPENDENT_STAGING_QA_PASS
          STAGING
      - name: Remove transient SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
