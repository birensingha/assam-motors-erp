name: FIX107 Estimate Print Parts Labour Sections STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fix107-estimate-print-sections.yml'
      - 'deployment/live-fixes/FIX107_ESTIMATE_PRINT_SECTIONS/apply.py'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and read-only financial scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/FIX107_ESTIMATE_PRINT_SECTIONS/apply.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('deployment/live-fixes/FIX107_ESTIMATE_PRINT_SECTIONS/apply.py').read_text()
          for key in ['FIX107_SPLIT_PARTS_LABOUR_ESTIMATE_PRINT','As per Applicable',
                      'PARTS','LABOUR / ROT / OSL','am107Groups',
                      'number_format((float)$i->line_total,2)',
                      'number_format((float)$estimate->grand_total,2)']:
            assert key in s,key
          for forbidden in ['DB::','->save()','->update(', 'job-cards/show.blade.php',
                            'invoices/print.blade.php']:
            assert forbidden not in s,forbidden
          print('FIX107_VIEW_ONLY_PYTHON_PREFLIGHT_PASS')
          PY
      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            echo "FIX107_SSH_RETRY_$i"
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Candidate compile, fixture tests, guarded deploy and rollback
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX107_ESTIMATE_PRINT_SECTIONS"'
          "${SCP[@]}" deployment/live-fixes/FIX107_ESTIMATE_PRINT_SECTIONS/apply.py "$REMOTE:~/FIX107_ESTIMATE_PRINT_SECTIONS/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1";cd "$APP";test -f artisan && test -d vendor
          PATCH="$HOME/FIX107_ESTIMATE_PRINT_SECTIONS/apply.py"
          PRINT="resources/views/estimates/print.blade.php"
          JC_SHA="$(sha256sum resources/views/job-cards/show.blade.php|cut -d' ' -f1)"
          INVOICE_SHA="$(sha256sum resources/views/invoices/print.blade.php|cut -d' ' -f1)"
          EDIT_SHA="$(sha256sum resources/views/estimates/create.blade.php|cut -d' ' -f1)"
          JS_SHA="$(sha256sum public/js/estimate-entry.js|cut -d' ' -f1)"
          python3 "$PATCH" check "$APP"
          TMP="$(mktemp -d "$APP/storage/app/fix107_candidate_XXXXXX")"
          trap 'rm -rf "$TMP"' EXIT
          FIX107_PREVIEW_PATH="$TMP/print.blade.php" python3 "$PATCH" check "$APP"
          php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            file_put_contents($argv[2],\Illuminate\Support\Facades\Blade::compileString(file_get_contents($argv[1])));
          ' "$TMP/print.blade.php" "$TMP/compiled.php"
          php -l "$TMP/compiled.php"
          python3 - "$TMP/print.blade.php" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          for k in ['FIX107_SPLIT_PARTS_LABOUR_ESTIMATE_PRINT',
                    '<dt>Tax Basis</dt><dd>As per Applicable</dd>',
                    "['heading'=>'PARTS'",
                    "['heading'=>'LABOUR / ROT / OSL'",
                    "@forelse($am107Group['lines'] as $i)",
                    "@foreach($am107Groups as $am107Group)",
                    'number_format((float)$i->line_total,2)',
                    'number_format((float)$estimate->grand_total,2)',
                    '@if($am104ShowGst)',
                    'am103-estimate-lines']:
            assert k in s,k
          assert s.count('FIX107_SPLIT_PARTS_LABOUR_ESTIMATE_PRINT')==1
          print('FIX107_TWO_SECTION_PRINT_CANDIDATE_CHECK_PASS')
          PY
          # Safety copy only the Estimate Print view.
          BACKUP="storage/app/FIX107_ESTIMATE_PRINT_BACKUP_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP";chmod 700 "$BACKUP"
          cp -p "$PRINT" "$BACKUP/print.blade.php"
          rollback(){
            echo FIX107_ROLLBACK_BEGIN
            cp -p "$BACKUP/print.blade.php" "$PRINT"
            php artisan view:clear >/dev/null 2>&1 || true
            php artisan view:cache >/dev/null 2>&1 || true
            echo FIX107_ESTIMATE_PRINT_ONLY_ROLLBACK_DONE
          }
          trap rollback ERR
          python3 "$PATCH" apply "$APP"
          php artisan view:clear
          php artisan view:cache
          # Financial test read-only; one PART and two non-PART items
          # must appear in different sections with saved line totals intact.
          php -r '
          require "vendor/autoload.php";
          $app=require "bootstrap/app.php";
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $estimate=(object)["id"=>107,"estimate_no"=>"AM/EST/QA107",
            "estimate_date"=>\Carbon\Carbon::parse("2026-10-22"),
            "status"=>"DRAFT","taxable_total"=>200,
            "cgst_total"=>18,"sgst_total"=>18,"round_off"=>0,
            "grand_total"=>236,"customer_note"=>""];
          $job=(object)["job_no"=>"JC-QA-107",
            "customer_name"=>"Test Customer","customer_phone"=>"000",
            "vehicle_reg_no"=>"AS-QA","vehicle_make"=>"Example","vehicle_model"=>"Car"];
          $items=collect([
            (object)["line_no"=>1,"item_type"=>"ROT","item_code"=>"R-1",
              "description"=>"First Labour QA","line_note"=>null,"qty"=>1,
              "unit"=>"HRS","rate"=>50,"discount_percent"=>0,
              "tax_percent"=>18,"line_total"=>59],
            (object)["line_no"=>2,"item_type"=>"PART","item_code"=>"P-1",
              "description"=>"Part QA","line_note"=>null,"qty"=>2,
              "unit"=>"PCS","rate"=>50,"discount_percent"=>0,
              "tax_percent"=>18,"line_total"=>118],
            (object)["line_no"=>3,"item_type"=>"OSL","item_code"=>"OSL-1",
              "description"=>"Outside Labour QA","line_note"=>null,"qty"=>1,
              "unit"=>"HRS","rate"=>50,"discount_percent"=>0,
              "tax_percent"=>18,"line_total"=>59],
          ]);
          foreach(["1"=>11,"0"=>7] as $gst=>$expectedColumns){
            request()->query->set("gst",(string)$gst);
            $html=view("estimates.print",compact("estimate","job","items"))->render();
            if(strpos($html,"As per Applicable")===false)throw new Exception("Tax Basis incorrect");
            $partsPos=strpos($html,">PARTS</h3>");
            $labourPos=strpos($html,">LABOUR / ROT / OSL</h3>");
            if($partsPos===false||$labourPos===false||$partsPos>=$labourPos)
              throw new Exception("Parts must be above Labour");
            preg_match_all("/<table class=\"am103-estimate-lines[^\"]*\">(.*?)<\\/table>/s",$html,$tables);
            if(count($tables[1])!==2)throw new Exception("Expected two item tables");
            foreach($tables[1] as $table){
              preg_match("/<thead>(.*?)<\\/thead>/s",$table,$head);
              if(!isset($head[1])||substr_count($head[1],"<th")!==$expectedColumns)
                throw new Exception("Header width wrong ".$gst);
              preg_match("/<tbody>(.*?)<\\/tbody>/s",$table,$body);
              preg_match_all("/<tr>(.*?)<\\/tr>/s",$body[1]??"",$rows);
              foreach($rows[1] as $row)
                if(substr_count($row,"<td")!==$expectedColumns)
                  throw new Exception("Row width wrong ".$gst);
            }
            if(strpos($tables[1][0],"Part QA")===false||
               strpos($tables[1][0],"First Labour QA")!==false||
               strpos($tables[1][1],"Outside Labour QA")===false||
               strpos($tables[1][1],"Part QA")!==false)
              throw new Exception("Items grouped incorrectly");
            if(strpos($html,"236.00")===false||
               strpos($html,"118.00")===false||
               strpos($html,"59.00")===false)
              throw new Exception("Saved financial values changed");
            if((string)$gst==="0"){
              foreach([">GST%<",">CGST<",">SGST<"] as $tag)
                if(strpos($html,$tag)!==false)throw new Exception("Hidden GST leaked");
            }else if(strpos($html,">CGST<")===false)
              throw new Exception("With GST breakdown missing");
            echo "FIX107_PRINT_GST_".$gst."_TWO_TABLES_".$expectedColumns."_COLUMNS_PASS".PHP_EOL;
          }
          '
          test "$JC_SHA" = "$(sha256sum resources/views/job-cards/show.blade.php|cut -d' ' -f1)"
          test "$INVOICE_SHA" = "$(sha256sum resources/views/invoices/print.blade.php|cut -d' ' -f1)"
          test "$EDIT_SHA" = "$(sha256sum resources/views/estimates/create.blade.php|cut -d' ' -f1)"
          test "$JS_SHA" = "$(sha256sum public/js/estimate-entry.js|cut -d' ' -f1)"
          echo FIX107_JC_INVOICE_ESTIMATE_ENTRY_JS_UNCHANGED_PASS
          for path in /erp/login /staff/login;do
            h="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")"
            echo "FIX107_HEALTH_$path=$h";test "$h" = 200
          done
          trap - ERR
          echo "FIX107_STAGING_DEPLOY_SUCCESS BACKUP=$BACKUP NO_ESTIMATE_DATA_WRITES"
          REMOTE
      - name: Clean SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
