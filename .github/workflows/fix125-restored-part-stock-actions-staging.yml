name: FIX125 Restore JC Parts Stock Controls - STAGING UI
on:
  push:
    branches: [fix/fix125-jc-part-stock-actions-20261025]
    paths: ['.github/workflows/fix125-restored-part-stock-actions-staging.yml']
permissions:
  contents: read
jobs:
  deploy-staging-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Restore authorized part issue control to JC Parts rows
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX125_STAGING_DEPLOY_START'
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/birensingha/assam-motors-erp/0446214db5ef1b6e84bd5d4c3a5a3587871c4b2a/deployment/live-fixes/FIX125_JC_STOCK_ACTIONS/apply_fix125.py' -o /tmp/fix125-staging-ui.py
          python3 -m py_compile /tmp/fix125-staging-ui.py
          python3 /tmp/fix125-staging-ui.py check "$PWD"
          python3 /tmp/fix125-staging-ui.py apply "$PWD"
          echo '=== VERIFY STOCK ACTIONS RESTORED TO JOB CARD ==='
          grep -n 'FIX125_PART_STOCK_ACTIONS_IN_ROWS' resources/views/job-cards/show.blade.php
          grep -n "include('job-cards.part-stock-control'" resources/views/job-cards/show.blade.php | head -n 2
          echo 'FIX125_STAGING_DEPLOY_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
