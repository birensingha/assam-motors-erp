name: AM241 Full OSL Batch Edit and Void STAGING guarded
on:
  push:
    branches: [feature/am241-osl-full-edit-void]
    paths:
      - '.github/workflows/am241-osl-full-edit-staging.yml'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.assammotors.com' }}
      STAGING_LOGIN_PATH: ${{ vars.STAGING_LOGIN_PATH || '/erp/login' }}
      STAGING_ADMIN_LOGIN: ${{ secrets.STAGING_ADMIN_LOGIN }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      SMOKE_OUTPUT_DIR: am241-browser-proof
    steps:
      - uses: actions/checkout@v4
      - name: Source static syntax tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM241_OSL_FULL_EDIT_VOID/apply.py
          node --check deployment/live-fixes/AM241_OSL_FULL_EDIT_VOID/qa/browser-test.mjs
          php -l deployment/live-fixes/AM241_OSL_FULL_EDIT_VOID/AdminOslPurchaseBatchController.php
      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Guarded deploy source files, backup, routes and Blade compile
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM241_OSL_FULL_EDIT"'
          "${SCP[@]}" deployment/live-fixes/AM241_OSL_FULL_EDIT_VOID/apply.py deployment/live-fixes/AM241_OSL_FULL_EDIT_VOID/AdminOslPurchaseBatchController.php deployment/live-fixes/AM241_OSL_FULL_EDIT_VOID/osl-batch-edit.blade.php "$REMOTE:~/AM241_OSL_FULL_EDIT/"
          CHECK=$("${SSH[@]}" "$REMOTE" "python3 ~/AM241_OSL_FULL_EDIT/apply.py check '$ROOT'")
          printf '%s\n' "$CHECK"
          grep -q AM241_PREFLIGHT_PASS <<<"$CHECK"
          RESULT=$("${SSH[@]}" "$REMOTE" "python3 ~/AM241_OSL_FULL_EDIT/apply.py apply '$ROOT'")
          printf '%s\n' "$RESULT"
          grep -q AM241_APPLIED <<<"$RESULT"
          BACKUP=$(printf '%s\n' "$RESULT" | sed -n 's/^AM241_BACKUP=//p' | tail -1)
          test -n "$BACKUP"
          echo "AM241_BACKUP_PATH=$BACKUP" >> "$GITHUB_ENV"
          "${SSH[@]}" "$REMOTE" "cd '$ROOT' && php -l app/Http/Controllers/Web/AdminOslPurchaseBatchController.php && php -l routes/web.php && php artisan view:clear && php artisan view:cache && php artisan route:list --path=erp/purchases/osl-batches" | tee "$RUNNER_TEMP/am241-verify.log"
          grep -q 'osl-batches' "$RUNNER_TEMP/am241-verify.log"
          echo AM241_STAGING_BLADE_AND_ROUTES_PASS
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser QA full OSL form and Delete option — NO POST
        run: node deployment/live-fixes/AM241_OSL_FULL_EDIT_VOID/qa/browser-test.mjs
      - name: Rollback code if any post-deploy test fails
        if: failure() && env.AM241_BACKUP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT");fi
          "${SSH[@]}" "$REMOTE" "python3 ~/AM241_OSL_FULL_EDIT/apply.py rollback '$ROOT' '$AM241_BACKUP_PATH' && cd '$ROOT' && php artisan view:clear"
      - name: Upload screenshots and QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am241-osl-batch-edit-delete-browser-proof
          path: am241-browser-proof/
          if-no-files-found: warn
          retention-days: 14
      - name: SSH cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
