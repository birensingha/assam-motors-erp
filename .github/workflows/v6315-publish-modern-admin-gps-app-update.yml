name: Publish Staff v6.3.15 modern Admin GPS UI to in-app update feed
on:
  push:
    branches: [main]
    paths: [".github/workflows/v6315-publish-admin-location-app-update.yml"]
permissions: {contents: read}
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Verify staging SSH and publish checksum-locked original-signed APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/v6315-publish
            chmod 600 ~/.ssh/v6315-publish
            SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -i ~/.ssh/v6315-publish -p "$PORT")
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=25 -o StrictHostKeyChecking=accept-new -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SITE="$HOME/domains/assammotors.com/public_html/staging/staff-app"
          APK_NAME="Assam-Motors-Staff-v6.3.15-MODERN-ADMIN-GPS-MAP-SIGNED-QA.apk"
          APK="$SITE/private/$APK_NAME"
          MANIFEST="$SITE/latest.json"
          API="$SITE/../legacy/api/staff-app-update.php"
          DOWNLOAD_API="$SITE/../legacy/api/staff-app-download.php"
          test -f "$MANIFEST" && test -s "$APK" && test -f "$API" && test -f "$DOWNLOAD_API"
          php -l "$API"
          php -l "$DOWNLOAD_API"
          test "$(wc -c < "$APK")" = 3349236
          echo "d1a4208c195ec7c58ea37bc4d4c5d7f7e96691444161744412ab7374202c39d6  $APK" | sha256sum -c -
          grep -Fq "staff-app-download.php" "$API"
          grep -Fq "latest.json" "$API"
          grep -Fq "private" "$DOWNLOAD_API"
          cd "$SITE"
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import os, json, tempfile, hashlib
          root=Path.cwd()
          manifest=root/'latest.json'
          expected='d1a4208c195ec7c58ea37bc4d4c5d7f7e96691444161744412ab7374202c39d6'
          filename='Assam-Motors-Staff-v6.3.15-MODERN-ADMIN-GPS-MAP-SIGNED-QA.apk'
          apk=root/'private'/filename
          original=manifest.read_bytes()
          data=json.loads(original)
          assert data.get('package_id')=='com.assammotors.staff','Refusing wrong application package'
          assert data.get('licence_file'),'Refusing missing old-client licensing metadata'
          version=int(data.get('version_code',0))
          assert version in (60314,60315),f'Unexpected published version {version}; release refused'
          assert apk.stat().st_size==3349236,'APK size mismatch'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected,'APK SHA-256 mismatch'
          if version==60315:
              assert data.get('version_name')=='6.3.13', 'Published name conflict'
              assert data.get('apk_file')==filename and data.get('sha256')==expected,'Published release conflict'
              print('STAFF_V6315_OTA=ALREADY_PUBLISHED_IDENTICAL')
          else:
              stamp=datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
              backup=root/('latest.json.backup-before-v6315-'+stamp)
              backup.write_bytes(original)
              backup.chmod(0o600)
              notes='ASSAM-MOTORS-STAFF-v6.3.15-MODERN-ADMIN-GPS.txt'
              (root/notes).write_text(
                'ASSAM MOTORS STAFF APP v6.3.15 (build 60315)\n'
                'Admin Staff Location redesigned with modern workshop dashboard and clear GPS status cards.\n'
                'In-app Google map opens only on Admin tap; date-wise Desktop Table and Easy View remain.\n'
                'Weak GPS / stale GPS points are unverified, not assumed to be outside the geofence.\n'
                'Foreground duty notification clearly states location sharing remains active while logged in.\n'
                'Check-In is still required for ROT Start, Pause, Resume and assignment; server applies one active Assigned/Running ROT.\n'
                'Preserves original Assam Motors signing identity, login permissions and consent controls.\n'
              )
              data.update({
                'version_code':60315,
                'version_name':'6.3.13',
                'apk_file':filename,
                'sha256':expected,
                'release_notes_file':notes,
                'published_at':datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
              })
              fd,tmp=tempfile.mkstemp(prefix='.latest-v6315-',dir=root)
              try:
                with os.fdopen(fd,'w') as fh:
                  json.dump(data,fh,indent=2)
                  fh.write('\n')
                  fh.flush()
                  os.fsync(fh.fileno())
                os.chmod(tmp,0o644)
                os.replace(tmp,manifest)
              finally:
                if os.path.exists(tmp):os.unlink(tmp)
              print('STAFF_UPDATE_MANIFEST_BACKUP='+backup.name)
              print('STAFF_V6315_OTA=PUBLISHED')
          verify=json.loads(manifest.read_text())
          assert verify.get('package_id')=='com.assammotors.staff'
          assert int(verify.get('version_code',0))==60315
          assert verify.get('version_name')=='6.3.13'
          assert verify.get('apk_file')==filename
          assert verify.get('sha256')==expected
          assert verify.get('licence_file')
          print('STAFF_AUTO_UPDATE_VERSION=60315')
          print('STAFF_AUTO_UPDATE_SHA256=VERIFIED')
          print('OLD_APP_IN_APP_UPDATE_MANIFEST=READY')
          PY
          # Close the exact-hash upload endpoint after the protected file
          # and manifest have been verified. Never remove an unknown receiver.
          RECEIVER="$SITE/v6315-upload-once.php"
          if [ -f "$RECEIVER" ]; then
            grep -Fq 'd1a4208c195ec7c58ea37bc4d4c5d7f7e96691444161744412ab7374202c39d6' "$RECEIVER"
            rm -f "$RECEIVER"
            echo "V6315_TEMP_UPLOAD_RECEIVER=REMOVED"
          fi
          REMOTE
      - name: Verify existing HTTPS update endpoints remain protected and online
        shell: bash
        run: |
          set -euo pipefail
          for path in /erp/login /staff/login; do
            status=$(curl --silent --show-error --location --max-time 30 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")
            echo "PUBLIC_LOGIN_PATH=$path HTTP=$status"
            test "$status" = 200
          done
          for endpoint in 'staff-app-update.php?platform=android&version_code=60314' 'staff-app-download.php?file=Assam-Motors-Staff-v6.3.15-MODERN-ADMIN-GPS-MAP-SIGNED-QA.apk'; do
            status=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com/legacy/api/$endpoint")
            echo "PROTECTED_OTA_ENDPOINT_HTTP=$status"
            test "$status" = 401 || test "$status" = 403
          done
          upload_status=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' 'https://staging.assammotors.com/staff-app/v6315-upload-once.php')
          echo "V6315_RECEIVER_POST_PUBLISH_HTTP=$upload_status"
          test "$upload_status" = 404 || test "$upload_status" = 410
          native_status=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' 'https://staging.assammotors.com/api/v1/app-update?platform=android&version_code=60314')
          echo "PROTECTED_NATIVE_APP_UPDATE_ENDPOINT_HTTP=$native_status"
          test "$native_status" = 401 || test "$native_status" = 403
          echo 'SIGNED_OLD_APP_UPDATE_PUBLICATION_SERVER_CHECK=PASS'
      - if: always()
        run: rm -f ~/.ssh/v6315-publish
