name: AM235 Reconciliation Layout CSS Repair STAGING
on:
  push:
    branches: [feature/am235-purchase-reconciliation]
    paths:
      - '.github/workflows/am235-style-staging.yml'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.assammotors.com' }}
      STAGING_LOGIN_PATH: ${{ vars.STAGING_LOGIN_PATH || '/erp/login' }}
      STAGING_ADMIN_LOGIN: ${{ secrets.STAGING_ADMIN_LOGIN }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      SMOKE_OUTPUT_DIR: am235-style-browser-proof
    steps:
      - uses: actions/checkout@v4
      - name: Check static syntax
        run: |
          python3 -m py_compile deployment/live-fixes/AM235_PURCHASE_RECON/polish.py
          node --check deployment/live-fixes/AM235_PURCHASE_RECON/qa/staging-browser-test.mjs
      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          mkdir -p ~/.ssh
          for n in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Guarded style-only patch
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM235_PURCHASE_RECON"'
          "${SCP[@]}" deployment/live-fixes/AM235_PURCHASE_RECON/polish.py "$REMOTE:~/AM235_PURCHASE_RECON/polish.py"
          CHECK=$("${SSH[@]}" "$REMOTE" "python3 ~/AM235_PURCHASE_RECON/polish.py check '$ROOT'")
          printf '%s\n' "$CHECK"
          grep -q AM235_STYLE_PREFLIGHT_PASS <<<"$CHECK"
          RESULT=$("${SSH[@]}" "$REMOTE" "python3 ~/AM235_PURCHASE_RECON/polish.py apply '$ROOT' && cd '$ROOT' && php artisan view:clear")
          printf '%s\n' "$RESULT"
          grep -q AM235_STYLE_APPLIED <<<"$RESULT"
          BACKUP=$(printf '%s\n' "$RESULT" | sed -n 's/^AM235_STYLE_BACKUP=//p')
          test -n "$BACKUP"
          echo "AM235_STYLE_BACKUP_PATH=$BACKUP" >> "$GITHUB_ENV"
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Report layout + JC lookup browser test, NO purchase save
        run: node deployment/live-fixes/AM235_PURCHASE_RECON/qa/staging-browser-test.mjs
      - name: Rollback style patch if browser QA fails
        if: failure() && env.AM235_STYLE_BACKUP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD"; SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT");fi
          "${SSH[@]}" "$REMOTE" "python3 ~/AM235_PURCHASE_RECON/polish.py rollback '$ROOT' '$AM235_STYLE_BACKUP_PATH' && cd '$ROOT' && php artisan view:clear"
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am235-reconciliation-styled-proof
          path: am235-style-browser-proof/
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
