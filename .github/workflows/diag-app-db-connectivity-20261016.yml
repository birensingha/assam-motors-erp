name: Read-only MySQL Localhost Versus TCP Connection Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-app-db-connectivity-20261016.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Open staging SSH read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/diagnose
            chmod 600 ~/.ssh/diagnose
            CMD=(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -i ~/.ssh/diagnose -p "$SSH_PORT")
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASSWORD"
            CMD=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -p "$SSH_PORT")
          fi
          "${CMD[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          echo "== MYSQL HOST/SOCKET CONNECTIVITY PROBE (NO CREDENTIAL OUTPUT) =="
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\\Illuminate\\Contracts\\Console\\Kernel::class)->bootstrap();
          $c=config('database.connections.mysql');
          $host=(string)($c['host']??'');
          $db=(string)($c['database']??'');
          $user=(string)($c['username']??'');
          $pass=(string)($c['password']??'');
          $port=(string)($c['port']??'3306');
          $options=[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_TIMEOUT=>3];
          echo "DB_CONFIG_HOST=".($host==='127.0.0.1'?'LOOPBACK_TCP':($host==='localhost'?'LOCALHOST':'OTHER'))."\n";
          echo "PHP_DEFAULT_MYSQL_SOCKET=".(ini_get('pdo_mysql.default_socket')?:'UNKNOWN')."\n";
          foreach (['CURRENT_HOST'=>$host,'TCP_127'=>'127.0.0.1','SOCKET_LOCALHOST'=>'localhost'] as $test=>$h) {
              for($i=1;$i<=2;$i++){
                  $dsn='mysql:host='.$h.';port='.$port.';dbname='.$db.';charset=utf8mb4';
                  try {
                      $pdo=new PDO($dsn,$user,$pass,$options);
                      $res=$pdo->query('SELECT 1')->fetchColumn();
                      echo "DB_PROBE ".$test." ".$i." OK\n";
                  }catch(Throwable $e){
                      $code=($e instanceof PDOException)?(string)$e->getCode():'UNEXPECTED';
                      echo "DB_PROBE ".$test." ".$i." FAIL_SQLSTATE=".$code." CATEGORY=".get_class($e)."\n";
                  }
              }
          }
          PHP
          echo "== DB SOCKET PATH CANDIDATES =="
          for file in /var/lib/mysql/mysql.sock /run/mysqld/mysqld.sock /tmp/mysql.sock; do test ! -S "$file" || echo SOCKET_FOUND="$(basename "$file")"; done
          echo "== MYSQL PDO EXTENSION =="
          php -m | grep -E 'PDO|pdo_mysql' || true

          REMOTE
      - if: always()
        run: rm -f ~/.ssh/diagnose
