name: FIX129 Payment JC Mapping Source Resolution - READ ONLY
on:
  push:
    branches: [audit/fix129-payment-jc-link-20261025]
    paths: ['.github/workflows/fix129-payment-source-resolution-audit.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Inspect precise payment source list and persistence code without writes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX129_RESOLUTION_AUDIT_START'
          echo '=== SOURCE PHP / VIEW HASH ==='
          sha256sum app/Services/ExpensePaymentService.php resources/views/payments/create.blade.php app/Http/Controllers/Web/AdminExpensePaymentPageController.php
          echo '=== PAYMENT SOURCE LIST ==='
          sed -n '130,190p' app/Services/ExpensePaymentService.php
          echo '=== PAYMENT SOURCE RESOLUTION / INSERT ==='
          grep -nE 'function resolveSource|function createVoucher|function payableSources|function searchPayments|function paymentDetail|function payment\(' app/Services/ExpensePaymentService.php
          sed -n '190,390p' app/Services/ExpensePaymentService.php
          echo '=== PAYMENT CREATE VIEW (COMPLETE) ==='
          sed -n '1,175p' resources/views/payments/create.blade.php
          echo '=== CONTROLLER PAYABLE SOURCE ==='
          sed -n '53,90p' app/Http/Controllers/Web/AdminExpensePaymentPageController.php
          echo 'FIX129_RESOLUTION_AUDIT_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
