name: P51 Legacy Independence and Admin Separation — Readonly Staging Audit
on:
  push:
    branches: [feature/p51-legacy-independence-audit-20261016]
    paths:
      - '.github/workflows/p51-independent-erp-readonly-audit.yml'
      - 'deployment/live-fixes/P51_STANDALONE_AUDIT/READONLY_AUDIT.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      APP_ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint P51 source
        run: |
          php -l deployment/live-fixes/P51_STANDALONE_AUDIT/READONLY_AUDIT.php
          echo 'P51_AUDIT_SOURCE_LINT_PASS'
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          if [ -n "$SSH_PRIVATE_KEY" ];then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          fi
      - name: Run metadata-only audit on STAGING (no old ERP writes)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ];then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
            SCP=(scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -P "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
            SCP=(sshpass -e scp -o StrictHostKeyChecking=accept-new -P "$SSH_PORT")
          fi
          REMOTE="$SSH_USER@$SSH_HOST"
          TEMP_DIR="/home/$SSH_USER/p51-readonly-$GITHUB_RUN_ID"
          "${SSH[@]}" "$REMOTE" "mkdir -p '$TEMP_DIR'"
          "${SCP[@]}" deployment/live-fixes/P51_STANDALONE_AUDIT/READONLY_AUDIT.php "$REMOTE:$TEMP_DIR/READONLY_AUDIT.php"
          "${SSH[@]}" "$REMOTE" "APP_ROOT='$APP_ROOT' TEMP_DIR='$TEMP_DIR' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          trap 'rm -rf "$TEMP_DIR"' EXIT
          test -f "$APP_ROOT/artisan"
          php "$TEMP_DIR/READONLY_AUDIT.php" "$APP_ROOT"
          REMOTE_SCRIPT
      - name: Cleanup credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
