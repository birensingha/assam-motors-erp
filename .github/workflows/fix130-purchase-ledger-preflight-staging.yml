name: FIX130 Purchase Roundoff and Ledger Preflight - READ ONLY
on:
  push:
    branches: [fix/fix130-purchase-roundoff-ledger-single-row-20261025]
    paths: ['.github/workflows/fix130-purchase-ledger-preflight-staging.yml']
permissions:
  contents: read
jobs:
  deploy-staging-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Check Purchase Entry/Ledger source patches in read-only mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX130_PREFLIGHT_START'
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/birensingha/assam-motors-erp/a418389ef33bb96c1fb73c7715a3e656c4e425ae/deployment/live-fixes/FIX130_PURCHASE_ROUNDING_LEDGER/apply_fix130.py' -o /tmp/fix130-staging.py
          python3 -m py_compile /tmp/fix130-staging.py
          python3 /tmp/fix130-staging.py check "$PWD"
          echo 'FIX130_PREFLIGHT_COMPLETE_NO_WRITES'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
