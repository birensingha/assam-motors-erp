name: Audit FIX56 Credit Notes JC ROT Staff Guards (read only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-fix56-credit-reopen-rot-staging.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh;chmod 700 ~/.ssh
          if [ -n "$KEY" ]; then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -y -qq sshpass;fi
      - name: Read-only sources and schemas
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ]; then SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$PORT")
          else export SSHPASS="$PASSWORD"; SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          echo "=== CREDIT NOTE CODE LOCATIONS ==="
          grep -RInEi '(credit.?note|invoice.?reversal|reverse.?invoice|credit_memo)' app/Http/Controllers/Web app/Services routes/web.php resources/views/job-cards | head -125 || true
          echo "=== CREDIT NOTE DATABASE COLUMNS ==="
          php -r '
          require "vendor/autoload.php";$app=require "bootstrap/app.php";$app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $schema=Illuminate\Support\Facades\Schema::class;$db=Illuminate\Support\Facades\DB::class;
          $names=array_map(fn($x)=>(string)array_values((array)$x)[0],$db::select("SHOW TABLES"));
          foreach($names as $t){
            if(preg_match("/credit|invoice|ledger|payment|receipt|stock|inventory|rot_session|attend|job_card/i",$t)){
              if(in_array($t,["invoices","job_cards","customer_ledger","rot_sessions","staff_attendance","attendance","job_card_parts","job_card_labour","parts_master","inventory_movements"])||preg_match("/credit|allocat|payment|receipt/i",$t))
                echo "DB_COLS ".$t." ".implode(",",$schema::getColumnListing($t))."\n";
            }
          }
          '
          echo "=== CURRENT REVERSAL CONTROLLERS ==="
          ls app/Http/Controllers/Web/*Reversal* app/Http/Controllers/Web/*Credit* app/Http/Controllers/Web/*Unwind* app/Http/Controllers/Web/*Rot* 2>/dev/null | head -60 || true
          grep -nEi '(invoice|credit|rot|return|reopen|part)' app/Http/Controllers/Web/AdminJobCardUnwindController.php | head -125 || true
          echo "=== INVOICE CREATION 340-520 ==="
          sed -n '342,520p' app/Http/Controllers/Web/AdminJobCardLifecyclePageController.php
          echo "=== ROT STAFF ASSIGNMENT / START / RESUME ==="
          grep -RInE 'function (assignMechanic|start|resume|reopen|changeMechanic|pause|complete|checkIn|checkOut)' app/Http/Controllers/Web/*Rot* app/Services/RotAssignmentService.php app/Http/Controllers/Web/AdminJobCardPageController.php | head -110 || true
          sed -n '1,240p' app/Services/RotAssignmentService.php
          echo "=== ACTIVE ROT CHECKS AND ATTENDANCE ==="
          grep -RInE '(Already.*Running|already.*running|where.*Running|where.*running|check.?in|Check.?In|attendance)' app/Services/RotAssignmentService.php app/Http/Controllers/Web/AdminJobCardPageController.php app/Http/Controllers/Web/*Rot* | head -145 || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
