name: AM242 Payment Staff and Customer source audit READONLY
on:
  push:
    branches: [feature/am242-payment-staff-customer-master]
    paths: ['.github/workflows/am242-payment-audit.yml']
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python3 -m py_compile deployment/live-fixes/AM242_PAYMENT_STAFF_CUSTOMER/audit.py
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Source and schema audit, no changes
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM242_PAYMENT_AUDIT"'
          "${SCP[@]}" deployment/live-fixes/AM242_PAYMENT_STAFF_CUSTOMER/audit.py "$REMOTE:~/AM242_PAYMENT_AUDIT/audit.py"
          "${SSH[@]}" "$REMOTE" "python3 ~/AM242_PAYMENT_AUDIT/audit.py '$ROOT'" | tee "$RUNNER_TEMP/am242-audit.log"
          grep -q AM242_AUDIT_FINISHED "$RUNNER_TEMP/am242-audit.log"
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
