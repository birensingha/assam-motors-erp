name: AM218 EMERGENCY JC500 Staging Restore
on:
  pull_request:
    paths:
      - '.github/workflows/am218-emergency-jc500-restore-staging.yml'
      - 'deployment/live-fixes/AM218_JC500_RESTORE/restore.py'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    name: Guarded Job Card OSL linked purchase and Master dropdown cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate emergency Python
        run: python3 -m py_compile deployment/live-fixes/AM218_JC500_RESTORE/restore.py
      - name: Configure STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Inspect recent error and guarded rollback of AM217 UI
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM218_EMERGENCY"'
          "${SCP[@]}" deployment/live-fixes/AM218_JC500_RESTORE/restore.py "$REMOTE:~/AM218_EMERGENCY/restore.py"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -Eeuo pipefail
          APP="$1";cd "$APP";test -f artisan
          echo AM218_STAGING_LOG_DIAG_START
          LOG="$(find storage/logs -maxdepth 1 -type f -name 'laravel*.log' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)"
          if test -n "$LOG" && test -f "$LOG";then
            grep -E '^\[[^]]+\] (local|production|staging)\.ERROR:' "$LOG" | tail -n 5 | sed -E 's/^(.{0,80})(.{0,120}).*$/\1\2 [details omitted]/' || true
          else echo AM218_NO_LARAVEL_LOG_FOUND; fi
          echo AM218_STAGING_LOG_DIAG_END
          python3 ~/AM218_EMERGENCY/restore.py check "$APP"
          python3 ~/AM218_EMERGENCY/restore.py restore "$APP"
          echo AM218_AM217_ROLLBACK_VIEW_CHECK_PASS
          REMOTE
          CODE="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 25 https://staging.assammotors.com/erp/login)"
          echo "AM218_STAGING_LOGIN_HTTP=$CODE"
          test "$CODE" = 200
          echo AM218_STAGING_EMERGENCY_RESTORE_SUCCESS
      - name: Remove transient SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
