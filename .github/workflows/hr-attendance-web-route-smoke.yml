name: Assam Motors HR Actual Web Route Smoke
on:
  push:
    branches: [fix/hr-attendance-403-20261013]
    paths: [.github/workflows/hr-attendance-web-route-smoke.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Simulate authenticated HR web requests with Laravel middleware (read-only)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$APP"
          echo '== VERIFY LIVE GET ATTENDANCE SOURCE AND ROUTES =='
          grep -nE 'HR_ATTENDANCE_LINK_403_P7|abort_unless|route\(' app/Http/Middleware/EnsureErpAdmin.php | head -14
          php artisan route:list --path=erp/attendance --except-vendor
          php artisan route:list --path=erp/hr/operations --except-vendor
          echo '== AUTHENTICATED HR ROUTE SMOKE (NO PASSWORDS, NO WRITES) =='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $hr=\App\Models\ErpAuthUser::query()->where('active',1)->get()->first(fn($u)=>\App\Support\HrAccess::permitted($u));
          if (!$hr) { echo "HR_ACCOUNT_NOT_FOUND\n"; exit(2); }
          $guard=\Illuminate\Support\Facades\Auth::guard('web');
          $guard->setUser($hr);
          $kernel=$app->make(\Illuminate\Contracts\Http\Kernel::class);
          foreach (['/erp/attendance','/erp/hr/operations','/erp/hr','/erp'] as $path) {
            $req=\Illuminate\Http\Request::create('https://staging.assammotors.com'.$path,'GET');
            $req->headers->set('Accept','text/html');
            $req->setUserResolver(fn()=>$hr);
            try {
              $resp=$kernel->handle($req);
              $loc=(string)$resp->headers->get('Location','');
              $loc=str_replace(['https://staging.assammotors.com','http://staging.assammotors.com'],'',$loc);
              $loc=preg_replace('/\?.*/','',$loc);
              echo 'HR_WEB '.$path.' HTTP='.$resp->getStatusCode().' REDIRECT='.($loc?:'none')."\n";
              $kernel->terminate($req,$resp);
            } catch (\Throwable $e) {
              echo 'HR_WEB '.$path.' EXCEPTION_CLASS='.get_class($e)."\n";
            }
          }
          echo "HR_WEB_ROUTE_SMOKE_COMPLETE\n";
          PHP
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"