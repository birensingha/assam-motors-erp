name: FIX94 ROT Clock Component CSS Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-fix94-rot-clock.yml'
      - 'deployment/live-fixes/FIX94_ROT_CARD_DESIGN/audit_clock.py'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit Python syntax
        run: |
          python3 -m py_compile deployment/live-fixes/FIX94_ROT_CARD_DESIGN/audit_clock.py
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3 4; do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            echo "FIX81_STAGING_SSH_SCAN_RETRY_$attempt"
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Read-only source inventory
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX94_ROT_CARD_DESIGN"'
          "${SCP[@]}" deployment/live-fixes/FIX94_ROT_CARD_DESIGN/audit_clock.py "$REMOTE:~/FIX94_ROT_CARD_DESIGN/"
          "${SSH[@]}" "$REMOTE" "python3 ~/FIX94_ROT_CARD_DESIGN/audit_clock.py '$ROOT'"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
