name: AM242 Payment Voucher Staff Customer Ledger STAGING guarded
on:
  push:
    branches: [feature/am242-payment-staff-customer-master]
    paths:
      - '.github/workflows/am242-payment-staging.yml'
      - 'deployment/live-fixes/AM242_PAYMENT_STAFF_CUSTOMER/apply.py'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.assammotors.com' }}
      STAGING_LOGIN_PATH: ${{ vars.STAGING_LOGIN_PATH || '/erp/login' }}
      STAGING_ADMIN_LOGIN: ${{ secrets.STAGING_ADMIN_LOGIN }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      SMOKE_OUTPUT_DIR: am242-browser-proof
    steps:
      - uses: actions/checkout@v4
      - name: Check patch syntax without staging changes
        shell: bash
        run: |
          set -euo pipefail
          PKG=deployment/live-fixes/AM242_PAYMENT_STAFF_CUSTOMER
          python3 -m py_compile "$PKG/apply.py"
          php -l "$PKG/CustomerPayoutVoucherService.php"
          php -l "$PKG/2026_11_04_183000_am242_add_customer_to_payment_vouchers.php"
          php -l "$PKG/qa/transaction-rollback-test.php"
          node --check "$PKG/qa/browser-test.mjs"
          grep -q 'AM242_CUSTOMER_PAYOUT_LEDGER' "$PKG/customer-script.blade.php"
      - name: Configure authenticated staging SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Guarded deploy + additive customer_id migration + Laravel syntax
        shell: bash
        run: |
          set -euo pipefail
          PKG=deployment/live-fixes/AM242_PAYMENT_STAFF_CUSTOMER
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM242_PAYMENT_STAFF_CUSTOMER"'
          "${SCP[@]}" "$PKG/apply.py" "$PKG/CustomerPayoutVoucherService.php" "$PKG/customer-panel.blade.php" "$PKG/customer-script.blade.php" "$PKG/2026_11_04_183000_am242_add_customer_to_payment_vouchers.php" "$PKG/qa/transaction-rollback-test.php" "$REMOTE:~/AM242_PAYMENT_STAFF_CUSTOMER/"
          CHECK=$("${SSH[@]}" "$REMOTE" "python3 ~/AM242_PAYMENT_STAFF_CUSTOMER/apply.py check '$ROOT'")
          printf '%s\n' "$CHECK"
          grep -q AM242_PREFLIGHT_PASS <<<"$CHECK"
          RESULT=$("${SSH[@]}" "$REMOTE" "python3 ~/AM242_PAYMENT_STAFF_CUSTOMER/apply.py apply '$ROOT'")
          printf '%s\n' "$RESULT"
          grep -q AM242_APPLIED <<<"$RESULT"
          BACKUP=$(printf '%s\n' "$RESULT" | sed -n 's/^AM242_BACKUP=//p' | tail -1)
          test -n "$BACKUP"
          echo "AM242_BACKUP_PATH=$BACKUP" >> "$GITHUB_ENV"
          "${SSH[@]}" "$REMOTE" "cd '$ROOT' && php -l app/Http/Controllers/Web/AdminExpensePaymentPageController.php && php -l app/Services/ExpensePaymentService.php && php -l app/Services/CustomerPayoutVoucherService.php && php artisan migrate --force --path=database/migrations/2026_11_04_183000_am242_add_customer_to_payment_vouchers.php && php artisan view:clear && php artisan view:cache" | tee "$RUNNER_TEMP/am242-deploy.log"
          grep -q 'Blade templates cached successfully' "$RUNNER_TEMP/am242-deploy.log"
          echo AM242_STAGING_SOURCE_MIGRATION_BLADE_PASS
      - name: Transaction simulation with guaranteed outer rollback
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD"; SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT");fi
          "${SSH[@]}" "$REMOTE" "php ~/AM242_PAYMENT_STAFF_CUSTOMER/transaction-rollback-test.php '$ROOT'" | tee "$RUNNER_TEMP/am242-finance-test.log"
          grep -q AM242_TRANSACTION_ROLLBACK_VERIFIED_NO_POSTED_TEST_MONEY "$RUNNER_TEMP/am242-finance-test.log"
      - name: Install Chromium browser test
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Staff and Customer searchable lists, advance/refund and Travel Expense UI — NO POST
        run: node deployment/live-fixes/AM242_PAYMENT_STAFF_CUSTOMER/qa/browser-test.mjs
      - name: Rollback source code when any test fails
        if: failure() && env.AM242_BACKUP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD"; SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT");fi
          "${SSH[@]}" "$REMOTE" "python3 ~/AM242_PAYMENT_STAFF_CUSTOMER/apply.py rollback '$ROOT' '$AM242_BACKUP_PATH' && cd '$ROOT' && php artisan view:clear"
          echo "AM242 failed QA: source restored; nullable customer_id schema column is retained (non-destructive)."
      - name: Upload screenshots and test proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am242-staff-customer-payment-voucher-browser-proof
          path: am242-browser-proof/
          if-no-files-found: warn
          retention-days: 14
      - name: SSH key cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
