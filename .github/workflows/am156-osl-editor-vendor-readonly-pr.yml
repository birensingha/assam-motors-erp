name: AM156 OSL Vendor Details Read Only
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi;sleep 3;done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Source and schema only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=12)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=12);fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          echo AM156_EDITOR_VIEW
          sed -n '1,210p' resources/views/workshop-controls/osl-edit.blade.php | cut -c1-235
          echo AM156_CONTROLLER_METHODS
          grep -nEi -C 5 'function editOsl|function updateOsl|function oslIndex' app/Http/Controllers/Web/AdminWorkshopControlPageController.php | head -n 150
          echo AM156_CONTROLLER_OSL_EDITOR
          start="$(grep -n 'function editOsl' app/Http/Controllers/Web/AdminWorkshopControlPageController.php | head -n1 | cut -d: -f1)"
          if test -n "$start";then sed -n "$((start)), $((start+100))p" app/Http/Controllers/Web/AdminWorkshopControlPageController.php | cut -c1-235;fi
          echo AM156_VENDOR_SCHEMA
          php -d display_errors=1 -d log_errors=0 <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $schema=\Illuminate\Support\Facades\Schema::class;
          foreach(['workshop_vendors','workshop_purchases','workshop_payment_allocations'] as $table){
            echo 'AM156_TABLE '.$table.' ['.implode(',', $schema::getColumnListing($table)).']'.PHP_EOL;
          }
          $purchase=\Illuminate\Support\Facades\DB::table('workshop_purchases')->where('id',31)->first();
          if($purchase){
            echo 'AM156_PURCHASE_31 vendor_id='.($purchase->vendor_id??'NULL').' status='.($purchase->record_status??'NULL').PHP_EOL;
            $exists=\Illuminate\Support\Facades\DB::table('workshop_vendors')->where('id',$purchase->vendor_id)->exists();
            echo 'AM156_VENDOR_FOREIGN_ID_EXISTS='.($exists?'YES':'NO').PHP_EOL;
          }
          echo 'AM156_SCHEMA_READ_ONLY'
          PHP
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519