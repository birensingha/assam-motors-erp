name: AM234 Universal Payment Voucher READ-ONLY Staging Preflight
on:
  pull_request:
    paths:
      - '.github/workflows/qa-am234-universal-payment-preflight.yml'
      - 'deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/**'
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: assam-motors-am234-payment-preflight
  cancel-in-progress: false
jobs:
  verify:
    name: Check six-feature voucher patch and existing posting guard (no financial writes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax and safety assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/apply.py
          node --check deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/feature-ui.js
          test "$(grep -c 'AM234_UNIVERSAL_PAYMENT_FEATURES' deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/apply.py)" -ge 1
          grep -q "STAFF_EXPENSE" deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/feature-ui.js
          grep -q "DIRECT_OSL" deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/feature-ui.js
          grep -q 'active:false' deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/feature-ui.js
      - name: Set up staging SSH for READ-ONLY preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Compare candidate against deployed Staging view (NO APP WRITES)
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM234_PREFLIGHT"'
          "${SCP[@]}" deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/apply.py deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/feature-ui.js "$REMOTE:~/AM234_PREFLIGHT/"
          "${SSH[@]}" "$REMOTE" "python3 ~/AM234_PREFLIGHT/apply.py check '$ROOT'"
      - name: Remove transient credentials
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/id_ed25519
