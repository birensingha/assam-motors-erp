name: AM261 Parts HSN and ROT Labour OSL SAC Master — STAGING
on:
  push:
    branches: [fix/am261-hsn-sac-master-create-edit-20261122]
    paths:
      - .github/workflows/deploy-am261-hsn-sac-master-staging.yml
      - deployment/live-fixes/AM261_HSN_SAC_MASTERS/install.py
      - deployment/live-fixes/AM261_HSN_SAC_MASTERS/files/**
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Source safety preflight
        run: |
          set -euo pipefail
          P=deployment/live-fixes/AM261_HSN_SAC_MASTERS
          python3 -m py_compile "$P/install.py"
          php -l "$P/files/database/migrations/2026_11_22_133500_am261_osl_master_sac.php"
          echo AM261_LOCAL_SOURCE_MIGRATION_SYNTAX_PASS
      - name: Configure Hostinger SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$PORT"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4 5 6; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Full SQL backup, OSL SAC migration and Master UI/controller changes
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = "assam-erp-staging"
          test -f "$APP/artisan"
          cd "$HOME/assam-motors-deploy"
          git fetch origin fix/am261-hsn-sac-master-create-edit-20261122
          PATCH_DIR="$(mktemp -d)"
          git archive FETCH_HEAD deployment/live-fixes/AM261_HSN_SAC_MASTERS | tar -x -C "$PATCH_DIR"
          PKG="$PATCH_DIR/deployment/live-fixes/AM261_HSN_SAC_MASTERS"
          SCRIPT="$PKG/install.py"
          if grep -Fq "AM261_HSN_SAC_MASTER" "$APP/app/Http/Controllers/Web/AdminNativeModuleController.php"; then
            echo AM261_ALREADY_INSTALLED_VERIFY_ONLY
          else
            python3 "$SCRIPT" check "$APP"
            python3 "$SCRIPT" prepare "$APP"
            # A fresh complete private STAGING MariaDB SQL backup is mandatory
            # before the additive OSL Master schema change.
            git fetch origin feature/am246-complaint-rework-assign-20261110
            git archive FETCH_HEAD deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN | tar -x -C "$PATCH_DIR"
            BACKUP="$PATCH_DIR/deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN"
            bash "$BACKUP/staging_db_backup_shell.sh" "$APP"
            cd "$APP"
            php artisan migrate --path=database/migrations/2026_11_22_133500_am261_osl_master_sac.php --force
            python3 "$SCRIPT" apply "$APP"
          fi
          python3 "$SCRIPT" verify "$APP"
          echo AM261_STAGING_PARTS_HSN_LABOUR_ROT_OSL_SAC_MASTER_VERIFIED
          REMOTE
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
