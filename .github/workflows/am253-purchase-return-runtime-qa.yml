name: AM253 Purchase Return — Read-Only Runtime QA
on:
  push:
    branches: [feature/am253-purchase-return-20261113]
    paths:
      - .github/workflows/am253-purchase-return-runtime-qa.yml
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Test real Laravel register, picker, return form and finance sources without writes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          QA="$(mktemp --suffix=.php)"
          trap 'rm -f "$QA"' EXIT
          cat > "$QA" <<'PHP'
          <?php
          error_reporting(E_ALL);
          require getcwd().'/vendor/autoload.php';
          $app=require getcwd().'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          \Illuminate\Support\Facades\View::share('errors',new \Illuminate\Support\ViewErrorBag());
          $DB=\Illuminate\Support\Facades\DB::class;
          $u=\App\Models\ErpAuthUser::query()->where('active',1)
            ->whereIn('role',['admin','owner'])->first();
          if(!$u){fwrite(STDERR,'STOP_AM253_QA_NO_OWNER_ADMIN_TEST_ACCOUNT');exit(31);}
          $request=\Illuminate\Http\Request::create('/erp/purchase-returns/create','GET');
          $request->setUserResolver(static fn()=>$u);
          $service=app(\App\Services\PurchaseService::class);
          $controller=app(\App\Http\Controllers\Web\AdminPurchaseReturnController::class);
          $picker=$controller->create($request,$service);
          if(!str_contains($picker->render(),'New Purchase Return'))exit(40);
          echo "AM253_ADMIN_PURCHASE_RETURN_PICKER_RENDER_PASS\n";
          $original=$DB::table('workshop_purchases')->where('purchase_type','PART')
            ->whereRaw("COALESCE(record_status,'ACTIVE') <> 'DELETED'")
            ->where('vendor_id','>',0)->orderByDesc('id')->first();
          if($original){
            $form=$controller->form($request,(int)$original->id);
            $html=$form->render();
            if(!str_contains($html,'Post Purchase Return') ||
               !str_contains($html,'name="items['))exit(41);
            echo "AM253_ADMIN_RETURN_FORM_RENDER_PASS\n";
          }else echo "AM253_NO_PARTS_BILL_FOR_RUNTIME_FORM_QA\n";
          $index=app(\App\Http\Controllers\Web\AdminPurchasePageController::class)
            ->index($request,$service);
          if(!str_contains($index->render(),'Purchase Return'))exit(42);
          echo "AM253_UNIFIED_PURCHASE_REGISTER_RENDER_PASS\n";
          $sources=app(\App\Services\ExpensePaymentService::class)->payableSources();
          if(!is_array($sources))exit(43);
          echo "AM253_VENDOR_PAYMENT_SOURCES_QUERY_PASS\n";
          if($original){
            $ledger=app(\App\Services\VendorService::class)->ledger((int)$original->vendor_id);
            if(!isset($ledger['entries'])||!isset($ledger['summary']))exit(44);
            echo "AM253_VENDOR_LEDGER_QUERY_PASS\n";
          }
          // Assert all checks were strictly SELECT/Blade rendering: no return transaction.
          echo "AM253_RUNTIME_QA_NO_PURCHASE_RETURN_POSTED\n";
          PHP
          LOG="$(php "$QA" 2>&1)"
          printf '%s\n' "$LOG"
          for marker in AM253_ADMIN_PURCHASE_RETURN_PICKER_RENDER_PASS AM253_ADMIN_RETURN_FORM_RENDER_PASS AM253_UNIFIED_PURCHASE_REGISTER_RENDER_PASS AM253_VENDOR_PAYMENT_SOURCES_QUERY_PASS AM253_VENDOR_LEDGER_QUERY_PASS AM253_RUNTIME_QA_NO_PURCHASE_RETURN_POSTED; do
            if ! printf '%s\n' "$LOG" | grep -Fq "$marker";then
              echo "STOP_AM253_RUNTIME_MISSING_MARKER_$marker"
              exit 42
            fi
          done
          echo AM253_RUNTIME_QA_ALL_ASSERTIONS_PASS
          REMOTE
      - name: Erase credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
