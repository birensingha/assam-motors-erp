name: Hotfix v6.3.13 Login-to-Logout GPS version gate (Staging)
on:
  push:
    branches: [main]
    paths: [".github/workflows/v6313-repair-login-gps-backend-version.yml"]
permissions: {contents: read}
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Fix privileged login GPS v6.3.12 with backup and PHP syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/am-gps-diag
            chmod 600 ~/.ssh/am-gps-diag
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=25 -o StrictHostKeyChecking=accept-new -i ~/.ssh/am-gps-diag -p "$PORT")
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=25 -o StrictHostKeyChecking=accept-new -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          python3 <<'PY'
          import os,pathlib,tempfile,subprocess,datetime
          root=pathlib.Path.cwd()
          path=root/'app/Http/Controllers/Api/V1/StaffLocationController.php'
          old="$loginGps = $request->header('X-Assam-Motors-App') === 'Android/6.3.12'"
          new="""$nativeAppHeader = (string)$request->header('X-Assam-Motors-App', '');
                  // Native Login GPS supports later app versions with consent.
                  $nativeAppVersionOk = preg_match('/^Android\\/([0-9]+(?:\\.[0-9]+){2})$/D',
                          $nativeAppHeader, $nativeAppVersionMatch) === 1
                      && version_compare($nativeAppVersionMatch[1], '6.3.12', '>=');
                  $loginGps = $nativeAppVersionOk"""
          content=path.read_text()
          assert "'ANDROID_LOGIN_SESSION_60S'" in content and "'login_tracking_consented'" in content and "&& !$loginGps" in content, "Unknown GPS authorization; refused"
          if new in content:
            print("V6313_GPS_LOGIN_HEADER_GATE=ALREADY_FIXED")
          else:
            assert content.count(old)==1, "Unexpected native header gate; refused"
            updated=content.replace(old,new,1)
            fd,tmp=tempfile.mkstemp(prefix='.v6313-gps-',suffix='.php',dir=path.parent)
            try:
              with os.fdopen(fd,'w') as f:f.write(updated)
              lint=subprocess.run(['php','-l',tmp],capture_output=True,text=True)
              assert lint.returncode==0,lint.stderr
              backup=root/'storage/app/patch-backups'/('v6313-gps-login-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ'))
              backup.mkdir(parents=True,mode=0o700)
              (backup/'StaffLocationController.php').write_text(content)
              (backup/'StaffLocationController.php').chmod(0o600)
              os.chmod(tmp,0o644)
              os.replace(tmp,path)
              print("V6313_GPS_LOGIN_HEADER_GATE=FIXED_BACKUP_SAVED")
            finally:
              if os.path.exists(tmp):os.unlink(tmp)
          assert new in path.read_text()
          print('V6313_GPS_LOGIN_VERSION_CONSENT=VERIFIED')
          PY
          php -r '$good=fn($v)=>preg_match("/^Android\/([0-9]+(?:\.[0-9]+){2})$/D",$v,$m)===1&&version_compare($m[1],"6.3.12",">=");foreach(["Android/6.3.12"=>true,"Android/6.3.13"=>true,"Android/6.3.14"=>true,"Android/6.4.0"=>true,"Android/6.3.11"=>false,"Android/invalid"=>false] as $v=>$ok){if($good($v)!==$ok)exit(1);echo "LOGIN_GPS_HEADER_".$v."=PASS\n";}'
          php -l app/Http/Controllers/Api/V1/StaffLocationController.php
          echo 'V6313_STAGING_GPS_SERVER_HOTFIX=PASS'
          REMOTE
      - name: Confirm staging ERP accessible and staff GPS route protected
        shell: bash
        run: |
          set -euo pipefail
          for path in /erp/login /staff/login; do
            code=$(curl -sS -L --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")
            echo "STAGING_LOGIN_HTTP=$code"
            test "$code" = 200
          done
          gps=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com/api/v1/staff/location")
          echo "GPS_ROUTE_PROTECTED_HTTP=$gps"
          test "$gps" = 405 || test "$gps" = 401 || test "$gps" = 403
          echo 'V6313_STAGING_HEALTH=PASS'
      - if: always()
        run: rm -f ~/.ssh/am-gps-diag
