name: AM222 Vehicle SAP Cascade and AM223 Customer-Owned JC Vehicles STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-am222-am223-vehicle-customer-scope.yml'
      - 'deployment/live-fixes/AM222_VEHICLE_CASCADE_SAP/**'
      - 'deployment/live-fixes/AM223_JC_CUSTOMER_VEHICLE_SCOPE/**'
permissions: {contents: read, issues: write}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Static checks for installers and both popup scripts
        id: qa
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM222_VEHICLE_CASCADE_SAP/install.py deployment/live-fixes/AM223_JC_CUSTOMER_VEHICLE_SCOPE/install.py
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          files=[
            'deployment/live-fixes/AM222_VEHICLE_CASCADE_SAP/cascade.blade.php',
            'deployment/live-fixes/AM223_JC_CUSTOMER_VEHICLE_SCOPE/customer-vehicle.blade.php']
          with tempfile.TemporaryDirectory(prefix='am222_qa_') as folder:
            for i,path in enumerate(files):
              content=Path(path).read_text()
              scripts=re.findall(r'<script>([\s\S]*?)</script>',content)
              assert len(scripts)==1,path
              js=re.sub(r'\{\{\s*\\Illuminate\\Support\\Js::from\([^\n]*?\)\s*\}\}','[]',scripts[0])
              assert '{{' not in js,path
              f=Path(folder)/f'{i}.js';f.write_text(js)
              subprocess.run(['node','--check',str(f)],check=True)
          print('AM222_AM223_BOTH_JAVASCRIPT_SYNTAX_PASS')
          PY
      - name: Prepare SSH
        id: ssh
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Guarded STAGING Blade compile then install both relationship UI fixes
        id: deploy
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM222_VEHICLE_CASCADE_SAP" "$HOME/AM223_JC_CUSTOMER_VEHICLE_SCOPE"'
          "${SCP[@]}" deployment/live-fixes/AM222_VEHICLE_CASCADE_SAP/install.py deployment/live-fixes/AM222_VEHICLE_CASCADE_SAP/cascade.blade.php "$REMOTE:~/AM222_VEHICLE_CASCADE_SAP/"
          "${SCP[@]}" deployment/live-fixes/AM223_JC_CUSTOMER_VEHICLE_SCOPE/install.py deployment/live-fixes/AM223_JC_CUSTOMER_VEHICLE_SCOPE/customer-vehicle.blade.php "$REMOTE:~/AM223_JC_CUSTOMER_VEHICLE_SCOPE/"
          "${SSH[@]}" "$REMOTE" "set -e; python3 ~/AM222_VEHICLE_CASCADE_SAP/install.py check '$ROOT'; python3 ~/AM223_JC_CUSTOMER_VEHICLE_SCOPE/install.py check '$ROOT'; python3 ~/AM222_VEHICLE_CASCADE_SAP/install.py apply '$ROOT'; python3 ~/AM223_JC_CUSTOMER_VEHICLE_SCOPE/install.py apply '$ROOT'" 2>&1 | tee "$RUNNER_TEMP/am222_223_results.log"
      - name: STAGING outcome report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_STATUS: ${{ steps.qa.outcome }}
          SSH_STATUS: ${{ steps.ssh.outcome }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
        run: |
          marks=""
          if [ -f "$RUNNER_TEMP/am222_223_results.log" ];then
            marks="$(grep -E '^AM222_|^AM223_' "$RUNNER_TEMP/am222_223_results.log" | tail -22 | tr '\n' ';' | cut -c1-1400 || true)"
          fi
          body="AM222 Vehicle SAP cascade + AM223 JC customer-owned vehicles: source=$QA_STATUS ssh=$SSH_STATUS deploy=$DEPLOY_STATUS. $marks. Authenticated browser interaction pending. No Android changes. https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api repos/"$GITHUB_REPOSITORY"/issues/124/comments -f body="$body" || true
      - name: Cleanup ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
