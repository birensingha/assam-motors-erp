name: AM240 Staff Payment Voucher STAGING guarded
on:
  pull_request:
    paths:
      - '.github/workflows/deploy-am240-staff-voucher-staging.yml'
      - 'deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/apply.py'
      - 'deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/staff-voucher.js'
      - 'deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/staff-voucher.css'
      - 'deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/DEPLOY_STAGING.sh'
      - 'deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/hotfix.py'
      - 'deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/verify-runtime.php'
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: assam-motors-staging-control, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Static JS/Python/shell and safety checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/apply.py
          node --check deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/staff-voucher.js
          bash -n deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/DEPLOY_STAGING.sh
          grep -q 'AM240_STAFF_SALARY_PAYABLE_IN_UNIVERSAL_VOUCHER_PASS' deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/apply.py
      - name: Connect staging
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Backup, apply and verify AM237 on staging
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM240_DEPLOY"'
          "${SCP[@]}" deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/apply.py deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/staff-voucher.js deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/staff-voucher.css deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/StaffPaymentVoucherService.php deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/hotfix.py deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/verify-runtime.php deployment/live-fixes/AM240_STAFF_PAYMENT_VOUCHER/DEPLOY_STAGING.sh "$REMOTE:~/AM240_DEPLOY/"
          "${SSH[@]}" "$REMOTE" "bash ~/AM240_DEPLOY/DEPLOY_STAGING.sh '$ROOT'"
      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
