name: AM195 Donation and Expense Category Master STAGING
on:
  pull_request:
    paths:
      - '.github/workflows/deploy-am195-expense-categories-staging.yml'
      - 'deployment/live-fixes/AM195_EXPENSE_CATEGORY_MASTER/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax validation
        shell: bash
        run: |
          set -euo pipefail
          php -l deployment/live-fixes/AM195_EXPENSE_CATEGORY_MASTER/2026_11_18_190000_am195_expense_category_master.php
          php -l deployment/live-fixes/AM195_EXPENSE_CATEGORY_MASTER/ExpenseCategoryMasterController.php
          python3 -m py_compile deployment/live-fixes/AM195_EXPENSE_CATEGORY_MASTER/apply.py
          bash -n deployment/live-fixes/AM195_EXPENSE_CATEGORY_MASTER/DEPLOY_STAGING.sh
      - name: Prepare authenticated staging SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Guarded staging deploy
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM195_DEPLOY"'
          "${SCP[@]}" deployment/live-fixes/AM195_EXPENSE_CATEGORY_MASTER/apply.py deployment/live-fixes/AM195_EXPENSE_CATEGORY_MASTER/DEPLOY_STAGING.sh deployment/live-fixes/AM195_EXPENSE_CATEGORY_MASTER/ExpenseCategoryMasterController.php deployment/live-fixes/AM195_EXPENSE_CATEGORY_MASTER/category-master.blade.php deployment/live-fixes/AM195_EXPENSE_CATEGORY_MASTER/2026_11_18_190000_am195_expense_category_master.php "$REMOTE:~/AM195_DEPLOY/"
          "${SSH[@]}" "$REMOTE" "bash ~/AM195_DEPLOY/DEPLOY_STAGING.sh '$ROOT'"
      - name: Clear transient key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
