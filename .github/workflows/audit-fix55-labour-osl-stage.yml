name: Audit FIX55 Labour OSL Panels and Estimate Transfers
on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-fix55-labour-osl-stage.yml"]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh;chmod 700 ~/.ssh
          if [ -n "$KEY" ]; then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -y -qq sshpass;fi
      - name: Read staging OSL ROT paths without modifying data
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ]; then SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD"; SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          echo "=== WORKSHOP AMOUNT EDIT VIEW SOURCES ==="
          grep -n -E 'job-amounts|job-lines|updateJobLine|jobAmounts|billing.update' routes/web.php
          grep -n -E 'p55OperationalLocked|invoiced|form|route\(|labour|line->id|expected_old_total|quantity|action|isLocked|editable' resources/views/workshop-controls/job-amounts.blade.php | head -150
          sed -n '1,205p' resources/views/workshop-controls/job-amounts.blade.php
          echo "=== JOB AMOUNT VALIDATION & EDIT LINES ==="
          sed -n '155,260p' app/Http/Controllers/Web/AdminWorkshopControlPageController.php
          echo "=== JOB CARD ROUTES SETUP 115-175 ==="
          sed -n '115,177p' routes/web.php
          echo "=== JOBCARD CONTROLLER HEADER ==="
          sed -n '1,84p' app/Http/Controllers/Web/AdminJobCardPageController.php
          echo "=== JC SHOW DIRECT PANEL 295-390 ==="
          sed -n '295,390p' resources/views/job-cards/show.blade.php
          echo "=== JC SHOW LABOUR PANEL 500-750 ==="
          sed -n '500,750p' resources/views/job-cards/show.blade.php
          echo "=== JC SHOW LABOUR / OSL / MASTER REFERENCES ==="
          grep -nEi '(Labour / ROT|OSL|Outside Labour|Delete Labour|Edit Labour|mechanic_name|execution_status|source_estimate_item_id)' resources/views/job-cards/show.blade.php | head -130
          echo "=== CONTROLLER UPDATE DELETE LABOUR METHODS ==="
          grep -nE 'public function (updateLabour|deleteLabour|addLabourDirect|edit|show|updatePart|deletePart)|function .*Osl' app/Http/Controllers/Web/AdminJobCardPageController.php
          sed -n '575,745p' app/Http/Controllers/Web/AdminJobCardPageController.php
          echo "=== CONTROLLER ADDLABOUR 775-880 ==="
          sed -n '780,885p' app/Http/Controllers/Web/AdminJobCardPageController.php
          echo "=== ROUTES LABOUR OSL DIRECT ==="
          grep -nEi '(labour\\.|labour/|osl|job-amounts|parts\\.direct|labour\\.direct)' routes/web.php | head -125
          echo "=== JC SERVICE DETAIL ==="
          sed -n '1,230p' app/Services/JobCardService.php
          echo "=== SCHEMA AND OSL REFS ==="
          php -r '
          require "vendor/autoload.php";$app=require "bootstrap/app.php";$app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $schema=Illuminate\Support\Facades\Schema::class;
          foreach(["job_card_labour","job_estimate_items","labour_master","workshop_osl_requests","workshop_purchases","job_cards"] as $t)
            if($schema::hasTable($t))echo "COLUMNS $t ".implode(",",$schema::getColumnListing($t))."\n";
          $db=Illuminate\Support\Facades\DB::class;
          $n=$db::table("job_card_labour")->where("mechanic_name","OSL")->count();
          echo "CURRENT_OSL_LABOUR_LINE_COUNT=$n\n";
          '
          REMOTE
      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/id_ed25519
