name: Verify v6.3.4 App Update Hosting Access
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v634-android-update-publish-preflight.yml"
permissions:
  contents: read
jobs:
  safe-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      API_TOKEN: ${{ github.token }}
    steps:
      - name: Check staging Hostinger SSH and locate existing app updater
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PORT" ] || [ -z "$SSH_USER" ]; then
            echo "STAGING_SSH_CONFIGURED=NO"
            exit 0
          fi
          if [ -z "$SSH_PRIVATE_KEY" ] && [ -z "$SSH_PASSWORD" ]; then
            echo "STAGING_SSH_CREDENTIAL=ABSENT"
            exit 0
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 8 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/preflight_key
            chmod 600 ~/.ssh/preflight_key
            CMD=(ssh -o BatchMode=yes -o ConnectTimeout=12 -i ~/.ssh/preflight_key -p "$SSH_PORT")
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
            export SSHPASS="$SSH_PASSWORD"
            CMD=(sshpass -e ssh -o ConnectTimeout=12 -p "$SSH_PORT")
          fi
          "${CMD[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          ROOT="$HOME/domains/assammotors.com"
          echo "HOSTINGER_SSH=CONNECTED"
          if [ -d "$ROOT" ]; then echo "DOMAIN_ROOT=EXISTS"; else echo "DOMAIN_ROOT=MISSING"; fi
          echo "UPDATER_FILE_PATHS"
          find "$ROOT" -maxdepth 8 -type f -name staff-app-update.php -print 2>/dev/null | head -12 || true
          echo "UPDATE_MANIFEST_PATHS"
          find "$ROOT" -maxdepth 8 -type f -name latest.json -print 2>/dev/null | head -12 || true
          echo "TOP_LEVEL_DIRECTORY_PATHS"
          find "$ROOT" -maxdepth 2 -type d -print 2>/dev/null | head -30 || true
          echo "EXISTING_STAFF_APP_ASSETS"
          STAGING="$ROOT/public_html/staging"
          if [ -d "$STAGING/staff-app" ]; then
            find "$STAGING/staff-app" -maxdepth 2 -type f -name '*.apk' -printf '%P %s bytes\n' 2>/dev/null | head -16 || true
          fi
          if [ -f "$STAGING/staff-app/latest.json" ]; then
            python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); print("CURRENT_MANIFEST_FIELDS",repr({k:x.get(k) for k in ("version_code","version_name","apk_file","channel","mandatory")}))' "$STAGING/staff-app/latest.json" || true
          fi
          if [ -f "$STAGING/legacy/api/staff-app-update.php" ]; then
            php -l "$STAGING/legacy/api/staff-app-update.php"
            echo "UPDATER_CODE_MANIFEST_REFERENCES"
            grep -nE "latest.json|version_code|download_url|sha256|staff-app/" "$STAGING/legacy/api/staff-app-update.php" | head -24 || true
          fi
          REMOTE
      - name: Test whether ERP runner can read signed Android artifact in sibling repo
        shell: bash
        run: |
          set +e
          code=$(curl -L --max-time 35 --silent --show-error -H "Authorization: Bearer $API_TOKEN" -H "Accept: application/vnd.github+json" -o /tmp/cross-v634.zip -w '%{http_code}' 'https://api.github.com/repos/birensingha/assam-motors-staff-app/actions/artifacts/12022694649/zip')
          echo "CROSS_REPO_ARTIFACT_HTTP=$code"
          if unzip -tq /tmp/cross-v634.zip >/dev/null 2>&1; then
            echo "CROSS_REPO_SIGNED_APK=ACCESSIBLE"
          else
            echo "CROSS_REPO_SIGNED_APK=INACCESSIBLE"
          fi
          rm -f /tmp/cross-v634.zip
      - name: Test existing updater response from GitHub runner
        shell: bash
        run: |
          set +e
          code=$(curl --max-time 14 -sS -o /tmp/update-response -w '%{http_code}' 'https://staging.assammotors.com/legacy/api/staff-app-update.php?platform=android&version_code=60303')
          echo "LIVE_UPDATE_ENDPOINT_HTTP=$code"
      - name: Check any configured cross-repo release token without exposing it
        env:
          CROSS_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_PAT || secrets.PRIVATE_REPO_PAT || secrets.CROSS_REPO_TOKEN || secrets.GH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CROSS_TOKEN" ]; then
            echo "CROSS_REPO_RELEASE_TOKEN=NOT_CONFIGURED"
          else
            code=$(curl -L --max-time 35 -sS -H "Authorization: Bearer $CROSS_TOKEN" -H "Accept: application/vnd.github+json" -o /tmp/pat-v634.zip -w '%{http_code}' 'https://api.github.com/repos/birensingha/assam-motors-staff-app/actions/artifacts/12022694649/zip')
            echo "CROSS_REPO_RELEASE_TOKEN_HTTP=$code"
            if unzip -tq /tmp/pat-v634.zip >/dev/null 2>&1; then
              echo "CROSS_REPO_RELEASE_APK=VERIFIED_ZIP"
            else
              echo "CROSS_REPO_RELEASE_APK=NOT_AVAILABLE"
            fi
          fi
          rm -f /tmp/pat-v634.zip
      - name: Check public update hosts for secure APK transport
        shell: bash
        run: |
          set +e
          for url in 'https://assammotors.com/' 'https://assammotors.com/workshop/' 'https://staging.assammotors.com/staff-app/latest.json'; do
            code=$(curl -L --max-time 16 -sS -o /dev/null -w '%{http_code}' "$url")
            echo "PUBLIC_URL_HTTP=$code"
          done
      - name: Erase temporary credentials
        if: always()
        shell: bash
        run: rm -f ~/.ssh/preflight_key /tmp/update-response /tmp/cross-v634.zip
