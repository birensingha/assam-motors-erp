name: AM214 Read-only Parts Form Source Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-am214-parts-native.yml'
      - 'deployment/audits/AM214_PARTS_NATIVE_SOURCE/audit.py'
      - 'deployment/audits/AM214_PARTS_NATIVE_SOURCE/edit_modal_audit.py'
permissions: {contents: read, issues: write}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read only source fields from STAGING
        shell: bash
        run: |
          set -euo pipefail
          FILE=deployment/audits/AM214_PARTS_NATIVE_SOURCE/audit.py
          python3 -m py_compile "$FILE" deployment/audits/AM214_PARTS_NATIVE_SOURCE/edit_modal_audit.py
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          install -d -m 700 ~/.ssh
          ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            sudo apt-get update -qq;sudo apt-get install -qq -y sshpass
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM214_SOURCE_AUDIT"'
          "${SCP[@]}" "$FILE" "$REMOTE:~/AM214_SOURCE_AUDIT/audit.py"
          "${SCP[@]}" deployment/audits/AM214_PARTS_NATIVE_SOURCE/edit_modal_audit.py "$REMOTE:~/AM214_SOURCE_AUDIT/edit_modal_audit.py"
          "${SSH[@]}" "$REMOTE" "python3 ~/AM214_SOURCE_AUDIT/audit.py '$ROOT'" | tee /tmp/am214_source_audit.out
          body="AM214 read-only Parts source audit ($GITHUB_SHA): $(grep '^AM214_' /tmp/am214_source_audit.out | tr '\n' ';' | cut -c1-3800)"
          gh api repos/"$GITHUB_REPOSITORY"/issues/124/comments -f body="$body"
          "${SSH[@]}" "$REMOTE" "python3 ~/AM214_SOURCE_AUDIT/edit_modal_audit.py '$ROOT'" | tee /tmp/am217_edit_dom.out
          body="AM217 native master Edit DOM audit ($GITHUB_SHA): $(grep '^AM217_' /tmp/am217_edit_dom.out | tr '\n' ';' | cut -c1-9000)"
          gh api repos/"$GITHUB_REPOSITORY"/issues/124/comments -f body="$body"
      - name: SSH cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
