name: AM245 Multiple Staff Expenses One Payment Voucher STAGING guarded
on:
  push:
    branches: [feature/am245-staff-multi-expense-payment]
    paths: ['.github/workflows/am245-staff-multi-staging.yml']
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.assammotors.com' }}
      STAGING_LOGIN_PATH: ${{ vars.STAGING_LOGIN_PATH || '/erp/login' }}
      STAGING_ADMIN_LOGIN: ${{ secrets.STAGING_ADMIN_LOGIN }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      SMOKE_OUTPUT_DIR: am245-browser-proof
    steps:
      - uses: actions/checkout@v4
      - name: Validate package locally
        shell: bash
        run: |
          set -euo pipefail
          P=deployment/live-fixes/AM245_STAFF_MULTI_EXPENSE
          python3 -m py_compile "$P/apply.py"
          php -l "$P/StaffMultiExpensePaymentService.php"
          php -l "$P/AdminStaffMultiExpensePaymentController.php"
          node --check "$P/qa/browser-test.mjs"
      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Guarded staging code installer with backups (NO DB writes)
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM245_STAFF_MULTI"'
          P=deployment/live-fixes/AM245_STAFF_MULTI_EXPENSE
          "${SCP[@]}" "$P/apply.py" "$P/StaffMultiExpensePaymentService.php" "$P/AdminStaffMultiExpensePaymentController.php" "$P/staff-expenses-multi.blade.php" "$REMOTE:~/AM245_STAFF_MULTI/"
          CHECK=$("${SSH[@]}" "$REMOTE" "python3 ~/AM245_STAFF_MULTI/apply.py check '$ROOT'")
          printf '%s\n' "$CHECK"
          grep -q AM245_PREFLIGHT_PASS <<<"$CHECK"
          RESULT=$("${SSH[@]}" "$REMOTE" "python3 ~/AM245_STAFF_MULTI/apply.py apply '$ROOT'")
          printf '%s\n' "$RESULT"
          grep -q AM245_INSTALLED <<<"$RESULT"
          BACKUP=$(printf '%s\n' "$RESULT" | sed -n 's/^AM245_BACKUP=//p' | tail -1)
          test -n "$BACKUP"
          echo "AM245_BACKUP_PATH=$BACKUP" >> "$GITHUB_ENV"
          "${SSH[@]}" "$REMOTE" "cd '$ROOT' && php -l app/Services/StaffMultiExpensePaymentService.php && php -l app/Http/Controllers/Web/AdminStaffMultiExpensePaymentController.php && php -l app/Services/ExpensePaymentService.php && php -l app/Http/Controllers/Web/AdminExpensePaymentPageController.php && php -l app/Http/Controllers/Web/AdminPaymentVoucherEditController.php && php -l routes/web.php && php artisan view:clear && php artisan view:cache && php artisan route:list --path=erp/payments/staff-expenses" | tee "$RUNNER_TEMP/am245-source-verify.log"
          grep -q 'staff-expenses/multi' "$RUNNER_TEMP/am245-source-verify.log"
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Staff expense amount-first multi allocation, NO financial posting
        run: node deployment/live-fixes/AM245_STAFF_MULTI_EXPENSE/qa/browser-test.mjs
      - name: Roll back all source files if QA fails
        if: failure() && env.AM245_BACKUP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT");fi
          "${SSH[@]}" "$REMOTE" "python3 ~/AM245_STAFF_MULTI/apply.py rollback '$ROOT' '$AM245_BACKUP_PATH' && cd '$ROOT' && php artisan view:clear"
      - name: Upload screenshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am245-staff-multi-expense-browser-proof
          path: am245-browser-proof/
          retention-days: 14
          if-no-files-found: warn
      - name: Cleanup secret key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
