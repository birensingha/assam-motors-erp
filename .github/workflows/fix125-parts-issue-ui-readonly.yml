name: FIX125 Parts Issue/ Fitted User Interface - READ ONLY
on:
  push:
    branches: [audit/fix125-jc-parts-status-20261025]
    paths: ['.github/workflows/fix125-parts-issue-ui-readonly.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Inspect stock issue/fitted controller, form, and routes read only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX125_PART_ISSUE_UI_READ_ONLY_BEGIN'
          echo '=== STOCK ISSUE CONTROLLER FIRST 270 LINES ==='
          if [ -f app/Http/Controllers/Web/AdminJobCardPartIssueController.php ];then sed -n '1,275p' app/Http/Controllers/Web/AdminJobCardPartIssueController.php;else echo 'CONTROLLER_MISSING';fi
          echo '=== JOB CARD PARTS PANEL MAIN ==='
          sed -n '850,1030p' resources/views/job-cards/show.blade.php
          echo '=== PART ISSUE VIEW REFERENCES ==='
          grep -RnlE 'job-cards.parts.(issue|fitted|requisition)|parts/(.*)/fitted|Mark as Fitted|Part Issue|Mark Fitted' resources/views/job-cards 2>/dev/null | head -n 35 || true
          echo '=== ALL PART STOCK ROUTES ==='
          sed -n '118,139p' routes/web.php
          echo 'FIX125_PART_ISSUE_UI_READ_ONLY_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
