name: AM259 Sales Labour OSL Source Audit
on:
  push:
    branches: [feature/am258-profit-period-filters-20261117]
    paths: [.github/workflows/am259-sales-source-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "\${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM259_SALES_FILES
          find app/Http/Controllers/Web resources/views -iname '*sale*register*' -o -iname '*osl*line*' | head -60
          echo AM259_SALES_CONTROLLER_BEGIN
          sed -n '1,260p' app/Http/Controllers/Web/AdminUnifiedSalesRegisterController.php
          echo AM259_SALES_CONTROLLER_END
          echo AM259_OSL_LINE_CONTROLLER_BEGIN
          sed -n '1,240p' app/Http/Controllers/Web/AdminJobCardOslLineController.php
          echo AM259_OSL_LINE_CONTROLLER_END
          echo AM259_SALES_ROUTE_AND_VIEW
          grep -n 'sales-register' routes/web.php | head -25
          grep -n -A 4 -B 4 -i 'sales-register' resources/views/layouts/erp.blade.php | head -45
          echo AM259_SALES_VIEW_PATHS
          find resources/views -iname '*sales*' -o -iname '*osl*' | head -90
          PHP="$(mktemp --suffix=.php)"
          trap 'rm -f "$PHP"' EXIT
          cat > "$PHP" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';
          $app=require getcwd().'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $D=\Illuminate\Support\Facades\DB::class;
          $S=\Illuminate\Support\Facades\Schema::class;
          $all=array_map(static fn($x)=>array_values((array)$x)[0],$D::select('SHOW TABLES'));
          foreach($all as $t){
            if(!preg_match('/osl|invoice|sales|credit|labour|rotation|job_card_parts/i',$t))continue;
            if(preg_match('/audit|history|events|session|photos/i',$t))continue;
            echo 'AM259_SOURCE_TABLE '.$t.' '.implode(',',$S::getColumnListing($t))."\n";
            echo 'AM259_SOURCE_COUNT '.$t.' '.$D::table($t)->count()."\n";
          }
          foreach(['invoices','job_card_labour','job_card_osl_billing','workshop_osl_billing_lines','workshop_purchases','invoice_credit_notes'] as $t){
            if(!$S::hasTable($t))continue;
            foreach(['status','billing_included','record_status','purchase_type','customer_billing_status'] as $c){
              if(!$S::hasColumn($t,$c))continue;
              $r=$D::table($t)->selectRaw($c.', COUNT(*) n')->groupBy($c)->limit(20)->get();
              echo 'AM259_SOURCE_STATUS '.$t.'.'.$c.'='.json_encode($r)."\n";
            }
          }
          echo 'AM259_READONLY_AUDIT_PASS'."\n";
          PHP
          php "$PHP"
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
