name: Assam Motors P31 Counter Sale Query Column Debug Audit
on:
  push:
    branches: [feature/p31-direct-counter-parts-invoice-20261014]
    paths: [.github/workflows/p31-counter-query-debug.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only auth mapping, routes and attendance source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          test -f "$ROOT/artisan"
          cd "$ROOT"
          echo '=== P31 TABLE METADATA ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::connection();
          $sc=\Illuminate\Support\Facades\Schema::class;
          foreach(['am_customer_master','parts_master','direct_invoice_requests','direct_invoice_lines'] as $t){
            echo 'TABLE_'.$t.'='.(int)$sc::hasTable($t).PHP_EOL;
            if($sc::hasTable($t))echo 'COLS_'.$t.'='.implode(',',$sc::getColumnListing($t)).PHP_EOL;
          }
          foreach(['customer','part','invoice-index'] as $mode){
            try{
              if($mode==='customer')$db->table('am_customer_master')->orderBy('name')->limit(1)->get(['id','customer_code','name','phone','status']);
              if($mode==='part')$db->table('parts_master')->whereRaw("LOWER(TRIM(COALESCE(active,''))) IN ('yes','active','1')")->limit(1)->get(['id','part_code','part_name','hsn_code','selling_price','gst_percent','unit','stock_qty']);
              if($mode==='invoice-index')$db->table('direct_invoice_requests as dr')->join('invoices as i','i.id','=','dr.invoice_id')->limit(1)->get(['i.invoice_no','dr.source_kind']);
              echo 'QUERY_'.$mode.'_PASS'.PHP_EOL;
            }catch(\Throwable $e){
              $message=preg_replace('/`[^`]+`/', '[SQL-ID]', $e->getMessage());
              $message=preg_replace('/\([^)]{30,}\)/','[SQL_VALUES_REDACTED]',$message);
              echo 'QUERY_'.$mode.'_FAIL_CLASS='.get_class($e).' TYPE='.substr($message,0,310).PHP_EOL;
            }
          }
          PHP
          echo P31_QUERY_DEBUG_READONLY_PASS
          REMOTE
      - if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
