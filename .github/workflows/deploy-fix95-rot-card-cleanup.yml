name: FIX95 Completed ROT Compact Actions, Remove Billing Panel STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fix95-rot-card-cleanup.yml'
      - 'deployment/live-fixes/FIX95_ROT_CARD_CLEANUP/apply.py'
      - 'deployment/live-fixes/FIX95_ROT_CARD_CLEANUP/render.php'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch and browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/FIX95_ROT_CARD_CLEANUP/apply.py
          php -l deployment/live-fixes/FIX95_ROT_CARD_CLEANUP/render.php
          python3 - <<'PY'
          from pathlib import Path
          import ast
          source=Path('deployment/live-fixes/FIX95_ROT_CARD_CLEANUP/apply.py').read_text()
          ast.parse(source)
          assert "job-cards.rot-billing-control" in source
          assert "am95-completed-actions" in source
          assert "job-cards.rot-time-editor" in source
          assert "route('erp.rot.reopen'" in source
          assert "route('erp.rot.history'" in source
          assert 'id="FIX95_ROT_ONE_ROW_NO_BILLING_BOX"' in source
          print('FIX95_CSS_AND_EXISTING_WORK_ACTION_ROUTING_PREFLIGHT_PASS')
          PY
      - name: Configure remote SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3 4; do
            if ssh-keyscan -T 14 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Backup deploy and verify with auto rollback
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX95_ROT_CARD_CLEANUP"'
          "${SCP[@]}" deployment/live-fixes/FIX95_ROT_CARD_CLEANUP/apply.py deployment/live-fixes/FIX95_ROT_CARD_CLEANUP/render.php "$REMOTE:~/FIX95_ROT_CARD_CLEANUP/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"; cd "$APP"; test -f artisan && test -d vendor
          PATCH="$HOME/FIX95_ROT_CARD_CLEANUP"
          python3 "$PATCH/apply.py" check "$APP"
          # Compile proposed source BEFORE touching the live Blade file.
          TMPB="$(mktemp "$APP/storage/app/.fix95_proposed_XXXXXX.blade.php")"
          TMPC="$(mktemp "$APP/storage/app/.fix95_compiled_XXXXXX.php")"
          FIX95_PREVIEW_PATH="$TMPB" python3 "$PATCH/apply.py" check "$APP"
          php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            file_put_contents($argv[2],\Illuminate\Support\Facades\Blade::compileString(file_get_contents($argv[1])));
          ' "$TMPB" "$TMPC"
          set +e
          PHP_LINT="$(php -d display_errors=1 -d log_errors=0 -l "$TMPC" 2>&1)"
          LINT_CODE=$?
          set -e
          if [ "$LINT_CODE" -ne 0 ]; then
            echo FIX95_COMPILED_BLADE_SYNTAX_FAIL
            printf '%s\n' "$PHP_LINT"
            echo FIX95_FOREACH_STACK_DEBUG
            grep -nE '__currentLoopData|__empty_|foreach|endforeach' "$TMPC" | head -75 | cut -c1-340 || true
            LINE="$(printf '%s\n' "$PHP_LINT" | sed -n 's/.*on line \([0-9][0-9]*\).*/\1/p' | tail -1)"
            if [ -n "$LINE" ]; then
              A=$((LINE>18?LINE-18:1))
              B=$((LINE+18))
              sed -n "${A},${B}p" "$TMPC" | head -n 40 | cut -c1-320
            fi
            rm -f "$TMPB" "$TMPC"
            exit 1
          fi
          rm -f "$TMPB" "$TMPC"
          echo FIX95_PROPOSED_BLADE_COMPILES_CLEAN
          BACKUP="storage/app/FIX95_COMPLETED_ROT_UI_BACKUP_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP"; chmod 700 "$BACKUP"
          cp -p resources/views/job-cards/show.blade.php "$BACKUP/show.blade.php"
          rollback(){
            echo FIX95_ROLLBACK_BEGIN
            cp -p "$BACKUP/show.blade.php" resources/views/job-cards/show.blade.php
            php artisan view:clear >/dev/null 2>&1 || true
            php artisan view:cache >/dev/null 2>&1 || true
          }
          trap rollback ERR
          python3 "$PATCH/apply.py" apply "$APP"
          php artisan view:clear
          php artisan view:cache
          php "$PATCH/render.php" "$APP"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('resources/views/job-cards/show.blade.php').read_text(errors='replace')
          for token in ('id="FIX95_ROT_ONE_ROW_NO_BILLING_BOX"',
                        'am95-completed-actions',
                        'am95-active-actions',
                        'am-v647-time-editor',
                        'id="FIX94_COMPACT_MECHANIC_ROT_CARD"',
                        'id="FIX93_OSL_MODAL_TOOLS"',
                        'id="FIX92_LABOUR_MECHANICS_DELETE_DIALOG"',
                        'id="am90-labour-billing"',
                        'class="am82-finance-form"',
                        "dashboard.partials.rot-live-clock",
                        "job-cards.rot-time-editor",
                        "route('erp.rot.start'",
                        "route('erp.rot.pause'",
                        "route('erp.rot.complete'",
                        "route('erp.rot.resume'",
                        "route('erp.rot.reopen'",
                        "route('erp.rot.change-mechanic'",
                        "route('erp.rot.history'"):
            assert token in s,token
          assert s.count('id="FIX95_ROT_ONE_ROW_NO_BILLING_BOX"')==1
          assert "@include('job-cards.rot-billing-control')" not in s
          assert 'Original ROT/Labour charge' not in s
          assert 'class="rot-main"' in s
          assert 'class="rot-meta"' in s
          assert 'class="rot-status-block"' in s
          print('FIX95_BILLING_BOX_REMOVED_COMPLETED_ACTIONS_ONE_ROW_AND_ROT_GUARDS_PRESERVED_PASS')
          PY
          for path in /erp/login /staff/login; do
            status="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")"
            echo "FIX95_HEALTH_$path=$status"
            test "$status" = 200
          done
          trap - ERR
          echo "FIX95_STAGING_DEPLOY_SUCCESS BACKUP=$BACKUP UI_ONLY_NO_BILLING_OR_ROT_DB_WRITES"
          REMOTE
      - name: Cleanup SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
