name: AM226 Vendor Name Only Payment Picker STAGING deploy
on:
  push:
    branches: [fix/am217-osl-vendor-payment-audit-20261030]
    paths:
      - deployment/live-fixes/AM226_VENDOR_ONLY_PICKER/install.py
      - deployment/live-fixes/AM226_VENDOR_ONLY_PICKER/vendor-only.js
      - deployment/live-fixes/AM226_VENDOR_ONLY_PICKER/test-vendor.js
      - .github/workflows/am226-vendor-only-picker-staging.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch syntax and guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM226_VENDOR_ONLY_PICKER/install.py
          node --check deployment/live-fixes/AM226_VENDOR_ONLY_PICKER/vendor-only.js
          node deployment/live-fixes/AM226_VENDOR_ONLY_PICKER/test-vendor.js
          OUTPUT="$(python3 deployment/live-fixes/AM226_VENDOR_ONLY_PICKER/install.py check /tmp/not-staging 2>&1 || true)"
          printf '%s\n' "$OUTPUT" | grep -q 'AM226_STOP_NOT_STAGING'
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          install -d -m 700 ~/.ssh
          for i in 1 2 3;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 2
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Guarded AM226 vendor selector STAGING deploy
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15)
            SCP=(scp -P "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=15)
            SCP=(sshpass -e scp -P "$PORT" -o ConnectTimeout=15)
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p -m 700 ~/AM226_VENDOR_ONLY_PICKER'
          "${SCP[@]}" deployment/live-fixes/AM226_VENDOR_ONLY_PICKER/install.py deployment/live-fixes/AM226_VENDOR_ONLY_PICKER/vendor-only.js deployment/live-fixes/AM226_VENDOR_ONLY_PICKER/test-vendor.js "$REMOTE:~/AM226_VENDOR_ONLY_PICKER/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          ROOT="$1"
          PATCH="$HOME/AM226_VENDOR_ONLY_PICKER/install.py"
          cd "$ROOT"
          python3 -m py_compile "$PATCH"
          python3 "$PATCH" check "$ROOT"
          OUT="$(python3 "$PATCH" apply "$ROOT")"
          printf '%s\n' "$OUT"
          if ! echo "$OUT" | grep -Fxq AM226_ALREADY_INSTALLED;then
            rollback(){
              echo AM226_DEPLOY_VALIDATION_FAILED_ROLLING_BACK
              python3 "$PATCH" rollback "$ROOT" || true
            }
            trap rollback ERR
          fi
          grep -Fq 'SELECT VENDOR NAME' resources/views/payments/create.blade.php
          grep -Fq 'id="am226-vendor-master-select" hidden' resources/views/payments/create.blade.php
          grep -Fq 'am226-vendor-only-inline' resources/views/payments/create.blade.php
          ! grep -Fq 'Search Vendor / Purchase Bill — Parts + OSL' resources/views/payments/create.blade.php
          php -r '
           require "vendor/autoload.php";
           $app=require "bootstrap/app.php";
           $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
           $sources=app(\App\Services\ExpensePaymentService::class)->payableSources();
           $vendors=[];
           foreach($sources as $item){
             if(!in_array($item["type"]??"",["PURCHASE_INVOICE","OSL_JOB"],true))continue;
             if((float)($item["outstanding"]??0)<=0.009)continue;
             if((int)($item["vendor_id"]??0)<=0)continue;
             $vendors[(int)$item["vendor_id"]]=true;
           }
           echo "AM226_AVAILABLE_VENDOR_IDS_COUNT ".count($vendors)."\n";
           if(count($vendors)<1)exit(37);
          '
          trap - ERR
          echo AM226_VENDOR_ONLY_PICKER_SOURCE_VERIFIED

          for p in /erp/login /staff/login;do
            STATUS="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$p")"
            echo "AM226_HEALTH $p $STATUS"
            test "$STATUS" = 200
          done
          echo AM226_STAGING_DEPLOY_SOURCE_CHECK_PASS_NO_FINANCIAL_WRITES
          REMOTE_SCRIPT
      - name: Cleanup SSH credential
        if: always()
        run: rm -f ~/.ssh/id_ed25519
