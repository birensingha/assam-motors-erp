name: P32 QC PASS WIP Timeline and Guards Readonly
on:
  push:
    branches: [fix/p32-qc-pass-ready-delivery-20261014]
    paths: [.github/workflows/p32-qc-timeline-readonly.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only auth mapping, routes and attendance source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          test -f "$ROOT/artisan"
          cd "$ROOT"
          echo '=== P32 JOB 34 PASS/WIP TIMELINE — NO CUSTOMER OR REASON PERSONAL DATA ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';$app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::connection();
          $sc=\Illuminate\Support\Facades\Schema::class;
          $id=34;$j=$db->table('job_cards')->where('id',$id)->first();
          if(!$j){echo 'P32_JOB_NOT_FOUND'.PHP_EOL;exit(2);}
          foreach(['id','status','inspection_status','diagnosis_status','decision_status','customer_public_status','work_started_at','completed_at','closed_at','updated_at','invoice_id'] as $key){
             echo 'P32_JOB_'.$key.'='.((string)($j->$key??'NULL')).PHP_EOL;
          }
          foreach($db->table('workshop_qc_checks')->where('job_card_id',$id)->orderByDesc('id')->limit(15)->get() as $q){
            echo 'P32_QC_LOG id='.$q->id.' result='.strtoupper((string)$q->result).
                 ' checked_at='.$q->checked_at.' created_at='.$q->created_at.PHP_EOL;
          }
          if($sc::hasTable('job_card_change_audits')){
            echo 'P32_AUDIT_COLS='.implode(',',$sc::getColumnListing('job_card_change_audits')).PHP_EOL;
            foreach($db->table('job_card_change_audits')->where('job_card_id',$id)->orderByDesc('id')->limit(35)->get() as $a){
              echo 'P32_AUDIT id='.$a->id.' action='.($a->action??'NULL').' date='.($a->created_at??'NULL').PHP_EOL;
            }
          }
          foreach(['rot_sessions','job_card_labour','job_card_parts','workshop_osl_requests'] as $t){
            if(!$sc::hasTable($t))continue;
            echo 'P32_TABLE_'.$t.'_COLS='.implode(',',$sc::getColumnListing($t)).PHP_EOL;
            foreach($db->table($t)->where('job_card_id',$id)->orderByDesc('id')->limit(22)->get() as $o){
              $status=$o->status??$o->execution_status??$o->issue_status??'NONE';
              echo 'P32_ITEM_'.$t.' id='.($o->id??'0').' status='.$status.
                   ' updated_at='.($o->updated_at??'NULL').PHP_EOL;
            }
          }
          echo P32_TIMELINE_READONLY_PASS.PHP_EOL;
          PHP
          REMOTE
      - if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
