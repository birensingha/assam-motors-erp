name: FIX123 Work Complete WIP Visibility - READ ONLY
on:
  push:
    branches: [fix/fix123-wip-work-complete-visible-20261024]
    paths: ['.github/workflows/fix123-work-complete-staging-audit.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Inspect actual staging lifecycle only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          VIEW=resources/views/job-cards/lifecycle-panel.blade.php
          CTRL=app/Http/Controllers/Web/AdminJobCardLifecyclePageController.php
          echo 'FIX123_READONLY_BEGIN'
          echo '=== VIEW SHA ==='
          sha256sum "$VIEW"
          echo '=== WORK COMPLETE UI CONDITIONS (bounded) ==='
          grep -nEi -C 7 'Work Complete blocked|Work Complete|work.complete|amLifeStage|PartPending|partsPending|lifecycle\.work-complete' "$VIEW" | head -n 160 || true
          echo '=== CONTROLLER WORK COMPLETE SIGNATURE ==='
          grep -nEi -C 4 'function markWorkComplete|function workCompleteGuards|function pendingWorkGuards|work.complete blocked' "$CTRL" | head -n 95 || true
          echo '=== ROUTE ALREADY REGISTERED ==='
          grep -n 'lifecycle/work-complete' routes/web.php | head -n 8 || true
          echo 'FIX123_READONLY_COMPLETE_NO_CHANGES'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
