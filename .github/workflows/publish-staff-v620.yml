name: Publish Staff App v6.2.0 Update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-staff-v620.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-dcd8-8211-9c3e-eb2e049f6c0a/raw?se=2026-10-11T04%3A43%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=b52661fb-a15f-5a82-a852-176ef5bb95cd&skoid=a3d7d4f3-706d-48bc-8860-17488c12cb39&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T04%3A28%3A44Z&ske=2026-10-12T04%3A28%3A44Z&sks=b&skv=2026-02-06&sig=wyJogMvTKvvA17KJDcg0hLhQ7ekvTOfQSEy1g1uoHlo%3D'

    steps:
      - name: Fetch and verify production-signed v6.2.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/am-v620
          curl -fsSL --retry 3 "$ARTIFACT_URL" -o /tmp/am-v620/release.zip
          unzip -q /tmp/am-v620/release.zip -d /tmp/am-v620/files
          APK="/tmp/am-v620/files/Assam-Motors-Staff-v6.2.0-FRESH-PRODUCTION.apk"
          META="/tmp/am-v620/files/latest.json"
          test -f "$APK"
          test -f "$META"
          EXPECTED="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$META")"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          test "$ACTUAL" = "4acad3105aacddc48cecd432c21816e84f437d48158269cf641b59baf45b0364"
          grep -q '"version_code": 60200' "$META"
          grep -q '"version_name": "6.2.0"' "$META"
          echo "v6.2.0 release integrity: PASS"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi

      - name: Publish official update files
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH_CMD=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH_CMD=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -p "$SSH_PORT")
          fi
          REMOTE_ROOT="/home/$SSH_USER/domains/assammotors.com/public_html/staging/staff-app"
          APK="Assam-Motors-Staff-v6.2.0-FRESH-PRODUCTION.apk"

          "${SSH_CMD[@]}" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$ARTIFACT_URL' '$REMOTE_ROOT' '$APK'" <<'REMOTE'
          set -euo pipefail
          ARTIFACT_URL="$1"
          REMOTE_ROOT="$2"
          APK="$3"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          curl -fsSL --retry 3 "$ARTIFACT_URL" -o "$TMP/release.zip"
          unzip -q "$TMP/release.zip" -d "$TMP/files"
          test -f "$TMP/files/$APK"
          test -f "$TMP/files/latest.json"
          mkdir -p "$REMOTE_ROOT/private"
          test -f "$REMOTE_ROOT/private/.htaccess"
          EXPECTED="$(php -r '$m=json_decode(file_get_contents($argv[1]),true); echo strtolower((string)($m["sha256"]??""));' "$TMP/files/latest.json")"
          ACTUAL="$(sha256sum "$TMP/files/$APK" | awk '{print $1}')"
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"
          cp "$TMP/files/$APK" "$REMOTE_ROOT/private/$APK"
          cp "$TMP/files/latest.json" "$REMOTE_ROOT/latest.json"
          chmod 0644 "$REMOTE_ROOT/private/$APK" "$REMOTE_ROOT/latest.json"
          echo "Server publish + checksum: PASS"
          REMOTE

      - name: External update-channel smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://staging.assammotors.com/staff-app/latest.json' -o /tmp/latest
          grep -q '"version_code": 60200' /tmp/latest
          grep -q '"version_name": "6.2.0"' /tmp/latest
          grep -q '4acad3105aacddc48cecd432c21816e84f437d48158269cf641b59baf45b0364' /tmp/latest

          API_CODE="$(curl -sS -o /tmp/update-api -w '%{http_code}' 'https://staging.assammotors.com/legacy/api/staff-app-update.php?platform=android&version_code=60100')"
          test "$API_CODE" = "401"

          PRIVATE_CODE="$(curl -sS -o /dev/null -w '%{http_code}' 'https://staging.assammotors.com/staff-app/private/Assam-Motors-Staff-v6.2.0-FRESH-PRODUCTION.apk')"
          case "$PRIVATE_CODE" in 401|403|404) ;; *) echo "Private APK unexpectedly public: HTTP $PRIVATE_CODE"; exit 1;; esac
          echo "v6.2.0 update channel smoke: PASS"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
