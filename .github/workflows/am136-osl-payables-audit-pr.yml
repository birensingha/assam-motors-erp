name: AM136 OSL Payable Mapping and Update Guards
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Read-only finance service functions
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=12)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=12);fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          echo AM136_FINANCE_METHOD_LINES
          grep -nE 'function payableSources|function savePayment|function voidPayment|function outstanding|OSL_JOB|PURCHASE_INVOICE' app/Services/ExpensePaymentService.php | head -n 110
          echo AM136_EXPENSE_PAYMENT_SOURCE_SELECTION
          sed -n '103,315p' app/Services/ExpensePaymentService.php | cut -c1-235
          echo AM136_OSL_UPDATE_HANDLER
          sed -n '267,410p' app/Http/Controllers/Web/AdminWorkshopControlPageController.php | cut -c1-240
          echo AM136_OSL_SOURCE_QUERY_JS
          grep -nEi 'source|preset|osl|purchase|multi' public/js/payment-voucher.js public/js/payment-voucher-multi.js | head -n 120 || true
          echo AM136_DONE_NO_WRITES
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519