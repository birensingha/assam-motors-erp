name: AM126 JC42 OSL Exact Link Preflight
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-readonly-jc42, cancel-in-progress: false}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Read-only inspect purchase-link and delete guard
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=12)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=12);fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          echo 'AM126_SERVER_CONTROLLER_83_148'
          sed -n '83,148p' app/Http/Controllers/Web/AdminJobCardOslLineController.php
          echo 'AM126_PURCHASE_CONSUMERS'
          grep -R -nEi --include='*.php' --exclude-dir='vendor' 'labour_line_id|billing_line_created|customer_billing_status' app/Http/Controllers/Web/AdminWorkshopOslPurchaseController.php app/Services/JobCardTaxTotals.php app/Services 2>/dev/null | head -n 90 || true
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $a=require 'bootstrap/app.php';
          $a->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          use Illuminate\Support\Facades\DB;
          $jc=DB::table('job_cards')->where('job_no','JC-20261025-00042')->first();
          if(!$jc){echo "AM126_JC_MISSING\n";exit(2);}
          foreach([91,92] as $id){
            $r=DB::table('job_card_labour')->where('job_card_id',$jc->id)->where('id',$id)->first();
            echo 'AM126_LINE='.$id.' '.json_encode($r?array_intersect_key((array)$r,array_flip(['id','job_card_id','rot_code','description','mechanic_name','source_estimate_item_id','standard_hours','labour_rate','discount_amount','gst_percent','total','execution_status','billing_included'])):null).PHP_EOL;
          }
          $cols=Illuminate\Support\Facades\Schema::getColumnListing('workshop_purchases');
          foreach(DB::table('workshop_purchases')->where('job_card_id',$jc->id)->where('purchase_type','OSL')->orderBy('id')->limit(30)->get() as $r){
            $keys=['id','purchase_no','job_card_id','labour_line_id','record_status','deleted_at','billing_line_created','customer_billing_status','customer_rate','customer_amount','gst_percent','customer_gst_percent','total_amount','purchase_batch_no','purchase_line_no'];
            echo 'AM126_PURCHASE='.json_encode(array_intersect_key((array)$r,array_flip($keys))).PHP_EOL;
          }
          foreach(['labour_line_id','job_card_labour_id','billing_line_id','customer_billing_line_id'] as $col){
            if(in_array($col,$cols,true)){
              echo 'AM126_LINKED_COLUMN_'.$col.'='.json_encode(DB::table('workshop_purchases')->where($col,92)->pluck('id')->all()).PHP_EOL;
            }
          }
          $tax=\App\Services\JobCardTaxTotals::forJob($jc->id);
          echo 'AM126_CALCULATED_TOTALS='.json_encode($tax).PHP_EOL;
          echo 'AM126_SAVED_TOTALS='.json_encode(array_intersect_key((array)$jc,array_flip(['parts_total','labour_total','gst_total','pre_round_total','round_off','grand_total']))).PHP_EOL;
          echo 'AM126_INVOICE_COUNT='.DB::table('invoices')->where('job_card_id',$jc->id)->count().PHP_EOL;
          echo "AM126_READ_ONLY_COMPLETE\n";
          PHP
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519