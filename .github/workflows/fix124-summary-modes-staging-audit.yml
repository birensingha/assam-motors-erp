name: FIX124 Job Card Summary Print Modes - READ ONLY
on:
  push:
    branches: [fix/fix124-jobcard-summary-gst-print-20261025]
    paths: ['.github/workflows/fix124-summary-modes-staging-audit.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Inspect actual staging summary and estimate print (read only)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          VIEW=resources/views/job-cards/summary-print.blade.php
          EST=resources/views/estimates/print.blade.php
          echo 'FIX124_READONLY_BEGIN'
          echo '=== SHA AND LINE COUNTS ==='
          sha256sum "$VIEW" "$EST"
          wc -l "$VIEW" "$EST"
          echo '=== SUMMARY VIEW CURRENT ==='
          sed -n '1,260p' "$VIEW"
          echo '=== ESTIMATE MODE ANCHORS ==='
          grep -nEi -C 2 'am104ShowGst|with gst|without gst|print modes|with-gst|without-gst|tax basis' "$EST" | head -n 105 || true
          echo '=== JOB CARD SUMMARY CONTROLLER AND ACTION LINK ==='
          grep -nEi -C 5 'function printSummary|function summaryPrint|summary-print|summaryPrint' app/Http/Controllers/Web/AdminJobCardPageController.php resources/views/job-cards/show.blade.php routes/web.php | head -n 110 || true
          echo '=== TAX CALCULATION SOURCE ==='
          if [ -f app/Services/JobCardTaxTotals.php ];then sed -n '1,215p' app/Services/JobCardTaxTotals.php;fi
          echo '=== ITEM MODEL FIELDS ==='
          for f in app/Models/JobCardPart.php app/Models/JobCardLabour.php;do if [ -f "$f" ];then echo "FILE=$f";sed -n '1,115p' "$f";fi;done
          echo 'FIX124_READONLY_COMPLETE_NO_CHANGES'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
