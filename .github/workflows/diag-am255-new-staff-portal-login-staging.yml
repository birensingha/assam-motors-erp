name: AM255 Staff Login and Check-In — Readonly Audit
on:
  push:
    branches: [fix/am255-new-staff-portal-login-20261113]
    paths:
      - .github/workflows/diag-am255-new-staff-portal-login-staging.yml
      - deployment/live-fixes/AM255_NEW_STAFF_PORTAL_LOGIN/**
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Source syntax
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM255_NEW_STAFF_PORTAL_LOGIN/audit.py
      - name: Prepare STAGING SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$PORT"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4 5 6; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Read-only Staff Portal authentication and attendance API source diagnosis
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = "assam-erp-staging"
          test -f "$APP/artisan"
          cd "$HOME/assam-motors-deploy"
          git fetch origin fix/am255-new-staff-portal-login-20261113
          PATCH_DIR="$(mktemp -d)"
          git archive FETCH_HEAD deployment/live-fixes/AM255_NEW_STAFF_PORTAL_LOGIN | tar -x -C "$PATCH_DIR"
          python3 "$PATCH_DIR/deployment/live-fixes/AM255_NEW_STAFF_PORTAL_LOGIN/audit.py" "$APP"
          php "$PATCH_DIR/deployment/live-fixes/AM255_NEW_STAFF_PORTAL_LOGIN/attendance_probe.php" "$APP"
          REMOTE
      - name: Clean up SSH credential
        if: always()
        run: rm -f ~/.ssh/id_ed25519
