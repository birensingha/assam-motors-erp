name: AM252 Purchase Returns + Credit Notes — STAGING Read-Only Audit
on:
  push:
    branches: [feature/am252-unified-purchase-sales-register-20261112]
    paths:
      - .github/workflows/am252-register-audit.yml
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect routes, register views, transaction schema, controller methods — no rows
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = assam-erp-staging
          test -f "$APP/artisan"
          cd "$APP"
          echo AM252_PURCHASE_SALES_ROUTE_LIST_BEGIN
          php artisan route:list --json | php -r '
            $rows=json_decode(stream_get_contents(STDIN),true);
            foreach($rows as $r){$url=$r["uri"]??"";
              if(preg_match("~^(erp/)?(purchases|purchase-returns|sales|sales-register|credit-notes|invoices|counter-sales)~i",$url))
                echo ($r["method"]??"")." ".$url." ".($r["name"]??"")." ".($r["action"]??"")."\n";
            }
          '
          echo AM252_PURCHASE_SALES_ROUTE_LIST_END
          echo AM252_RELEVANT_APP_VIEW_FILES
          find resources/views -type f \( -ipath '*purchase*' -o -ipath '*sale*' -o -ipath '*invoice*' -o -ipath '*credit-note*' \) -name '*.blade.php' | head -75
          echo AM252_CONTROLLER_METHODS
          for f in app/Http/Controllers/Web/AdminPurchasePageController.php app/Http/Controllers/Web/AdminInvoicePageController.php app/Http/Controllers/Web/AdminSalesPageController.php app/Http/Controllers/Web/AdminCreditNotePageController.php app/Http/Controllers/Web/AdminCounterSalesController.php; do
            if [ -f "$f" ];then
              echo "FILE $f"; grep -nE '^[[:space:]]*(public|protected|private) function ' "$f" | head -80
            fi
          done
          echo AM252_SCHEMA_BEGIN
          php -r 'require "vendor/autoload.php";$a=require "bootstrap/app.php";$a->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $tables=["workshop_purchases","workshop_purchase_batches","workshop_purchase_items","workshop_purchase_returns","purchase_returns","purchase_return_items","workshop_purchase_return_items","invoices","invoice_items","credit_notes","invoice_credit_notes","sales_credit_notes","counter_sale_invoices","counter_sales","direct_sales","sales_returns","workshop_vendors","workshop_payment_vouchers"];
          foreach($tables as $t){if(\Illuminate\Support\Facades\Schema::hasTable($t)){echo "TABLE ".$t." COLUMNS ".implode(",",\Illuminate\Support\Facades\Schema::getColumnListing($t))."\n";}else echo "MISSING ".$t."\n";}'
          echo AM252_SCHEMA_END
          for f in resources/views/purchases/index.blade.php resources/views/invoices/index.blade.php resources/views/sales/index.blade.php resources/views/credit-notes/index.blade.php resources/views/counter-sales/index.blade.php; do
            if [ -f "$f" ];then
              echo "VIEW $f"
              sed -n '1,150p' "$f" | grep -E -v '(password|secret|token|@csrf)' | head -110
            fi
          done
          echo AM252_READ_ONLY_REGISTER_AUDIT_COMPLETE
          REMOTE
      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
