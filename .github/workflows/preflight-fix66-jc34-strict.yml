name: FIX66 JC34 Strict Financial Gate (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preflight-fix66-jc34-strict.yml'
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Readonly gate syntax
        run: php -l deployment/live-fixes/FIX66_JC34_AUTHORIZED_UAT/preflight.php
      - name: SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2;do
            if ssh-keyscan -T 18 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -y -qq sshpass;fi
      - name: Strict gate on staging data, no writes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT");SCP=(sshpass -e scp -P "$PORT");fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX66_JC34_AUTHORIZED_UAT"'
          "${SCP[@]}" deployment/live-fixes/FIX66_JC34_AUTHORIZED_UAT/preflight.php "$REMOTE:~/FIX66_JC34_AUTHORIZED_UAT/"
          "${SSH[@]}" "$REMOTE" "php '$HOME/FIX66_JC34_AUTHORIZED_UAT/preflight.php' '$ROOT'"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
