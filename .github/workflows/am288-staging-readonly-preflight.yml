name: AM288 STAGING read-only preflight
on:
  push:
    branches: [feature/am288-dynamic-inspection-assignment]
    paths: [.github/workflows/am288-staging-readonly-preflight.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Configure SSH (read-only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Inspect exact staging APIs and schema presence, no row values
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=25 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=25 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test -f "$ROOT/artisan"
          cd "$ROOT"
          echo AM288_READONLY_SOURCE_INVENTORY
          for p in app/Services/Am206InspectionMaster.php app/Services/InspectionQcGuard.php app/Http/Controllers/Api/V1/StaffExtraController.php app/Http/Controllers/Api/V1/OwnerWorkshopController.php routes/api.php; do
            if [ -f "$p" ]; then
              echo "PRESENT $p"
              sha256sum "$p" | cut -d' ' -f1
            else
              echo "MISSING $p"
            fi
          done
          echo AM288_READONLY_ROUTE_METADATA
          php artisan route:list --json 2>/dev/null | python3 -c 'import sys,json;d=json.load(sys.stdin);[print(x.get("method",""),x.get("uri",""),str(x.get("action",""))[:110],str(x.get("middleware",[]))[:150]) for x in d if "inspect" in str(x.get("uri","")).lower() or "qc" in str(x.get("uri","")).lower()][:80]' || true
          echo AM288_READONLY_TABLE_EXISTENCE
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap(); foreach(["job_cards","staff","job_card_inspection","am189_inspection_defects","am189_inspection_defect_audits","am206_inspection_master_versions","am206_job_inspection_forms","am288_inspection_answers","am288_inspection_events"] as $t){echo $t."=".(\Illuminate\Support\Facades\Schema::hasTable($t)?"YES":"NO")."\n";}' 2>/dev/null || { echo "AM288_SCHEMA_READONLY_CHECK_UNAVAILABLE"; exit 2; }
          echo AM288_STAGING_READONLY_PREFLIGHT_FINISHED_NO_MUTATIONS
          REMOTE
      - if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
