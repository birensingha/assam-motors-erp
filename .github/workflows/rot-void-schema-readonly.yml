name: Assam Motors ROT Void Status Schema Audit
on:
  push:
    branches: [fix/jc-cancelled-rot-void-20261013]
    paths: [.github/workflows/rot-void-schema-readonly.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only routes, finance schema and application source methods
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$APP"
          echo '=== ROT RELATED COLUMN TYPES (SCHEMA ONLY) ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';$app=require 'bootstrap/app.php';$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          foreach(['rot_sessions','job_card_labour','rot_mechanic_segments','job_card_change_audits'] as $t){
            echo "TABLE ".$t."\n";foreach(\Illuminate\Support\Facades\DB::select("SHOW COLUMNS FROM ".$t) as $c){
              if(in_array($c->Field,['id','status','execution_status','productive_seconds','rot_session_id','labour_line_id','staff_id','ended_at','total','action'],true))
                echo "FIELD ".$c->Field." TYPE=".$c->Type." NULL=".$c->Null."\n";
            }
          }
          $id=\Illuminate\Support\Facades\DB::table('job_cards')->where('job_no','JC-2026-0025')->value('id');
          $segments=\Illuminate\Support\Facades\DB::table('rot_mechanic_segments as seg')->join('rot_sessions as rot','rot.id','=','seg.rot_session_id')->where('rot.job_card_id',$id)->count();
          echo "TARGET_SEGMENTS=".$segments."\n";
          PHP
          echo '=== JOB SUMMARY START / STATUS GATES ==='
          grep -nE "job->status|\\$amLifeStage==='OPEN'|Delete Empty Job Card" resources/views/job-cards/lifecycle-panel.blade.php resources/views/job-cards/show.blade.php | head -25
          echo 'ROT_VOID_SCHEMA_AUDIT_PASS'
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"