name: Assam Motors JC Delete & Purchase Settlement Audit
on:
  push:
    branches: [feature/jobcard-delete-purchase-settlement-20261013]
    paths: [.github/workflows/jc-payment-source-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only routes, finance schema and application source methods
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$APP"
          echo '=== PAYMENT SERVICE SOURCE ==='
          nl -ba app/Services/ExpensePaymentService.php | sed -n '125,225p'
          echo '=== PAYMENT CONTROLLER SOURCE ==='
          nl -ba app/Http/Controllers/Web/AdminExpensePaymentPageController.php | sed -n '58,100p'
          echo '=== PAYMENT CREATE BLADE SOURCE ==='
          nl -ba resources/views/payments/create.blade.php | sed -n '1,165p'
          echo '=== PURCHASE SERVICE / BATCH TOTAL REFERENCES ==='
          grep -nE 'purchase_batch_no|pre_round_total|round_off|grand_total|function.*batch|workshop_purchase_batches|total_amount' app/Services/PurchaseService.php | head -72
          echo '=== JOB CARD PAGE METHODS/DELETE LIST ==='
          grep -nE 'function (index|show|destroy|store|edit|update|delete|cancel)|job_card_delete_audit|from .job_cards|DB::table\(.job_cards|return view' app/Http/Controllers/Web/AdminJobCardPageController.php | head -87
          echo '=== JOB CARD LIST / SHOW UI LINKS ==='
          for t in resources/views/job-cards/index.blade.php resources/views/job-cards/show.blade.php; do
            echo "VIEW=$t"
            sed -n '1,72p' "$t"
          done
          echo '=== ROUTES CONTEXT ==='
          sed -n '52,98p' routes/web.php
          echo 'SOURCE_CODE_AUDIT_NO_WRITES_PASS'
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"