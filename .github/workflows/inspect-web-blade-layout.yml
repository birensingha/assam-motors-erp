name: Inspect Web Blade Layout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-web-blade-layout.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Blade headers
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          fi
          ROOT="/home/$SSH_USER/domains/assammotors.com/assam-erp-staging"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "ROOT='$ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$ROOT"
          echo '=== JOB SHOW HEADER ==='
          sed -n '1,24p' resources/views/job-cards/show.blade.php
          echo '=== ESTIMATE SHOW HEADER ==='
          sed -n '1,28p' resources/views/estimates/show.blade.php
          echo '=== ESTIMATE PRINT HEADER ==='
          sed -n '1,36p' resources/views/estimates/print.blade.php
          echo '=== LAYOUT FILES ==='
          find resources/views -maxdepth 2 -type f -path '*layout*' -print | sort
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
