name: FIX83 Emergency Rollback JC 500 STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-fix83-jc500.yml'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do
            if ssh-keyscan -T 14 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -y -qq sshpass;fi
      - name: Read latest JC error and restore exact pre FIX83 view/controller
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1";cd "$APP";test -f artisan && test -d vendor
          SOURCE="storage/app/FIX83_ONE_LABOUR_OSL_BACKUP_20261021_172003"
          VIEW="resources/views/job-cards/show.blade.php"
          CTRL="app/Http/Controllers/Web/AdminJobCardPageController.php"
          test -f "$SOURCE/show.blade.php" && test -f "$SOURCE/AdminJobCardPageController.php"
          # Give an exception class/message and exact originating source line,
          # not entire stack/log with potential customer info.
          python3 - <<'PY'
          from pathlib import Path
          import re
          logs=sorted(Path('storage/logs').glob('laravel*.log'),key=lambda p:p.stat().st_mtime)
          if not logs:
            print('FIX83_LOG_NONE')
          else:
            s=logs[-1].read_bytes()[-240000:].decode('utf8','replace')
            errors=list(re.finditer(r'(?:production|staging|local)\.ERROR:.*|\[\d{4}-\d{2}-\d{2}[^\]]+\].*ERROR:.*',s))
            if not errors:
              print('FIX83_LOG_NO_RECENT_ERROR')
            else:
              block=s[errors[-1].start():errors[-1].start()+1200]
              for l in block.splitlines()[:7]:
                l=re.sub(r'(?:https?://[^\s"\']+|[\w.+-]+@[\w.-]+|\+?\d[\d\s-]{8,}\d)','[redacted]',l)
                if '.php' in l or 'ERROR' in l or 'Error' in l or 'Exception' in l:
                  print('FIX83_ERROR_DIAG',l[:500])
          PY
          EXPECT_VIEW=cc418f920608aac9e63064a6be7ed7033772648f482efb6ec277c300964f0c34
          EXPECT_CTRL=d6d7cab124151ad1695d1a08317cfd6e9d8ab08fb7dd12404df99793489008c9
          printf '%s  %s\n' "$EXPECT_VIEW" "$SOURCE/show.blade.php" | sha256sum --check --status
          printf '%s  %s\n' "$EXPECT_CTRL" "$SOURCE/AdminJobCardPageController.php" | sha256sum --check --status
          if ! grep -Fq 'FIX83_SINGLE_LABOUR_OSL_WORKSPACE' "$VIEW";then
            echo 'FIX83_LIVE_MARKER_ABSENT_ABORT';exit 5
          fi
          # Save exact crashing version for future root cause inspection.
          FAILED="storage/app/FIX83_FAILED_500_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$FAILED";chmod 700 "$FAILED"
          cp -p "$VIEW" "$FAILED/show.blade.php"
          cp -p "$CTRL" "$FAILED/AdminJobCardPageController.php"
          cp -p "$SOURCE/show.blade.php" "$VIEW"
          cp -p "$SOURCE/AdminJobCardPageController.php" "$CTRL"
          php -l "$CTRL"
          php artisan view:clear
          php artisan view:cache
          printf '%s  %s\n' "$EXPECT_VIEW" "$VIEW" | sha256sum --check
          printf '%s  %s\n' "$EXPECT_CTRL" "$CTRL" | sha256sum --check
          for path in /erp/login /staff/login;do
            h="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")"
            echo "FIX83_ROLLBACK_HEALTH_$path=$h"
            test "$h" = 200
          done
          echo "FIX83_JC500_ROLLBACK_PASS_PRE_FIX83_RESTORED; FAILED_VERSION_BACKUP=$FAILED"
          REMOTE
      - name: Clean up SSH
        if: always()
        run: rm -f ~/.ssh/id_ed25519
