name: Audit Labour Hours 20261023
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-labour-hours-20261023.yml']
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH with pinned host
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            echo "FIX106_SSH_SCAN_RETRY_$n"
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Inspect labour hours form and save handling
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519);else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('resources/views/job-cards/show.blade.php'),Path('routes/web.php')]
          files+=list(Path('app/Http/Controllers').rglob('*.php'))
          files+=list(Path('app/Services').rglob('*.php'))
          for p in files:
           s=p.read_text(errors='replace').splitlines()
           hits=[i for i,l in enumerate(s) if ('am82-new-std' in l or 'erp.job-cards.labour.direct' in l or '/labour/direct' in l or (('standard_hours' in l or 'function addLabour' in l) and p.suffix=='.php' and 'views' not in str(p)))]
           if not hits:continue
           if 'show.blade' in str(p):radius=9
           elif str(p)=='routes/web.php':radius=3
           else:radius=16
           seen=set()
           for h in hits:
            for n in range(max(0,h-radius),min(len(s),h+radius+1)):
             if n in seen:continue
             seen.add(n)
             if re.search(r'password|secret|bearer|api.key|private.key',s[n],re.I):continue
             print(str(p)+':'+str(n+1)+': '+s[n][:700])
          PY
          REMOTE
      - name: Cleanup ephemeral credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
