name: FIX128 Restore Two Bulk Buttons In Parts Heading - STAGING
on:
  push:
    branches: [fix/fix128-jc-bulk-bar-safe-20261025]
    paths: ['.github/workflows/fix128-bulk-buttons-staging-deploy.yml']
permissions:
  contents: read
jobs:
  deploy-staging-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Restore two bulk buttons safely inside Parts heading without altering layout
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX128_DEPLOY_START'
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/birensingha/assam-motors-erp/b6c8a2c43d781c37b24a507fec27bfcd25a5d492/deployment/live-fixes/FIX128_BULK_ACTIONS/apply_fix128_staging.py' -o /tmp/fix128-apply.py
          python3 -m py_compile /tmp/fix128-apply.py
          python3 /tmp/fix128-apply.py check "$PWD"
          python3 /tmp/fix128-apply.py apply "$PWD"
          echo '=== SOURCE TARGETED ANCHOR ==='
          grep -nE "parts-bulk-actions|FIX128: per-row" resources/views/job-cards/show.blade.php | head -n 5
          echo '=== PHP ROUTES ==='
          php -l routes/web.php
          echo 'FIX128_DEPLOY_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
