name: FIX130 Purchase Round Off and Ledger - READ ONLY
on:
  push:
    branches: [audit/fix130-purchase-rounding-ledger-20261025]
    paths: ['.github/workflows/fix130-purchase-roundoff-ledger-readonly.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Audit Purchase entry rounding and linked ledger rows read only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX130_READONLY_BEGIN'
          echo '=== PURCHASE PAYMENT AND LEDGER SOURCE PATHS ==='
          find app resources/views -maxdepth 5 -type f \( -iname '*purchase*' -o -iname '*payment*' -o -iname '*ledger*' \) | head -n 100
          echo '=== PURCHASE VIEW TEMPLATE NAMES ==='
          ls -l resources/views/purchases/ 2>/dev/null | head -n 28
          echo '=== ROUND OFF CODE ANCHORS ==='
          grep -RniE 'round.off|roundoff|round_off|grand.total|net.payable' resources/views/purchases app/Services/PurchaseService.php app/Http/Controllers/Web/AdminPurchasePageController.php | head -n 125 || true
          echo '=== LEDGER ENTRY ROUTE CONTROLLER ==='
          grep -nEi 'ledger|payment.voucher|purchase' routes/web.php | head -n 115 || true
          echo '=== PURCHASE BILL + LEDGER SCHEMA (COLUMN NAMES ONLY) ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::class;
          $schema=\Illuminate\Support\Facades\Schema::class;
          foreach(['workshop_purchase_batches','workshop_purchases','workshop_payments','payment_vouchers','ledger_entries','workshop_ledger_entries','account_ledger_entries','vendor_ledger_entries'] as $name){
           if($schema::hasTable($name)){
            echo 'TABLE='.$name.' COLUMNS='.implode(',',$schema::getColumnListing($name))."\n";
           }
          }
          $bill='PB-261025124019-467';
          if($schema::hasTable('workshop_purchase_batches')){
            $batchCols=$schema::getColumnListing('workshop_purchase_batches');
            if(in_array('batch_no',$batchCols,true)){
              $batch=$db::table('workshop_purchase_batches')->where('batch_no',$bill)->first();
              if($batch){
                echo 'BILL_FOUND=YES'.PHP_EOL;
                foreach(['id','batch_no','grand_total','taxable_total','gst_total','round_off','discount_total','created_at'] as $key)
                 if(property_exists($batch,$key))echo "BILL_{$key}=".$batch->$key.PHP_EOL;
              }else echo 'BILL_FOUND=NO'.PHP_EOL;
            }
          }
          echo "FIX130_DATABASE_READ_ONLY_COMPLETE\n";
          PHP
          echo 'FIX130_READONLY_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
