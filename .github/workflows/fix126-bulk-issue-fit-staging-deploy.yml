name: FIX126 Two-Button Parts Issue and Fit - STAGING
on:
  push:
    branches: [fix/fix126-bulk-issue-fit-20261025]
    paths: ['.github/workflows/fix126-bulk-issue-fit-staging-deploy.yml']
permissions:
  contents: read
jobs:
  deploy-staging-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Deploy guarded bulk stock controller routes and 2-button UI
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX126_STAGING_DEPLOY_BEGIN'
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/birensingha/assam-motors-erp/131051e333ae47886c4db57d04dcf13736eeba57/deployment/live-fixes/FIX126_BULK_PARTS/apply_fix126_staging.py' -o /tmp/fix126-staging.py
          python3 -m py_compile /tmp/fix126-staging.py
          python3 /tmp/fix126-staging.py check "$PWD"
          python3 /tmp/fix126-staging.py apply "$PWD"
          echo '=== VERIFY TWO BULK ROUTES ==='
          php artisan route:list --name=erp.job-cards.parts.issue-all
          php artisan route:list --name=erp.job-cards.parts.fitted-all
          echo '=== VERIFY COMPACT BUTTONS ==='
          grep -n 'FIX126_BULK_PARTS_TWO_BUTTONS' resources/views/job-cards/show.blade.php | head -n 4
          echo 'FIX126_STAGING_DEPLOY_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
