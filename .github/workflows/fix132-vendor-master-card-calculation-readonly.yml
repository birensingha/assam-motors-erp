name: FIX132 Vendor Master Card Calculation - READ ONLY
on:
  push:
    branches: [audit/fix132-vendor-outstanding-payment-multi-20261025]
    paths: ['.github/workflows/fix132-vendor-master-card-calculation-readonly.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Audit Vendor Master card vs ledger outstanding for vendor 5
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX132_CARD_READONLY_BEGIN'
          echo '=== VENDOR INDEX CONTROLLER ==='
          sed -n '1,125p' app/Http/Controllers/Web/AdminVendorPageController.php
          echo '=== VENDOR INDEX VIEW ==='
          sed -n '1,175p' resources/views/vendors/index.blade.php
          echo '=== VENDOR COMPONENTS ==='
          grep -RniE 'Purchase lifetime totals|Vendor payments|Manage Vendor|View Ledger|purchase_total|payment_total' resources/views/vendors resources/views/dashboard 2>/dev/null | head -n 80 || true
          echo '=== VENDOR MASTER SVC AND PURCHASE SERVICE ==='
          grep -RniE 'vendorStats|vendorSummary|total_purchases|vendor_payment|vendor.*outstanding|vendor_purchase' app/Services app/Http/Controllers/Web/AdminVendorPageController.php 2>/dev/null | head -n 100 || true
          echo 'FIX132_CARD_READONLY_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
