name: AM246 Tally-style Master Item Ledger STAGING guarded
on:
  push:
    branches: [feature/am246-master-item-ledgers]
    paths: ['.github/workflows/am246-master-ledgers-staging.yml']
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.assammotors.com' }}
      STAGING_LOGIN_PATH: ${{ vars.STAGING_LOGIN_PATH || '/erp/login' }}
      STAGING_ADMIN_LOGIN: ${{ secrets.STAGING_ADMIN_LOGIN }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      SMOKE_OUTPUT_DIR: am246-browser-proof
    steps:
      - uses: actions/checkout@v4
      - name: Validate feature package locally
        shell: bash
        run: |
          set -euo pipefail
          P=deployment/live-fixes/AM246_MASTER_ITEM_LEDGERS
          python3 -m py_compile "$P/apply.py"
          php -l "$P/AdminMasterItemLedgerController.php"
          php -l "$P/qa/controller-test.php"
          node --check "$P/qa/browser-test.mjs"
      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Source-backup deploy and 3-master read-only controller QA
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM246_MASTER_LEDGERS"'
          P=deployment/live-fixes/AM246_MASTER_ITEM_LEDGERS
          "${SCP[@]}" "$P/apply.py" "$P/AdminMasterItemLedgerController.php" "$P/item-ledger.blade.php" "$P/qa/controller-test.php" "$REMOTE:~/AM246_MASTER_LEDGERS/"
          CHECK=$("${SSH[@]}" "$REMOTE" "python3 ~/AM246_MASTER_LEDGERS/apply.py check '$ROOT'")
          printf '%s\n' "$CHECK"
          grep -q AM246_PREFLIGHT_PASS <<<"$CHECK"
          RESULT=$("${SSH[@]}" "$REMOTE" "python3 ~/AM246_MASTER_LEDGERS/apply.py apply '$ROOT'")
          printf '%s\n' "$RESULT"
          grep -q AM246_INSTALLED <<<"$RESULT"
          BACKUP=$(printf '%s\n' "$RESULT" | sed -n 's/^AM246_BACKUP=//p' | tail -1)
          test -n "$BACKUP"
          echo "AM246_BACKUP_PATH=$BACKUP" >> "$GITHUB_ENV"
          "${SSH[@]}" "$REMOTE" "cd '$ROOT' && php -l app/Http/Controllers/Web/AdminMasterItemLedgerController.php && php -l routes/web.php && php artisan view:clear && php artisan view:cache && php artisan route:list --path=erp/masters/item-ledger && php ~/AM246_MASTER_LEDGERS/controller-test.php '$ROOT'" | tee "$RUNNER_TEMP/am246-check.log"
          grep -q 'item-ledger' "$RUNNER_TEMP/am246-check.log"
          grep -q AM246_CONTROLLER_READONLY_TEST_FINISHED_NO_MUTATIONS "$RUNNER_TEMP/am246-check.log"
          grep -q AM246_AUTHORIZATION_403_PASS "$RUNNER_TEMP/am246-check.log"
      - name: Install Chrome for protected screen QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser QA three masters and search (no financial writes)
        run: node deployment/live-fixes/AM246_MASTER_ITEM_LEDGERS/qa/browser-test.mjs
      - name: Automatic rollback on failure
        if: failure() && env.AM246_BACKUP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT");fi
          "${SSH[@]}" "$REMOTE" "python3 ~/AM246_MASTER_LEDGERS/apply.py rollback '$ROOT' '$AM246_BACKUP_PATH' && cd '$ROOT' && php artisan view:clear"
      - name: Upload screenshots and verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am246-tally-master-ledger-browser-proof
          path: am246-browser-proof/
          retention-days: 14
          if-no-files-found: warn
      - name: Cleanup SSH secret
        if: always()
        run: rm -f ~/.ssh/id_ed25519
