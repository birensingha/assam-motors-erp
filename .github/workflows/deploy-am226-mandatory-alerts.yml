name: AM226 Correct Mandatory Notification Lifecycle STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-am226-mandatory-alerts.yml'
      - 'deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/install.py'
  workflow_dispatch:
permissions: {contents: read, issues: write}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Python installer syntax
        id: qa
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/install.py
      - name: Configure STAGING SSH
        id: ssh
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq;sudo apt-get install -qq -y sshpass
          fi
      - name: Read-only check, full private STAGING DB backup, guarded source apply
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM226_REMINDERS_DEPLOY"'
          "${SCP[@]}" deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/install.py "$REMOTE:~/AM226_REMINDERS_DEPLOY/install.py"
          "${SSH[@]}" "$REMOTE" "set -e
            PATCH=~/AM226_REMINDERS_DEPLOY/install.py
            python3 \"\$PATCH\" check '$ROOT'
            test -f ~/assam-motors-deploy/deployment/live-fixes/AM212_ROT_WORK_PROCEDURE/staging_shell_backup.sh
            bash ~/assam-motors-deploy/deployment/live-fixes/AM212_ROT_WORK_PROCEDURE/staging_shell_backup.sh '$ROOT'
            python3 \"\$PATCH\" apply '$ROOT'
            php -l '$ROOT/app/Services/StaffReminderEngine.php'
            php -l '$ROOT/app/Services/StaffDashboardService.php'
          " 2>&1 | tee "$RUNNER_TEMP/am226_result.txt"
      - name: Post STAGING status without staff record data
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RESULT: ${{ steps.qa.outcome }}
          SSH_RESULT: ${{ steps.ssh.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
        run: |
          markers=""
          if [ -f "$RUNNER_TEMP/am226_result.txt" ];then
            markers="$(grep -E '^AM226_|^AM212_FRESH_STAGING_DB_BACKUP' "$RUNNER_TEMP/am226_result.txt" | tail -24 | tr '\n' ';' | cut -c1-1750 || true)"
          fi
          body="AM226 STAGING mandatory alert lifecycle: static=$QA_RESULT SSH=$SSH_RESULT apply=$DEPLOY_RESULT. $markers. No alert rows manually deleted. Scheduled reconciliation / actual portal browser QA separate. Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api repos/"$GITHUB_REPOSITORY"/issues/124/comments -f body="$body" || true
      - name: Remove ephemeral SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
