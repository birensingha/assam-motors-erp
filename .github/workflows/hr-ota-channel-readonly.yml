name: Assam Motors Staff OTA Channel Readonly Audit
on:
  push:
    branches: [feature/hr-fixed-salary-absence-impact-20261013]
    paths: [.github/workflows/hr-ota-channel-readonly.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Inspect OTA endpoint and current update feed (read-only)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$ROOT"
          echo '=== OTA FEED FILE ==='
          f=public/legacy/api/staff-app-update.php
          if [ -f "$f" ]; then sed -n '1,250p' "$f"; else echo "UPDATE_ENDPOINT_MISSING"; fi
          echo '=== LIST OTA ARTIFACT LOCATIONS (no payload) ==='
          find public storage/app -maxdepth 6 -type f \( -name 'latest.json' -o -iname '*staff*update*' -o -iname '*release*apk' \) -printf '%p\n' | head -65
          echo '=== OTA RESPONSE WITHOUT CREDENTIALS ==='
          curl -LsS --max-time 20 'https://staging.assammotors.com/legacy/api/staff-app-update.php?platform=android&version_code=60200' | head -c 1100 || true
          echo
          echo 'OTA_READONLY_INSPECTION: PASS'
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"