          cp -p "$ATT" "$BACKUP/attendance.blade.php"
          rollback(){
            cp -p "$BACKUP/attendance.blade.php" "$ATT"
            php artisan view:clear >/dev/null 2>&1 || true
            echo ATTENDANCE_SINGLE_STATUS_ROLLBACK_RESTORED
