name: Diagnose Owner Admin Attendance and Dashboard Timeout (Read Only)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v640-diagnose-owner-timeout.yml"
      - "deployment/live-fixes/V640_ADMIN_TIMEOUT/**"
permissions: { contents: read }
concurrency:
  group: assam-motors-v640-timeout-diagnose
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/admin-attendance-dashboard-timeout-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check targeted updater controller and guarded deploy
        shell: bash
        run: |
          set -euo pipefail
          bash -n deployment/live-fixes/V640_ADMIN_TIMEOUT/DIAGNOSE_READONLY.sh
          test -s deployment/live-fixes/V640_ADMIN_TIMEOUT/DIAGNOSE_READONLY.sh
          grep -Fq 'SOURCE DIAGNOSIS READONLY COMPLETE' deployment/live-fixes/V640_ADMIN_TIMEOUT/DIAGNOSE_READONLY.sh
      - name: Deploy to Hostinger staging via existing secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          install -d -m 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/v640
            chmod 600 ~/.ssh/v640
            SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -i ~/.ssh/v640 -p "$PORT")
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -p "$PORT")
          fi
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          TEMP_DIR="/tmp/v640-attendance-diagnose-${GITHUB_RUN_ID}"
          # Stage authenticated PHP only in the Laravel project folder.
          tar -czf /tmp/v640-attendance-diagnose.tgz -C deployment/live-fixes/V640_ADMIN_TIMEOUT DIAGNOSE_READONLY.sh
          if [ -n "$KEY" ]; then
            SCP=(scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/v640 -P "$PORT")
          else
            SCP=(sshpass -e scp -o StrictHostKeyChecking=accept-new -P "$PORT")
          fi
          "${SCP[@]}" /tmp/v640-attendance-diagnose.tgz "$USERNAME@$HOST:$TEMP_DIR.tgz"
          "${SSH[@]}" "$USERNAME@$HOST" "mkdir -p '$TEMP_DIR' && tar -xzf '$TEMP_DIR.tgz' -C '$TEMP_DIR' && bash '$TEMP_DIR/DIAGNOSE_READONLY.sh' '/home/u956497103/domains/assammotors.com/assam-erp-staging'; result=\$?; rm -rf '$TEMP_DIR' '$TEMP_DIR.tgz'; exit \$result"
      - if: always()
        run: rm -f ~/.ssh/v640 /tmp/v640-attendance-diagnose.tgz
