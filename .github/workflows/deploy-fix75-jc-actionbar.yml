name: FIX75 JC Quick Actions Three Buttons STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fix75-jc-actionbar.yml'
      - 'deployment/live-fixes/FIX75_JC_ACTION_BAR/apply.py'
permissions: {contents: read}
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check patch source and intended labels
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/FIX75_JC_ACTION_BAR/apply.py
          grep -Fq 'FIX75_JC_THREE_ACTION_BAR' deployment/live-fixes/FIX75_JC_ACTION_BAR/apply.py
          grep -Fq 'Job Card Summary' deployment/live-fixes/FIX75_JC_ACTION_BAR/apply.py
          grep -Fq 'Credit Note' deployment/live-fixes/FIX75_JC_ACTION_BAR/apply.py
      - name: Secure STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          install -d -m 700 ~/.ssh
          for i in 1 2;do
            if ssh-keyscan -T 18 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Backup and deploy one-row JC action toolbar
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX75_JC_ACTION_BAR"'
          "${SCP[@]}" deployment/live-fixes/FIX75_JC_ACTION_BAR/apply.py "$REMOTE:~/FIX75_JC_ACTION_BAR/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1";PKG="$HOME/FIX75_JC_ACTION_BAR";cd "$APP"
          test -f artisan && test -d vendor
          python3 "$PKG/apply.py" check "$APP"
          BACKUP="storage/app/FIX75_JC_ACTIONBAR_BACKUP_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP"
          cp -p resources/views/job-cards/show.blade.php "$BACKUP/show.blade.php"
          rollback(){
            echo 'FIX75_ROLLBACK_VIEW'
            cp -p "$BACKUP/show.blade.php" resources/views/job-cards/show.blade.php
            php artisan view:clear >/dev/null 2>&1 || true
          }
          trap rollback ERR
          python3 "$PKG/apply.py" apply "$APP"
          php artisan view:clear
          php artisan view:cache
          python3 - <<'PY'
          from pathlib import Path
          s=Path('resources/views/job-cards/show.blade.php').read_bytes().decode('utf-8', errors='surrogateescape')
          hdr=s.index("<nav class=\"am75-quick-actions\"")
          end=s.index("</nav>",hdr)
          bar=s[hdr:end]
          for phrase in ('Job Card Summary','Credit Note','Estimate/ Reverse'):
           if phrase not in bar:raise RuntimeError('FIX75 missing '+phrase)
          if not (bar.index('Job Card Summary')<bar.index('Credit Note')<bar.index('Estimate/ Reverse')):
           raise RuntimeError('FIX75 toolbar sequence wrong')
          if any(sx in bar for sx in ('Purchase for Job','Expense for Job')):
           raise RuntimeError('FIX75 old purchase/expenses shortcut remains')
          if s.index('<nav class="am75-quick-actions"') > s.index('<div class="page-head">'):
           raise RuntimeError('FIX75 toolbar below job heading, expected above')
          if s.count('class="am75-quick-actions"')!=1:
           raise RuntimeError('FIX75 multiple toolbars')
          for name in ('route(\'erp.job-cards.summary-print\',$job->id)',
                       'route(\'erp.job-cards.credit-correction\',$job->id)',
                       'route(\'erp.estimates.create\',$job->id)'):
           if name not in s:raise RuntimeError('FIX75 route lost: '+name)
          if 'Purchase for Job' in s or 'Expense for Job' in s:
           raise RuntimeError('FIX75 redundant links still on view')
          print('FIX75_THREE_BUTTONS_POSITION_ORDER_LABELS_ROUTES_PASS')
          PY
          for path in /erp/login /staff/login;do
            status="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")"
            echo "FIX75_HEALTH_$path=$status";test "$status" = 200
          done
          trap - ERR
          echo "FIX75_STAGING_JC_ACTIONBAR_DEPLOY_SUCCESS BACKUP=$BACKUP VIEW_ONLY"
          REMOTE
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
