name: Deploy Approved Compact Blue Staff Live Location V2
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-staff-location-compact-blue-v2-20261018.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved map-first V2 Blade patch after server dry-run
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/am-live-v2
            chmod 600 ~/.ssh/am-live-v2
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=4 -o StrictHostKeyChecking=accept-new -i ~/.ssh/am-live-v2 -p "$PORT")
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -o ConnectionAttempts=4 -o StrictHostKeyChecking=accept-new -p "$PORT")
          fi
          SRC=deployment/live-fixes/FIX_STAFF_LIVE_COMPACT_V2_20261018/apply.py
          test -s "$SRC"
          python3 -m py_compile "$SRC"
          echo 'STAFF_BLUE_V2_PATCH_SYNTAX=PASS'
          "${SSH[@]}" "$USERNAME@$HOST" 'python3 - --root "$HOME/domains/assammotors.com/assam-erp-staging"' < "$SRC"
          echo 'STAFF_BLUE_V2_SERVER_DRY_RUN=PASS'
          "${SSH[@]}" "$USERNAME@$HOST" 'python3 - --root "$HOME/domains/assammotors.com/assam-erp-staging" --apply' < "$SRC"
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          VIEW=resources/views/admin/native/staff-live-location.blade.php
          grep -Fq 'AM_STAFF_LIVE_BLUE_V2_20261018' "$VIEW"
          grep -Fq 'id="slV2Tools"' "$VIEW"
          grep -Fq 'id="slV2Focus"' "$VIEW"
          grep -Fq 'id="slMap"' "$VIEW"
          grep -Fq 'id="slHistoryButton"' "$VIEW"
          php artisan route:list --path=erp/staff-live-location
          echo 'STAFF_BLUE_V2_LIVE_VIEW_AND_ROUTES=PASS'
          REMOTE
      - name: Verify protected GPS page and login health
        shell: bash
        run: |
          set -euo pipefail
          for path in /erp/login /staff/login; do
            code=$(curl -sS -L --max-time 30 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")
            echo "STAGING_LOGIN_PATH=$path HTTP=$code"
            test "$code" = 200
          done
          code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' 'https://staging.assammotors.com/erp/staff-live-location')
          echo "STAFF_BLUE_V2_GUEST_PROTECTED_HTTP=$code"
          test "$code" = 302 || test "$code" = 401 || test "$code" = 403
          echo 'STAFF_BLUE_V2_DEPLOYMENT_VERIFIED=PASS'
      - if: always()
        run: rm -f ~/.ssh/am-live-v2
