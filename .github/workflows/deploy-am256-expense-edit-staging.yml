name: AM256 Expense Voucher Amount Edit + Audit — STAGING
on:
  push:
    branches: [fix/am256-expense-edit-amount-audit-20261114]
    paths:
      - .github/workflows/deploy-am256-expense-edit-staging.yml
      - deployment/live-fixes/AM256_EXPENSE_EDIT/install.py
      - deployment/live-fixes/AM256_EXPENSE_EDIT/files/**
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python and PHP syntax
        run: |
          set -euo pipefail
          P=deployment/live-fixes/AM256_EXPENSE_EDIT
          python3 -m py_compile "$P/install.py" "$P/audit.py"
          php -l "$P/files/app/Services/ExpenseAmountCorrectionService.php"
          php -l "$P/files/database/migrations/2026_11_14_193000_am256_expense_amount_corrections.php"
          echo AM256_SOURCE_PREFLIGHT_PASS
      - name: Prepare Hostinger SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$PORT"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4 5 6; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Protected Expense edit, private DB backup, additive audit migration
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = "assam-erp-staging"
          test -f "$APP/artisan"
          cd "$HOME/assam-motors-deploy"
          git fetch origin fix/am256-expense-edit-amount-audit-20261114
          PATCH_DIR="$(mktemp -d)"
          git archive FETCH_HEAD deployment/live-fixes/AM256_EXPENSE_EDIT | tar -x -C "$PATCH_DIR"
          PKG="$PATCH_DIR/deployment/live-fixes/AM256_EXPENSE_EDIT"
          SCRIPT="$PKG/install.py"
          if grep -Fq "AM256_AUDITED_EXPENSE_AMOUNT_EDIT" "$APP/routes/web.php"; then
            echo AM256_EXISTING_INSTALL_VERIFY_ONLY
          else
            python3 "$SCRIPT" check "$APP"
            python3 "$SCRIPT" prepare "$APP"
            # Verified private MariaDB shell backup with full table coverage.
            git fetch origin feature/am246-complaint-rework-assign-20261110
            git archive FETCH_HEAD deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN | tar -x -C "$PATCH_DIR"
            BACKUP="$PATCH_DIR/deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN"
            bash "$BACKUP/staging_db_backup_shell.sh" "$APP"
            cd "$APP"
            php artisan migrate --path=database/migrations/2026_11_14_193000_am256_expense_amount_corrections.php --force
            python3 "$SCRIPT" apply "$APP"
          fi
          python3 "$SCRIPT" verify "$APP"
          echo AM256_STAGING_UNPAID_EXPENSE_EDIT_WITH_AUDIT_VERIFIED
          REMOTE
      - name: Remove ephemeral SSH identity
        if: always()
        run: rm -f ~/.ssh/id_ed25519
