name: FIX130 Purchase Preview and Vendor Ledger Detail - READ ONLY
on:
  push:
    branches: [audit/fix130-purchase-rounding-ledger-20261025]
    paths: ['.github/workflows/fix130-purchase-entry-ledger-detail-readonly.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Inspect purchase roundoff preview and vendor ledger grouping read only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX130_DETAIL_READONLY_BEGIN'
          echo '=== SOURCE CHECKSUMS ==='
          sha256sum resources/views/purchases/create.blade.php resources/views/purchases/edit.blade.php resources/views/vendors/ledger.blade.php app/Http/Controllers/Web/AdminVendorPageController.php app/Services/PurchaseService.php
          echo '=== CREATE ROUND OFF UI + JS ==='
          nl -ba resources/views/purchases/create.blade.php | sed -n '345,470p'
          echo '=== PURCHASE CREATE JS END ==='
          nl -ba resources/views/purchases/create.blade.php | sed -n '470,615p'
          echo '=== VENDOR LEDGER VIEW ==='
          sed -n '1,225p' resources/views/vendors/ledger.blade.php
          echo '=== VENDOR CONTROLLER LEDGER METHOD ==='
          grep -nEi -C 7 'function ledger|ledger\(' app/Http/Controllers/Web/AdminVendorPageController.php | head -n 140 || true
          echo '=== LEDGER SERVICE/SQL REFERENCES ==='
          grep -RniE 'function (ledger|vendorLedger)|ledgerRows|vendor_ledger|workshop_vendor_payments|purchase_batch_no' app/Services/ExpensePaymentService.php app/Services/VendorService.php app/Http/Controllers/Web/AdminVendorPageController.php 2>/dev/null | head -n 135 || true
          echo '=== MATCHED PURCHASE LINES FOR BILL (NO CUSTOMER DATA) ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::class;
          $rows=$db::table('workshop_purchases')->where('purchase_batch_no','PB-261025124019-467')->get(['id','job_card_id','total_amount','record_status','purchase_line_no']);
          echo 'PURCHASE_ITEM_COUNT='.$rows->count()."\n";
          foreach($rows as $row)echo "ITEM_ID={$row->id} JC_ID={$row->job_card_id} LINE={$row->purchase_line_no} TOTAL={$row->total_amount} STATUS={$row->record_status}\n";
          $batch=$db::table('workshop_purchase_batches')->where('batch_no','PB-261025124019-467')->first(['id','vendor_id','round_off','grand_total']);
          if($batch)echo "BATCH_ID={$batch->id} VENDOR_ID={$batch->vendor_id} ROUND_OFF={$batch->round_off} TOTAL={$batch->grand_total}\n";
          echo 'FIX130_DETAIL_DB_READ_ONLY_PASS';
          PHP
          echo 'FIX130_DETAIL_READONLY_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
