name: AM236 Vendor New/Advance Reference STAGING Deployment
on:
  pull_request:
    paths:
      - '.github/workflows/deploy-am236-payment-reference-staging.yml'
      - 'deployment/live-fixes/AM236_PAYMENT_REFERENCE_FLOW/apply.py'
      - 'deployment/live-fixes/AM236_PAYMENT_REFERENCE_FLOW/vendor-combobox.js'
      - 'deployment/live-fixes/AM236_PAYMENT_REFERENCE_FLOW/vendor-combobox.css'
      - 'deployment/live-fixes/AM236_PAYMENT_REFERENCE_FLOW/DEPLOY_STAGING.sh'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  deploy:
    name: Backup, validate and deploy New Reference/Advance vendor payment flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == 'birensingha/assam-motors-erp'
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Static patch, popup JS and shell checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM236_PAYMENT_REFERENCE_FLOW/apply.py
          bash -n deployment/live-fixes/AM236_PAYMENT_REFERENCE_FLOW/DEPLOY_STAGING.sh
          grep -q 'AM236_VENDOR_NEW_REFERENCE' deployment/live-fixes/AM236_PAYMENT_REFERENCE_FLOW/apply.py
      - name: Configure staging-only SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Deploy AM236 guarded view+service+controller to STAGING (auto rollback)
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM236_DEPLOY"'
          "${SCP[@]}" deployment/live-fixes/AM236_PAYMENT_REFERENCE_FLOW/apply.py deployment/live-fixes/AM236_PAYMENT_REFERENCE_FLOW/DEPLOY_STAGING.sh "$REMOTE:~/AM236_DEPLOY/"
          "${SSH[@]}" "$REMOTE" "bash ~/AM236_DEPLOY/DEPLOY_STAGING.sh '$ROOT'"
      - name: Remove temporary key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
