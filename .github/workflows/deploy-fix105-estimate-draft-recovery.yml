name: FIX105 Restore Estimate Draft Tab and GST-Free Rate STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fix105-estimate-draft-recovery.yml'
      - 'deployment/live-fixes/FIX105_ESTIMATE_EDITOR_RECOVERY/apply.py'
permissions: {contents: read}
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight patch scope and syntax
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/FIX105_ESTIMATE_EDITOR_RECOVERY/apply.py
          grep -q FIX105_EDITOR_LOAD_TAB_AND_WO_GST_RATE deployment/live-fixes/FIX105_ESTIMATE_EDITOR_RECOVERY/apply.py
          ! grep -q job-cards/show.blade.php deployment/live-fixes/FIX105_ESTIMATE_EDITOR_RECOVERY/apply.py
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            echo FIX105_SSH_RETRY_$i;sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Candidate compile, backup, deploy and safe print QA
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX105_ESTIMATE_EDITOR_RECOVERY"'
          "${SCP[@]}" deployment/live-fixes/FIX105_ESTIMATE_EDITOR_RECOVERY/apply.py "$REMOTE:~/FIX105_ESTIMATE_EDITOR_RECOVERY/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1";cd "$APP";test -f artisan && test -d vendor
          PATCH="$HOME/FIX105_ESTIMATE_EDITOR_RECOVERY/apply.py"
          CREATE=resources/views/estimates/create.blade.php
          JS=public/js/estimate-entry.js
          PRINT=resources/views/estimates/print.blade.php
          JC_SHA="$(sha256sum resources/views/job-cards/show.blade.php|cut -d' ' -f1)"
          INVOICE_SHA="$(sha256sum resources/views/invoices/print.blade.php|cut -d' ' -f1)"
          python3 "$PATCH" check "$APP"
          TMP="$(mktemp -d "$APP/storage/app/fix105_preview_XXXXXX")"
          trap 'rm -rf "$TMP"' EXIT
          FIX105_PREVIEW_CREATE="$TMP/create.blade.php" \
          FIX105_PREVIEW_JS="$TMP/estimate-entry.js" \
          FIX105_PREVIEW_PRINT="$TMP/print.blade.php" \
            python3 "$PATCH" check "$APP"
          php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            foreach(["create","print"] as $name){
              file_put_contents($argv[1]."/".$name.".php",
                \Illuminate\Support\Facades\Blade::compileString(file_get_contents($argv[1]."/".$name.".blade.php")));
            }' "$TMP"
          php -l "$TMP/create.php"
          php -l "$TMP/print.php"
          python3 - "$TMP" <<'PY'
          from pathlib import Path
          import sys,re
          p=Path(sys.argv[1])
          c=(p/'create.blade.php').read_text()
          j=(p/'estimate-entry.js').read_text()
          v=(p/'print.blade.php').read_text()
          assert 'file_get_contents(public_path' in c
          assert 'estimate-entry-fix104.js' not in c
          assert 'FIX105_EDITOR_LOAD_TAB_AND_WO_GST_RATE' in c
          assert 'estimate-lines tr' in c
          assert 'focus' in j and "refSearch.addEventListener('focus', () => closeMenu(tr))" in j
          assert "e.key === 'Escape' || e.key === 'Tab'" in j
          assert "q.length < 2" in j
          assert 'const initial = Array.isArray(data.initial)' in j
          assert "initial.forEach(r => add(r))" in j
          segment=j.split('function rowHtml(i, r={})',1)[1].split('function add(r=',1)[0]
          assert len(re.findall(r'<td(?:\s|>)',segment))==12
          assert 'number_format($am104ShowGst ? (float)$i->rate :' in v
          assert '(float)$i->line_total/(float)$i->qty' in v
          assert 'colspan="{{ $am104ShowGst?11:7 }}"' in v
          assert 'number_format((float)$estimate->grand_total,2)' in v
          print('FIX105_CANDIDATE_DRAFT_TABS_PRINT_MATH_AND_12_COL_CHECK_PASS')
          PY
          # IMPORTANT: only 3 files change. Existing customer estimates remain untouched.
          BACKUP="storage/app/FIX105_ESTIMATE_RECOVERY_BACKUP_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP";chmod 700 "$BACKUP"
          cp -p "$CREATE" "$BACKUP/create.blade.php"
          cp -p "$JS" "$BACKUP/estimate-entry.js"
          cp -p "$PRINT" "$BACKUP/print.blade.php"
          rollback(){
            echo FIX105_ROLLBACK_BEGIN
            cp -p "$BACKUP/create.blade.php" "$CREATE"
            cp -p "$BACKUP/estimate-entry.js" "$JS"
            cp -p "$BACKUP/print.blade.php" "$PRINT"
            php artisan view:clear >/dev/null 2>&1 || true
            php artisan view:cache >/dev/null 2>&1 || true
            echo FIX105_ROLLBACK_ESTIMATE_ONLY
          }
          trap rollback ERR
          python3 "$PATCH" apply "$APP"
          php artisan view:clear
          php artisan view:cache
          test "$JC_SHA" = "$(sha256sum resources/views/job-cards/show.blade.php|cut -d' ' -f1)"
          test "$INVOICE_SHA" = "$(sha256sum resources/views/invoices/print.blade.php|cut -d' ' -f1)"
          echo FIX105_JOB_CARD_INVOICE_FILES_UNCHANGED
          # Read-only dummy render: 2 qty x ₹118 gross line => ₹59 unit
          php -r '
          require "vendor/autoload.php";
          $app=require "bootstrap/app.php";
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $estimate=(object)["id"=>105,"estimate_no"=>"AM/EST/QA105",
            "estimate_date"=>\Carbon\Carbon::parse("2026-10-22"),
            "status"=>"DRAFT","taxable_total"=>150,
            "cgst_total"=>13.5,"sgst_total"=>13.5,"round_off"=>0,
            "grand_total"=>177,"customer_note"=>""];
          $job=(object)["job_no"=>"JC-QA-105",
            "customer_name"=>"Test Customer","customer_phone"=>"000",
            "vehicle_reg_no"=>"AS-QA","vehicle_make"=>"Example","vehicle_model"=>"Car"];
          $items=collect([
            (object)["line_no"=>1,"item_type"=>"PART","item_code"=>"P-TEST",
              "description"=>"Test Part","line_note"=>null,"qty"=>2,"unit"=>"PCS",
              "rate"=>50,"discount_percent"=>0,"tax_percent"=>18,"line_total"=>118],
            (object)["line_no"=>2,"item_type"=>"ROT","item_code"=>"R-TEST",
              "description"=>"Test Labour","line_note"=>null,"qty"=>1,"unit"=>"HRS",
              "rate"=>50,"discount_percent"=>0,"tax_percent"=>18,"line_total"=>59]
          ]);
          foreach(["1"=>11,"0"=>7] as $gst=>$count){
            request()->query->set("gst",(string)$gst);
            $html=view("estimates.print",compact("estimate","job","items"))->render();
            preg_match("/<table class=\"am103-estimate-lines[^\"]*\">(.*?)<\\/table>/s",$html,$table);
            if(!isset($table[1]))throw new Exception("Missing estimate print table");
            preg_match("/<thead>(.*?)<\\/thead>/s",$table[1],$head);
            if(substr_count($head[1],"<th")!==$count)throw new Exception("Header count ".$gst);
            preg_match("/<tbody>(.*?)<\\/tbody>/s",$table[1],$tbody);
            preg_match_all("/<tr>(.*?)<\\/tr>/s",$tbody[1],$rows);
            foreach($rows[1] as $row){
              if(substr_count($row,"<td")!==$count)throw new Exception("Row count ".$gst);
            }
            if(strpos($html,"177.00")===false||strpos($html,"118.00")===false)
              throw new Exception("Gross line/grand changed");
            if((string)$gst==="0"){
              if(strpos($html,"<td class=\"num\">59.00</td>")===false)throw new Exception("Gross rate not 118/2=59");
              foreach([">GST%<",">Dis%<",">CGST<",">SGST<"] as $needle)
                if(strpos($html,$needle)!==false)throw new Exception("Unexpected tax or discount column");
            }else{
              if(strpos($html,">CGST<")===false||strpos($html,">GST%<")===false)
                throw new Exception("Missing GST on with-tax version");
            }
            echo "FIX105_PRINT_".$gst."_".$count."_COLS_RATE_TOTAL_PASS".PHP_EOL;
          }
          '
          echo FIX105_CURRENT_WEB_PUBLIC_ASSET_CHECK_BEGIN
          status="$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' 'https://staging.assammotors.com/js/estimate-entry-fix104.js?v=104')"
          echo "FIX105_OLD_BROKEN_ASSET_STATUS=$status"
          # The tested bundled script is from Laravel public_path and needs no 404 URL.
          test -f "$JS"
          for path in /erp/login /staff/login;do
            code="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")"
            echo "FIX105_HEALTH_$path=$code";test "$code" = 200
          done
          trap - ERR
          echo "FIX105_STAGING_DEPLOY_SUCCESS BACKUP=$BACKUP SAVED_ESTIMATE_DATA_UNTOUCHED"
          REMOTE
          "${SCP[@]}" "$REMOTE:$ROOT/public/js/estimate-entry.js" /tmp/fix105-estimate-entry.js
          node --check /tmp/fix105-estimate-entry.js
          node - <<'JS'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/fix105-estimate-entry.js','utf8');
          const segment=s.split('function rowHtml(i, r={})')[1].split('function add(r=')[0];
          if((segment.match(/<td(?:\s|>)/g)||[]).length!==12)throw Error('Wrong row width');
          for(const x of ["refSearch.addEventListener('focus', () => closeMenu(tr))",
            "e.key === 'Escape' || e.key === 'Tab'",
            "const initial = Array.isArray(data.initial)"]) {
            if(!s.includes(x))throw Error('Missing '+x);
          }
          console.log('FIX105_JS_SYNTAX_12_COLUMNS_AND_TAB_PASS');
          JS
      - name: Clean temporary SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
