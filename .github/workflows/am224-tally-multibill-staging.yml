name: AM224 Tally multi bill Parts OSL STAGING guarded deploy
on:
  push:
    branches: [fix/am217-osl-vendor-payment-audit-20261030]
    paths:
      - deployment/live-fixes/AM224_TALLY_PAYMENT_MULTIBILL/install.py
      - deployment/live-fixes/AM224_TALLY_PAYMENT_MULTIBILL/unified.js
      - .github/workflows/am224-tally-multibill-staging.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch syntax and guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM224_TALLY_PAYMENT_MULTIBILL/install.py
          OUTPUT="$(python3 deployment/live-fixes/AM224_TALLY_PAYMENT_MULTIBILL/install.py check /tmp/not-staging 2>&1 || true)"
          printf '%s\n' "$OUTPUT" | grep -q 'AM224_STOP_NOT_STAGING'
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          install -d -m 700 ~/.ssh
          for i in 1 2 3;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 2
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Guarded AM224 STAGING preflight and deploy
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15)
            SCP=(scp -P "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=15)
            SCP=(sshpass -e scp -P "$PORT" -o ConnectTimeout=15)
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p -m 700 ~/AM224_TALLY_PAYMENT_MULTIBILL'
          "${SCP[@]}" deployment/live-fixes/AM224_TALLY_PAYMENT_MULTIBILL/install.py deployment/live-fixes/AM224_TALLY_PAYMENT_MULTIBILL/unified.js "$REMOTE:~/AM224_TALLY_PAYMENT_MULTIBILL/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          ROOT="$1"
          PATCH="$HOME/AM224_TALLY_PAYMENT_MULTIBILL/install.py"
          cd "$ROOT"
          python3 -m py_compile "$PATCH"
          python3 "$PATCH" check "$ROOT"
          OUT="$(python3 "$PATCH" apply "$ROOT")"
          printf '%s\n' "$OUT"
          if ! echo "$OUT" | grep -Fxq AM224_ALREADY_INSTALLED;then
            rollback() {
              echo AM224_DEPLOY_VALIDATION_FAILED_ROLLING_BACK
              python3 "$PATCH" rollback "$ROOT" || true
            }
            trap rollback ERR
            grep -Fq AM224_TALLY_PAYMENT_MULTIBILL app/Services/MultiPurchasePaymentService.php
            grep -Fq AM224_TALLY_PAYMENT_MULTIBILL app/Services/ExpensePaymentService.php
            grep -Fq 'am224-tally-payment-multibill-inline' resources/views/payments/create.blade.php
            grep -Fq 'OSL_JOB::' app/Services/MultiPurchasePaymentService.php
            php -l app/Services/MultiPurchasePaymentService.php
            php -l app/Services/ExpensePaymentService.php
            php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $osls=\Illuminate\Support\Facades\DB::table("workshop_purchases")
              ->where("id",47)->where("purchase_type","OSL")->first();
            if(!$osls)exit(31);
            $sources=app(\App\Services\ExpensePaymentService::class)->payableSources();
            $found=array_values(array_filter($sources,fn($s)=>($s["key"]??"")==="OSL_JOB::47"));
            if(count($found)>1)exit(32);
            if(count($found)===1 && (int)$found[0]["vendor_id"]!==(int)$osls->vendor_id)exit(33);
            echo "AM224_OSL_SOURCE_VENDOR_MAPPING_READ_ONLY_PASS\n";
            '
            trap - ERR
          fi
          for p in /erp/login /staff/login;do
            STATUS="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$p")"
            echo "AM224_HEALTH $p $STATUS"
            test "$STATUS" = 200
          done
          echo AM224_STAGING_DEPLOY_SOURCE_CHECK_PASS_NO_FINANCIAL_WRITES
          REMOTE_SCRIPT
      - name: Cleanup SSH credential
        if: always()
        run: rm -f ~/.ssh/id_ed25519
