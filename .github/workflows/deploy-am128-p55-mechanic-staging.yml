name: AM128 P55 Completed Mechanic Binding STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-am128-p55-mechanic-staging.yml'
      - 'deployment/live-fixes/AM128_P55_MECHANIC_BINDING/apply.py'
      - 'deployment/live-fixes/AM128_P55_MECHANIC_BINDING/verify.php'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-am128, cancel-in-progress: false}
jobs:
  deploy:
    name: Guarded Staging P55 mechanic select correction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight local source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM128_P55_MECHANIC_BINDING/apply.py
          php -l deployment/live-fixes/AM128_P55_MECHANIC_BINDING/verify.php
          grep -q AM128_P55_MECHANIC_STAFF_BINDING deployment/live-fixes/AM128_P55_MECHANIC_BINDING/apply.py
      - name: SSH staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Staging backup, source patch and read-only mechanic QA
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519 "$REMOTE" 'mkdir -p "$HOME/AM128_P55"'
            scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519 deployment/live-fixes/AM128_P55_MECHANIC_BINDING/apply.py deployment/live-fixes/AM128_P55_MECHANIC_BINDING/verify.php "$REMOTE:~/AM128_P55/"
            ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519 "$REMOTE" "bash -c 'set -e; cd \"$ROOT\"; python3 ~/AM128_P55/apply.py check \"$ROOT\"; python3 ~/AM128_P55/apply.py apply \"$ROOT\"; php ~/AM128_P55/verify.php'"
          else
            export SSHPASS="$PASSWORD"
            sshpass -e ssh -o ConnectTimeout=14 -p "$PORT" "$REMOTE" 'mkdir -p "$HOME/AM128_P55"'
            sshpass -e scp -o ConnectTimeout=14 -P "$PORT" deployment/live-fixes/AM128_P55_MECHANIC_BINDING/apply.py deployment/live-fixes/AM128_P55_MECHANIC_BINDING/verify.php "$REMOTE:~/AM128_P55/"
            sshpass -e ssh -o ConnectTimeout=14 -p "$PORT" "$REMOTE" "bash -c 'set -e; cd \"$ROOT\"; python3 ~/AM128_P55/apply.py check \"$ROOT\"; python3 ~/AM128_P55/apply.py apply \"$ROOT\"; php ~/AM128_P55/verify.php'"
          fi
      - name: Staging ERP public login smoke check
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' https://staging.assammotors.com/erp/login)"
          echo "AM128_STAGING_ERP_LOGIN_HTTP=$status"
          test "$status" = 200
      - name: Remove transient key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
