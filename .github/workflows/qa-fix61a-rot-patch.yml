name: FIX61A Reason Scoped ROT Patch QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-fix61a-rot-patch.yml']
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python patch syntax validation
        run: python3 -m py_compile deployment/live-fixes/FIX61A_ROT_REASON_SCOPED/reason_scope.py
      - name: Verify required fail-closed guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('deployment/live-fixes/FIX61A_ROT_REASON_SCOPED/reason_scope.py').read_text()
          for token in ('FIX61A_ROT_REASON_SCOPED_V1','array_key_exists($am61Field,$data)','Wrong mechanic selected','Start / End time correction','data-p55-target-wrap','relock()'):
              assert token in s,token
          print('FIX61A_SOURCE_GUARD_QA=PASS')
          PY
