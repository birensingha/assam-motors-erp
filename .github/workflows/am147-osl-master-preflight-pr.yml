name: AM147 OSL Master PR Preflight (NO APP WRITES)
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint patch and quick-create PHP
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM146_OSL_MASTER_LINK/apply.py
          php -l deployment/live-fixes/AM146_OSL_MASTER_LINK/AdminOslQuickMasterController.php
          python3 - <<'PY'
          import ast,re
          from pathlib import Path
          tree=ast.parse(Path('deployment/live-fixes/AM146_OSL_MASTER_LINK/apply.py').read_text())
          blocks={}
          for node in ast.walk(tree):
            if isinstance(node,ast.Assign) and isinstance(node.value,ast.Constant) and isinstance(node.value.value,str):
              for target in node.targets:
                if isinstance(target,ast.Name) and target.id in ('ui','pui'):
                  blocks[target.id]=node.value.value
          assert 'ui' in blocks and 'pui' in blocks
          for label,block,tag in [('jc',blocks['ui'],'am146-osl-calculations'),('purchase',blocks['pui'],'am146-purchase-link-script')]:
            match=re.search(r'<script id="'+tag+r'">(.*?)</script>',block,re.S)
            assert match,label
            code=match.group(1).replace("@json(route('erp.osl-masters.quick-create'))", '"/erp/osl-masters/quick-create"')
            code=code.replace("@json($am146Masters)",'[]').replace("@json($oslBillingOptions)",'[]')
            Path('/tmp/am146-'+label+'.js').write_text(code)
          print('AM146_EXTRACTED_2_JS_BLOCKS')
          PY
          node --check /tmp/am146-jc.js
          node --check /tmp/am146-purchase.js
      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Read-only source patch and compile preview
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=12)
            SCP=(scp -P "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=12)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=12)
            SCP=(sshpass -e scp -P "$PORT" -o ConnectTimeout=12)
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p ~/AM146_OSL_MASTER_LINK'
          "${SCP[@]}" deployment/live-fixes/AM146_OSL_MASTER_LINK/apply.py deployment/live-fixes/AM146_OSL_MASTER_LINK/AdminOslQuickMasterController.php "$REMOTE:~/AM146_OSL_MASTER_LINK/"
          "${SSH[@]}" "$REMOTE" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          PATCH="$HOME/AM146_OSL_MASTER_LINK/apply.py"
          echo AM146_SERVER_STAGE_1_PREFLIGHT
          python3 "$PATCH" check "$PWD"
          TMP="$(mktemp -d "$PWD/storage/app/am146_preview_XXXXXXXX")"
          trap 'rm -rf "$TMP"' EXIT
          AM146_PREVIEW_DIR="$TMP" python3 "$PATCH" check "$PWD"
          php -l "$TMP/app/Http/Controllers/Web/AdminOslQuickMasterController.php"
          php -l "$TMP/app/Http/Controllers/Web/AdminPurchasePageController.php"
          php -l "$TMP/app/Http/Controllers/Web/AdminJobCardOslLineController.php"
          php -l "$TMP/app/Services/PurchaseService.php"
          php -l "$TMP/routes/web.php"
          php -r '
             require "vendor/autoload.php";
             $a=require "bootstrap/app.php";$a->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
             $blade=\Illuminate\Support\Facades\Blade::compileString(file_get_contents($argv[1]));
             file_put_contents($argv[2],$blade);
          ' "$TMP/resources/views/job-cards/show.blade.php" "$TMP/jc-compiled.php"
          php -l "$TMP/jc-compiled.php"
          php -r '
             require "vendor/autoload.php";
             $a=require "bootstrap/app.php";$a->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
             file_put_contents($argv[2],\Illuminate\Support\Facades\Blade::compileString(file_get_contents($argv[1])));
          ' "$TMP/resources/views/purchases/osl-create.blade.php" "$TMP/purchase-compiled.php"
          php -l "$TMP/purchase-compiled.php"
          echo AM146_BLADE_AND_PHP_PREFLIGHT_PASS
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519