name: AM217 OSL Vendor Payment read-only STAGING audit
on:
  push:
    branches:
      - fix/am217-osl-vendor-payment-audit-20261030
    paths:
      - deployment/live-fixes/AM217_OSL_VENDOR_PAYMENT_AUDIT/**
      - .github/workflows/am217-osl-vendor-payment-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Python source compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM217_OSL_VENDOR_PAYMENT_AUDIT/audit.py
          python3 deployment/live-fixes/AM217_OSL_VENDOR_PAYMENT_AUDIT/audit.py /tmp/invalid-app 2>&1 | grep -F 'AM217_STOP_NOT_STAGING'
          echo AM217_SCRIPT_SYNTAX_AND_STAGING_GUARD_PASS
      - name: SSH setup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 2
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Execute structural read-only STAGING audit
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15)
            SCP=(scp -P "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=15)
            SCP=(sshpass -e scp -P "$PORT" -o ConnectTimeout=15)
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p -m 700 ~/AM217_OSL_VENDOR_PAYMENT_AUDIT'
          "${SCP[@]}" deployment/live-fixes/AM217_OSL_VENDOR_PAYMENT_AUDIT/audit.py "$REMOTE:~/AM217_OSL_VENDOR_PAYMENT_AUDIT/audit.py"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          ROOT="$1"
          test -f "$ROOT/artisan"
          test -d "$ROOT/vendor"
          python3 -m py_compile "$HOME/AM217_OSL_VENDOR_PAYMENT_AUDIT/audit.py"
          python3 "$HOME/AM217_OSL_VENDOR_PAYMENT_AUDIT/audit.py" "$ROOT"
          echo AM217_STAGING_STRUCTURE_AUDIT_PASS_NO_DATA_WRITES
          REMOTE_SCRIPT
      - name: Delete temporary SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
