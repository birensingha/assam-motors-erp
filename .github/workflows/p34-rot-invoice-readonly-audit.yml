name: P34 ROT Billing and Invoice Readonly Audit
on:
  push:
    branches: [feature/p34-rot-billing-inclusion-control-20261014]
    paths: [.github/workflows/p34-rot-invoice-readonly-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only auth mapping, routes and attendance source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          test -f "$ROOT/artisan"
          cd "$ROOT"
          echo '=== P34 LABOUR LINE RENDER/ACTIONS ==='
          sed -n '528,648p' resources/views/job-cards/show.blade.php
          echo '=== P34 LABOUR TOTAL/UPDATE/DELETE CONTROLLER ==='
          grep -n -A 120 -B 5 'function updateLabour' app/Http/Controllers/Web/AdminJobCardPageController.php | head -n 130 || true
          grep -n -A 82 -B 3 'function recalculateJobTotals' app/Http/Controllers/Web/AdminJobCardPageController.php | head -n 93 || true
          echo '=== P34 INVOICE SHOW/PRINT AND JC SUMMARY LABOUR ROWS ==='
          grep -n -C 7 -i 'labour\\|rot_code' resources/views/invoices/show.blade.php resources/views/invoices/print.blade.php | head -n 250 || true
          echo '=== P34 LABOUR INVOICE VALUES READONLY ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';$app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::connection();
          $schema=\Illuminate\Support\Facades\Schema::class;
          foreach(['job_card_labour','job_cards'] as $t)echo 'P34_COLS_'.$t.'='.implode(',',$schema::getColumnListing($t)).PHP_EOL;
          foreach($db->table('job_card_labour')->where('job_card_id',34)->get() as $x){
            echo 'P34_LINE id='.$x->id.' execution_status='.$x->execution_status.
                 ' line_total='.$x->total.' rot_session_id='.($x->rot_session_id??'NULL').PHP_EOL;
          }
          echo P34_BILLING_AUDIT_READONLY_PASS.PHP_EOL;
          PHP
          REMOTE
      - if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
