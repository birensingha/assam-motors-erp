name: P33 ROT Labour Billing Recalculation Readonly Audit
on:
  push:
    branches: [feature/p33-jobcard-parts-issue-fitted-20261014]
    paths: [.github/workflows/p33-rot-billing-readonly-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only auth mapping, routes and attendance source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          test -f "$ROOT/artisan"
          cd "$ROOT"
          echo '=== ROT BILLING TABLE/LINK SCOPE ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::connection();
          foreach(['job_card_labour','rot_sessions','rot_master','invoices','job_cards'] as $t){
            $sc=\Illuminate\Support\Facades\Schema::class;
            if($sc::hasTable($t))echo 'P33_BILLING_COLS_'.$t.'='.implode(',',$sc::getColumnListing($t)).PHP_EOL;
          }
          foreach($db->table('job_card_labour')->where('job_card_id',34)->limit(15)->get() as $l){
            echo 'P33_JOB34_LABOUR id='.$l->id.' rot_session_id='.($l->rot_session_id??'NULL').
            ' code='.($l->rot_code??'NULL').' amount='.($l->total??'NULL').
            ' status='.($l->execution_status??'NULL').PHP_EOL;
          }
          $jc=$db->table('job_cards')->where('id',34)->first();
          echo 'P33_JOB34_TOTALS labour='.($jc->labour_total??'NULL').' parts='.($jc->parts_total??'NULL').' grand='.($jc->grand_total??'NULL').PHP_EOL;
          PHP
          echo '=== RECALC METHOD ==='
          grep -n -A 110 -B 4 'function recalculateJobTotals' app/Http/Controllers/Web/AdminJobCardPageController.php | head -n 125
          echo '=== LABOUR ADD/START AND STATUS ==='
          grep -n -A 96 -B 5 'function addLabourDirect' app/Http/Controllers/Web/AdminJobCardPageController.php | head -n 111
          grep -Rni -C 3 -E 'rot_session_id|job_card_labour|ROT.*complete' app/Http/Controllers/Api/V1/StaffRotController.php | head -n 110 || true
          echo '=== INVOICE LINE SOURCE ==='
          grep -n -A 95 -B 4 'function invoiceData' app/Http/Controllers/Web/AdminJobCardLifecyclePageController.php | head -n 118
          grep -n -C 3 'labour\\|rot_code' resources/views/invoices/show.blade.php | head -n 110
          echo P33_LABOUR_READONLY_AUDIT_DONE
          REMOTE
      - if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
