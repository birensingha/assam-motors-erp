name: Inspect live Staff Location V2 CSS integration targets (read only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-staff-location-v2-layout-20261018.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Inspect template structure without reading user GPS or credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/am-location-layout
            chmod 600 ~/.ssh/am-location-layout
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=4 -o StrictHostKeyChecking=accept-new -i ~/.ssh/am-location-layout -p "$PORT")
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -o ConnectionAttempts=4 -o StrictHostKeyChecking=accept-new -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'python3 -' <<'PY'
          import pathlib,hashlib,re
          root=pathlib.Path.home()/'domains/assammotors.com/assam-erp-staging'
          paths={
            'staff_map':root/'resources/views/admin/native/staff-live-location.blade.php',
            'layout_erp':root/'resources/views/layouts/erp.blade.php',
          }
          for label,p in paths.items():
              s=p.read_text(encoding='utf-8',errors='surrogateescape')
              print('INSPECT_FILE',label,'LINES',s.count('\n')+1,'SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
              if label=='staff_map':
                  patterns=['sl-hero','sl-metrics','sl-body','sl-staff-panel','sl-map-wrap','sl-map-head','slMap','slClock','slReportingLimit','slWorkshop','slRefresh','slHistoryDate','slGoogleMaps','@extends','</style>','@endsection']
              else:
                  patterns=['@yield(\'topbar_title\'','topbar','top-bar','tool-shortcut','JC Amounts','OBL Purchases','Vendor Database','Voucher Editing','header','<main','@yield(\'content\'']
              for i,line in enumerate(s.splitlines(),1):
                  if any(k.lower() in line.lower() for k in patterns):
                      normalized=re.sub(r'(?i)(value|token|secret|password|csrf)[^=]*=[^ >]+',r'\1=REDACTED',line)
                      print('INSPECT_LINE',label,i,normalized.strip()[:340])
          print('STAFF_LOCATION_LAYOUT_READONLY=PASS')
          PY
      - if: always()
        run: rm -f ~/.ssh/am-location-layout
