name: AM126 Completed ROT Corrected TAT STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-am126-rot-live-tat-staging.yml'
      - 'deployment/live-fixes/AM126_ROT_LIVE_SYNC/apply.py'
      - 'deployment/live-fixes/AM126_ROT_LIVE_SYNC/verify.php'
      - 'deployment/live-fixes/AM126_ROT_LIVE_SYNC/DEPLOY_STAGING.sh'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    name: Guarded view patch and rendered clock verification
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Python PHP Shell source syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM126_ROT_LIVE_SYNC/apply.py
          php -l deployment/live-fixes/AM126_ROT_LIVE_SYNC/verify.php
          bash -n deployment/live-fixes/AM126_ROT_LIVE_SYNC/DEPLOY_STAGING.sh
          grep -q 'AM126_COMPLETED_TAT_FROM_CORRECTED_START_END' deployment/live-fixes/AM126_ROT_LIVE_SYNC/apply.py
      - name: Configure STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Backup, apply STAGING-only clock view, verify read-only & rollback on failure
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM126_ROT_LIVE"'
          "${SCP[@]}" deployment/live-fixes/AM126_ROT_LIVE_SYNC/apply.py deployment/live-fixes/AM126_ROT_LIVE_SYNC/verify.php deployment/live-fixes/AM126_ROT_LIVE_SYNC/DEPLOY_STAGING.sh "$REMOTE:~/AM126_ROT_LIVE/"
          "${SSH[@]}" "$REMOTE" "bash ~/AM126_ROT_LIVE/DEPLOY_STAGING.sh '$ROOT'"
      - name: Remove transient SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
