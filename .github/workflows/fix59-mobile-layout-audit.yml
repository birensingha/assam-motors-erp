name: FIX59 Mobile ERP Staging Audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/fix59-mobile-layout-audit.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Inspect layout and mobile nav anchors without writes
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh;chmod 700 ~/.ssh
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$PORT")
          else
            sudo apt-get update -qq;sudo apt-get install -y -qq sshpass;export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          echo "=== FIX59 LAYOUT HEAD ==="
          sed -n '1,215p' resources/views/layouts/erp.blade.php
          echo "=== FIX59 LAYOUT TAIL ==="
          tail -145 resources/views/layouts/erp.blade.php
          echo "=== FIX59 EXISTING MOBILE FILES ==="
          ls -l public/mobile-erp resources/views/partials/mobile-erp.blade.php 2>/dev/null || true
          echo "=== FIX59 ROUTE NAV CLUES ==="
          grep -nE "name\('erp\.(dashboard|job-cards|parts|customers|invoices|purchase|staff)" routes/web.php | head -75 || true
          echo "=== FIX59 END READONLY ==="
          REMOTE
