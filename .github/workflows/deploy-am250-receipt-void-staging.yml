name: AM250 Admin Money Receipt Void — STAGING Deploy
on:
  push:
    branches: [feature/am250-money-receipt-void-20261112]
    paths:
      - '.github/workflows/deploy-am250-receipt-void-staging.yml'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate package syntax
        shell: bash
        run: |
          set -euo pipefail
          P=deployment/live-fixes/AM250_MONEY_RECEIPT_VOID
          python3 -m py_compile "$P/install.py"
          php -l "$P/files/app/Http/Controllers/Web/AdminMoneyReceiptVoidController.php"
          bash -n deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN/staging_db_backup_shell.sh
          php -l deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN/staging_dump_config.php
          echo AM250_GITHUB_STATIC_PACKAGE_PASS
      - name: Prepare STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Verify native money receipt sources, fresh SQL backup and guarded install
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = "assam-erp-staging"
          test -f "$APP/artisan"
          cd "$HOME/assam-motors-deploy"
          git fetch origin feature/am250-money-receipt-void-20261112
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          git archive FETCH_HEAD deployment/live-fixes/AM250_MONEY_RECEIPT_VOID deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN/staging_db_backup_shell.sh deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN/staging_dump_config.php | tar -x -C "$TMP"
          PKG="$TMP/deployment/live-fixes/AM250_MONEY_RECEIPT_VOID"
          python3 "$PKG/install.py" check "$APP"
          bash "$TMP/deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN/staging_db_backup_shell.sh" "$APP"
          python3 "$PKG/install.py" apply "$APP"
          cd "$APP"
          php artisan route:list --path=erp/money-receipts | grep -F 'erp.money-receipts.void'
          php -l app/Http/Controllers/Web/AdminMoneyReceiptVoidController.php
          echo AM250_STAGING_SECURE_RECEIPT_VOID_ROUTE_DEPLOYED
          echo AM250_NO_RECEIPT_DATA_CHANGED_DURING_INSTALL
          REMOTE
      - name: Remove ephemeral SSH material
        if: always()
        run: rm -f ~/.ssh/id_ed25519
