name: Assam Motors P28 Mobile Owner Attendance Inspection API Preflight
on:
  push:
    branches: [feature/p28-owner-mobile-attendance-inspection-20261014]
    paths: [deployment/live-fixes/P28_OWNER_MOBILE/**, .github/workflows/p28-owner-api-preflight.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP patch syntax
        run: |
          php -l deployment/live-fixes/P28_OWNER_MOBILE/PATCH_P28.php
          php -l deployment/live-fixes/P28_OWNER_MOBILE/payload/OwnerSelfAttendanceInspectionController.php
      - name: Secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Check existing exact staging source and compile candidate Blade without writes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
            SCP=(scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -P "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
            SCP=(sshpass -e scp -o StrictHostKeyChecking=accept-new -P "$SSH_PORT")
          fi
          REMOTE="$SSH_USER@$SSH_HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p ~/assam-p28-mobile'
          "${SCP[@]}" -r deployment/live-fixes/P28_OWNER_MOBILE/PATCH_P28.php deployment/live-fixes/P28_OWNER_MOBILE/payload "$REMOTE:~/assam-p28-mobile/"
          "${SSH[@]}" "$REMOTE" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          php -l "$HOME/assam-p28-mobile/PATCH_P28.php"
          php "$HOME/assam-p28-mobile/PATCH_P28.php" check "$ROOT"
          echo 'P28_PREFLIGHT_NO_STAGING_WRITES_PASS'
          REMOTE
      - name: Clear SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
