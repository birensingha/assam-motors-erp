name: P33 Part Issue Transaction Source Readonly Audit
on:
  push:
    branches: [feature/p33-jobcard-parts-issue-fitted-20261014]
    paths: [.github/workflows/p33-parts-issue-readonly-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only auth mapping, routes and attendance source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          test -f "$ROOT/artisan"
          cd "$ROOT"
          echo '=== P33 PART TABLE CURRENT ACTIONS ==='
          sed -n '410,517p' resources/views/job-cards/show.blade.php
          echo '=== P33 PART DELETE AND RETURN STOCK SEMANTICS ==='
          sed -n '497,585p' app/Http/Controllers/Web/AdminJobCardPageController.php
          echo '=== P33 STOCK_ISSUE EXISTING WRITE PATTERNS ==='
          grep -Rni -C 4 --include='*.php' "'JOB_ISSUE'\|'JOB_PART_DELETE_REVERSAL'\|'FITTED'" app/Services app/Http/Controllers/Web | head -n 170 || true
          echo '=== P33 PARTS_MASTER / JOB_PARTS DB STRUCTURE ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';$app=require 'bootstrap/app.php';$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::connection();
          foreach(['parts_master','job_card_parts','inventory_movements','job_card_change_audits','rot_sessions'] as $t){
            echo 'P33_COLUMNS_'.$t.'='.implode(',',\Illuminate\Support\Facades\Schema::getColumnListing($t)).PHP_EOL;
          }
          $p=$db->table('job_card_parts')->where('job_card_id',34)->orderBy('id')->first();
          if($p){
             echo 'P33_JOB34_PART_ID='.$p->id.' STATE='.$p->issue_status.' PART_MASTER_ID='.$p->part_master_id.' QTY='.$p->qty.PHP_EOL;
             $m=$db->table('parts_master')->where('id',$p->part_master_id)->first();
             if($m)echo 'P33_JOB34_STOCK_QTY='.$m->stock_qty.PHP_EOL;
             foreach($db->table('inventory_movements')->where('job_card_id',34)->where('part_master_id',$p->part_master_id)->get() as $im){
               echo 'P33_EXISTING_MOVEMENT id='.$im->id.' type='.$im->movement_type.' ref='.$im->reference_no.' out='.$im->qty_out.PHP_EOL;
             }
          }
          PHP
          echo P33_READONLY_PART_ISSUE_AUDIT_COMPLETE
          REMOTE
      - if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
