name: AM199 Job Card Amount and GST Action Bar Relocation STAGING
on:
  pull_request:
    paths:
      - '.github/workflows/deploy-am199-billing-actionbar-staging.yml'
      - 'deployment/live-fixes/AM199_BILLING_ACTION_BAR/apply.py'
      - 'deployment/live-fixes/AM199_BILLING_ACTION_BAR/verify.py'
      - 'deployment/live-fixes/AM199_BILLING_ACTION_BAR/DEPLOY_STAGING.sh'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    name: Guarded move of Amount and GST shortcut into original quick action bar
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate gated PHP source and deploy script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM199_BILLING_ACTION_BAR/apply.py
          python3 -m py_compile deployment/live-fixes/AM199_BILLING_ACTION_BAR/verify.py
          bash -n deployment/live-fixes/AM199_BILLING_ACTION_BAR/DEPLOY_STAGING.sh
          grep -q 'AM199_JC_AMOUNT_GST_IN_TOP_ACTION_BAR' deployment/live-fixes/AM199_BILLING_ACTION_BAR/apply.py
      - name: Configure STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Staging move Amount and GST shortcut and verify original financial link
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM199_DEPLOY"'
          "${SCP[@]}" deployment/live-fixes/AM199_BILLING_ACTION_BAR/apply.py deployment/live-fixes/AM199_BILLING_ACTION_BAR/verify.py deployment/live-fixes/AM199_BILLING_ACTION_BAR/DEPLOY_STAGING.sh "$REMOTE:~/AM199_DEPLOY/"
          "${SSH[@]}" "$REMOTE" "bash ~/AM199_DEPLOY/DEPLOY_STAGING.sh '$ROOT'"
      - name: Remove transient SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
