name: Inspect OSL Parts Mobile Schema 2
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-osl-parts-mobile-2.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          fi
          ROOT="/home/$SSH_USER/domains/assammotors.com/assam-erp-staging"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "ROOT='$ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$ROOT"
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=Illuminate\Support\Facades\DB::getDatabaseName();
          $tables=Illuminate\Support\Facades\DB::table('information_schema.tables')
            ->where('table_schema',$db)
            ->where(function($q){
              $q->where('table_name','like','%purchase%')
                ->orWhere('table_name','like','%osl%')
                ->orWhere('table_name','like','%labour%')
                ->orWhere('table_name','like','%part%');
            })->orderBy('table_name')->pluck('table_name');
          foreach($tables as $t){
            echo "TABLE:$t\n";
            foreach(Illuminate\Support\Facades\DB::select("SHOW COLUMNS FROM ".$t) as $c){
              echo " ".$c->Field." ".$c->Type."\n";
            }
          }
          PHP
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
