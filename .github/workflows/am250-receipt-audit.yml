name: AM250 Money Receipt Void — STAGING Read-Only Accounting Audit
on:
  push:
    branches: [feature/am250-money-receipt-void-20261112]
    paths:
      - '.github/workflows/am250-receipt-audit.yml'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Confirm source audit exists
        uses: actions/checkout@v4
      - name: Validate audit syntax
        run: python3 -m py_compile deployment/live-fixes/AM207_RECEIPT_VOUCHER_EDIT_PREFLIGHT/audit.py
      - name: Configure STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Read-only STAGING receipt source, schema and registered routes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = "assam-erp-staging"
          test -f "$APP/artisan"
          cd "$HOME/assam-motors-deploy"
          git fetch origin feature/am250-money-receipt-void-20261112
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          git archive FETCH_HEAD deployment/live-fixes/AM207_RECEIPT_VOUCHER_EDIT_PREFLIGHT | tar -x -C "$WORK"
          python3 "$WORK/deployment/live-fixes/AM207_RECEIPT_VOUCHER_EDIT_PREFLIGHT/audit.py" "$APP"
          echo AM250_POSTING_CODE_BEGIN
          sed -n '170,293p' "$APP/app/Http/Controllers/Web/AdminMoneyReceiptController.php"
          echo AM250_POSTING_CODE_END
          echo AM250_REGISTER_VIEW_BEGIN
          sed -n '36,71p' "$APP/resources/views/money-receipts/index.blade.php"
          echo AM250_REGISTER_VIEW_END
          echo AM250_DETAILS_VIEW_BEGIN
          sed -n '20,68p' "$APP/resources/views/money-receipts/show.blade.php"
          echo AM250_DETAILS_VIEW_END
          echo AM250_ROUTE_DECLARATIONS
          grep -n -F "money-receipts" "$APP/routes/web.php" | head -20
          echo AM250_READONLY_STAGING_RECEIPT_AUDIT_COMPLETE
          REMOTE
      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/id_ed25519
