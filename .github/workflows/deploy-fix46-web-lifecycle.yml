name: Deploy FIX46 Web Job Card Lifecycle Staging
# redeploy-invoice-date-fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-fix46-web-lifecycle.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          fi
      - name: Upload FIX46 package
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
            SCP=(scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -P "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
            SCP=(sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$SSH_PORT")
          fi
          REMOTE="$SSH_USER@$SSH_HOST"
          "${SSH[@]}" "$REMOTE" "rm -rf ~/FIX46_WEB_JOBCARD_LIFECYCLE_INVOICE && mkdir -p ~/FIX46_WEB_JOBCARD_LIFECYCLE_INVOICE"
          "${SCP[@]}" -r deployment/live-fixes/FIX46_WEB_JOBCARD_LIFECYCLE_INVOICE/* "$REMOTE:~/FIX46_WEB_JOBCARD_LIFECYCLE_INVOICE/"
      - name: Check + Apply + Verify
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          fi
          ROOT="/home/$SSH_USER/domains/assammotors.com/assam-erp-staging"
          REMOTE="$SSH_USER@$SSH_HOST"
          "${SSH[@]}" "$REMOTE" "bash ~/FIX46_WEB_JOBCARD_LIFECYCLE_INVOICE/APPLY_FIX46_STAGING.sh '$ROOT'"
      - name: External auth-boundary smoke
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/body -w '%{http_code}' 'https://staging.assammotors.com/erp/job-cards')"
          case "$code" in 200|302) ;; *) echo "Unexpected HTTP $code"; cat /tmp/body; exit 1;; esac
          echo "FIX46 external auth boundary: PASS"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
