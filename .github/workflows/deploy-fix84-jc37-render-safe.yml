name: FIX84 JC37 500 Corrected Labour OSL Staging
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fix84-jc37-render-safe.yml'
      - 'deployment/live-fixes/FIX84_JC37_500_RENDER_SAFE/apply.py'
      - 'deployment/live-fixes/FIX84_JC37_500_RENDER_SAFE/render.php'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Static patch and render smoke syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/FIX84_JC37_500_RENDER_SAFE/apply.py
          php -l deployment/live-fixes/FIX84_JC37_500_RENDER_SAFE/render.php
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do
            if ssh-keyscan -T 14 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -y -qq sshpass;fi
      - name: Backup and patch with actual JC37 and JC34 Blade rendering
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT");SCP=(sshpass -e scp -P "$PORT");fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX84_JC37_RENDER_SAFE"'
          "${SCP[@]}" deployment/live-fixes/FIX84_JC37_500_RENDER_SAFE/apply.py deployment/live-fixes/FIX84_JC37_500_RENDER_SAFE/render.php "$REMOTE:~/FIX84_JC37_RENDER_SAFE/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1";cd "$APP";test -f artisan && test -d vendor
          TOOL="$HOME/FIX84_JC37_RENDER_SAFE"
          python3 "$TOOL/apply.py" check "$APP"
          BACKUP="storage/app/FIX84_JC37_RENDER_BACKUP_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP";chmod 700 "$BACKUP"
          cp -p resources/views/job-cards/show.blade.php "$BACKUP/show.blade.php"
          cp -p app/Http/Controllers/Web/AdminJobCardPageController.php "$BACKUP/AdminJobCardPageController.php"
          rollback(){
            echo 'FIX84_SMOKE_FAILED_ROLLBACK_PRE_FIX83'
            cp -p "$BACKUP/show.blade.php" resources/views/job-cards/show.blade.php
            cp -p "$BACKUP/AdminJobCardPageController.php" app/Http/Controllers/Web/AdminJobCardPageController.php
            php artisan view:clear >/dev/null 2>&1 || true
            php artisan view:cache >/dev/null 2>&1 || true
          }
          trap rollback ERR
          python3 "$TOOL/apply.py" apply "$APP"
          php -l app/Http/Controllers/Web/AdminJobCardPageController.php
          php artisan view:clear
          php artisan view:cache
          # ACTUAL show-controller load and full Blade template rendering, JC37 + JC34.
          # No DB mutations or transaction postings.
          php "$TOOL/render.php" "$APP"
          for path in /erp/login /staff/login;do
            h="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")"
            echo "FIX84_HEALTH_$path=$h";test "$h" = 200
          done
          trap - ERR
          echo "FIX84_JC37_FULL_RENDER_DEPLOY_SUCCESS BACKUP=$BACKUP NO_FINANCIAL_WRITES"
          REMOTE
      - name: Clear SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
