name: FIX49 Authenticated Editor Deep-Link QA (Read Only)
on:
  push:
    branches: [feature/fix49-financial-edit-controls-20261015]
    paths: ['.github/workflows/fix49-editor-detail-qa.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.assammotors.com' }}
      STAGING_ADMIN_LOGIN: ${{ secrets.STAGING_ADMIN_LOGIN }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Authenticate and inspect only GET edit pages
        run: node deployment/live-fixes/FIX49_FINANCIAL_EDIT/scripts/DETAIL_VERIFY.mjs
