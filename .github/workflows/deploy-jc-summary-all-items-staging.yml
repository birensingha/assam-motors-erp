name: JC Summary Full Parts Labour Print — STAGING
on:
  pull_request:
    paths:
      - '.github/workflows/deploy-jc-summary-all-items-staging.yml'
      - 'deployment/live-fixes/JC_ALL_ITEMS_20261102/**'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    name: Full lines summary for JC-20261016-00035 (guarded)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/JC_ALL_ITEMS_20261102/patch.py
          php -l deployment/live-fixes/JC_ALL_ITEMS_20261102/verify.php
          bash -n deployment/live-fixes/JC_ALL_ITEMS_20261102/DEPLOY_STAGING.sh
          grep -q AM_JC_ALL_LINES_FULL_SUMMARY_20261102 deployment/live-fixes/JC_ALL_ITEMS_20261102/patch.py
      - name: Configure STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Guarded STAGING install and actual JC35 render QA
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/JC_ALL_ITEMS_DEPLOY"'
          "${SCP[@]}" deployment/live-fixes/JC_ALL_ITEMS_20261102/patch.py deployment/live-fixes/JC_ALL_ITEMS_20261102/verify.php deployment/live-fixes/JC_ALL_ITEMS_20261102/DEPLOY_STAGING.sh "$REMOTE:~/JC_ALL_ITEMS_DEPLOY/"
          "${SSH[@]}" "$REMOTE" "bash ~/JC_ALL_ITEMS_DEPLOY/DEPLOY_STAGING.sh '$ROOT'"
      - name: Remove transient SSH identity
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
