name: Assam Motors ROT Lock Quick Check
on:
  push:
    branches: [fix/rot-void-504-diagnosis-20261014]
    paths: [.github/workflows/rot-lock-quick-check.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only routes, finance schema and application source methods
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$APP"
          echo 'QUICK_CHECK_START'
          timeout 20s php <<'PHP' || echo 'NO_GO_PHP_CHECK_TIMED_OUT'
          <?php
          require 'vendor/autoload.php';$app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::connection();
          $rot='ROT26100501344375FC';
          $parts=[
            'PING'=>fn()=>$db->selectOne('SELECT 1 as ping'),
            'VOID_COUNT'=>fn()=>$db->table('job_card_rot_voids')->where('rot_session_id',$rot)->count(),
            'JC_ROW'=>fn()=>$db->table('job_cards')->where('job_no','JC-2026-0025')->value('status'),
            'ROT_ROW'=>fn()=>$db->table('rot_sessions')->where('id',$rot)->value('status')
          ];
          foreach($parts as $name=>$check){
            $begin=microtime(true);
            try{$result=$check();echo "CHECK ".$name." status=OK elapsed=".round(microtime(true)-$begin,3)."s";if($name==='VOID_COUNT')echo " count=".$result;echo "\n";}
            catch(\Throwable $e){echo "CHECK ".$name." error=".get_class($e)." elapsed=".round(microtime(true)-$begin,3)."s\n";}
          }
          try{$rows=$db->select('SHOW PROCESSLIST');foreach($rows as $p)if((int)($p->Time??0)>3)echo "LONG_DB_PROCESS command=".($p->Command??'')." seconds=".$p->Time." state=".substr((string)($p->State??''),0,60)."\n";}
          catch(\Throwable $e){echo "PROCESSLIST_UNAVAILABLE\n";}
          echo "QUICK_CHECK_DONE\n";
          PHP
          echo 'RECENT_ERROR_COUNTS'
          for f in storage/logs/laravel*.log; do test -f "$f" || continue; tail -n 1200 "$f" | grep -F '[2026-10-14 ' | grep -Ec 'SQLSTATE|database|PDOException|Lock wait|Deadlock|Max execution' || true; done
          echo 'QUICK_AUDIT_COMPLETE'
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"