name: AM238 Multi Purchase service rollback integration QA
on:
  pull_request:
    paths:
      - '.github/workflows/qa-am238-multi-rollback.yml'
      - 'deployment/live-fixes/AM238_VENDOR_DEBIT_SETTLEMENT/test-multi-rollback.php'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-am238-multi-finance-test, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check read-only PHP syntax
        shell: bash
        run: php -l deployment/live-fixes/AM238_VENDOR_DEBIT_SETTLEMENT/test-multi-rollback.php
      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: 'STAGING rollback: MultiPurchasePaymentService 4000 to 3058 then 3000 plus 942'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM238_MULTI_QA"'
          "${SCP[@]}" deployment/live-fixes/AM238_VENDOR_DEBIT_SETTLEMENT/test-multi-rollback.php "$REMOTE:~/AM238_MULTI_QA/"
          "${SSH[@]}" "$REMOTE" "cd '$ROOT' && php ~/AM238_MULTI_QA/test-multi-rollback.php"
      - name: Remove temporary key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
