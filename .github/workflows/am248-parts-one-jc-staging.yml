name: AM248 Parts Purchase One JC Search STAGING Fix
on:
  push:
    branches: [fix/am217-osl-vendor-payment-audit-20261030]
    paths:
      - deployment/live-fixes/AM248_PARTS_ONE_JC_PICKER/install.py
      - deployment/live-fixes/AM248_PARTS_ONE_JC_PICKER/job-picker.js
      - .github/workflows/am248-parts-one-jc-staging.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch syntax and guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM248_PARTS_ONE_JC_PICKER/install.py
                    OUTPUT="$(python3 deployment/live-fixes/AM248_PARTS_ONE_JC_PICKER/install.py check /tmp/not-staging 2>&1 || true)"
          printf '%s\n' "$OUTPUT" | grep -q 'AM248_STOP_NOT_STAGING'
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          install -d -m 700 ~/.ssh
          for i in 1 2 3;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 2
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: AM248 guarded Parts Purchase JC single searchable selector
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15)
            SCP=(scp -P "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=15)
            SCP=(sshpass -e scp -P "$PORT" -o ConnectTimeout=15)
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p -m 700 ~/AM248_PARTS_ONE_JC_PICKER'
          "${SCP[@]}" deployment/live-fixes/AM248_PARTS_ONE_JC_PICKER/install.py deployment/live-fixes/AM248_PARTS_ONE_JC_PICKER/job-picker.js "$REMOTE:~/AM248_PARTS_ONE_JC_PICKER/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          ROOT="$1"
          PATCH="$HOME/AM248_PARTS_ONE_JC_PICKER/install.py"
          cd "$ROOT"
          python3 -m py_compile "$PATCH"
          python3 "$PATCH" check "$ROOT"
          OUT="$(python3 "$PATCH" apply "$ROOT")"
          printf '%s\n' "$OUT"
          if ! echo "$OUT" | grep -Fxq AM248_ALREADY_INSTALLED;then
            rollback(){
              echo AM248_VERIFY_FAILED_ROLLING_BACK
              python3 "$PATCH" rollback "$ROOT" || true
            }
            trap rollback ERR
          fi
          VIEW=resources/views/purchases/create.blade.php
          JS=public/js/purchase-entry.js
          grep -Fq 'am248-parts-single-jc-picker' "$VIEW"
          grep -Fq 'AM248_PARTS_ONE_JC_PICKER' "$VIEW"
          grep -Fq 'AM248_PARTS_ONE_JC_PICKER' "$JS"
          grep -Fq 'select.value=item.value' "$JS"
          grep -Fq "select.style.setProperty('display','none','important')" "$JS"
          grep -Fq 'job_card_id' "$VIEW"
          grep -Fq "job.dispatchEvent(new Event('change',{bubbles:true}))" "$JS"
          php artisan view:cache
          trap - ERR
          echo AM248_PARTS_SINGLE_JC_PICKER_SOURCE_VERIFIED

          for p in /erp/login /staff/login;do
            STATUS="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$p")"
            echo "AM248_HEALTH $p $STATUS"
            test "$STATUS" = 200
          done
          echo AM248_STAGING_DEPLOY_SOURCE_CHECK_PASS_NO_FINANCIAL_WRITES
          REMOTE_SCRIPT
          # Read-only retrieve the exact JS deployed on staging and syntax-check it on runner.
          "${SCP[@]}" "$REMOTE:$ROOT/public/js/purchase-entry.js" "$RUNNER_TEMP/am248-purchase-entry.js"
          node --check "$RUNNER_TEMP/am248-purchase-entry.js"
          echo AM248_RUNNER_JS_SYNTAX_PASS

      - name: Cleanup SSH credential
        if: always()
        run: rm -f ~/.ssh/id_ed25519
