name: FIX132 Vendor Card Totals Calculation - READ ONLY
on:
  push:
    branches: [audit/fix132-vendor-balance-multipayment-20261025]
    paths: ['.github/workflows/fix132-vendor-card-totals-readonly.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read actual vendor database controller and money receipt theme
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX132_VENDORCARD_SOURCE_START'
          echo '=== VENDOR DATABASE VIEW ==='
          sed -n '1,210p' resources/views/workshop-controls/vendor-database.blade.php
          echo '=== CONTROLLER HANDLERS ==='
          grep -RniE -C 8 "workshop-controls.vendor-database|purchaseTotals|paymentTotals" app/Http/Controllers app/Services | head -n 170 || true
          echo '=== MONEY RECEIPT THEME ==='
          sed -n '1,210p' resources/views/money-receipts/create.blade.php
          echo 'FIX132_VENDORCARD_SOURCE_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
