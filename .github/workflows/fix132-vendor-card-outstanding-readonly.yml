name: FIX132 Vendor Master Outstanding Mismatch - READ ONLY
on:
  push:
    branches: [audit/fix132-vendor-outstanding-payment-multi-20261025]
    paths: ['.github/workflows/fix132-vendor-card-outstanding-readonly.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Audit Vendor Master card vs ledger outstanding for vendor 5
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX132_READONLY_BEGIN'
          echo '=== VENDOR CARD SOURCES ==='
          grep -RniE -C 4 'Purchase lifetime totals|Vendor payments|outstanding|totalPurchases|purchase_total' resources/views/vendors/index.blade.php app/Services/VendorService.php app/Http/Controllers/Web/AdminVendorPageController.php | head -n 180 || true
          echo '=== SERVICE SUMMARY AND VENDOR LIST ==='
          nl -ba app/Services/VendorService.php | sed -n '1,90p'
          echo '=== PAYMENT STYLE TARGETS ==='
          find resources/views -iname '*money*receipt*' -o -iname '*payment*create*' | head -n 35
          echo '=== PAYMENT-VOUCHER EXISTING JS AND CSS ==='
          sha256sum resources/views/payments/create.blade.php public/js/payment-voucher.js app/Services/VendorService.php
          sed -n '1,125p' public/js/payment-voucher.js
          echo '=== VENDOR 5 LIVE AGGREGATES READ ONLY ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::class;
          foreach(['workshop_purchases','workshop_purchase_batches','workshop_payment_vouchers','workshop_vendor_payments','workshop_expenses'] as $t){
           $q=$db::table($t)->where('vendor_id',5);
           echo "TABLE_{$t}_ROWS=".$q->count()."\n";
          }
          $svc=$app->make(\App\Services\VendorService::class);
          $l=$svc->ledger(5);
          echo 'LEDGER_OUTSTANDING='.$l['summary']['outstanding'].PHP_EOL;
          echo 'LEDGER_PURCHASES='.$l['summary']['purchases'].PHP_EOL;
          echo 'LEDGER_PAYMENTS='.$l['summary']['payments'].PHP_EOL;
          echo "FIX132_READONLY_COMPLETE\n";
          PHP
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
