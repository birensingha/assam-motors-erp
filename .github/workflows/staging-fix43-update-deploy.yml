name: Assam Motors FIX43 Staff App Update Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/staging-fix43-update-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      APP_ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-6bd4-8211-9763-53e5469d45af/raw?se=2026-10-10T16%3A04%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=7c659427-2488-5cea-bd98-515bd655f5bc&skoid=a3d7d4f3-706d-48bc-8860-17488c12cb39&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T02%3A27%3A54Z&ske=2026-10-11T02%3A27%3A54Z&sks=b&skv=2026-02-06&sig=bfIygdZmqqKvWT35T5T5ls1eAmPJElfvXLe4Zh3CrRU%3D'

    steps:
      - name: Checkout ERP deployment package
        uses: actions/checkout@v4

      - name: Materialize signed Staff v6.0.21
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/am-release
          curl -fsSL --retry 3 "$ARTIFACT_URL" -o /tmp/am-release/release.zip
          unzip -q /tmp/am-release/release.zip -d /tmp/am-release/files

          APK="/tmp/am-release/files/Assam-Motors-Staff-v6.0.21-FRESH-PRODUCTION.apk"
          META="/tmp/am-release/files/latest.json"
          test -f "$APK"
          test -f "$META"

          EXPECTED="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$META")"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"

          echo "Signed production APK integrity: PASS"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi

      - name: Stage payload and apply FIX43
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH_CMD=(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
            SCP_CMD=(scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH_CMD=(sshpass -e ssh -p "$SSH_PORT")
            SCP_CMD=(sshpass -e scp -P "$SSH_PORT")
          fi

          REMOTE_PAYLOAD="$HOME/assam-motors-deploy/deployment/live-fixes/FIX43_STAFF_APP_UPDATE_CHANNEL/payload"

          "${SSH_CMD[@]}" "$SSH_USER@$SSH_HOST" "set -e;
            cd ~/assam-motors-deploy;
            git fetch origin main;
            git checkout main;
            git pull --ff-only origin main;
            mkdir -p '$REMOTE_PAYLOAD'"

          "${SCP_CMD[@]}"             /tmp/am-release/files/Assam-Motors-Staff-v6.0.21-FRESH-PRODUCTION.apk             "$SSH_USER@$SSH_HOST:$REMOTE_PAYLOAD/Assam-Motors-Staff-v6.0.21-FRESH-PRODUCTION.apk"

          "${SCP_CMD[@]}"             /tmp/am-release/files/latest.json             "$SSH_USER@$SSH_HOST:$REMOTE_PAYLOAD/latest.json"

          "${SSH_CMD[@]}" "$SSH_USER@$SSH_HOST"             "cd ~/assam-motors-deploy/deployment/live-fixes/FIX43_STAFF_APP_UPDATE_CHANNEL && bash APPLY.sh '$APP_ROOT'"

      - name: External update-channel smoke
        shell: bash
        run: |
          set -euo pipefail
          API_CODE="$(curl -sS -o /tmp/update-api -w '%{http_code}' 'https://staging.assammotors.com/legacy/api/staff-app-update.php?platform=android&version_code=60020')"
          test "$API_CODE" = "401"
          META_CODE="$(curl -sS -o /tmp/latest -w '%{http_code}' 'https://staging.assammotors.com/staff-app/latest.json')"
          test "$META_CODE" = "200"
          grep -q '"version_code": 60021' /tmp/latest
          grep -q '"version_name": "6.0.21"' /tmp/latest
          echo "FIX43 external smoke: PASS"

      - name: Remove runner SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
