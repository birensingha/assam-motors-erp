name: AM263 STAGING GRN Draft Restore Source Audit
on:
  push:
    branches: [fix/am262-grn-unrecorded-opening-20261117]
    paths: [.github/workflows/am263-grn-draft-source-audit.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Inspect sales register source and OSL billing schema without writing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test "$(basename "$ROOT")" = assam-erp-staging
          cd "$ROOT"
          echo AM263_DRAFT_SOURCE_LOCATIONS
          grep -R -n -i -m 3 -E 'Restore Draft|Discard Draft|Unsaved browser draft|No transaction was posted' resources app public/js 2>/dev/null | head -80 || true
          echo AM263_LAYOUT_SCRIPT_INCLUDES
          grep -n -i -E 'script|draft|localStorage|sessionStorage' resources/views/layouts/erp.blade.php | tail -85 || true
          echo AM263_PROCUREMENT_RECEIVE_SOURCE
          sed -n '1,220p' resources/views/procurement/receive.blade.php
          echo AM263_STATIC_JAVASCRIPT_CANDIDATES
          find public/js resources/js -maxdepth 3 -type f 2>/dev/null | grep -i -E 'draft|procure|erp|form|restore' | head -70 || true
          echo AM263_GLOBAL_AUTOSAVE_FULL
          sed -n '1,320p' public/js/am254-global-form-autosave.js
          echo AM263_GLOBAL_AUTOSAVE_END
          echo AM263_DRAFT_SOURCE_AUDIT_DONE

          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
