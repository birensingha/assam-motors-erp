name: Assam Motors P21 Vehicle Inspection Page Audit
on:
  push:
    branches: [feature/p21-inspection-manager-sequential-workflow-20261014]
    paths: [.github/workflows/p21-inspection-page-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only auth mapping, routes and attendance source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          test -f "$ROOT/artisan"
          cd "$ROOT"
          echo '== VEHICLE INSPECTION ROUTE / CONTROLLER =='
          grep -n -C 4 "name('erp.vehicle-inspection')" routes/web.php | head -n 35 || true
          grep -RnlE "function (vehicleInspection|inspectionIndex|inspection)\(" app/Http/Controllers/Web | head -n 22 || true
          echo '== VIEW SEARCH =='
          find resources/views -maxdepth 4 -iname '*inspection*' -print | head -n 32
          grep -Rnl 'Vehicle Inspection' resources/views/admin resources/views/job-cards resources/views/inspections resources/views/vehicle-inspection 2>/dev/null | head -n 20 || true
          echo '== JOB CARD SHOW START/END AND DIAG FORM =='
          sed -n '1,50p' resources/views/job-cards/show.blade.php
          sed -n '185,270p' resources/views/job-cards/show.blade.php
          echo '== STAFF PORTAL ASSIGNMENT REPORT CONTROLLER =='
          sed -n '1,100p' app/Http/Controllers/Web/StaffPortalController.php
          echo P21_PAGE_READONLY_PASS
          REMOTE
      - if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
