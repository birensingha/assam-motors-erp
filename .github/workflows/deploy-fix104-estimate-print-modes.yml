name: FIX104 Estimate Two Print Formats and Aligned Columns STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fix104-estimate-print-modes.yml'
      - 'deployment/live-fixes/FIX104_ESTIMATE_DUAL_PRINT/apply.py'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify FIX104 safety and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/FIX104_ESTIMATE_DUAL_PRINT/apply.py
          python3 - <<'PY'
          from pathlib import Path
          x=Path('deployment/live-fixes/FIX104_ESTIMATE_DUAL_PRINT/apply.py').read_text()
          for t in ['FIX104_ESTIMATE_DUAL_PRINT_AND_12_COLUMNS',
                    'Print With GST','Print Without GST',
                    "asset('js/estimate-entry-fix104.js')",
                    'request()->query','@if($am104ShowGst)',
                    'number_format((float)$i->line_total,2)',
                    'number_format((float)$estimate->grand_total,2)']:
            assert t in x,t
          assert 'job-cards/show.blade.php' not in x
          assert 'invoices/print.blade.php' not in x
          print('FIX104_PATCH_SCOPE_SAFE')
          PY
      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3 4;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Guarded preflight, deploy and live read-only QA
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX104_ESTIMATE_DUAL_PRINT"'
          "${SCP[@]}" deployment/live-fixes/FIX104_ESTIMATE_DUAL_PRINT/apply.py "$REMOTE:~/FIX104_ESTIMATE_DUAL_PRINT/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1";cd "$APP";test -f artisan && test -d vendor
          PATCH="$HOME/FIX104_ESTIMATE_DUAL_PRINT/apply.py"
          CREATE=resources/views/estimates/create.blade.php
          SHOW=resources/views/estimates/show.blade.php
          PRINT=resources/views/estimates/print.blade.php
          NEWJS=public/js/estimate-entry-fix104.js
          JC_HASH="$(sha256sum resources/views/job-cards/show.blade.php | cut -d' ' -f1)"
          INV_HASH="$(sha256sum resources/views/invoices/print.blade.php | cut -d' ' -f1)"
          python3 "$PATCH" check "$APP"
          TEMP="$(mktemp -d "$APP/storage/app/fix104_preview_XXXXXX")"
          trap 'rm -rf "$TEMP"' EXIT
          FIX104_PREVIEW_CREATE="$TEMP/create.blade.php" \
          FIX104_PREVIEW_SHOW="$TEMP/show.blade.php" \
          FIX104_PREVIEW_PRINT="$TEMP/print.blade.php" \
          FIX104_PREVIEW_NEWJS="$TEMP/estimate-entry-fix104.js" \
            python3 "$PATCH" check "$APP"
          php -r '
          require "vendor/autoload.php";
          $app=require "bootstrap/app.php";
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          foreach(["create","show","print"] as $name){
            file_put_contents($argv[1]."/".$name.".php",
              \Illuminate\Support\Facades\Blade::compileString(file_get_contents($argv[1]."/".$name.".blade.php")));
          }' "$TEMP"
          php -l "$TEMP/create.php"
          php -l "$TEMP/show.php"
          php -l "$TEMP/print.php"
          python3 - "$TEMP" <<'PY'
          import sys,re
          from pathlib import Path
          d=Path(sys.argv[1]);a=(d/'create.blade.php').read_text()
          b=(d/'show.blade.php').read_text();p=(d/'print.blade.php').read_text()
          j=(d/'estimate-entry-fix104.js').read_text()
          assert a.count('FIX104_12COL_LAYOUT')==1
          assert a.count('estimate-entry-fix104.js')==1
          assert 'Print With GST' in b and 'Print Without GST' in b
          assert j.count('FIX104_ESTIMATE_DUAL_PRINT_AND_12_COLUMNS')==1
          segment=j.split('function rowHtml(i, r={})',1)[1].split('function add(r=',1)[0]
          assert len(re.findall(r'<td(?:\\s|>)',segment))==12
          assert 'class="e-disc-amt"' in segment and 'class="e-gst-amt"' in segment
          assert 'line_note' in segment and 'type="hidden"' in segment
          assert 'NOT A TAX INVOICE' not in p
          assert '@if($am104ShowGst)' in p and 'gst=0' in p and 'gst=1' in p
          assert 'number_format((float)$i->line_total,2)' in p
          assert 'number_format((float)$estimate->grand_total,2)' in p
          print('FIX104_ALL_THREE_BLADE_AND_12COL_JS_PRECHECK_PASS')
          PY
          BACKUP="storage/app/FIX104_ESTIMATE_PRINT_BACKUP_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP";chmod 700 "$BACKUP"
          cp -p "$CREATE" "$BACKUP/create.blade.php"
          cp -p "$SHOW" "$BACKUP/show.blade.php"
          cp -p "$PRINT" "$BACKUP/print.blade.php"
          rollback(){
            echo FIX104_ROLLBACK_STARTED
            cp -p "$BACKUP/create.blade.php" "$CREATE"
            cp -p "$BACKUP/show.blade.php" "$SHOW"
            cp -p "$BACKUP/print.blade.php" "$PRINT"
            rm -f "$NEWJS"
            php artisan view:clear >/dev/null 2>&1 || true
            php artisan view:cache >/dev/null 2>&1 || true
            echo FIX104_ROLLBACK_ESTIMATES_ONLY
          }
          trap rollback ERR
          python3 "$PATCH" apply "$APP"
          php artisan view:clear
          php artisan view:cache
          test "$JC_HASH" = "$(sha256sum resources/views/job-cards/show.blade.php | cut -d' ' -f1)"
          test "$INV_HASH" = "$(sha256sum resources/views/invoices/print.blade.php | cut -d' ' -f1)"
          echo FIX104_JOB_CARD_AND_INVOICE_FILES_UNTOUCHED
          php -r '
          require "vendor/autoload.php";
          $app=require "bootstrap/app.php";
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $estimate=(object)["id"=>104,"estimate_no"=>"AM/EST/QA-104",
            "estimate_date"=>\Carbon\Carbon::parse("2026-10-22"),
            "status"=>"DRAFT","taxable_total"=>150,
            "cgst_total"=>13.5,"sgst_total"=>13.5,"round_off"=>0,
            "grand_total"=>177,"customer_note"=>""];
          $job=(object)["job_no"=>"JC-QA-104","customer_name"=>"Test Customer",
            "customer_phone"=>"000","vehicle_reg_no"=>"AS-QA",
            "vehicle_make"=>"Example","vehicle_model"=>"Car"];
          $items=collect([
            (object)["line_no"=>1,"item_type"=>"PART","item_code"=>"P-QA",
              "description"=>"Test Part","line_note"=>null,"qty"=>1,
              "unit"=>"PCS","rate"=>100,"discount_percent"=>0,
              "tax_percent"=>18,"line_total"=>118],
            (object)["line_no"=>2,"item_type"=>"ROT","item_code"=>"R-QA",
              "description"=>"Test Labour","line_note"=>null,"qty"=>1,
              "unit"=>"HRS","rate"=>50,"discount_percent"=>0,
              "tax_percent"=>18,"line_total"=>59]
          ]);
          foreach(["1"=>11,"0"=>9] as $gst=>$ncols){
            request()->query->set("gst",$gst);
            $html=view("estimates.print",compact("estimate","job","items"))->render();
            preg_match("/<table class=\"am103-estimate-lines[^\"]*\">(.*?)<\\/table>/s",$html,$m);
            if(!isset($m[1]))throw new Exception("Missing estimate table");
            preg_match("/<thead>(.*?)<\\/thead>/s",$m[1],$h);
            if(substr_count($h[1],"<th")!==$ncols)throw new Exception("Wrong column count ".$gst);
            preg_match_all("/<tr>(.*?)<\\/tr>/s",$m[1],$rows);
            foreach($rows[1] as $row){
              if(substr_count($row,"<td")!==$ncols)throw new Exception("Row/heading misalignment ".$gst);
            }
            foreach(["118.00","59.00","177.00","Workshop Estimate"] as $needle){
              if(strpos($html,$needle)===false)throw new Exception("Missing amount ".$needle);
            }
            if(strpos($html,"NOT A TAX INVOICE")!==false)throw new Exception("Forbidden tagline");
            if($gst==="0"&&(strpos($html,">CGST<")!==false||strpos($html,">SGST<")!==false||
               strpos($html,">GST%<")!==false))throw new Exception("GST visible in without variant");
            if($gst==="1"&&strpos($html,">CGST<")===false)throw new Exception("GST variant lost breakup");
            echo "FIX104_PRINT_VARIANT_".$gst."_". $ncols."_COLS_AND_TOTAL_177_PASS".PHP_EOL;
          }
          '
          for path in /erp/login /staff/login;do
            status="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")"
            echo "FIX104_HEALTH_$path=$status";test "$status" = 200
          done
          trap - ERR
          echo "FIX104_STAGING_DEPLOY_SUCCESS BACKUP=$BACKUP NO_FINANCIAL_WRITES"
          REMOTE
          "${SCP[@]}" "$REMOTE:$ROOT/public/js/estimate-entry-fix104.js" /tmp/estimate-entry-fix104.js
          node --check /tmp/estimate-entry-fix104.js
          node - <<'JS'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/estimate-entry-fix104.js','utf8');
          const segment=s.split('function rowHtml(i, r={})')[1].split('function add(r=')[0];
          if((segment.match(/<td(?:\\s|>)/g)||[]).length!==12)throw Error('Missing 12 columns');
          for(const x of ['e-disc-amt','e-gst-amt','e-total','line_note','discountAmount','gstAmount']){
            if(!s.includes(x))throw Error('Missing '+x);
          }
          console.log('FIX104_NODE_JS_SYNTAX_AND_12_COL_COUNT_PASS');
          JS
      - name: Erase ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
