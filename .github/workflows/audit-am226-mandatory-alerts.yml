name: AM226 Mandatory Alert Lifecycle Readonly STAGING Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-am226-mandatory-alerts.yml'
      - 'deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/audit.py'
      - 'deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/generator_audit.py'
      - 'deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/aggregate_audit.php'
      - 'deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/post_verify.php'
permissions: {contents: read, issues: write}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare STAGING SSH
        id: ssh
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq; sudo apt-get install -qq -y sshpass
          fi
      - name: Run source and schema-only audit
        id: audit
        run: |
          set -euo pipefail
          FILE=deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/audit.py
          python3 -m py_compile "$FILE" deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/generator_audit.py
          php -l deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/aggregate_audit.php
          php -l deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/post_verify.php
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM226_ALERT_AUDIT"'
          "${SCP[@]}" "$FILE" "$REMOTE:~/AM226_ALERT_AUDIT/audit.py"
          "${SCP[@]}" deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/generator_audit.py "$REMOTE:~/AM226_ALERT_AUDIT/generator_audit.py"
          "${SCP[@]}" deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/aggregate_audit.php "$REMOTE:~/AM226_ALERT_AUDIT/aggregate_audit.php"
          "${SCP[@]}" deployment/live-fixes/AM226_MANDATORY_ALERTS_DEDUP/post_verify.php "$REMOTE:~/AM226_ALERT_AUDIT/post_verify.php"
          "${SSH[@]}" "$REMOTE" "python3 ~/AM226_ALERT_AUDIT/audit.py '$ROOT'" | tee "$RUNNER_TEMP/am226.txt"
          grep -Fq AM226_AUDIT_READ_ONLY_COMPLETE "$RUNNER_TEMP/am226.txt"
          "${SSH[@]}" "$REMOTE" "python3 ~/AM226_ALERT_AUDIT/generator_audit.py '$ROOT'" | tee "$RUNNER_TEMP/am226_gen.txt"
          grep -Fq AM226_GEN_AUDIT_READ_ONLY_COMPLETE "$RUNNER_TEMP/am226_gen.txt"
          "${SSH[@]}" "$REMOTE" "php ~/AM226_ALERT_AUDIT/aggregate_audit.php '$ROOT'" | tee "$RUNNER_TEMP/am226_aggregate.txt"
          grep -Fq AM226_AGG_READ_ONLY_COMPLETE "$RUNNER_TEMP/am226_aggregate.txt"
          "${SSH[@]}" "$REMOTE" "php ~/AM226_ALERT_AUDIT/post_verify.php '$ROOT'" | tee "$RUNNER_TEMP/am226_verify.txt"
          grep -Fq AM226_VERIFY_AGGREGATE_READ_ONLY_COMPLETE "$RUNNER_TEMP/am226_verify.txt"
      - name: Log audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_STATUS: ${{ steps.ssh.outcome }}
          AUDIT_STATUS: ${{ steps.audit.outcome }}
        run: |
          body="AM226 Mandatory Notifications lifecycle source/schema audit: SSH=$SSH_STATUS, audit=$AUDIT_STATUS. NO attendance, alert or staff records read or changed. Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api repos/"$GITHUB_REPOSITORY"/issues/124/comments -f body="$body" || true
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
