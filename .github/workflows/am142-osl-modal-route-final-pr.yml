name: AM142 OSL Modal Final Route QA
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Validate live file and compile without writes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=12)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=12);fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          FILE="resources/views/job-cards/show.blade.php"
          for needle in 'AM137_OSL_EDIT_PURCHASE_LINKS' 'am137-osl-reference-template' 'data-am137-link-line' 'Edit OSL Purchase' 'Vendor Ledger' 'Payment Against Reference' 'am91-delete';do
            grep -Fq "$needle" "$FILE" || { echo "AM142_MISSING $needle";exit 1;}
            echo "AM142_PRESENT $needle"
          done
          TMP="$(mktemp -d "$PWD/storage/app/am142_preview_XXXXXX")"
          trap 'rm -rf "$TMP"' EXIT
          php -r '
          require "vendor/autoload.php";$app=require "bootstrap/app.php";
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $compiled=\Illuminate\Support\Facades\Blade::compileString(file_get_contents("resources/views/job-cards/show.blade.php"));
          file_put_contents($argv[1],$compiled);
          ' "$TMP/compiled.php"
          php -l "$TMP/compiled.php"
          php artisan route:list | grep -F 'erp.fix48.osl-edit'
          php artisan route:list | grep -F 'erp.vendors.ledger'
          php artisan route:list | grep -F 'erp.payments.create'
          php artisan route:list --path=job-cards | grep -F 'osl-billing' | grep 'DELETE'
          echo "AM142_FINAL_PASS_NO_DB_WRITES"
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519