name: AM125 JC42 OSL Read Only PR
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/am125-jc42-osl-readonly-pr.yml'
permissions:
  contents: read
concurrency:
  group: assam-motors-staging-readonly-jc42
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Prepare remote access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4; do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Inspect specific job without changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ]; then
            SSH=(ssh -i ~/.ssh/id_ed25519 -p "$PORT" -o ConnectTimeout=12 -o BatchMode=yes)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=12)
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$ROOT"
          test -f artisan
          echo "=== AM123 CONTROLLER + VIEW STATUS ==="
          for file in resources/views/job-cards/show.blade.php app/Http/Controllers/Web/AdminJobCardOslLineController.php app/Http/Controllers/Web/AdminJobCardPageController.php routes/web.php; do
            if test -f "$file"; then sha256sum "$file"; else echo "MISSING $file"; fi
          done
          echo "=== OSL ROUTES ==="
          php artisan route:list --path=job-cards --columns=method,uri,name,action 2>/dev/null | grep -Ei 'osl|job-cards' | grep -Ei 'osl|billing' | head -n 40 || true
          echo "=== OSL VIEW HOOKS ==="
          grep -nEi 'data-am91-osl|am91-delete|osl\.admin-delete|FIX91_UNIFIED_OSL_ADMIN|am91-osl-edit|FIX93' resources/views/job-cards/show.blade.php | head -n 55 || true
          echo "=== DB READONLY TARGETED ==="
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Facades\Schema;
          $card=DB::table('job_cards')->where('job_no','JC-20261025-00042')->first();
          if (!$card) {echo "AM123_JC42_NOT_FOUND\n";exit(3);}
          echo 'JC42_HEADER='.json_encode(array_intersect_key((array)$card,array_flip(['id','job_no','status','invoice_id','parts_total','labour_total','gst_total','pre_round_total','round_off','grand_total']))).PHP_EOL;
          foreach(['job_card_labour','workshop_purchases','job_estimate_items','job_cards','invoices','job_card_change_audits'] as $table){
            if(!Schema::hasTable($table)){echo "MISSING_TABLE=$table\n";continue;}
            $cols=Schema::getColumnListing($table);
            echo "TABLE=$table COLUMNS=".implode(',',$cols).PHP_EOL;
          }
          $lines=DB::table('job_card_labour')->where('job_card_id',$card->id)
              ->orderBy('id')->get();
          foreach($lines as $row){
            $take=['id','job_card_id','description','rot_code','mechanic_name','source_estimate_item_id','labour_rate','standard_hours','discount_percent','discount_amount','gst_percent','total','billing_included','execution_status','created_at'];
            echo 'JC42_LABOUR='.json_encode(array_intersect_key((array)$row,array_flip($take)),JSON_INVALID_UTF8_SUBSTITUTE).PHP_EOL;
          }
          if(Schema::hasTable('workshop_purchases')){
            $q=DB::table('workshop_purchases')->where('job_card_id',$card->id);
            if(Schema::hasColumn('workshop_purchases','purchase_type'))$q->where('purchase_type','OSL');
            foreach($q->orderBy('id')->limit(60)->get() as $row){
              $take=['id','job_card_id','purchase_type','purchase_no','description','supplier_name','total_amount','customer_amount','customer_billing_status','customer_billing_line_id','job_card_labour_id','billing_line_id','billing_line_created','deleted_at','record_status','created_at'];
              echo 'JC42_PURCHASE='.json_encode(array_intersect_key((array)$row,array_flip($take)),JSON_INVALID_UTF8_SUBSTITUTE).PHP_EOL;
            }
          }
          $inv=DB::table('invoices')->where('job_card_id',$card->id);
          echo 'JC42_INVOICES='.$inv->count().PHP_EOL;
          if(Schema::hasTable('job_card_change_audits')){
            foreach(DB::table('job_card_change_audits')->where('job_card_id',$card->id)->orderByDesc('id')->limit(15)->get() as $row) {
              echo 'JC42_AUDIT='.json_encode(array_intersect_key((array)$row,array_flip(['id','entity_type','entity_id','action','reason','created_at'])),JSON_INVALID_UTF8_SUBSTITUTE).PHP_EOL;
            }
          }
          echo "AM123_DB_READONLY_PASS\n";
          PHP
          echo "AM123_AUDIT_COMPLETE_NO_DATA_MUTATION"
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519