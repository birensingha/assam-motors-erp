name: AM139 Live OSL Purchase Links READ ONLY
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Verify live view and backing server actions
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=12)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=12);fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          use Illuminate\Support\Facades\Blade;
          use Illuminate\Support\Facades\DB;
          $file='resources/views/job-cards/show.blade.php';
          $source=file_get_contents($file);
          $required=['AM137_OSL_EDIT_PURCHASE_LINKS','am137-osl-reference-template','data-am137-link-line','Pay Against Reference','Edit OSL Purchase','Vendor Ledger','am129-osl-delete-script','am91-delete'];
          foreach($required as $key) {
            if(strpos($source,$key)===false) throw new Exception('AM139_MISSING='.$key);
            echo 'AM139_PRESENT='.$key.PHP_EOL;
          }
          $compiled=Blade::compileString($source);
          $path=tempnam(sys_get_temp_dir(),'am139_').'.php';
          file_put_contents($path,$compiled);
          passthru('php -l '.escapeshellarg($path),$exit);
          @unlink($path);
          if($exit!==0) throw new Exception('AM139_BLADE_COMPILE_FAIL');
          $jc=DB::table('job_cards')->where('job_no','JC-20261025-00042')->first();
          if(!$jc) throw new Exception('AM139_JC_NOT_FOUND');
          foreach([91,92] as $lineId){
            $line=DB::table('job_card_labour')->where('job_card_id',$jc->id)->where('id',$lineId)->first();
            echo 'AM139_LINE_'.$lineId.'='.($line ? 'PRESENT' : 'ABSENT').PHP_EOL;
          }
          $p=DB::table('workshop_purchases')->where('job_card_id',$jc->id)->where('purchase_type','OSL')->where('record_status','ACTIVE')->whereNull('deleted_at')->count();
          echo 'AM139_JC42_ACTIVE_OSL_PURCHASES='.$p.PHP_EOL;
          echo 'AM139_JC42_SAVED_TOTAL='.$jc->grand_total.PHP_EOL;
          echo 'AM139_JC42_CALCULATED_TOTAL='.\App\Services\JobCardTaxTotals::forJob($jc->id)['grand_total'].PHP_EOL;
          echo "AM139_READ_ONLY_DONE\n";
          PHP
          php artisan route:list | grep -E 'erp.fix48.osl-edit|erp.vendors.ledger|erp.payments.create|erp.job-cards.osl.admin-delete'
          echo AM139_VERIFIED_NO_STAGING_WRITES
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519