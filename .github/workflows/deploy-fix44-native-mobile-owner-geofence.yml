name: Deploy FIX44 Native Mobile Owner Geofence Staging

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-fix44-native-mobile-owner-geofence.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi

      - name: Upload FIX44 package
        shell: bash
        run: |
          set -euo pipefail
          PKG="deployment/live-fixes/FIX44_NATIVE_MOBILE_OWNER_GEOFENCE"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
            SCP=(scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -P "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
            SCP=(sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$SSH_PORT")
          fi
          REMOTE="$SSH_USER@$SSH_HOST"
          "${SSH[@]}" "$REMOTE" "rm -rf ~/FIX44_NATIVE_MOBILE_OWNER_GEOFENCE && mkdir -p ~/FIX44_NATIVE_MOBILE_OWNER_GEOFENCE"
          "${SCP[@]}" -r "$PKG/"* "$REMOTE:~/FIX44_NATIVE_MOBILE_OWNER_GEOFENCE/"

      - name: Check staging prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          fi
          REMOTE="$SSH_USER@$SSH_HOST"
          "${SSH[@]}" "$REMOTE" "bash ~/FIX44_NATIVE_MOBILE_OWNER_GEOFENCE/CHECK_FIX44_STAGING.sh /home/$SSH_USER/domains/assammotors.com/assam-erp-staging"

      - name: Apply FIX44 to staging Laravel
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          fi
          REMOTE="$SSH_USER@$SSH_HOST"
          "${SSH[@]}" "$REMOTE" "bash ~/FIX44_NATIVE_MOBILE_OWNER_GEOFENCE/APPLY_FIX44_STAGING.sh /home/$SSH_USER/domains/assammotors.com/assam-erp-staging"

      - name: Verify staging
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          fi
          REMOTE="$SSH_USER@$SSH_HOST"
          "${SSH[@]}" "$REMOTE" "bash ~/FIX44_NATIVE_MOBILE_OWNER_GEOFENCE/VERIFY_FIX44_STAGING.sh /home/$SSH_USER/domains/assammotors.com/assam-erp-staging"

      - name: External unauthenticated route smoke
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://staging.assammotors.com/api/v1/admin/mobile/dashboard" \
            "https://staging.assammotors.com/api/v1/staff/location" \
            "https://staging.assammotors.com/api/v1/attendance/today"
          do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' "$url")"
            case "$code" in 401|403|405) ;; *) echo "Unexpected HTTP $code for $url"; cat /tmp/body; exit 1;; esac
          done
          echo "FIX44 external route smoke: PASS"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
