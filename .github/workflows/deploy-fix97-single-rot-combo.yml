name: FIX97 Single ROT Search Select Box STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fix97-single-rot-combo.yml'
      - 'deployment/live-fixes/FIX97_SINGLE_ROT_COMBO/apply.py'
      - 'deployment/live-fixes/FIX97_SINGLE_ROT_COMBO/render.php'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch and browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/FIX97_SINGLE_ROT_COMBO/apply.py
          php -l deployment/live-fixes/FIX97_SINGLE_ROT_COMBO/render.php
          python3 - <<'PY'
          from pathlib import Path
          import ast
          source=Path('deployment/live-fixes/FIX97_SINGLE_ROT_COMBO/apply.py').read_text()
          ast.parse(source)
          for needle in ['id="FIX97_ONE_VISIBLE_ROT_COMBO"','button.am96-arrow',
                         'position:absolute!important;top:0!important;right:0!important',
                         'border:0!important;border-left:0!important',
                         'input.am96-visible-search',
                         "id=\"FIX96_SINGLE_ROW_LABOUR_COMBO\""]:
            assert needle in source,needle
          print('FIX97_ONLY_ONE_VISUAL_ARROW_AND_SHARED_BORDER_PREFLIGHT_PASS')
          PY
      - name: Configure remote SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3 4; do
            if ssh-keyscan -T 14 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Backup deploy and verify with auto rollback
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX97_SINGLE_ROT_COMBO"'
          "${SCP[@]}" deployment/live-fixes/FIX97_SINGLE_ROT_COMBO/apply.py deployment/live-fixes/FIX97_SINGLE_ROT_COMBO/render.php "$REMOTE:~/FIX97_SINGLE_ROT_COMBO/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"; cd "$APP"; test -f artisan && test -d vendor
          PATCH="$HOME/FIX97_SINGLE_ROT_COMBO"
          python3 "$PATCH/apply.py" check "$APP"
          # Compile proposed source BEFORE touching the live Blade file.
          TMPB="$(mktemp "$APP/storage/app/.fix97_proposed_XXXXXX.blade.php")"
          TMPC="$(mktemp "$APP/storage/app/.fix97_compiled_XXXXXX.php")"
          FIX97_PREVIEW_PATH="$TMPB" python3 "$PATCH/apply.py" check "$APP"
          php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            file_put_contents($argv[2],\Illuminate\Support\Facades\Blade::compileString(file_get_contents($argv[1])));
          ' "$TMPB" "$TMPC"
          set +e
          PHP_LINT="$(php -d display_errors=1 -d log_errors=0 -l "$TMPC" 2>&1)"
          LINT_CODE=$?
          set -e
          if [ "$LINT_CODE" -ne 0 ]; then
            echo FIX97_COMPILED_BLADE_SYNTAX_FAIL
            printf '%s\n' "$PHP_LINT"
            echo FIX97_FOREACH_STACK_DEBUG
            grep -nE '__currentLoopData|__empty_|foreach|endforeach' "$TMPC" | head -75 | cut -c1-340 || true
            LINE="$(printf '%s\n' "$PHP_LINT" | sed -n 's/.*on line \([0-9][0-9]*\).*/\1/p' | tail -1)"
            if [ -n "$LINE" ]; then
              A=$((LINE>18?LINE-18:1))
              B=$((LINE+18))
              sed -n "${A},${B}p" "$TMPC" | head -n 40 | cut -c1-320
            fi
            rm -f "$TMPB" "$TMPC"
            exit 1
          fi
          rm -f "$TMPB" "$TMPC"
          echo FIX97_PROPOSED_BLADE_COMPILES_CLEAN
          BACKUP="storage/app/FIX97_COMBO_UI_BACKUP_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP"; chmod 700 "$BACKUP"
          cp -p resources/views/job-cards/show.blade.php "$BACKUP/show.blade.php"
          rollback(){
            echo FIX97_ROLLBACK_BEGIN
            cp -p "$BACKUP/show.blade.php" resources/views/job-cards/show.blade.php
            php artisan view:clear >/dev/null 2>&1 || true
            php artisan view:cache >/dev/null 2>&1 || true
          }
          trap rollback ERR
          python3 "$PATCH/apply.py" apply "$APP"
          php artisan view:clear
          php artisan view:cache
          php "$PATCH/render.php" "$APP"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('resources/views/job-cards/show.blade.php').read_text(errors='replace')
          for token in ('id="FIX97_ONE_VISIBLE_ROT_COMBO"',
                        'id="FIX96_SINGLE_ROW_LABOUR_COMBO"',
                        'am96-visible-search','am96-arrow',
                        'position:absolute!important;top:0!important;right:0!important',
                        'border:0!important;border-left:0!important',
                        'id="am82-rot-select"',
                        'id="am82-rot-search"',
                        'id="am90-labour-billing"',
                        'id="am91-add-osl"',
                        'id="FIX95_ROT_ONE_ROW_NO_BILLING_BOX"',
                        'id="FIX94_COMPACT_MECHANIC_ROT_CARD"',
                        'id="FIX93_OSL_MODAL_TOOLS"',
                        "route('erp.job-cards.labour.direct',$job->id)"]:
            assert token in s,token
          assert s.count('id="FIX97_ONE_VISIBLE_ROT_COMBO"')==1
          assert s.count('id="am82-rot-select"')==1
          assert 'native.dispatchEvent(new Event(\'change\',{bubbles:true}))' in s
          print('FIX97_NATIVE_ROT_SELECTION_AND_AUTOFILL_UNCHANGED_ONE_VISIBLE_ARROW_PASS')
          PY
          for path in /erp/login /staff/login; do
            status="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")"
            echo "FIX97_HEALTH_$path=$status"
            test "$status" = 200
          done
          trap - ERR
          echo "FIX97_STAGING_DEPLOY_SUCCESS BACKUP=$BACKUP CSS_ONLY_NO_FINANCIAL_OR_ROT_WRITES"
          REMOTE
      - name: Cleanup SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
