name: Assam Motors P25 Estimate Undefined Initial Source Audit
on:
  push:
    branches: [fix/p25-open-estimate-500-20261014]
    paths: [.github/workflows/p25-estimate-view-source-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only auth mapping, routes and attendance source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          test -f "$ROOT/artisan"
          cd "$ROOT"
          echo '=== P25 CREATE BLADE 1..240 (redact sensitive data) ==='
          nl -ba resources/views/estimates/create.blade.php | head -n 240
          echo '=== P25 INITIAL VARIABLE USES ==='
          grep -n -C 5 -F '$initial' resources/views/estimates/create.blade.php || true
          echo '=== P25 ESTIMATE CREATE VIEW HASH ==='
          sha256sum resources/views/estimates/create.blade.php
          echo '=== P25 OTHER CREATE-RELATED VARS ==='
          grep -nE '@php|@endphp|defaultKind|estimate_kind|estimate->|latest|items|initial|INITIAL|REVISED|SUPPLEMENTARY' resources/views/estimates/create.blade.php | head -n 130 || true
          echo P25_ESTIMATE_VIEW_READONLY_AUDIT_PASS
          REMOTE
      - if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
