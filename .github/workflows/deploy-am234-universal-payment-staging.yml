name: AM234 Universal Payment Voucher UI STAGING (backup + rollback)
on:
  pull_request:
    paths:
      - '.github/workflows/deploy-am234-universal-payment-staging.yml'
      - 'deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/apply.py'
      - 'deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/feature-ui.js'
      - 'deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/DEPLOY_STAGING.sh'
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  deploy:
    name: Guarded staging payment create view only (existing voucher ledger untouched)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == 'birensingha/assam-motors-erp'
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax and view-only safety checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/apply.py
          node --check deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/feature-ui.js
          bash -n deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/DEPLOY_STAGING.sh
          grep -q 'AM234_BACKEND_SERVICE_AND_FINANCIAL_TABLES_UNCHANGED' deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/apply.py
      - name: Configure staging-only SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Deploy guarded AM234 payment create view to STAGING
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM234_DEPLOY"'
          "${SCP[@]}" deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/apply.py deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/feature-ui.js deployment/live-fixes/AM234_UNIVERSAL_PAYMENT_VOUCHER/DEPLOY_STAGING.sh "$REMOTE:~/AM234_DEPLOY/"
          "${SSH[@]}" "$REMOTE" "bash ~/AM234_DEPLOY/DEPLOY_STAGING.sh '$ROOT'"
      - name: Cleanup transient SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
