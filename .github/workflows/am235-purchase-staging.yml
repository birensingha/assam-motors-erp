name: AM235 Parts Purchase Reconciliation Report STAGING guarded
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.assammotors.com' }}
      STAGING_LOGIN_PATH: ${{ vars.STAGING_LOGIN_PATH || '/erp/login' }}
      STAGING_ADMIN_LOGIN: ${{ secrets.STAGING_ADMIN_LOGIN }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      SMOKE_OUTPUT_DIR: am235-browser-proof
    steps:
      - uses: actions/checkout@v4
      - name: Local static tests
        shell: bash
        run: |
          set -euo pipefail
          PKG=deployment/live-fixes/AM235_PURCHASE_RECON
          python3 -m py_compile "$PKG/apply.py" "$PKG/rollback.py"
          php -l "$PKG/AdminPurchaseReconciliationController.php"
          node --check "$PKG/qa/staging-browser-test.mjs"
          grep -q 'AM235' "$PKG/reconciliation.blade.php"
      - name: Configure STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Install read-only reconciliation register (backup & preflight)
        shell: bash
        run: |
          set -euo pipefail
          PKG=deployment/live-fixes/AM235_PURCHASE_RECON
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM235_PURCHASE_RECON"'
          "${SCP[@]}" "$PKG/apply.py" "$PKG/rollback.py" "$PKG/AdminPurchaseReconciliationController.php" "$PKG/reconciliation.blade.php" "$REMOTE:~/AM235_PURCHASE_RECON/"
          CHECK=$("${SSH[@]}" "$REMOTE" "python3 ~/AM235_PURCHASE_RECON/apply.py check '$ROOT'")
          printf '%s\n' "$CHECK"
          grep -q AM235_PREFLIGHT_PASS <<<"$CHECK"
          RESULT=$("${SSH[@]}" "$REMOTE" "python3 ~/AM235_PURCHASE_RECON/apply.py apply '$ROOT'")
          printf '%s\n' "$RESULT"
          grep -q AM235_APPLIED <<<"$RESULT"
          BACKUP=$(printf '%s\n' "$RESULT" | sed -n 's/^AM235_BACKUP=//p' | tail -1)
          test -n "$BACKUP"
          echo "AM235_BACKUP_PATH=$BACKUP" >> "$GITHUB_ENV"
          "${SSH[@]}" "$REMOTE" "cd '$ROOT' && php -l app/Http/Controllers/Web/AdminPurchaseReconciliationController.php && php artisan view:clear && php artisan route:list --path=erp/purchases" | tee "$RUNNER_TEMP/am235-route.log"
          grep -q 'purchases/reconciliation' "$RUNNER_TEMP/am235-route.log"
          echo AM235_STAGING_ROUTE_PASS
      - name: Prepare Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Automated browser report + JC selection check (NO purchase posting)
        run: node deployment/live-fixes/AM235_PURCHASE_RECON/qa/staging-browser-test.mjs
      - name: Rollback code if any staging test failed
        if: failure() && env.AM235_BACKUP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" "python3 ~/AM235_PURCHASE_RECON/rollback.py '$ROOT' '$AM235_BACKUP_PATH' && cd '$ROOT' && php artisan view:clear"
      - name: Upload screenshots / proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am235-purchase-reconciliation-browser-proof
          path: am235-browser-proof/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
