name: AM253 Purchase Returns + Unified Register — STAGING Deploy
on:
  push:
    branches: [feature/am253-purchase-return-20261113]
    paths:
      - '.github/workflows/deploy-am253-purchase-return-staging.yml'
      - 'deployment/live-fixes/AM253_PURCHASE_RETURNS/**'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify AM253 package syntax before any SSH work
        shell: bash
        run: |
          set -euo pipefail
          P=deployment/live-fixes/AM253_PURCHASE_RETURNS
          python3 -m py_compile "$P/install.py"
          php -l "$P/files/database/migrations/2026_11_13_140000_create_am_purchase_returns.php"
          php -l "$P/files/app/Http/Controllers/Web/AdminPurchaseReturnController.php"
          for name in choose create show print; do
            test -s "$P/files/resources/views/purchase-returns/$name.blade.php"
          done
          bash -n deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN/staging_db_backup_shell.sh
          php -l deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN/staging_dump_config.php
          echo AM253_GITHUB_PACKAGE_STATIC_PREFLIGHT_PASS
      - name: Prepare STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Staging source preflight, verified complete SQL backup, additive migration and guarded apply
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = assam-erp-staging
          test -f "$APP/artisan"
          cd "$HOME/assam-motors-deploy"
          git fetch origin feature/am253-purchase-return-20261113
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          git archive FETCH_HEAD deployment/live-fixes/AM253_PURCHASE_RETURNS deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN/staging_db_backup_shell.sh deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN/staging_dump_config.php | tar -x -C "$TMP"
          PKG="$TMP/deployment/live-fixes/AM253_PURCHASE_RETURNS"
          python3 "$PKG/install.py" check "$APP"
          python3 "$PKG/install.py" prepare "$APP"
          # Never run a financial schema migration before verified fresh full SQL export.
          bash "$TMP/deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN/staging_db_backup_shell.sh" "$APP"
          (cd "$APP" && php artisan migrate --path=database/migrations/2026_11_13_140000_create_am_purchase_returns.php --force)
          python3 "$PKG/install.py" apply "$APP"
          cd "$APP"
          php artisan route:list --path=erp/purchase-returns | grep -F 'erp.purchase-returns'
          php artisan route:list --path=erp/purchases | grep -F 'erp.purchases.return.store'
          php -l app/Http/Controllers/Web/AdminPurchaseReturnController.php
          echo AM253_STAGING_PURCHASE_RETURN_ROUTES_AND_SOURCE_VERIFIED
          echo AM253_NO_RETURN_DOCUMENTS_AUTOMATICALLY_POSTED
          REMOTE
      - name: Protected return-page guest redirect smoke
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -sS --max-redirs 0 --max-time 20 -o /dev/null -w '%{http_code}' 'https://staging.assammotors.com/erp/purchase-returns/create' || true)
          echo "AM253_GUEST_PURCHASE_RETURN_STATUS=$STATUS"
          test "$STATUS" = "302" || test "$STATUS" = "303"
          echo AM253_GUEST_ADMIN_AUTH_REDIRECT_PASS
      - name: Erase SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
