name: Diagnose Assigned Staff Inspection Not Showing
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-v635-assigned-inspection-readonly.yml"]
permissions: { contents: read }
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Read-only trace job card inspection to mobile endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/inspectkey
            chmod 600 ~/.ssh/inspectkey
            SSH=(ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=25 -i ~/.ssh/inspectkey -p "$PORT")
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$ROOT"
          echo "== INSPECTION ROUTE AND ASSIGNMENT REFS =="
          grep -RIn --include='*.php' -E "staff-inspections\.php|staff-inspection\.php|inspections/mine|inspections/assigned|my-inspections|inspection-assigned|inspection_assigned|assigned_to_staff_id|assigned_inspector_id" routes app/Http/Controllers app/Services 2>/dev/null | head -110 || true
          echo "== INSPECTION RELATED ROUTES =="
          php artisan route:list --path=api --json 2>/dev/null | python3 -c 'import sys,json; rows=json.load(sys.stdin); [print(x.get("method"),x.get("uri"),x.get("action")) for x in rows if "inspect" in (x.get("uri","")+" "+x.get("action","")).lower()]' | head -70 || true
          echo "== INSPECTION CONTROLLER FILES =="
          find app/Http/Controllers -iname '*Inspect*' -o -iname '*JobCard*' | head -45
          echo "== LEGACY STAFF API FILES =="
          find "$HOME/domains/assammotors.com/public_html/staging" "$ROOT/public" -maxdepth 5 -name 'staff-inspection*.php' -print 2>/dev/null | head -25 || true
          echo "== NATIVE STAFF INSPECTION READ METHOD =="
          php -r '$p="app/Http/Controllers/Api/V1/StaffExtraController.php";$s=file($p);foreach($s as $i=>$l){if(preg_match("/function (inspections|inspection|saveInspection)\\s*\\(/",$l)){echo "METHOD: $p LINE ".($i+1)."\n";for($j=$i;$j<min(count($s),$i+100);$j++){if($j>$i && preg_match("/^    (public|private|protected) function /",$s[$j]))break; echo ($j+1).": ".substr($s[$j],0,220);}}}' | head -185
          echo "== WEB ADMIN ASSIGNMENT IMPLEMENTATION =="
          php -r '$p="app/Http/Controllers/Web/AdminInspectionPageController.php";$s=file($p);foreach($s as $i=>$l){if(preg_match("/function .*assign/i",$l)){echo "METHOD: $p LINE ".($i+1)."\n";for($j=$i;$j<min(count($s),$i+130);$j++){if($j>$i && preg_match("/^    (public|private|protected) function /",$s[$j]))break; echo ($j+1).": ".substr($s[$j],0,220);}}}' | head -165
          echo "== LEGACY STAFF INSPECTION PHP SELECT/GATE REFS =="
          grep -nEi "SELECT |FROM |staff_id|assigned|job_card|inspections|response|json_encode|staff_code|API" "$HOME/domains/assammotors.com/public_html/staging/legacy/api/staff-inspections.php" | head -115 || true
          echo "== DEPLOYED LEGACY INSPECTION IMPLEMENTATION (lines 1-105) =="
          sed -n '1,105p' "$HOME/domains/assammotors.com/public_html/staging/legacy/api/staff-inspections.php" | sed -E '/(password|JWT_SECRET|DB_PASS|token[_ ]?=|secret)/Id' | head -100 || true
          echo "== NATIVE STAFF LINKED ID IMPLEMENTATION =="
          sed -n '1,37p' app/Http/Controllers/Api/V1/StaffExtraController.php || true
          echo "== ASSIGNMENT ADMIN CONTROLLER METHODS =="
          grep -nE 'function |job_card_inspection_assignments|assigned_staff_id|inspection_assigned' app/Http/Controllers/Web/AdminInspectionPageController.php | head -85 || true
          echo "== TABLE STRUCTURE (COLUMNS ONLY) =="
          php artisan tinker --execute='foreach(["job_cards","inspections","job_card_inspections","staff","erp_auth_users"] as $t){if(\\Illuminate\\Support\\Facades\\Schema::hasTable($t)){echo $t." ".implode(",",\\Illuminate\\Support\\Facades\\Schema::getColumnListing($t))."\n";}}' 2>/dev/null | head -15 || true
          REMOTE
      - name: Purge temporary SSH identity
        if: always()
        run: rm -f ~/.ssh/inspectkey
