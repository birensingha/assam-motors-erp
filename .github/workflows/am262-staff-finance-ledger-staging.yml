name: AM262 Staff Ledger Salary Accounts STAGING Deploy
on:
  push:
    branches: [fix/am217-osl-vendor-payment-audit-20261030]
    paths:
      - deployment/live-fixes/AM262_STAFF_FINANCE_LEDGER/install.py
      - deployment/live-fixes/AM262_STAFF_FINANCE_LEDGER/files/**
      - .github/workflows/am262-staff-finance-ledger-staging.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Source preflight and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM262_STAFF_FINANCE_LEDGER/install.py
          php -l deployment/live-fixes/AM262_STAFF_FINANCE_LEDGER/files/app/Http/Controllers/Web/AdminStaffFinanceLedgerController.php
          php -l deployment/live-fixes/AM262_STAFF_FINANCE_LEDGER/files/database/migrations/2026_10_31_225000_create_staff_finance_subledger.php
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          install -d -m 700 ~/.ssh
          for i in 1 2 3;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 2
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: AM262 guarded Staff Ledger source and empty-schema deploy
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15)
            SCP=(scp -P "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=15)
            SCP=(sshpass -e scp -P "$PORT" -o ConnectTimeout=15)
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p -m 700 ~/AM262_STAFF_FINANCE_LEDGER'
          "${SCP[@]}" deployment/live-fixes/AM262_STAFF_FINANCE_LEDGER/install.py "$REMOTE:~/AM262_STAFF_FINANCE_LEDGER/"
          "${SCP[@]}" -r deployment/live-fixes/AM262_STAFF_FINANCE_LEDGER/files "$REMOTE:~/AM262_STAFF_FINANCE_LEDGER/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          ROOT="$1"
          PATCH="$HOME/AM262_STAFF_FINANCE_LEDGER/install.py"
          cd "$ROOT"
          python3 "$PATCH" check "$ROOT"
          python3 "$PATCH" apply "$ROOT"
          php -l app/Http/Controllers/Web/AdminStaffFinanceLedgerController.php
          # Existing installer already checked route names in complete stdout.
          # Avoid grep -q with pipefail causing SIGPIPE on a full route:list.
          php artisan route:list --path=staff-finance
          test -s resources/views/staff-finance/index.blade.php
          php artisan view:cache
          echo AM262_STAFF_LEDGER_ROUTES_AND_VIEWS_PASS
          for p in /erp/login /staff/login;do
            STATUS="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$p")"
            echo "AM262_HEALTH $p $STATUS"
            test "$STATUS" = 200
          done
          REMOTE_SCRIPT
      - name: Cleanup SSH credential
        if: always()
        run: rm -f ~/.ssh/id_ed25519
