name: AM253 Long Estimate Description + Row Recovery — STAGING Deploy
on:
  push:
    branches: [fix/am253-estimate-description-recovery-20261113]
    paths:
      - .github/workflows/deploy-am253-estimate-description-recovery-staging.yml
      - deployment/live-fixes/AM253_ESTIMATE_DESCRIPTION_RECOVERY/**
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Source syntax and offline draft recovery JS
        run: |
          set -euo pipefail
          P=deployment/live-fixes/AM253_ESTIMATE_DESCRIPTION_RECOVERY
          python3 -m py_compile "$P/install.py"
          php -l "$P/files/database/migrations/2026_11_13_120000_am253_long_estimate_descriptions.php"
          node --check "$P/files/public/js/am253-estimate-autosave.js"
          echo AM253_GITHUB_SOURCE_JS_PHP_PREFLIGHT_PASS
      - name: Prepare Hostinger SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$PORT"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Back up complete STAGING DB, migrate and install Estimate recovery
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = "assam-erp-staging"
          test -f "$APP/artisan"
          cd "$HOME/assam-motors-deploy"
          git fetch origin fix/am253-estimate-description-recovery-20261113
          PATCH_DIR="$(mktemp -d)"
          git archive FETCH_HEAD deployment/live-fixes/AM253_ESTIMATE_DESCRIPTION_RECOVERY | tar -x -C "$PATCH_DIR"
          PKG="$PATCH_DIR/deployment/live-fixes/AM253_ESTIMATE_DESCRIPTION_RECOVERY"
          SCRIPT="$PKG/install.py"
          if [ -f "$APP/public/js/am253-estimate-autosave.js" ]; then
            echo AM253_ASSET_PRESENT_VERIFY_ONLY
          else
            python3 "$SCRIPT" check "$APP"
            python3 "$SCRIPT" prepare "$APP"
            # Reuse pre-verified Hostinger-native shell MariaDB backup.
            git fetch origin feature/am246-complaint-rework-assign-20261110
            git archive FETCH_HEAD deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN | tar -x -C "$PATCH_DIR"
            BACKUP="$PATCH_DIR/deployment/live-fixes/AM246_COMPLAINT_REWORK_ASSIGN"
            bash "$BACKUP/staging_db_backup_shell.sh" "$APP"
            cd "$APP"
            php artisan migrate --path=database/migrations/2026_11_13_120000_am253_long_estimate_descriptions.php --force
            python3 "$SCRIPT" apply "$APP"
          fi
          python3 "$SCRIPT" verify "$APP"
          test -f "$APP/routes/web.php"
          echo AM253_EXISTING_ESTIMATE_POST_ROUTE_PRESERVED
          echo AM253_STAGING_ESTIMATE_LONG_DESCRIPTION_AND_RECOVERY_VERIFIED
          REMOTE
      - name: Clean ephemeral SSH identity
        if: always()
        run: rm -f ~/.ssh/id_ed25519
