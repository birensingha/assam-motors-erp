name: AM258 Continuous Blank Entry Row — STAGING Deploy
on:
  push:
    branches: [fix/am258-always-blank-entry-row-20261116]
    paths:
      - .github/workflows/deploy-am258-always-blank-entry-row-staging.yml
      - deployment/live-fixes/AM258_AUTO_BLANK_ROW/install.py
      - deployment/live-fixes/AM258_AUTO_BLANK_ROW/files/**
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check new code syntax and no network requests
        run: |
          set -euo pipefail
          P=deployment/live-fixes/AM258_AUTO_BLANK_ROW
          python3 -m py_compile "$P/install.py"
          node --check "$P/files/public/js/am258-auto-blank-entry.js"
          if grep -E 'fetch\(|XMLHttpRequest|form\.submit\(|requestSubmit\(' "$P/files/public/js/am258-auto-blank-entry.js"; then
            echo STOP_AM258_UNEXPECTED_NETWORK_OR_AUTO_SUBMIT
            exit 8
          fi
          echo AM258_NEW_JS_AND_INSTALLER_SYNTAX_PASS
      - name: Configure Hostinger STAGING SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$PORT"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4 5 6; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Install guarded entry row fix on STAGING
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = "assam-erp-staging"
          test -f "$APP/artisan"
          cd "$HOME/assam-motors-deploy"
          git fetch origin fix/am258-always-blank-entry-row-20261116
          PATCH_DIR="$(mktemp -d)"
          git archive FETCH_HEAD deployment/live-fixes/AM258_AUTO_BLANK_ROW | tar -x -C "$PATCH_DIR"
          SCRIPT="$PATCH_DIR/deployment/live-fixes/AM258_AUTO_BLANK_ROW/install.py"
          if test -f "$APP/public/js/am258-auto-blank-entry.js"; then
            echo AM258_ASSET_PRESENT_VERIFY_ONLY
          else
            python3 "$SCRIPT" check "$APP"
            python3 "$SCRIPT" apply "$APP"
          fi
          python3 "$SCRIPT" verify "$APP"
          echo AM258_STAGING_ESTIMATE_PURCHASE_SALES_READY_ROW_SOURCE_VERIFIED
          REMOTE
      - name: Verify exact deployed JavaScript through GitHub Node
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          for path in public/js/am258-auto-blank-entry.js public/js/estimate-entry.js public/js/purchase-entry.js public/js/purchase-edit.js; do
            "${SSH[@]}" "$USERNAME@$HOST" "cat '$ROOT/$path'" | node --check
            echo "AM258_DEPLOYED_NODE_SYNTAX_PASS $path"
          done
          echo AM258_ALL_DEPLOYED_JS_SYNTAX_PASS
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
