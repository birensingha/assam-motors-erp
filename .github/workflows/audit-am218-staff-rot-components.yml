name: AM218 Inspect STAGING Staff ROT Components data flow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-am218-staff-rot-components.yml'
      - 'deployment/live-fixes/AM218_ROT_COMPONENTS_STAFF_VISIBILITY/audit.py'
      - 'deployment/live-fixes/AM218_ROT_COMPONENTS_STAFF_VISIBILITY/detail_audit.py'
permissions: {contents: read, issues: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH read-only staff API and portal source audit
        run: |
          set -euo pipefail
          FILE=deployment/live-fixes/AM218_ROT_COMPONENTS_STAFF_VISIBILITY/audit.py
          python3 -m py_compile "$FILE" deployment/live-fixes/AM218_ROT_COMPONENTS_STAFF_VISIBILITY/detail_audit.py
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            sudo apt-get update -qq; sudo apt-get install -qq -y sshpass
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM218_ROT_AUDIT"'
          "${SCP[@]}" "$FILE" "$REMOTE:~/AM218_ROT_AUDIT/audit.py"
          "${SSH[@]}" "$REMOTE" "python3 ~/AM218_ROT_AUDIT/audit.py '$ROOT'" | tee /tmp/am218.txt
          body="AM218 read-only STAGING staff API source inventory: $(grep '^AM218_' /tmp/am218.txt | head -75 | tr '\n' ' ' | cut -c1-8500)"
          gh api repos/"$GITHUB_REPOSITORY"/issues/124/comments -f body="$body"
          "__SSHARRAY__" "$REMOTE" "python3 ~/AM218_ROT_AUDIT/detail_audit.py '$ROOT'" > /tmp/am218_detail.txt
          grep -E '^AM218_DETAIL_|^AM218_SOURCE' /tmp/am218_detail.txt | sed -n '1,140p'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
