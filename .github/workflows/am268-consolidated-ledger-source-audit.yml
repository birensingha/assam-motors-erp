name: AM275 Expense Category Settings and Donation Voucher — STAGING
on:
  push:
    branches: [feature/am275-expense-category-master-20261118]
    paths:
      - '.github/workflows/am268-consolidated-ledger-source-audit.yml'
      - 'deployment/live-fixes/AM275_EXPENSE_CATEGORIES/**'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight Expense Category package
        shell: bash
        run: |
          set -euo pipefail
          PKG=deployment/live-fixes/AM275_EXPENSE_CATEGORIES
          python3 -m py_compile "$PKG/install.py"
          php -l "$PKG/migrate.php"
          php -l "$PKG/qa_runtime.php"
          php -l "$PKG/files/app/Services/ExpenseCategoryMasterService.php"
          php -l "$PKG/files/app/Http/Controllers/Web/AdminExpenseCategorySettingsController.php"
          grep -Fq 'DONATION' "$PKG/migrate.php"
          grep -Fq 'Expense Category Settings' "$PKG/files/resources/views/expenses/categories.blade.php"
          echo AM275_PACKAGE_PREFLIGHT_PASS
      - name: Prepare STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Guarded STAGING category migration, code install and rollback-only financial QA
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = assam-erp-staging
          test -f "$APP/artisan"
          cd "$HOME/assam-motors-deploy"
          git fetch origin feature/am275-expense-category-master-20261118
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          git archive FETCH_HEAD deployment/live-fixes/AM275_EXPENSE_CATEGORIES | tar -x -C "$TMP"
          PKG="$TMP/deployment/live-fixes/AM275_EXPENSE_CATEGORIES"
          python3 "$PKG/install.py" check "$APP"
          python3 "$PKG/install.py" apply "$APP"
          cd "$APP"
          set +e
          php "$PKG/qa_runtime.php" > "$TMP/qa_runtime.log" 2>&1
          QA_RC=$?
          set -e
          cat "$TMP/qa_runtime.log"
          if [ "$QA_RC" -ne 0 ] || ! grep -q AM275_FULL_STAGING_DONATION_CATEGORY_AND_SETTINGS_QA_PASS "$TMP/qa_runtime.log";then
            echo AM275_QA_FAILED_ROLLING_BACK_CODE
            python3 "$PKG/install.py" rollback "$APP"
            exit 43
          fi
          echo AM275_DONATION_PAYMENT_AND_CATEGORY_MASTER_STAGING_QA_PASS
          echo AM275_NO_FINANCIAL_OR_INVENTORY_TRANSACTIONS_POSTED_BY_DEPLOYMENT
          REMOTE
      - name: Verify STAGING Expense Categories remain login-protected
        shell: bash
        run: |
          set -euo pipefail
          URL=https://staging.assammotors.com/erp/configuration/expense-categories
          code=$(curl -sS --max-redirs 0 --max-time 20 -o /dev/null -w '%{http_code}' "$URL" || true)
          echo "AM275_CATEGORIES_GUEST_HTTP=$code"
          test "$code" = 302 || test "$code" = 303
          echo AM275_GUEST_ACCESS_PROTECTION_PASS
      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
