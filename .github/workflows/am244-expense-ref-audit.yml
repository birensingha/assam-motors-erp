name: AM244 Staff Expense Against Reference READONLY
on:
  push:
    branches: [feature/am244-staff-expense-against-ref]
    paths: ['.github/workflows/am244-expense-ref-audit.yml']
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile deployment/audits/AM244_staff_expense_reference.py
      - name: SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi;sleep 3;done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Read current payment source only
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519);SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT");SCP=(sshpass -e scp -P "$PORT");fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM244_AUDIT"'
          "${SCP[@]}" deployment/audits/AM244_staff_expense_reference.py "$REMOTE:~/AM244_AUDIT/audit.py"
          "${SSH[@]}" "$REMOTE" "python3 ~/AM244_AUDIT/audit.py '$ROOT'" | tee "$RUNNER_TEMP/am244-audit.log"
          grep -q AM244_READ_ONLY_DONE "$RUNNER_TEMP/am244-audit.log"
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
