name: Assam Motors HR Browser Session Guard Source Audit
on:
  push:
    branches: [fix/hr-attendance-403-20261013]
    paths: [.github/workflows/hr-browser-session-guard-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Simulate authenticated HR web requests with Laravel middleware (read-only)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$APP"
          echo '== READ-ONLY STAFF LOGIN, LOGOUT AND AUTH GUARDS =='
          php artisan route:list --path=staff -v --except-vendor | head -55
          sed -n '1,90p' app/Http/Middleware/EnsureHrManager.php
          sed -n '1,155p' app/Support/HrAccess.php
          sed -n '1,90p' app/Http/Middleware/EnsureStaffUser.php
          echo '== WEB ROUTE LOGIN REDIRECT =='
          grep -nE "(redirectGuestsTo|redirectTo|login|staff.login|staff.logout|ASSAM_HR_NATIVE_2B)" bootstrap/app.php routes/web.php | head -80
          echo '== WEB AND STAFF AUTH LOGIN HANDLERS =='
          grep -RsnE 'function (login|logout)\(' app/Http/Controllers/Web/*AuthController.php | head -30 || true
          sed -n '1,175p' app/Http/Controllers/Web/StaffWebAuthController.php
          sed -n '1,165p' app/Http/Controllers/Web/WebAuthController.php
          echo 'HR_BROWSER_GUARD_SOURCE_AUDIT: COMPLETE (no writes)'
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
