name: Fix misleading stale INSIDE badge and verify Owner GPS linkage (Staging)
on:
  push:
    branches: [main]
    paths: [".github/workflows/v6313-stale-badge-and-owner-gps-audit.yml"]
permissions: {contents: read}
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Check staging SSH and protected GPS route
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/am-gps-diag
            chmod 600 ~/.ssh/am-gps-diag
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=25 -o StrictHostKeyChecking=accept-new -i ~/.ssh/am-gps-diag -p "$PORT")
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=25 -o StrictHostKeyChecking=accept-new -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          SITE="$HOME/domains/assammotors.com/public_html/staging/staff-app"
          test -f "$ROOT/artisan" && test -f "$SITE/latest.json"
          cd "$ROOT"
          echo '=== Correct stale GPS badge priority without changing GPS records ==='
          SITE="$HOME/domains/assammotors.com/public_html/staging"
          JS="$SITE/legacy/admin/admin.js"
          test -f "$JS"
          JS="$JS" python3 <<'PY'
          import os,pathlib,datetime,tempfile,subprocess
          path=pathlib.Path(os.environ['JS'])
          before=path.read_text()
          oldcls="const cls=outside?'outside':inside?'inside':stale?'stale':'';"
          newcls="const cls=stale?'stale':outside?'outside':inside?'inside':'';"
          oldbadge="const badge=weak?'<span class=\"staff-location-badge weak\">GPS Weak / Unverified</span>':outside?'<span class=\"staff-location-badge out\">Outside</span>':inside?'<span class=\"staff-location-badge in\">Inside</span>':'<span class=\"staff-location-badge\">Unverified</span>';"
          newbadge="const badge=stale?'<span class=\"staff-location-badge weak\">STALE GPS · LAST KNOWN</span>':weak?'<span class=\"staff-location-badge weak\">GPS Weak / Unverified</span>':outside?'<span class=\"staff-location-badge out\">Outside</span>':inside?'<span class=\"staff-location-badge in\">Inside</span>':'<span class=\"staff-location-badge\">Unverified</span>';"
          if newcls in before and newbadge in before:
            print('STALE_GPS_BADGE=ALREADY_FIXED')
          else:
            assert before.count(oldcls)==1,'Unexpected status class logic - abort'
            assert before.count(oldbadge)==1,'Unexpected GPS badge logic - abort'
            after=before.replace(oldcls,newcls,1).replace(oldbadge,newbadge,1)
            assert after.count('GPS Weak / Unverified')==before.count('GPS Weak / Unverified')
            backup=path.parent / ('admin.js.backup-v6313-stale-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ'))
            backup.write_text(before)
            backup.chmod(0o600)
            fd,tmp=tempfile.mkstemp(prefix='.admin-v6313-',dir=path.parent)
            with os.fdopen(fd,'w') as f:f.write(after)
            os.chmod(tmp,path.stat().st_mode & 0o777)
            # Check syntax when Node is present; fail closed if it reports errors.
            if subprocess.run(['bash','-lc','command -v node >/dev/null'],capture_output=True).returncode==0:
              test=subprocess.run(['node','--check',tmp],capture_output=True,text=True)
              if test.returncode!=0:
                os.unlink(tmp)
                raise RuntimeError('JS syntax lint failed: '+test.stderr)
            os.replace(tmp,path)
            print('STALE_GPS_BADGE=DEPLOYED_WITH_BACKUP')
          confirmed=path.read_text()
          assert newcls in confirmed and newbadge in confirmed
          print('GPS_STALE_OVERRIDES_OLD_INSIDE=PASS')
          PY
          echo '=== Owner staff master/auth status and recent accepted GPS, no coordinates ==='
          php <<'PHP'
          <?php
          try {
            require 'vendor/autoload.php';$app=require 'bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db=\Illuminate\Support\Facades\DB::class;
            $staff=$db::table('staff')->where('staff_code','AM5077')->first();
            if(!$staff){echo 'OWNER_STAFF_MASTER_MATCH=NONE'.PHP_EOL;exit(0);}
            echo 'OWNER_STAFF_MASTER_STATUS='.strtoupper((string)$staff->status).PHP_EOL;
            $linked=\App\Models\ErpAuthUser::query()->where('staff_id',$staff->id)->get();
            echo 'OWNER_ERP_LINKED_ACCOUNTS='.$linked->count().PHP_EOL;
            foreach($linked as $u){echo 'OWNER_LINKED_ACTIVE='.($u->active?'YES':'NO').',IS_STAFF='.($u->isStaff()?'YES':'NO').',IS_ADMIN='.($u->isAdmin()?'YES':'NO').PHP_EOL;}
            $recent=$db::table('staff_location_logs')->where('staff_id',$staff->id)->orderByDesc('received_at')->limit(6)->get(['received_at','recorded_at','accuracy_m','quality','app_version','provider']);
            echo 'OWNER_LAST_GPS_RECORDS='.$recent->count().PHP_EOL;
            foreach($recent as $l){
              echo 'OWNER_LAST_GPS_RECEIVED_AT='.(string)$l->received_at.',RECORDED_AT='.(string)$l->recorded_at.',APP='.(string)$l->app_version.',ACCURACY_METRES='.(string)$l->accuracy_m.',QUALITY='.(string)$l->quality.',PROVIDER='.(string)$l->provider.PHP_EOL;
            }
            echo 'OWNER_GPS_LINK_DIAGNOSTIC=PASS'.PHP_EOL;
          }catch(\Throwable $e){echo 'OWNER_GPS_LINK_DIAGNOSTIC_ERROR='.get_class($e).PHP_EOL;exit(1);}
          PHP
          echo 'GPS_STALE_BADGE_AND_OWNER_AUTH_AUDIT=PASS'
          REMOTE
      - name: Check unauthenticated GPS API protections
        run: |
          set -euo pipefail
          for path in /api/v1/staff/location /api/v1/admin/mobile/staff-locations; do
            status="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path" || true)"
            echo "PATH=$path HTTP=$status (unauthenticated; GET-only)"
          done
      - if: always()
        run: rm -f ~/.ssh/am-gps-diag
