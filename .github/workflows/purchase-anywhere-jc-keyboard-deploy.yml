name: Purchase Search and OSL Keyboard Staging Patch
on:
  pull_request:
    paths:
      - '.github/workflows/purchase-anywhere-jc-keyboard-deploy.yml'
      - 'deployment/live-fixes/PURCHASE_ANYWHERE_JC_KEYBOARD/**'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          python3 -m py_compile deployment/live-fixes/PURCHASE_ANYWHERE_JC_KEYBOARD/apply.py
      - name: Prepare staging SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq;sudo apt-get install -qq -y sshpass
          fi
      - name: Guarded staging purchase patch
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/PURCHASE_KEYBOARD_DEPLOY"'
          "${SCP[@]}" deployment/live-fixes/PURCHASE_ANYWHERE_JC_KEYBOARD/apply.py  "$REMOTE:~/PURCHASE_KEYBOARD_DEPLOY/"
          "${SSH[@]}" "$REMOTE" "python3 ~/PURCHASE_KEYBOARD_DEPLOY/apply.py check '$ROOT' && python3 ~/PURCHASE_KEYBOARD_DEPLOY/apply.py apply '$ROOT'"
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
