name: P41 Android Inspired Desktop Staff Portal Motion Deploy
on:
  push:
    branches:
      - feature/p31-direct-counter-parts-invoice-20261014
    paths:
      - 'deployment/live-fixes/P41_STAFF_ANDROID_DESKTOP/PATCH_P41.php'
      - '.github/workflows/p41-staff-desktop-motion-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assam-motors-p41-staff-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      APP_ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          mkdir -p ~/.ssh
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          fi
      - name: Check apply and verify staging only
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" bash -s -- "$APP_ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test -f "$ROOT/artisan"
          DEPLOY="$HOME/assam-motors-deploy"
          test -d "$DEPLOY/.git"
          cd "$DEPLOY"
          git fetch origin feature/p31-direct-counter-parts-invoice-20261014
          SCRIPT="$DEPLOY/deployment/live-fixes/P41_STAFF_ANDROID_DESKTOP/PATCH_P41.php"
          git show origin/feature/p31-direct-counter-parts-invoice-20261014:deployment/live-fixes/P41_STAFF_ANDROID_DESKTOP/PATCH_P41.php > /tmp/assam-p41-staff.php
          php -l /tmp/assam-p41-staff.php
          php /tmp/assam-p41-staff.php check "$ROOT"
          RESULT="$(php /tmp/assam-p41-staff.php apply "$ROOT")"
          echo "$RESULT"
          BAK="$(printf '%s\n' "$RESULT" | sed -n 's/^P41_BACKUP=//p')"
          restore(){
            if [ -n "$BAK" ] && [ -f "$BAK" ]; then
              cp "$BAK" "$ROOT/resources/views/staff/portal.blade.php"
              (cd "$ROOT" && php artisan view:clear >/dev/null) || true
              echo 'P41_SAFE_ROLLBACK_APPLIED'
            fi
          }
          trap restore ERR
          cd "$ROOT"
          php artisan view:clear
          php artisan view:cache
          git -C "$DEPLOY" show origin/feature/p31-direct-counter-parts-invoice-20261014:deployment/live-fixes/P39_STAFF_PORTAL_SUMMARY/RENDER_P39.php > /tmp/assam-p39-render.php
          php -l /tmp/assam-p39-render.php
          php /tmp/assam-p39-render.php "$ROOT" | tee /tmp/assam-p39-qa.out
          grep -q 'P39_RENDER_STAFF_PORTAL_PASS' /tmp/assam-p39-qa.out
          if grep -q 'P39_RENDER_STAFF_PORTAL_FAIL' /tmp/assam-p39-qa.out; then exit 1; fi
          php /tmp/assam-p41-staff.php check "$ROOT"
          grep -q 'P41_STAFF_ANDROID_MOTION_V1' resources/views/staff/portal.blade.php
          trap - ERR
          echo "P41_STAFF_DESKTOP_MOTION_RENDER_VERIFIED_PASS"
          rm -f /tmp/assam-p41-staff.php
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
