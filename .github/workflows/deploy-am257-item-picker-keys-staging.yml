name: AM257 Tally-Style Master Picker Enter Tab — STAGING Deploy
on:
  push:
    branches: [fix/am257-item-picker-enter-tab-20261116]
    paths:
      - .github/workflows/deploy-am257-item-picker-keys-staging.yml
      - deployment/live-fixes/AM257_ITEM_PICKER_KEYS/install.py
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Python source preflight
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM257_ITEM_PICKER_KEYS/install.py
          echo AM257_PACKAGE_PYTHON_SYNTAX_PASS
      - name: Configure Hostinger STAGING SSH
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$PORT"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4 5 6; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Preflight, guarded STAGING code install, verify
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = "assam-erp-staging"
          test -f "$APP/artisan"
          cd "$HOME/assam-motors-deploy"
          git fetch origin fix/am257-item-picker-enter-tab-20261116
          PATCH_DIR="$(mktemp -d)"
          git archive FETCH_HEAD deployment/live-fixes/AM257_ITEM_PICKER_KEYS | tar -x -C "$PATCH_DIR"
          SCRIPT="$PATCH_DIR/deployment/live-fixes/AM257_ITEM_PICKER_KEYS/install.py"
          if grep -Fq "AM257_PICKER_ENTER_TAB" "$APP/public/js/estimate-entry.js"; then
            python3 "$SCRIPT" verify "$APP"
          else
            python3 "$SCRIPT" check "$APP"
            python3 "$SCRIPT" apply "$APP"
          fi
          python3 "$SCRIPT" verify "$APP"
          echo AM257_ESTIMATE_PURCHASE_AND_SALES_KEYBOARD_NAV_STAGING_VERIFIED
          REMOTE
      - name: Node syntax verify exact deployed JS and global Sales selector
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT")
          fi
          for path in public/js/estimate-entry.js public/js/purchase-entry.js public/js/purchase-edit.js; do
            "${SSH[@]}" "$USERNAME@$HOST" "cat '$ROOT/$path'" | node --check
            echo "AM257_NODE_SYNTAX_VERIFIED $path"
          done
          "${SSH[@]}" "$USERNAME@$HOST" "cat '$ROOT/resources/views/partials/am-global-selector.blade.php'" | python3 -c 'import re,sys; s=sys.stdin.read(); blocks=re.findall(r"<script[^>]*>(.*?)</script>",s,re.S|re.I); assert len(blocks)==1, "expected one selector script"; print(blocks[0])' | node --check
          echo AM257_GLOBAL_SALES_SELECTOR_NODE_SYNTAX_VERIFIED
      - name: Erase SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
