name: Diagnose Android App Native API 500
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-android-api-500-20261016.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Open staging SSH read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/diagnose
            chmod 600 ~/.ssh/diagnose
            CMD=(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -i ~/.ssh/diagnose -p "$SSH_PORT")
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASSWORD"
            CMD=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -p "$SSH_PORT")
          fi
          "${CMD[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          echo "== LARAVEL APP LOG FILE METADATA =="
          find storage/logs -maxdepth 1 -name '*.log' -printf '%f %s bytes %TY-%Tm-%Td %TH:%TM\n' | tail -14 || true
          echo "== MOST RECENT LARAVEL ERROR SUMMARY (REDACTED) =="
          python3 - <<'PY'
          from pathlib import Path
          from collections import deque
          import re
          files=sorted(Path('storage/logs').glob('*.log'),key=lambda x:x.stat().st_mtime,reverse=True)[:3]
          events=[]
          for f in files:
              with f.open(errors='replace') as h: lines=deque(h,maxlen=35000)
              for line in lines:
                  if '.ERROR:' not in line and '.CRITICAL:' not in line and '.EMERGENCY:' not in line: continue
                  marker=line.find('.ERROR:')
                  if marker<0:marker=line.find('.CRITICAL:')
                  if marker<0:marker=line.find('.EMERGENCY:')
                  desc=line[marker+7:].split(' {')[0].strip()[:250]
                  desc=re.sub(r'([A-Za-z0-9_.+-]+)@([A-Za-z0-9.-]+)','[email]',desc)
                  desc=re.sub(r'[0-9]{9,}','[num]',desc)
                  desc=re.sub(r'(?i)(password|secret|token|key)[ ]*[:=][ ]*[^ ,]+','[redacted]',desc)
                  events.append((line[:26],desc))
          print('ERROR_COUNT_RECENT_WINDOW',len(events))
          for ts,desc in events[-35:]:print('LARAVEL_ERROR',ts,repr(desc))
          PY
          echo "== CURRENT NATIVE API ROUTES =="
          php artisan route:list --json 2>/dev/null | python3 -c 'import json,sys; rows=json.load(sys.stdin); [print(x.get("method"),x.get("uri"),x.get("action")) for x in rows if any(z in x.get("uri","") for z in ("admin/mobile/","staff/inspections","staff/notifications","staff/device","attendance"))][:80]' | head -90
          echo "== PHP AND LARAVEL BASICS =="
          php -v | head -2
          test -f bootstrap/cache/config.php && echo CONFIG_CACHED=YES || echo CONFIG_CACHED=NO
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/diagnose
