name: Inspect Workshop Control Details

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-workshop-control-details.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH inspect
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          fi
          ROOT="/home/$SSH_USER/domains/assammotors.com/assam-erp-staging"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "ROOT='$ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$ROOT"
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Facades\Schema;

          echo "=== JOB STATUS VALUES ===\n";
          foreach(['status','inspection_status','diagnosis_status','customer_public_status'] as $c){
            if(Schema::hasColumn('job_cards',$c)){
              echo "$c:";
              foreach(DB::table('job_cards')->select($c)->selectRaw('COUNT(*) n')->groupBy($c)->orderByDesc('n')->get() as $r){
                echo " [".($r->$c ?? 'NULL')."=".$r->n."]";
              }
              echo "\n";
            }
          }

          echo "=== JOB CARD CONTROL COLUMNS ===\n";
          foreach(DB::select("SHOW COLUMNS FROM job_cards") as $c){
            if(preg_match('/status|priority|technician|diagn|inspect|complete|close|cancel|invoice|customer|vehicle|ready|qc|rework|work_/i',$c->Field)){
              echo $c->Field." ".$c->Type."\n";
            }
          }

          echo "=== RELATED TABLES ===\n";
          $db=DB::getDatabaseName();
          $rows=DB::table('information_schema.tables')
            ->where('table_schema',$db)
            ->where(function($q){
              foreach(['%job%','%inspection%','%diagn%','%osl%','%part%','%qc%','%quality%','%road%','%vehicle%','%key%','%audit%','%rework%','%attendance%'] as $p){
                $q->orWhere('table_name','like',$p);
              }
            })->orderBy('table_name')->pluck('table_name');
          foreach($rows as $t) echo $t."\n";

          echo "=== RELATED TABLE KEY COLUMNS ===\n";
          foreach($rows as $t){
            if(!preg_match('/inspection|diagn|osl|part|qc|quality|road|key|audit|rework|attendance|job_card_status|job_card_history/i',$t)) continue;
            echo "TABLE:$t\n";
            foreach(DB::select("SHOW COLUMNS FROM ".$t) as $c){
              if(preg_match('/^id$|job|staff|status|type|reason|note|date|time|at$|odometer|key|vendor|part|qty|amount|diagn|inspect|qc|result|action|old|new|user|admin/i',$c->Field)){
                echo " ".$c->Field." ".$c->Type."\n";
              }
            }
          }
          PHP
          echo "=== JOB CARD SERVICE METHODS ==="
          grep -nE 'public function|status|complete|close|cancel|ready|QC|diagn|inspection|technician|assign|invoice' app/Services/JobCardService.php | head -260 || true
          echo "=== STAFF EXTRA METHODS ==="
          grep -nE 'public function|inspection|diagn|attendance|job' app/Http/Controllers/Api/V1/StaffExtraController.php | head -240 || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
