name: FIX78 Clean Branded Print Footer STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fix78-clean-print-footer.yml'
      - 'deployment/live-fixes/FIX78_CLEAN_PRINT_FOOTER/apply.py'
permissions: {contents: read}
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check patch syntax and logo/site contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/FIX78_CLEAN_PRINT_FOOTER/apply.py
          grep -Fq 'FIX78_BRANDED_PRINT_MARGIN_FOOTER' deployment/live-fixes/FIX78_CLEAN_PRINT_FOOTER/apply.py
          grep -Fq '@bottom-left' deployment/live-fixes/FIX78_CLEAN_PRINT_FOOTER/apply.py
      - name: Configure STAGING SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          install -d -m 700 ~/.ssh
          for i in 1 2;do
            if ssh-keyscan -T 18 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -y -qq sshpass;fi
      - name: Source backup, guarded edit eight print views, Blade checks
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT");SCP=(sshpass -e scp -P "$PORT");fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX78_CLEAN_PRINT_FOOTER"'
          "${SCP[@]}" deployment/live-fixes/FIX78_CLEAN_PRINT_FOOTER/apply.py "$REMOTE:~/FIX78_CLEAN_PRINT_FOOTER/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1";cd "$APP";test -f artisan && test -d vendor
          PKG="$HOME/FIX78_CLEAN_PRINT_FOOTER"
          python3 "$PKG/apply.py" check "$APP"
          BACKUP="storage/app/FIX78_PRINT_FOOTER_BACKUP_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP"
          cp -p resources/views/invoices/print.blade.php "$BACKUP/invoice-print.blade.php"
          cp -p resources/views/invoices/direct-print.blade.php "$BACKUP/invoice-direct-print.blade.php"
          cp -p resources/views/invoices/credit-note.blade.php "$BACKUP/credit-note.blade.php"
          cp -p resources/views/money-receipts/print.blade.php "$BACKUP/money-receipt.blade.php"
          cp -p resources/views/job-cards/summary-print.blade.php "$BACKUP/jc-summary.blade.php"
          cp -p resources/views/job-cards/inspection-report.blade.php "$BACKUP/jc-inspection.blade.php"
          cp -p resources/views/estimates/print.blade.php "$BACKUP/estimate.blade.php"
          cp -p resources/views/purchases/print.blade.php "$BACKUP/purchase.blade.php"
          rollback(){
            echo 'FIX78_VIEW_ONLY_ROLLBACK'
            cp -p "$BACKUP/invoice-print.blade.php" resources/views/invoices/print.blade.php
            cp -p "$BACKUP/invoice-direct-print.blade.php" resources/views/invoices/direct-print.blade.php
            cp -p "$BACKUP/credit-note.blade.php" resources/views/invoices/credit-note.blade.php
            cp -p "$BACKUP/money-receipt.blade.php" resources/views/money-receipts/print.blade.php
            cp -p "$BACKUP/jc-summary.blade.php" resources/views/job-cards/summary-print.blade.php
            cp -p "$BACKUP/jc-inspection.blade.php" resources/views/job-cards/inspection-report.blade.php
            cp -p "$BACKUP/estimate.blade.php" resources/views/estimates/print.blade.php
            cp -p "$BACKUP/purchase.blade.php" resources/views/purchases/print.blade.php
            php artisan view:clear >/dev/null 2>&1 || true
          }
          trap rollback ERR
          python3 "$PKG/apply.py" apply "$APP"
          php artisan view:clear
          php artisan view:cache
          python3 - <<'PY'
          from pathlib import Path
          targets=[
           'resources/views/invoices/print.blade.php',
           'resources/views/invoices/direct-print.blade.php',
           'resources/views/invoices/credit-note.blade.php',
           'resources/views/money-receipts/print.blade.php',
           'resources/views/job-cards/summary-print.blade.php',
           'resources/views/job-cards/inspection-report.blade.php',
           'resources/views/estimates/print.blade.php',
           'resources/views/purchases/print.blade.php'
          ]
          for p in targets:
           s=Path(p).read_bytes().decode('utf8','surrogateescape')
           assert s.count('FIX78_BRANDED_PRINT_MARGIN_FOOTER')==1, p
           assert s.count('@bottom-left')>=1, p
           assert 'content: "www.assammotors.com";' in s, p
           assert '@top-left' in s and '@bottom-right' in s, p
           print('FIX78_VIEW_OK '+p)
          print('FIX78_EIGHT_DOCUMENTS_BRANDED_FOOTER_AND_BLADE_COMPILE_PASS')
          PY
          for path in /erp/login /staff/login;do
            status="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")"
            echo "FIX78_HEALTH_$path=$status"
            test "$status" = 200
          done
          trap - ERR
          echo "FIX78_STAGING_PRINT_FOOTER_SUCCESS BACKUP=$BACKUP NO_FINANCIAL_WRITES"
          REMOTE
      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
