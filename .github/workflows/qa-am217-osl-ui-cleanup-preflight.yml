name: AM217 OSL Master Purchase UI Cleanup Preflight (no writes)
on:
  pull_request:
    paths:
      - '.github/workflows/qa-am217-osl-ui-cleanup-preflight.yml'
      - 'deployment/live-fixes/AM217_OSL_UI_CLEANUP/apply.py'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: assam-motors-am217-osl-ui-preflight, cancel-in-progress: false}
jobs:
  inspect:
    name: Test exact one-button view diff and Blade compilation without writes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate audit shell syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM217_OSL_UI_CLEANUP/apply.py
          node --check deployment/live-fixes/AM217_OSL_UI_CLEANUP/master-search.js
      - name: SSH staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Read-only verify OSL duplicate filtering, Master search and Blade compilation
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ]; then
            ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519 "$USERNAME@$HOST" 'mkdir -p "$HOME/AM217_PREFLIGHT"'
            scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519 deployment/live-fixes/AM217_OSL_UI_CLEANUP/apply.py "$USERNAME@$HOST:~/AM217_PREFLIGHT/apply.py"
            ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519 "$USERNAME@$HOST" "cd '$ROOT' && python3 -m py_compile ~/AM217_PREFLIGHT/apply.py && python3 ~/AM217_PREFLIGHT/apply.py check '$ROOT'"
          else
            export SSHPASS="$PASSWORD"
            sshpass -e ssh -o ConnectTimeout=14 -p "$PORT" "$USERNAME@$HOST" 'mkdir -p "$HOME/AM217_PREFLIGHT"'
            sshpass -e scp -o ConnectTimeout=14 -P "$PORT" deployment/live-fixes/AM217_OSL_UI_CLEANUP/apply.py "$USERNAME@$HOST:~/AM217_PREFLIGHT/apply.py"
            sshpass -e ssh -o ConnectTimeout=14 -p "$PORT" "$USERNAME@$HOST" "cd '$ROOT' && python3 -m py_compile ~/AM217_PREFLIGHT/apply.py && python3 ~/AM217_PREFLIGHT/apply.py check '$ROOT'"
          fi
      - name: Remove transient key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
