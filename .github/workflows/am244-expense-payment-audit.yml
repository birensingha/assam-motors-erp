name: AM244 Expense Against Reference READONLY Audit
on:
  push:
    branches: [feature/am244-lubricash-expense-payment-link]
    paths: ['.github/workflows/am244-expense-payment-audit.yml','deployment/live-fixes/AM244_EXPENSE_PAYMENT/audit_ui.py']
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile deployment/live-fixes/AM244_EXPENSE_PAYMENT/audit.py deployment/live-fixes/AM244_EXPENSE_PAYMENT/audit_ui.py
      - name: SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Read current payment code and requested outstanding expense
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM244_EXPENSE_PAYMENT"'
          "${SCP[@]}" deployment/live-fixes/AM244_EXPENSE_PAYMENT/audit.py "$REMOTE:~/AM244_EXPENSE_PAYMENT/audit.py"
          "${SCP[@]}" deployment/live-fixes/AM244_EXPENSE_PAYMENT/audit_ui.py "$REMOTE:~/AM244_EXPENSE_PAYMENT/audit_ui.py"
          "${SSH[@]}" "$REMOTE" "python3 ~/AM244_EXPENSE_PAYMENT/audit.py '$ROOT'" | tee "$RUNNER_TEMP/am244-audit.log"
          grep -q AM244_READONLY_DONE "$RUNNER_TEMP/am244-audit.log"
          "${SSH[@]}" "$REMOTE" "python3 ~/AM244_EXPENSE_PAYMENT/audit_ui.py '$ROOT'" | tee "$RUNNER_TEMP/am244-ui.log"
          grep -q AM244_UI_AUDIT_PASS "$RUNNER_TEMP/am244-ui.log"
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
