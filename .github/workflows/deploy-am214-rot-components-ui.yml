name: AM214 ROT Remove Refit Components UI STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-am214-rot-components-ui.yml'
      - 'deployment/live-fixes/AM214_ROT_COMPONENTS_REMOVE_REFIT_UI/install.py'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate AM214 installer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM214_ROT_COMPONENTS_REMOVE_REFIT_UI/install.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('deployment/live-fixes/AM214_ROT_COMPONENTS_REMOVE_REFIT_UI/install.py').read_text()
          for token in ['AM214_ROT_COMPONENTS_REMOVE_REFIT_UI','Parts / Components to Remove &amp; Refit','name="work_procedure"','Not printed on Estimate / Invoice.','AM214_EXISTING_WORK_PROCEDURE_VALUES_PRESERVED']:
              assert token in s, token
          print('AM214_REPO_PREFLIGHT_PASS')
          PY

      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3 4; do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi

      - name: Guarded deploy to STAGING
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM214_ROT_COMPONENTS_REMOVE_REFIT_UI"'
          "${SCP[@]}" deployment/live-fixes/AM214_ROT_COMPONENTS_REMOVE_REFIT_UI/install.py "$REMOTE:~/AM214_ROT_COMPONENTS_REMOVE_REFIT_UI/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          cd "$APP"
          test -f artisan
          PATCH="$HOME/AM214_ROT_COMPONENTS_REMOVE_REFIT_UI/install.py"
          python3 "$PATCH" check "$APP"
          python3 "$PATCH" apply "$APP"
          grep -Fq 'AM214_ROT_COMPONENTS_REMOVE_REFIT_UI' resources/views/admin/native/labour.blade.php
          grep -Fq 'Parts / Components to Remove &amp; Refit' resources/views/admin/native/labour.blade.php
          test "$(grep -o 'name=\"work_procedure\"' resources/views/admin/native/labour.blade.php | wc -l | tr -d ' ')" = "2"
          php artisan view:clear >/dev/null
          php artisan view:cache >/dev/null
          status="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' https://staging.assammotors.com/erp/login)"
          echo "AM214_STAGING_LOGIN_HTTP=$status"
          test "$status" = "200"
          echo AM214_STAGING_DEPLOY_SUCCESS
          REMOTE

      - name: Erase ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
