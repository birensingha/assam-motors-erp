name: Diagnose Attendance Reset Permission
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-attendance-reset-403.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Open staging SSH read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/diagnose
            chmod 600 ~/.ssh/diagnose
            CMD=(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -i ~/.ssh/diagnose -p "$SSH_PORT")
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASSWORD"
            CMD=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -p "$SSH_PORT")
          fi
          "${CMD[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          echo "== ATTENDANCE RESET ROUTE =="
          php artisan route:list --json | python3 -c 'import json,sys; rows=json.load(sys.stdin); [print(x.get("method"),x.get("uri"),x.get("action"),x.get("middleware")) for x in rows if "attendance" in x.get("uri","") and "reset" in x.get("uri","")]'
          echo "== EXACT 403 TEXT REFERENCES =="
          grep -RIn --include='*.php' -F 'Admin/Supervisor permission required.' app routes | head -50 || true
          echo "== RESET METHODS =="
          grep -RIn --include='*.php' -E 'function reset\(|attendance.*reset|function admin\(' app/Http/Controllers/Web routes | head -90 || true
          echo "== GUARD / ROLE CLASS REFERENCES =="
          grep -RIn --include='*.php' -E '(isAdmin|isSupervisor|isStaff|hasPermission|class .*Middleware)' app/Http/Controllers/Web app/Http/Middleware app/Models | head -85 || true
          echo "== FULL SMALL MODEL AND ADMIN MIDDLEWARE =="
          sed -n '1,125p' app/Models/ErpAuthUser.php
          sed -n '1,125p' app/Http/Middleware/EnsureErpAdmin.php
          echo "== WEB ADMIN LOGIN AND STAFF LOGIN =="
          sed -n '1,135p' app/Http/Controllers/Web/WebAuthController.php | grep -vEi '(password|secret|token)'
          sed -n '1,118p' app/Http/Controllers/Web/StaffWebAuthController.php | grep -vEi '(password|secret|token)'
          echo "== RESET CONTROLLER FILE METHOD CONTEXT =="
          grep -nF -e 'function resetAttendance' -e 'function admin(' -e 'function attendance(' app/Http/Controllers/Web/AdminNativeModuleController.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/Http/Controllers/Web/AdminNativeModuleController.php')
          rows=p.read_text().splitlines()
          marks=[i for i,l in enumerate(rows) if 'function resetAttendance' in l or 'private function admin(' in l]
          for i in marks:
            print('CONTROLLER_LINES',i+1)
            for j in range(max(0,i-6),min(len(rows),i+90)):
              if j>i+5 and 'function ' in rows[j] and rows[j].lstrip().startswith(('public','private','protected')):break
              v=rows[j]
              if 'password' not in v.lower() and 'secret' not in v.lower() and 'token' not in v.lower():print(str(j+1)+': '+v[:195])
          PY
          echo "== RELEVANT WEB ROUTE GROUPS AND LOGIN ROUTES =="
          sed -n '1,100p' routes/web.php | grep -vEi '(password|secret|token)'
          sed -n '170,250p' routes/web.php | grep -vEi '(password|secret|token)'
          echo "== SESSION AUTH CONFIG SOURCE =="
          grep -nE '(providers|guards|driver|model)' config/auth.php | head -75
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/diagnose
