name: FIX64 JC34 Financial Pre-UAT Read Only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-fix64-jc34-preuat-readonly.yml'
permissions: {contents: read}
concurrency:
  group: assam-motors-staging-readonly-jc34
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight syntax
        run: |
          php -l deployment/live-fixes/FIX64_JC34_PREUAT_READONLY/preflight.php
          grep -q 'START TRANSACTION READ ONLY' deployment/live-fixes/FIX64_JC34_PREUAT_READONLY/preflight.php
      - name: Configure SSH with one retry
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          install -d -m 700 ~/.ssh
          if ! ssh-keyscan -T 18 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then
            sleep 3
            ssh-keyscan -T 18 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -y -qq sshpass;fi
      - name: Read-only JC34 finance details; never post
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX64_JC34_PREUAT_READONLY"'
          "${SCP[@]}" deployment/live-fixes/FIX64_JC34_PREUAT_READONLY/preflight.php "$REMOTE:~/FIX64_JC34_PREUAT_READONLY/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test -f "$ROOT/artisan" && test -d "$ROOT/vendor"
          php -l "$HOME/FIX64_JC34_PREUAT_READONLY/preflight.php"
          php "$HOME/FIX64_JC34_PREUAT_READONLY/preflight.php" "$ROOT"
          REMOTE
      - name: Clear ephemeral key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
