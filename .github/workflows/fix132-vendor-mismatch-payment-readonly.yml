name: FIX132 Vendor Summary and Payment UI - READ ONLY
on:
  push:
    branches: [audit/fix132-vendor-balance-multipayment-20261025]
    paths: ['.github/workflows/fix132-vendor-mismatch-payment-readonly.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Audit vendor master mismatch and multi-bill payment architecture, read only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX132_AUDIT_BEGIN'
          echo '=== RELEVANT FILE HASH ==='
          sha256sum app/Services/VendorService.php resources/views/vendors/index.blade.php resources/views/payments/create.blade.php public/js/payment-voucher.js app/Services/ExpensePaymentService.php
          echo '=== VENDOR MASTER SUMMARY SOURCES ==='
          grep -RniE 'Purchase life totals|Vendor payments|purchase.*total|payment.*total|outstanding|vendor.*summary' resources/views/vendors app/Services/VendorService.php app/Http/Controllers/Web/AdminVendorPageController.php | head -n 120 || true
          echo '=== VENDOR SERVICE INTRO THROUGH LEDGER ==='
          nl -ba app/Services/VendorService.php | sed -n '1,98p'
          echo '=== VENDOR LIST VIEW ==='
          sed -n '1,165p' resources/views/vendors/index.blade.php
          echo '=== PAYMENT VOUCHER JS ==='
          sed -n '1,250p' public/js/payment-voucher.js
          echo '=== MONEY RECEIPT TEMPLATE SOURCES ==='
          find resources/views -maxdepth 5 -type f -iname '*receipt*' | head -n 28
          echo '=== PAYMENT TABLE / AUDIT TABLE COLUMNS ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';$app=require 'bootstrap/app.php';$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::class;$schema=\Illuminate\Support\Facades\Schema::class;
          foreach(['workshop_payment_vouchers','workshop_vendor_payments','workshop_purchase_batches','workshop_purchases','workshop_vendors','payment_allocations','workshop_payment_allocations','payment_voucher_audits','vendor_payment_audit_logs'] as $t)if($schema::hasTable($t))echo "TABLE=$t COLUMNS=".implode(',',$schema::getColumnListing($t))."\n";
          $v=5;
          echo 'VENDOR_5_ALL_PURCHASE_LINE_SUM='.$db::table('workshop_purchases')->where('vendor_id',$v)->sum('total_amount')."\n";
          echo 'VENDOR_5_ACTIVE_PURCHASE_LINE_SUM='.$db::table('workshop_purchases')->where('vendor_id',$v)->whereRaw("COALESCE(record_status,'ACTIVE') <> 'DELETED'")->sum('total_amount')."\n";
          echo 'VENDOR_5_LEGACY_PAYMENTS_ALL='.$db::table('workshop_vendor_payments')->where('vendor_id',$v)->sum('amount')."\n";
          echo 'VENDOR_5_LEGACY_PAYMENTS_ACTIVE='.$db::table('workshop_vendor_payments')->where('vendor_id',$v)->where('record_status','<>','DELETED')->sum('amount')."\n";
          echo 'VENDOR_5_UNIFIED_PAYMENTS_ACTIVE='.$db::table('workshop_payment_vouchers')->where('vendor_id',$v)->where('record_status','ACTIVE')->sum('amount')."\n";
          echo 'FIX132_READ_ONLY_DB_COMPLETE';
          PHP
          echo 'FIX132_AUDIT_COMPLETE_NO_WRITES'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
