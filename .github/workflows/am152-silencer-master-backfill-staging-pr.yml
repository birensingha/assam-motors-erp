name: AM152 Existing SILENCER WELDING OSL Master STAGING
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-catalog-only, cancel-in-progress: false}
jobs:
  master:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/am143-osl-jc-master-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi;sleep 3;done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Exact historical JC service catalog only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=12)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=12);fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          echo AM152_SQL_EXACT_SCOPE_STAGING_JC42
          php -d display_errors=1 -d log_errors=0 <<'PHP'
          <?php
          error_reporting(E_ALL);
          try {
              require 'vendor/autoload.php';
              $app=require 'bootstrap/app.php';
              $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $line=\Illuminate\Support\Facades\DB::table('job_card_labour')
                  ->where('job_card_id',42)->where('id',91)
                  ->whereRaw("UPPER(TRIM(COALESCE(mechanic_name,'')))='OSL'")->first();
              echo 'AM152_LINE_EXISTS='.($line?'YES':'NO').PHP_EOL;
              if(!$line)exit(0);
              $name=mb_strtoupper(trim((string)$line->description));
              echo 'AM152_SERVICE_NAME='.$name.PHP_EOL;
              if($name!=='SILENCER WELDING')exit(0);
              $result=\Illuminate\Support\Facades\DB::transaction(function(){
                  $existing=\Illuminate\Support\Facades\DB::table('workshop_osl_master')
                     ->whereRaw('LOWER(TRIM(osl_name))=?',['silencer welding'])->lockForUpdate()->first();
                  if($existing)return (int)$existing->id;
                  $code='OSL-Q-'.strtoupper(substr(str_replace('-','',(string)\Illuminate\Support\Str::uuid()),0,14));
                  return (int)\Illuminate\Support\Facades\DB::table('workshop_osl_master')->insertGetId([
                      'osl_code'=>$code,'osl_name'=>'SILENCER WELDING',
                      'category'=>'OUTSIDE LABOUR','default_cost'=>0,
                      'gst_percent'=>0,'active'=>1,
                      'created_at'=>now(),'updated_at'=>now(),
                  ]);
              },3);
              echo 'AM152_SILENCER_WELDING_MASTER_ID='.$result.PHP_EOL;
              echo 'AM152_STAGING_CATALOG_ONLY_DONE'.PHP_EOL;
          } catch (\Throwable $e) {
              echo 'AM152_ERROR_CLASS='.get_class($e).PHP_EOL;
              echo 'AM152_ERROR_MESSAGE='.mb_substr($e->getMessage(),0,350).PHP_EOL;
              exit(1);
          }
          PHP
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519