name: FIX96 Single Row Labour and Searchable ROT Select STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fix96-inline-labour-row.yml'
      - 'deployment/live-fixes/FIX96_INLINE_LABOUR_ROW/apply.py'
      - 'deployment/live-fixes/FIX96_INLINE_LABOUR_ROW/render.php'
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch and browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/FIX96_INLINE_LABOUR_ROW/apply.py
          php -l deployment/live-fixes/FIX96_INLINE_LABOUR_ROW/render.php
          python3 - <<'PY'
          from pathlib import Path
          import ast,re
          source=Path('deployment/live-fixes/FIX96_INLINE_LABOUR_ROW/apply.py').read_text()
          tree=ast.parse(source)
          snippets=[n.value.value for n in ast.walk(tree) if isinstance(n,ast.Assign)
            and any(isinstance(t,ast.Name) and t.id=='ui' for t in n.targets)
            and isinstance(n.value,ast.Constant) and isinstance(n.value.value,str)]
          assert len(snippets)==1
          scripts=re.findall(r'<script>(.*?)</script>',snippets[0],re.S)
          assert len(scripts)==1
          for token in ['am96-visible-search','am96-options-popup','searchBridge',
                        "native.dispatchEvent(new Event('change'","form.addEventListener('reset'",
                        "grid-template-columns:minmax(190px,2.5fr)"]:
            assert token in snippets[0],token
          assert "route('erp.job-cards.labour.direct',$job->id)" in source
          assert 'id="am82-rot-select"' in source
          Path('/tmp/fix96.js').write_text(scripts[0],encoding='utf8')
          print('FIX96_SINGLE_COMBO_SELECT_JS_SOURCE_CHECK_PASS')
          PY
          node --check /tmp/fix96.js
      - name: Configure remote SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for attempt in 1 2 3 4; do
            if ssh-keyscan -T 14 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Backup deploy and verify with auto rollback
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ]; then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX96_INLINE_LABOUR_ROW"'
          "${SCP[@]}" deployment/live-fixes/FIX96_INLINE_LABOUR_ROW/apply.py deployment/live-fixes/FIX96_INLINE_LABOUR_ROW/render.php "$REMOTE:~/FIX96_INLINE_LABOUR_ROW/"
          "${SSH[@]}" "$REMOTE" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"; cd "$APP"; test -f artisan && test -d vendor
          PATCH="$HOME/FIX96_INLINE_LABOUR_ROW"
          python3 "$PATCH/apply.py" check "$APP"
          # Compile proposed source BEFORE touching the live Blade file.
          TMPB="$(mktemp "$APP/storage/app/.fix96_proposed_XXXXXX.blade.php")"
          TMPC="$(mktemp "$APP/storage/app/.fix96_compiled_XXXXXX.php")"
          FIX96_PREVIEW_PATH="$TMPB" python3 "$PATCH/apply.py" check "$APP"
          php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            file_put_contents($argv[2],\Illuminate\Support\Facades\Blade::compileString(file_get_contents($argv[1])));
          ' "$TMPB" "$TMPC"
          set +e
          PHP_LINT="$(php -d display_errors=1 -d log_errors=0 -l "$TMPC" 2>&1)"
          LINT_CODE=$?
          set -e
          if [ "$LINT_CODE" -ne 0 ]; then
            echo FIX96_COMPILED_BLADE_SYNTAX_FAIL
            printf '%s\n' "$PHP_LINT"
            echo FIX96_FOREACH_STACK_DEBUG
            grep -nE '__currentLoopData|__empty_|foreach|endforeach' "$TMPC" | head -75 | cut -c1-340 || true
            LINE="$(printf '%s\n' "$PHP_LINT" | sed -n 's/.*on line \([0-9][0-9]*\).*/\1/p' | tail -1)"
            if [ -n "$LINE" ]; then
              A=$((LINE>18?LINE-18:1))
              B=$((LINE+18))
              sed -n "${A},${B}p" "$TMPC" | head -n 40 | cut -c1-320
            fi
            rm -f "$TMPB" "$TMPC"
            exit 1
          fi
          rm -f "$TMPB" "$TMPC"
          echo FIX96_PROPOSED_BLADE_COMPILES_CLEAN
          BACKUP="storage/app/FIX96_LABOUR_ROW_BACKUP_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP"; chmod 700 "$BACKUP"
          cp -p resources/views/job-cards/show.blade.php "$BACKUP/show.blade.php"
          rollback(){
            echo FIX96_ROLLBACK_BEGIN
            cp -p "$BACKUP/show.blade.php" resources/views/job-cards/show.blade.php
            php artisan view:clear >/dev/null 2>&1 || true
            php artisan view:cache >/dev/null 2>&1 || true
          }
          trap rollback ERR
          python3 "$PATCH/apply.py" apply "$APP"
          php artisan view:clear
          php artisan view:cache
          php "$PATCH/render.php" "$APP"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('resources/views/job-cards/show.blade.php').read_text(errors='replace')
          for token in ('id="FIX96_SINGLE_ROW_LABOUR_COMBO"',
                        'id="am82-rot-select"',
                        'id="am82-rot-search"',
                        'am96-visible-search','am96-options-popup',
                        'am96-arrow','am96-shell',
                        'grid-template-columns:minmax(190px,2.5fr)',
                        'id="am82-new-std"','id="am82-add-labour-total"',
                        'id="am90-labour-billing"',
                        'id="am91-add-osl"',
                        'class="jc-entry-form"',
                        'id="FIX95_ROT_ONE_ROW_NO_BILLING_BOX"',
                        'id="FIX94_COMPACT_MECHANIC_ROT_CARD"',
                        'id="FIX93_OSL_MODAL_TOOLS"',
                        "route('erp.job-cards.labour.direct',$job->id)",
                        "route('erp.rot.complete'"):
            assert token in s,token
          for bad in ['ONE WORKSPACE · Approved Estimate',
                      'ROT / Labour Search → Mechanic → Start',
                      'Approved Estimate se transferred ROTs niche hain.',
                      'Search ROT by name/code<input']:
            assert bad not in s,bad
          assert s.count('id="FIX96_SINGLE_ROW_LABOUR_COMBO"')==1
          assert s.count('id="am82-rot-select"')==1
          assert s.count('id="am82-rot-search"')==1
          print('FIX96_COMPACT_SINGLE_ROW_AND_ORIGINAL_ROT_OSL_AJAX_PRESERVED_PASS')
          PY
          for path in /erp/login /staff/login; do
            status="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$path")"
            echo "FIX96_HEALTH_$path=$status"
            test "$status" = 200
          done
          trap - ERR
          echo "FIX96_STAGING_DEPLOY_SUCCESS BACKUP=$BACKUP VIEW_ONLY_NO_FINANCIAL_OR_ROT_WRITES"
          REMOTE
      - name: Cleanup SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
