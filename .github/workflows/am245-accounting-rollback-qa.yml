name: AM245 Staff Multi Expense Accounting ROLLBACK-ONLY QA
on:
  push:
    branches: [feature/am245-staff-multi-expense-payment]
    paths: ['.github/workflows/am245-accounting-rollback-qa.yml']
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  rollback-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint isolated QA script
        run: php -l deployment/live-fixes/AM245_STAFF_MULTI_EXPENSE/qa/rollback-accounting.php
      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Test financial POST + partial + VOID inside forced InnoDB rollback
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM245_QA"'
          "${SCP[@]}" deployment/live-fixes/AM245_STAFF_MULTI_EXPENSE/qa/rollback-accounting.php "$REMOTE:~/AM245_QA/rollback-accounting.php"
          "${SSH[@]}" "$REMOTE" "test -f '$ROOT/app/Services/StaffMultiExpensePaymentService.php' && php -l ~/AM245_QA/rollback-accounting.php && php ~/AM245_QA/rollback-accounting.php '$ROOT'" | tee "$RUNNER_TEMP/am245-rollback-accounting.log"
          grep -q AM245_POST_AND_PARTIAL_ALLOCATION_TEST_PASS_ROLLBACK_PENDING "$RUNNER_TEMP/am245-rollback-accounting.log"
          grep -q AM245_VOID_RESTORES_TWO_BALANCES_PASS_ROLLBACK_PENDING "$RUNNER_TEMP/am245-rollback-accounting.log"
          grep -q AM245_ACCOUNTING_TRANSACTION_ROLLBACK_FINISHED_NO_COMMITTED_ROWS "$RUNNER_TEMP/am245-rollback-accounting.log"
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
