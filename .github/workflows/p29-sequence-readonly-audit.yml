name: Assam Motors P29 Inspection Staff Visibility Lifecycle and Invoice Audit
on:
  push:
    branches: [feature/p29-inspection-any-staff-lifecycle-counter-invoice-20261014]
    paths: [.github/workflows/p29-sequence-readonly-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only auth mapping, routes and attendance source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          test -f "$ROOT/artisan"
          cd "$ROOT"
          echo '=== P29 MANAGER INSPECTION CONTROLLER RESTRICTIONS ==='
          grep -n -C 5 -E 'managerStaff|role|whereRaw|function (assign|complete|index)' app/Http/Controllers/Web/ManagerInspectionWorkController.php | head -n 155 || true
          echo '=== P29 STAFF PORTAL INSPECTION SOURCES ==='
          grep -RnlE 'function (inspectionWork|inspectionReport|inspectionSave|inspectionSubmit|inspections)' app/Http/Controllers/Web app/Http/Controllers/Api/V1 | head -n 45 || true
          grep -RniE -C 3 'inspection|assigned_staff_id|technician_id' app/Http/Controllers/Web/StaffPortalController.php | head -n 165 || true
          sed -n '1,190p' resources/views/staff/inspection-work.blade.php
          echo '=== P29 STAFF EXTRA API INSPECTION ==='
          grep -n -A 155 -B 3 'public function inspections(' app/Http/Controllers/Api/V1/StaffExtraController.php | head -n 168
          echo '=== P29 STAGE UI SOURCE AND ROUTES ==='
          grep -n -C 4 'Workshop Lifecycle & Billing' resources/views/job-cards/lifecycle-panel.blade.php || true
          grep -n -C 3 'erp.job-cards.lifecycle.work-complete' resources/views/job-cards/lifecycle-panel.blade.php routes/web.php || true
          echo '=== P29 INVOICE/POS CURRENT ROUTES ==='
          php artisan route:list --json | php -r '$a=json_decode(stream_get_contents(STDIN),true);foreach($a as $x)if(preg_match("/invoice|counter|pos|sale/i",($x["uri"]??"")." ".($x["name"]??"")))echo ($x["method"]??"")." ".($x["uri"]??"")." ".($x["name"]??"").PHP_EOL;' | head -n 125
          echo '=== P29 INVOICE RELATED DB SCHEMA, NO ROWS ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php'; $app=require 'bootstrap/app.php'; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $schema=\Illuminate\Support\Facades\Schema::class;
          foreach(['invoices','invoice_lines','invoice_items','customer_ledger','parts','parts_master','part_stock','stock_movements','inventory_movements','job_card_inspection_assignments','staff','erp_auth_users'] as $t){
           echo 'TABLE_'.$t.'='.(int)$schema::hasTable($t).PHP_EOL;
           if($schema::hasTable($t))echo 'COLUMNS_'.$t.'='.implode(',',$schema::getColumnListing($t)).PHP_EOL;
          }
          PHP
          echo 'P29_READONLY_SYSTEM_AUDIT_PASS'
          REMOTE
      - if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
