name: AM244 Staff Expense Against Reference STAGING guarded
on:
  push:
    branches: [feature/am244-lubricash-expense-payment-link]
    paths: ['.github/workflows/am244-staff-expense-staging.yml','deployment/live-fixes/AM244_EXPENSE_PAYMENT/apply.py','deployment/live-fixes/AM244_EXPENSE_PAYMENT/qa/browser-test.mjs']
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.assammotors.com' }}
      STAGING_LOGIN_PATH: ${{ vars.STAGING_LOGIN_PATH || '/erp/login' }}
      STAGING_ADMIN_LOGIN: ${{ secrets.STAGING_ADMIN_LOGIN }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      SMOKE_OUTPUT_DIR: am244-browser-proof
    steps:
      - uses: actions/checkout@v4
      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM244_EXPENSE_PAYMENT/apply.py
          node --check deployment/live-fixes/AM244_EXPENSE_PAYMENT/qa/browser-test.mjs
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Guarded UI fix + backup + Blade compilation
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM244_EXPENSE_PAYMENT"'
          "${SCP[@]}" deployment/live-fixes/AM244_EXPENSE_PAYMENT/apply.py "$REMOTE:~/AM244_EXPENSE_PAYMENT/apply.py"
          CHECK=$("${SSH[@]}" "$REMOTE" "python3 ~/AM244_EXPENSE_PAYMENT/apply.py check '$ROOT'")
          printf '%s\n' "$CHECK"
          grep -q AM244_PREFLIGHT_PASS <<<"$CHECK"
          RESULT=$("${SSH[@]}" "$REMOTE" "python3 ~/AM244_EXPENSE_PAYMENT/apply.py apply '$ROOT'")
          printf '%s\n' "$RESULT"
          grep -q AM244_APPLIED <<<"$RESULT"
          BACKUP=$(printf '%s\n' "$RESULT" | sed -n 's/^AM244_BACKUP=//p' | tail -1)
          test -n "$BACKUP"
          echo "AM244_BACKUP_PATH=$BACKUP" >> "$GITHUB_ENV"
          "${SSH[@]}" "$REMOTE" "cd '$ROOT' && php artisan view:clear && php artisan view:cache" | tee "$RUNNER_TEMP/am244-view.log"
          echo AM244_STAGING_BLADE_COMPILE_PASS
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Staff expense Against Reference browser QA - no financial posting
        run: node deployment/live-fixes/AM244_EXPENSE_PAYMENT/qa/browser-test.mjs
      - name: Rollback changed UI files if QA fails
        if: failure() && env.AM244_BACKUP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT");fi
          "${SSH[@]}" "$REMOTE" "python3 ~/AM244_EXPENSE_PAYMENT/apply.py rollback '$ROOT' '$AM244_BACKUP_PATH' && cd '$ROOT' && php artisan view:clear"
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am244-staff-expense-against-reference-proof
          path: am244-browser-proof/
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
