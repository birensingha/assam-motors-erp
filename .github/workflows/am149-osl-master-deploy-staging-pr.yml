name: AM149 OSL Master JC Purchase STAGING Deploy
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/am143-osl-jc-master-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch package
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM146_OSL_MASTER_LINK/apply.py
          php -l deployment/live-fixes/AM146_OSL_MASTER_LINK/AdminOslQuickMasterController.php
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          for i in 1 2 3 4;do
            if ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: STAGING guarded apply and route checks
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -p "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=12)
            SCP=(scp -P "$PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=12)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT" -o ConnectTimeout=12)
            SCP=(sshpass -e scp -P "$PORT" -o ConnectTimeout=12)
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p ~/AM146_OSL_MASTER_LINK'
          "${SCP[@]}" deployment/live-fixes/AM146_OSL_MASTER_LINK/apply.py deployment/live-fixes/AM146_OSL_MASTER_LINK/AdminOslQuickMasterController.php "$REMOTE:~/AM146_OSL_MASTER_LINK/"
          "${SSH[@]}" "$REMOTE" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$APP"
          PATCH="$HOME/AM146_OSL_MASTER_LINK/apply.py"
          echo AM149_BEFORE_STAGING_DEPLOY
          python3 "$PATCH" check "$APP"
          TMP="$(mktemp -d "$APP/storage/app/am149_preview_XXXXXXXX")"
          trap 'rm -rf "$TMP"' EXIT
          AM146_PREVIEW_DIR="$TMP" python3 "$PATCH" check "$APP"
          for file in app/Http/Controllers/Web/AdminOslQuickMasterController.php app/Http/Controllers/Web/AdminPurchasePageController.php app/Http/Controllers/Web/AdminJobCardOslLineController.php app/Services/PurchaseService.php routes/web.php;do
            php -l "$TMP/$file"
          done
          for name in job-cards/show purchases/osl-create;do
            php -r '
              require "vendor/autoload.php";$a=require "bootstrap/app.php";
              $a->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              file_put_contents($argv[2],\Illuminate\Support\Facades\Blade::compileString(file_get_contents($argv[1])));
            ' "$TMP/resources/views/$name.blade.php" "$TMP/$(basename "$name")-compiled.php"
            php -l "$TMP/$(basename "$name")-compiled.php"
          done
          out="$(python3 "$PATCH" apply "$APP")"
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -Fxq AM146_ALREADY_INSTALLED;then
            echo AM149_NOOP_INSTALLED;exit 0
          fi
          BACKUP="$(printf '%s\n' "$out" | sed -n 's/^AM146_APPLIED_BACKUP=//p')"
          test -n "$BACKUP"
          test -f "$BACKUP/routes/web.php"
          rollback(){
            echo AM149_STAGING_ROLLBACK_SOURCE
            for file in routes/web.php resources/views/job-cards/show.blade.php resources/views/purchases/osl-create.blade.php app/Http/Controllers/Web/AdminPurchasePageController.php app/Http/Controllers/Web/AdminJobCardOslLineController.php app/Services/PurchaseService.php;do
              cp -p "$BACKUP/$file" "$APP/$file"
            done
            rm -f app/Http/Controllers/Web/AdminOslQuickMasterController.php
            php artisan view:clear >/dev/null 2>&1 || true
            php artisan route:clear >/dev/null 2>&1 || true
          }
          trap rollback ERR
          php artisan view:clear
          php artisan route:clear
          php artisan route:list | grep -F 'erp.osl-masters.quick-create'
          php artisan route:list | grep -F 'erp.job-cards.osl.admin-delete'
          php artisan route:list | grep -F 'erp.purchases.osl.store'
          grep -Fq AM146_OSL_MASTER resources/views/job-cards/show.blade.php
          grep -Fq AM146_OSL_MASTER resources/views/purchases/osl-create.blade.php
          grep -Fq AM146_OSL_MASTER app/Services/PurchaseService.php
          for url in /erp/login /staff/login;do
            code="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "https://staging.assammotors.com$url")"
            echo "AM149_HEALTH $url $code"
            test "$code" = 200
          done
          trap - ERR
          echo "AM149_STAGING_INSTALL_PASS BACKUP=$BACKUP NO_FINANCIAL_DB_WRITES"
          REMOTE
      - name: Remove SSH credential
        if: always()
        run: rm -f ~/.ssh/id_ed25519