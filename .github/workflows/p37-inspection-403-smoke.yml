name: P37 Authenticated Inspection Report and Assignment Smoke
on:
  push:
    branches:
      - feature/p31-direct-counter-parts-invoice-20261014
    paths:
      - 'deployment/live-fixes/P37_INSPECTION_403/**'
      - '.github/workflows/p37-inspection-403-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      APP_ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          fi
      - name: Verify assigned staff inspection report and work GET on staging
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" bash -s -- "$APP_ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test -f "$ROOT/artisan"
          cd "$HOME/assam-motors-deploy"
          git fetch origin feature/p31-direct-counter-parts-invoice-20261014
          git show origin/feature/p31-direct-counter-parts-invoice-20261014:deployment/live-fixes/P37_INSPECTION_403/SMOKE_P37.php > /tmp/assam-p37-smoke.php
          php -l /tmp/assam-p37-smoke.php
          php /tmp/assam-p37-smoke.php "$ROOT"
          rm -f /tmp/assam-p37-smoke.php
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
