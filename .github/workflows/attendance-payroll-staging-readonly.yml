name: Inspect Staging Attendance Payroll Schema (Read-only)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/attendance-payroll-staging-readonly.yml']
  push:
    branches: [feature/attendance-payroll-report-20261123]
    paths: ['.github/workflows/attendance-payroll-staging-readonly.yml']
permissions:
  contents: read
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  read-only-inspection:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/attendance-payroll-report-20261123')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Read source paths and metadata only (no writes)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/staging-readonly
            chmod 600 ~/.ssh/staging-readonly
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -i ~/.ssh/staging-readonly -p "$PORT")
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq >/dev/null
            sudo apt-get install -y -qq sshpass >/dev/null
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          if [ ! -f "$ROOT/artisan" ]; then
            echo 'STAGING_LARAVEL_ROOT_NOT_FOUND'
            exit 0
          fi
          cd "$ROOT"
          echo 'STAGING_LARAVEL_ROOT_FOUND'

          echo '=== ATTENDANCE ROUTE SOURCE (SELECTED LINES ONLY) ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('routes/web.php').read_text(errors='replace').splitlines()
          for i,line in enumerate(lines,1):
              if "erp.attendance" in line and ('Route::' in line or '->name(' in line):
                  print(f'ATTENDANCE_ROUTE_LINE={i}: {line.strip()[:260]}')
          p=Path('app/Http/Controllers/Web/AdminNativeModuleController.php')
          if p.exists():
              source=p.read_text(errors='replace')
              match=re.search(r'function\\s+attendance\\s*\\(',source)
              if match:
                  head=source[:match.start()].count('\\n')+1
                  segment=source[match.start():match.start()+25000]
                  next_method=re.search(r'\\n\\s*(?:public|protected|private)\\s+function\\s+',segment[100:])
                  if next_method:
                      segment=segment[:next_method.start()+100]
                  print('ATTENDANCE_METHOD_LINE='+str(head))
                  for v in re.findall(r'view\\s*\\(\\s*["\\x27]([^"\\x27]+)',segment):
                      print('ATTENDANCE_VIEW_REFERENCE='+v)
          PY

          echo '=== RELEVANT SOURCE FILE PATHS (NO CONTENT) ==='
          find app/Http/Controllers app/Models -type f \( -iname '*Attend*' -o -iname '*Salary*' -o -iname '*Payroll*' -o -iname '*Hr*' \) -print 2>/dev/null | head -90 || true
          echo '=== RELEVANT ROUTES (NAMES/URIS ONLY) ==='
          timeout 80 php artisan route:list --json 2>/dev/null | php -r '
            $routes = json_decode(stream_get_contents(STDIN), true);
            if (!is_array($routes)) { echo "ROUTE_JSON_UNAVAILABLE\n"; exit; }
            $printed = 0;
            foreach ($routes as $route) {
                $uri = (string)($route["uri"] ?? "");
                $name = (string)($route["name"] ?? "");
                if (preg_match("/attendance|salary|payroll|staff|hr|leave/i", $uri." ".$name)) {
                    echo "ROUTE=".($route["method"] ?? "")." ".$uri." name=".$name." action=".($route["action"] ?? "")."\n";
                    if (++$printed >= 100) break;
                }
            }' || true
          echo '=== RELATED DATABASE TABLE COLUMNS (NO ROWS) ==='
          timeout 90 php -d display_errors=0 <<'PHP'
          <?php
          try {
              require 'vendor/autoload.php';
              $app = require 'bootstrap/app.php';
              $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $tables = \Illuminate\Support\Facades\DB::select('SHOW TABLES');
              $printed = 0;
              foreach ($tables as $table) {
                  $fields = (array) $table;
                  $name = (string) reset($fields);
                  if (!preg_match('/staff|attend|salary|payroll|leave|holiday|advance/i', $name)) continue;
                  echo 'TABLE='.$name.' COLUMNS='.implode(',', \Illuminate\Support\Facades\Schema::getColumnListing($name)).PHP_EOL;
                  if (++$printed >= 70) break;
              }
              $statuses = \\Illuminate\\Support\\Facades\\DB::table('attendance')
                  ->select('status', \\Illuminate\\Support\\Facades\\DB::raw('COUNT(*) AS total'))
                  ->groupBy('status')->get();
              foreach ($statuses as $item) {
                  echo 'ATTENDANCE_STATUS='.(string)($item->status ?? 'NULL').' COUNT='.(int)$item->total.PHP_EOL;
              }

              echo 'DB_SCHEMA_READ_ONLY_OK'.PHP_EOL;
          } catch (\Throwable $e) {
              echo 'DB_SCHEMA_CHECK_FAILED_CLASS='.get_class($e).PHP_EOL;
          }
          PHP
          REMOTE
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/staging-readonly
