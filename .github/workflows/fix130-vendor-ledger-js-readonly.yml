name: FIX130 Vendor Ledger Service and Purchase JS - READ ONLY
on:
  push:
    branches: [audit/fix130-purchase-rounding-ledger-20261025]
    paths: ['.github/workflows/fix130-vendor-ledger-js-readonly.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Inspect vendor ledger rows logic and frontend preview JavaScript read only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX130_LEDGERJS_READONLY_BEGIN'
          echo '=== SOURCE SHA ==='
          sha256sum app/Services/VendorService.php public/js/purchase-entry.js
          echo '=== VENDOR SERVICE LEDGER CORE ==='
          nl -ba app/Services/VendorService.php | sed -n '82,260p'
          echo '=== PURCHASE JS CALC PREVIEW ANCHORS ==='
          grep -nEi -C 6 'roundOff|round_off|apply-roundoff|preview-preround|preview-roundoff|preview-grand|Math.round|recalculate|function calculate|total' public/js/purchase-entry.js | head -n 245 || true
          echo '=== VENDOR EXACT LEDGER ROWS FOR PURCHASE BILL ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $service=$app->make(\App\Services\VendorService::class);
          $data=$service->ledger(5,'2026-10-24','2026-10-26');
          foreach($data['entries']??[] as $r){
           $no=(string)($r['entry_no']??'');
           $desc=(string)($r['description']??'');
           if(str_contains($no,'PB-261025124019-467') || str_contains($desc,'PB-261025124019-467') || ($r['entry_type']??'')==='ROUND_OFF'){
            echo 'ROW_ENTRY='.$no.' TYPE='.($r['entry_type']??''). ' DEBIT='.($r['debit']??0). ' CREDIT='.($r['credit']??0).' BALANCE='.($r['balance']??0).PHP_EOL;
           }
          }
          echo 'FIX130_VENDOR_LEDGER_READ_ONLY_COMPLETE';
          PHP
          echo 'FIX130_LEDGERJS_READONLY_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
