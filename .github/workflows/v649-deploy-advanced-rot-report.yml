name: Deploy Advanced ROT Five Filters, All Reasons and JC Drilldown (Staging)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v649-deploy-advanced-rot-report.yml"
      - "deployment/live-fixes/V649_ADVANCED_ROT_REPORT/**"
permissions: { contents: read }
concurrency:
  group: assam-motors-v649-advanced-rot-report
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/v649-rot-performance-advanced-filters-history'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify new report PHP service and backup-first patch scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n deployment/live-fixes/V649_ADVANCED_ROT_REPORT/APPLY.sh
          php -l deployment/live-fixes/V649_ADVANCED_ROT_REPORT/AdvancedRotPerformanceReportService.php
          test -s deployment/live-fixes/V649_ADVANCED_ROT_REPORT/advanced-rot-report.blade.php
      - name: Deploy advanced read-only ROT report to Staging with backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          install -d -m 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/v649
            chmod 600 ~/.ssh/v649
            SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -i ~/.ssh/v649 -p "$PORT")
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -p "$PORT")
          fi
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          TEMP_DIR="/tmp/v649-rot-clock-${GITHUB_RUN_ID}"
          # Stage authenticated PHP only in the Laravel project folder.
          tar -czf /tmp/v649-clock-bundle.tgz -C deployment/live-fixes/V649_ADVANCED_ROT_REPORT APPLY.sh AdvancedRotPerformanceReportService.php advanced-rot-report.blade.php
          if [ -n "$KEY" ]; then
            SCP=(scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/v649 -P "$PORT")
          else
            SCP=(sshpass -e scp -o StrictHostKeyChecking=accept-new -P "$PORT")
          fi
          "${SCP[@]}" /tmp/v649-clock-bundle.tgz "$USERNAME@$HOST:$TEMP_DIR.tgz"
          "${SSH[@]}" "$USERNAME@$HOST" "mkdir -p '$TEMP_DIR' && tar -xzf '$TEMP_DIR.tgz' -C '$TEMP_DIR' && bash '$TEMP_DIR/APPLY.sh' '/home/u956497103/domains/assammotors.com/assam-erp-staging'; result=\$?; rm -rf '$TEMP_DIR' '$TEMP_DIR.tgz'; exit \$result"
      - name: Verify Staging ERP login still loads
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -L --max-time 25 -o /tmp/v649-login-page -w '%{http_code}' 'https://staging.assammotors.com/erp/login')
          echo "V649_ERP_LOGIN_HTTP=$status"
          test "$status" = 200
      - if: always()
        run: rm -f ~/.ssh/v649 /tmp/v649-clock-bundle.tgz /tmp/v649-login-page
