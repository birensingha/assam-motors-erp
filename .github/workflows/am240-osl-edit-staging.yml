name: AM240 Purchase Register OSL Edit STAGING guarded
on:
  push:
    branches: [feature/am240-osl-purchase-edit]
    paths: ['.github/workflows/am240-osl-edit-staging.yml']
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.assammotors.com' }}
      STAGING_LOGIN_PATH: ${{ vars.STAGING_LOGIN_PATH || '/erp/login' }}
      STAGING_ADMIN_LOGIN: ${{ secrets.STAGING_ADMIN_LOGIN }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      SMOKE_OUTPUT_DIR: am240-browser-proof
    steps:
      - uses: actions/checkout@v4
      - name: Source syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deployment/live-fixes/AM240_OSL_PURCHASE_EDIT/apply.py
          node --check deployment/live-fixes/AM240_OSL_PURCHASE_EDIT/qa/browser-test.mjs
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4;do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Backup and add OSL Edit button to Purchase Register
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM240_OSL_EDIT"'
          "${SCP[@]}" deployment/live-fixes/AM240_OSL_PURCHASE_EDIT/apply.py "$REMOTE:~/AM240_OSL_EDIT/apply.py"
          CHECK=$("${SSH[@]}" "$REMOTE" "python3 ~/AM240_OSL_EDIT/apply.py check '$ROOT'")
          printf '%s\n' "$CHECK"
          grep -q AM240_PREFLIGHT_PASS <<<"$CHECK"
          ROUTES=$("${SSH[@]}" "$REMOTE" "cd '$ROOT' && php artisan route:list --name=erp.fix48.osl-edit")
          printf '%s\n' "$ROUTES"
          grep -q 'workshop-tools/osl' <<<"$ROUTES"
          RESULT=$("${SSH[@]}" "$REMOTE" "python3 ~/AM240_OSL_EDIT/apply.py apply '$ROOT' && cd '$ROOT' && php artisan view:clear")
          printf '%s\n' "$RESULT"
          grep -q AM240_APPLIED <<<"$RESULT"
          BACKUP=$(printf '%s\n' "$RESULT" | sed -n 's/^AM240_BACKUP=//p' | tail -1)
          test -n "$BACKUP"
          echo "AM240_BACKUP_PATH=$BACKUP" >> "$GITHUB_ENV"
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify OSL Edit button opens real OSL editor without saving
        run: node deployment/live-fixes/AM240_OSL_PURCHASE_EDIT/qa/browser-test.mjs
      - name: Rollback Register UI if Chrome QA fails
        if: failure() && env.AM240_BACKUP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT");fi
          "${SSH[@]}" "$REMOTE" "python3 ~/AM240_OSL_EDIT/apply.py rollback '$ROOT' '$AM240_BACKUP_PATH' && cd '$ROOT' && php artisan view:clear"
      - name: Browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am240-osl-purchase-edit-browser-proof
          path: am240-browser-proof/
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
