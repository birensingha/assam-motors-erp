name: Inspect Web Job Card UI Lines
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-web-jobcard-ui-lines.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Job Card Parts Labour UI
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          fi
          ROOT="/home/$SSH_USER/domains/assammotors.com/assam-erp-staging"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "ROOT='$ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$ROOT"
          echo '=== SECTION ORDER ==='
          grep -nE 'Direct Parts|Direct Labour|Parts /|Labour / ROT|jc-parts-block|jc-labour-block|PARTS|LABOUR' resources/views/job-cards/show.blade.php | head -n 200
          echo '=== PARTS BLOCK ==='
          line=$(grep -n "jc-parts-block" resources/views/job-cards/show.blade.php | tail -1 | cut -d: -f1 || true)
          if [ -n "$line" ]; then start=$((line-20)); end=$((line+140)); sed -n "${start},${end}p" resources/views/job-cards/show.blade.php; fi
          echo '=== LABOUR BLOCK ==='
          line=$(grep -n "jc-labour-block" resources/views/job-cards/show.blade.php | tail -1 | cut -d: -f1 || true)
          if [ -n "$line" ]; then start=$((line-20)); end=$((line+180)); sed -n "${start},${end}p" resources/views/job-cards/show.blade.php; fi
          echo '=== EDIT/LOCK METHODS ==='
          grep -nE 'public function (edit|update|updatePart|deletePart|addPartDirect|addLabourDirect)|Locked Job Card|closed.*invoiced.*cancelled' app/Http/Controllers/Web/AdminJobCardPageController.php | head -n 240
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
