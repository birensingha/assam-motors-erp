name: Preflight Restore Approved Staff Location Desktop BLUE V2
on:
  push:
    branches: [fix/restore-desktop-blue-v2-keep-mobile-solo-v3]
    paths: [".github/workflows/dryrun-staff-desktop-v2-restore.yml", "deployment/live-fixes/FIX_STAFF_LIVE_DESKTOP_V2_RESTORE_20261018/**"]
permissions: {contents: read}
concurrency:
  group: assam-motors-staging-control
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint and dry-run desktop BLUE V2 restoration against actual STAGING V3 without changes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/am-gps-diag
            chmod 600 ~/.ssh/am-gps-diag
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=25 -o StrictHostKeyChecking=accept-new -i ~/.ssh/am-gps-diag -p "$PORT")
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=25 -o StrictHostKeyChecking=accept-new -p "$PORT")
          fi
          SRC=deployment/live-fixes/FIX_STAFF_LIVE_DESKTOP_V2_RESTORE_20261018
          python3 -m py_compile "$SRC/apply.py"
          
          "${SSH[@]}" "$USERNAME@$HOST" 'python3 - --root "$HOME/domains/assammotors.com/assam-erp-staging"' < "$SRC/apply.py"
          echo 'DESKTOP_BLUE_V2_STAGING_PREFLIGHT=PASS'
      - if: always()
        run: rm -f ~/.ssh/am-gps-diag
