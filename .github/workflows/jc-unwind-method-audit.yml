name: Assam Motors JC Unwind UI Method Audit
on:
  push:
    branches: [feature/jc-safe-unwind-20261013]
    paths: [.github/workflows/jc-unwind-method-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only routes, finance schema and application source methods
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$APP"
          echo '=== JOB CARD RECALC CURRENT IMPLEMENTATION ==='
          sed -n '782,823p' app/Http/Controllers/Web/AdminJobCardPageController.php
          echo '=== JOB CARD SHOW PART / LABOUR UI ==='
          grep -nE 'Parts &|Parts|Labour|@foreach\(\$parts|@foreach\(\$labour|@forelse\(\$parts|@forelse\(\$labour|parts.delete|issue_status' resources/views/job-cards/show.blade.php | head -125
          echo '=== LIST STATUS SEARCH / FILTER ==='
          sed -n '16,80p' app/Services/JobCardService.php
          echo '=== CANCELLED JOB MARKERS IN STAFF API ==='
          grep -RsnE "status[^=]*cancelled|LOWER\(status\).*cancelled" app/Http/Controllers/Api/V1 2>/dev/null | head -40 || true
          echo 'UNWIND_UI_SOURCE_AUDIT_PASS'
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"