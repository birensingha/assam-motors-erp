name: P32 ERP Navigation Staging Deploy
on:
  push:
    branches:
      - feature/p31-direct-counter-parts-invoice-20261014
    paths:
      - 'deployment/live-fixes/P32_ERP_NAVIGATION/**'
      - '.github/workflows/p32-erp-nav-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assam-motors-p32-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      APP_ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          mkdir -p ~/.ssh
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          fi
      - name: Check apply and verify staging only
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" bash -s -- "$APP_ROOT" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          test -f "$ROOT/artisan"
          DEPLOY="$HOME/assam-motors-deploy"
          test -d "$DEPLOY/.git"
          cd "$DEPLOY"
          git fetch origin feature/p31-direct-counter-parts-invoice-20261014
          SCRIPT="$DEPLOY/deployment/live-fixes/P32_ERP_NAVIGATION/PATCH_P32.php"
          git show origin/feature/p31-direct-counter-parts-invoice-20261014:deployment/live-fixes/P32_ERP_NAVIGATION/PATCH_P32.php > /tmp/assam-p32-nav.php
          php /tmp/assam-p32-nav.php check "$ROOT"
          php /tmp/assam-p32-nav.php apply "$ROOT"
          cd "$ROOT"
          php artisan view:clear
          php /tmp/assam-p32-nav.php check "$ROOT"
          grep -q 'P32_ERP_NAVIGATION' resources/views/layouts/erp.blade.php
          echo "P32_NAVIGATION_INSTALLED_STAGING_PASS"
          rm -f /tmp/assam-p32-nav.php
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
