name: AM254 Item-wise Purchase Return — Runtime & Security QA
on:
  push:
    branches: [feature/am254-itemwise-purchase-return-20261113]
    paths: [.github/workflows/am254-runtime-itemwise-qa.yml]
permissions: {contents: read}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          for retry in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null;then break;fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ];then printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Laravel item search, source provenance, 403, validation rollback — no posted transactions
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ];then SSH=(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$PORT" -i ~/.ssh/id_ed25519)
          else export SSHPASS="$SSH_PASSWORD";SSH=(sshpass -e ssh -o ConnectTimeout=15 -p "$PORT");fi
          "${SSH[@]}" "$USERNAME@$HOST" "bash -s -- '$ROOT'" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          test "$(basename "$APP")" = assam-erp-staging
          cd "$APP"
          QA="$(mktemp --suffix=.php)"
          trap 'rm -f "$QA"' EXIT
          cat > "$QA" <<'PHP'
          <?php
          error_reporting(E_ALL);
          require getcwd().'/vendor/autoload.php';
          $app=require getcwd().'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          \Illuminate\Support\Facades\View::share('errors',new \Illuminate\Support\ViewErrorBag());
          $DB=\Illuminate\Support\Facades\DB::class;
          $user=\App\Models\ErpAuthUser::query()
             ->where('active',1)->whereIn('role',['owner','admin'])->first();
          if(!$user)throw new RuntimeException('AM254_TEST_OWNER_MISSING');
          $controller=app(\App\Http\Controllers\Web\AdminPurchaseReturnItemwiseController::class);
          $req=\Illuminate\Http\Request::create('/erp/purchase-returns/create','GET');
          $req->setUserResolver(static fn()=>$user);
          $html=$controller->create($req)->render();
          if(!str_contains($html,'Item-wise Purchase Return') ||
             !str_contains($html,'am254-search') ||
             !str_contains($html,'purchase-returns'))exit(41);
          echo "AM254_ITEMWISE_ADMIN_FORM_RENDER_PASS\n";
          $source=$DB::table('workshop_purchases')->where('purchase_type','PART')
            ->where('vendor_id','>',0)->whereRaw("COALESCE(record_status,'ACTIVE') <> 'DELETED'")
            ->whereNotNull('part_master_id')->orderByDesc('id')->first();
          if(!$source)throw new RuntimeException('AM254_TEST_SOURCE_MISSING');
          $search=\Illuminate\Http\Request::create('/erp/purchase-returns/search','GET',
             ['q'=>(string)$source->purchase_no]);
          $search->setUserResolver(static fn()=>$user);
          $response=$controller->search($search);
          if($response->getStatusCode()!==200)exit(42);
          $data=json_decode($response->getContent(),true,512,JSON_THROW_ON_ERROR);
          if(!isset($data['items'])||!is_array($data['items']))exit(43);
          $found=null;
          foreach($data['items'] as $item){
            if((int)($item['purchase_id']??0)===(int)$source->id){$found=$item;break;}
          }
          if(!$found)exit(44);
          foreach(['item_name','vendor_name','purchase_bill','supplier_invoice','job_no',
                   'vehicle_no','customer_invoice','remaining_qty','unit_cost','gst_percent'] as $field){
            if(!array_key_exists($field,$found))exit(45);
          }
          echo "AM254_PURCHASE_HISTORY_VENDOR_BILL_JC_SEARCH_PASS\n";
          $guest=\Illuminate\Http\Request::create('/erp/purchase-returns/search','GET',['q'=>'brake']);
          $guest->setUserResolver(static fn()=>null);
          try{$controller->search($guest);exit(46);}
          catch(\Symfony\Component\HttpKernel\Exception\HttpException $e){
            if($e->getStatusCode()!==403)exit(47);
          }
          echo "AM254_UNAUTHORIZED_PURCHASE_SEARCH_403_PASS\n";
          $beforeCount=(int)$DB::table('am_purchase_returns')->count();
          $beforeStock=(float)$DB::table('parts_master')->where('id',$source->part_master_id)->value('stock_qty');
          $submit=\Illuminate\Http\Request::create('/erp/purchase-returns/itemwise','POST',[
              'request_key'=>(string)\Illuminate\Support\Str::uuid(),
              'return_date'=>now('Asia/Kolkata')->format('Y-m-d'),
              'reason'=>'Runtime QA over-quantity deliberate invalid return',
              'supplier_credit_note'=>null,
              'lines'=>[['purchase_id'=>(int)$source->id,
                         'qty'=>max(1000000,(float)$source->qty+1000)]],
          ]);
          $submit->setUserResolver(static fn()=>$user);
          $DB::beginTransaction();
          try{
            $controller->store($submit,app(\App\Http\Controllers\Web\AdminPurchaseReturnController::class));
            throw new RuntimeException('AM254_OVER_RETURN_WRONGLY_ACCEPTED');
          }catch(\Illuminate\Validation\ValidationException $e){
            $messages=collect($e->errors())->flatten()->implode(' ');
            if(!str_contains(strtolower($messages),'quantity') &&
               !str_contains(strtolower($messages),'qty') &&
               !str_contains(strtolower($messages),'return'))
              throw new RuntimeException('AM254_UNRELATED_VALIDATION: '.mb_substr($messages,0,130));
            echo "AM254_OVER_QTY_RETURN_BLOCK_PASS\n";
          }finally{$DB::rollBack();}
          if($beforeCount!==(int)$DB::table('am_purchase_returns')->count() ||
             abs($beforeStock-(float)$DB::table('parts_master')
                  ->where('id',$source->part_master_id)->value('stock_qty'))>0.0001)
             exit(49);
          echo "AM254_REJECTED_ITEMWISE_RETURN_NO_ACCOUNTING_CHANGE_PASS\n";
          echo "AM254_ALL_READONLY_RUNTIME_CHECKS_PASS\n";
          PHP
          RESULT="$(php "$QA" 2>&1)"
          printf '%s\n' "$RESULT"
          for marker in AM254_ITEMWISE_ADMIN_FORM_RENDER_PASS AM254_PURCHASE_HISTORY_VENDOR_BILL_JC_SEARCH_PASS AM254_UNAUTHORIZED_PURCHASE_SEARCH_403_PASS AM254_OVER_QTY_RETURN_BLOCK_PASS AM254_REJECTED_ITEMWISE_RETURN_NO_ACCOUNTING_CHANGE_PASS AM254_ALL_READONLY_RUNTIME_CHECKS_PASS;do
            printf '%s\n' "$RESULT" | grep -Fq "$marker" || { echo "STOP_AM254_QA_MARKER_MISSING_$marker";exit 60; }
          done
          echo AM254_RUNTIME_TEST_JOB_SUCCESS
          REMOTE
      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/id_ed25519
