name: Inspect Web Lifecycle Details

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-web-lifecycle-details.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staging lifecycle details
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          fi
          ROOT="/home/$SSH_USER/domains/assammotors.com/assam-erp-staging"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "ROOT='$ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$ROOT"
          echo '=== WEB JOB CONTROLLER 560-840 ==='
          sed -n '560,840p' app/Http/Controllers/Web/AdminJobCardPageController.php
          echo '=== WEB JOB CONTROLLER 920-1100 ==='
          sed -n '920,1100p' app/Http/Controllers/Web/AdminJobCardPageController.php
          echo '=== JOB CARD SHOW ACTION MARKERS ==='
          grep -nEi -A12 -B8 'workflow|status|complete|close|invoice|quality|ready|delivery|rework|diagnosis|estimate' resources/views/job-cards/show.blade.php | head -n 800 || true
          echo '=== WEB ROUTE SOURCE JOB CARD BLOCK ==='
          grep -nEi -A8 -B4 "job-cards|invoice|billing" routes/web.php | head -n 700 || true
          echo '=== INVOICE FILES ==='
          find app/Http/Controllers/Web app/Models app/Services resources/views -maxdepth 3 -type f \( -iname '*invoice*' -o -iname '*billing*' \) -print | sort
          echo '=== INVOICE RELATED ROUTES ==='
          php artisan route:list | grep -Ei 'invoice|billing|payment|ledger' | head -n 300 || true
          echo '=== INVOICE TABLES / SCHEMA ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=Illuminate\Support\Facades\DB::getDatabaseName();
          $tables=Illuminate\Support\Facades\DB::table('information_schema.tables')
            ->where('table_schema',$db)
            ->where(function($q){
              $q->where('table_name','like','%invoice%')
                ->orWhere('table_name','like','%payment%')
                ->orWhere('table_name','like','%ledger%')
                ->orWhere('table_name','like','%receivable%');
            })->orderBy('table_name')->pluck('table_name');
          foreach($tables as $t){
            echo "TABLE:$t\n";
            foreach(Illuminate\Support\Facades\DB::select("SHOW COLUMNS FROM ".$t) as $c){
              echo " ".$c->Field." ".$c->Type." ".($c->Null==='NO'?'NOTNULL':'NULL')." default=".($c->Default??'NULL')."\n";
            }
          }
          PHP
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
