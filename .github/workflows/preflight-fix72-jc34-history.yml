name: FIX72 JC34 Finance Snapshot Readonly
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preflight-fix72-jc34-history.yml'
      - 'deployment/live-fixes/FIX72_JC34_HISTORIC_INVOICE_CN/preflight.php'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit Python syntax
        run: php -l deployment/live-fixes/FIX72_JC34_HISTORIC_INVOICE_CN/preflight.php
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if ! ssh-keyscan -T 18 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            sleep 3
            ssh-keyscan -T 18 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ];then printf '%s\n' "$KEY" > ~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519
          else test -n "$PASSWORD";sudo apt-get update -qq;sudo apt-get install -qq -y sshpass;fi
      - name: Read-only source inventory
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -p "$PORT")
            SCP=(sshpass -e scp -P "$PORT")
          fi
          REMOTE="$USERNAME@$HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/FIX72_JC34_HISTORIC_INVOICE_CN"'
          "${SCP[@]}" deployment/live-fixes/FIX72_JC34_HISTORIC_INVOICE_CN/preflight.php "$REMOTE:~/FIX72_JC34_HISTORIC_INVOICE_CN/"
          "${SSH[@]}" "$REMOTE" "php ~/FIX72_JC34_HISTORIC_INVOICE_CN/preflight.php '$ROOT'"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
