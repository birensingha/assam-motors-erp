name: P32 QC PASS Ready for Delivery Readonly Diagnosis
on:
  push:
    branches: [fix/p32-qc-pass-ready-delivery-20261014]
    paths: [.github/workflows/p32-qc-ready-readonly.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only auth mapping, routes and attendance source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          test -f "$ROOT/artisan"
          cd "$ROOT"
          echo '=== P32 LIVE SERVER VALIDATION SOURCE ==='
          grep -n -A 36 'function readyForDelivery(' app/Http/Controllers/Web/AdminJobCardLifecyclePageController.php | head -n 41
          echo '=== P32 VIEW STATE CLASSIFICATION ==='
          grep -n -A 24 'amLifeStage=' resources/views/job-cards/lifecycle-panel.blade.php | head -n 41
          echo '=== P32 LATEST QC RECORD AND LINKED JOB CARD STATUS — NO CUSTOMER DETAILS ==='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::connection();
          $schema=\Illuminate\Support\Facades\Schema::class;
          foreach(['workshop_qc_checks','job_cards','job_card_change_audits'] as $table){
            echo 'P32_TABLE_'.$table.'_EXISTS='.(int)$schema::hasTable($table).PHP_EOL;
          }
          if(!$schema::hasTable('workshop_qc_checks'))exit(2);
          echo 'P32_QC_COLUMNS='.implode(',',$schema::getColumnListing('workshop_qc_checks')).PHP_EOL;
          $qc=$db->table('workshop_qc_checks')->orderByDesc('id')->limit(35)->get();
          $seen=[];
          foreach($qc as $item){
            $id=(int)$item->job_card_id;if(isset($seen[$id]))continue;$seen[$id]=true;
            $job=$db->table('job_cards')->where('id',$id)->first(['id','status','customer_public_status','invoice_id']);
            if(!$job)continue;
            $public=strtolower(trim((string)$job->customer_public_status));
            $status=strtolower(trim((string)$job->status));
            $pass=strtoupper(trim((string)$item->result))==='PASS';
            $oldGate=$status==='completed' && str_contains($public,'quality check passed');
            $newGate=$status==='completed' && $pass;
            echo 'P32_QC_JOB='.($job->id).
                ' latest_qc_id='.$item->id.
                ' qc_result='.strtoupper((string)$item->result).
                ' status='.$status.
                ' public_label='.str_replace(["\n","\r"],' ',(string)$job->customer_public_status).
                ' old_gate='.(int)$oldGate.
                ' canonical_qc_gate='.(int)$newGate.
                ' invoice_present='.(int)((int)($job->invoice_id??0)>0).PHP_EOL;
          }
          echo 'P32_READONLY_QC_DIAGNOSIS_PASS'.PHP_EOL;
          PHP
          REMOTE
      - if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
