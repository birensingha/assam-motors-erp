name: AM219 Hide Redundant Add New Part Bar STAGING
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-am219-hide-part-create-strip.yml'
      - 'deployment/live-fixes/AM219_HIDE_PART_CREATE_STRIP/**'
permissions: {contents: read, issues: write}
concurrency: {group: assam-motors-staging-control, cancel-in-progress: false}
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
      ROOT: ${{ vars.STAGING_APP_ROOT || '/home/u956497103/domains/assammotors.com/assam-erp-staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Python static syntax preflight
        id: qa
        run: python3 -m py_compile deployment/live-fixes/AM219_HIDE_PART_CREATE_STRIP/install.py
      - name: Configure private SSH
        id: ssh
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          test -n "$KEY" || test -n "$PASSWORD"
          install -d -m 700 ~/.ssh
          for n in 1 2 3 4; do
            if timeout 18 ssh-keyscan -T 12 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y sshpass
          fi
      - name: Guarded one-file STAGING source patch
        id: deploy
        run: |
          set -euo pipefail
          REMOTE="$USERNAME@$HOST"
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=14 -p "$PORT" -i ~/.ssh/id_ed25519)
            SCP=(scp -o BatchMode=yes -o ConnectTimeout=14 -P "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=14 -p "$PORT")
            SCP=(sshpass -e scp -o ConnectTimeout=14 -P "$PORT")
          fi
          "${SSH[@]}" "$REMOTE" 'mkdir -p "$HOME/AM219_PARTS_MASTER"'
          "${SCP[@]}" deployment/live-fixes/AM219_HIDE_PART_CREATE_STRIP/install.py "$REMOTE:~/AM219_PARTS_MASTER/install.py"
          "${SSH[@]}" "$REMOTE" "python3 ~/AM219_PARTS_MASTER/install.py check '$ROOT' && python3 ~/AM219_PARTS_MASTER/install.py apply '$ROOT'" 2>&1 | tee "$RUNNER_TEMP/am219_release.log"
      - name: STAGING outcome note
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.qa.outcome }}
          SSH_STATUS: ${{ steps.ssh.outcome }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
        run: |
          details=""
          if [ -f "$RUNNER_TEMP/am219_release.log" ];then
            details="$(grep '^AM219_' "$RUNNER_TEMP/am219_release.log" | tail -12 | tr '\n' ';' | cut -c1-1200 || true)"
          fi
          body="AM219 redundant Parts Create strip: source=$SOURCE, ssh=$SSH_STATUS, deployment=$DEPLOY_STATUS. $details. Browser visual check pending. Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api repos/"$GITHUB_REPOSITORY"/issues/124/comments -f body="$body" || true
      - name: Remove transient SSH credential
        if: always()
        run: rm -f ~/.ssh/id_ed25519
