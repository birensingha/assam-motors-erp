name: Inspect Job Part Issue Flow
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-job-part-issue-flow.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            SSH=(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519 -p "$SSH_PORT")
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          fi
          ROOT="/home/$SSH_USER/domains/assammotors.com/assam-erp-staging"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "ROOT='$ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$ROOT"
          echo '=== ROUTES PARTS ==='
          php artisan route:list | grep -Ei 'job-cards.*part|part.*job-cards|issue.*part|stock.*issue' || true
          echo '=== CONTROLLER PART METHODS ==='
          grep -nE 'public function .*Part|issue_status|inventory_movements|qty_out|JOB_PART|stock_qty' app/Http/Controllers/Web/AdminJobCardPageController.php | head -320 || true
          echo '=== SERVICES ==='
          grep -RInE 'issue_status|inventory_movements|qty_out|JOB_PART|stock_qty' app/Services app/Http/Controllers/Api/V1 | head -360 || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
