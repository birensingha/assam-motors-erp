name: Assam Motors Vendor Ledger Rounding Audit
on:
  push:
    branches: [feature/jobcard-delete-purchase-settlement-20261013]
    paths: [.github/workflows/vendor-ledger-roundoff-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read-only routes, finance schema and application source methods
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$APP"
          echo '=== VENDOR SERVICE LEDGER OPENING AND ENTRIES ==='
          nl -ba app/Services/VendorService.php | sed -n '84,160p'
          echo '=== VENDOR LEDGER VIEW BALANCE LABEL ==='
          sed -n '1,17p' resources/views/vendors/ledger.blade.php
          echo '=== PURCHASE BATCH ACTIVE STATUSES AND TYPES ==='
          php -r '
            require "vendor/autoload.php";$app=require "bootstrap/app.php";$app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $g=\Illuminate\Support\Facades\DB::table("workshop_purchase_batches")->selectRaw("purchase_type, record_status, COUNT(*) n")->groupBy("purchase_type","record_status")->get();
            foreach($g as $x)echo "BATCH_TYPE_STATUS ".$x->purchase_type." ".$x->record_status." count=".$x->n."\n";
          '
          echo 'VENDOR_ROUNDOFF_LEDGER_READONLY_PASS'
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"