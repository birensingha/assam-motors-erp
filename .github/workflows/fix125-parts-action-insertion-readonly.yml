name: FIX125 Parts Row Insertion Anchor - READ ONLY
on:
  push:
    branches: [audit/fix125-jc-parts-status-20261025]
    paths: ['.github/workflows/fix125-parts-action-insertion-readonly.yml']
permissions:
  contents: read
jobs:
  staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      USERNAME: ${{ secrets.STAGING_SSH_USER }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: Configure remote access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USERNAME"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in 1 2 3;do
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            test -n "$PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Inspect current parts row exact insertion anchors read only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY" ];then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=12 -p "$PORT" -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$PASSWORD"
            SSH=(sshpass -e ssh -o ConnectTimeout=12 -p "$PORT")
          fi
          "${SSH[@]}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/assammotors.com/assam-erp-staging"
          test -f artisan
          echo 'FIX125_INSERTION_READONLY_START'
          echo '=== SHA AND LINES ==='
          sha256sum resources/views/job-cards/show.blade.php resources/views/job-cards/part-stock-control.blade.php
          wc -l resources/views/job-cards/show.blade.php
          echo '=== PARTS ROW ==='
          sed -n '970,1130p' resources/views/job-cards/show.blade.php
          echo 'FIX125_INSERTION_READONLY_COMPLETE'
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
