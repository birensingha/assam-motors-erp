name: Assam Motors P20 Attendance View and Schema Readonly Details
on:
  push:
    branches: [fix/p20-admin-self-attendance-20261014]
    paths: [.github/workflows/p20-admin-attendance-detail.yml]
permissions:
  contents: read
jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - name: SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            test -n "$SSH_PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Read only admin attendance source and schema
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
          fi
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          cd "$ROOT"
          echo '== ADMIN ATTENDANCE VIEW =='
          sed -n '1,220p' resources/views/admin/native/attendance.blade.php
          echo '== CONTROLLER READ AND RETURN =='
          sed -n '240,385p' app/Http/Controllers/Web/AdminNativeModuleController.php
          echo '== MODELS AND AUDIT FIELDS =='
          sed -n '1,155p' app/Models/Attendance.php
          sed -n '1,125p' app/Models/ErpAuthUser.php
          echo '== DB INFORMATION (NO PERSONAL DATA) =='
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::connection();
          $schema=\Illuminate\Support\Facades\Schema::class;
          foreach(['attendance','staff','hr_audit_logs','staff_location_logs','erp_auth_users'] as $table) {
            echo 'TABLE='.$table.' EXIST='.(int)$schema::hasTable($table).PHP_EOL;
            if($schema::hasTable($table))echo 'COLUMNS_'.strtoupper($table).'='.implode(',',$schema::getColumnListing($table)).PHP_EOL;
          }
          $users=$db->table('erp_auth_users')->whereRaw('LOWER(email)=?', ['birensingha@outlook.com'])->get();
          foreach($users as $u){
             $staff=$db->table('staff')->where('id',(int)$u->staff_id)->first();
             echo 'LINK_STAFF_ATTENDANCE_ENABLED='.(int)($staff->attendance_enabled??0).PHP_EOL;
          }
          echo 'AUDIT_DETAIL_PASS'.PHP_EOL;
          PHP
          echo P20_ATTENDANCE_DETAILS_READONLY_PASS
          REMOTE
      - if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
