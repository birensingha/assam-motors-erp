name: Assam Motors P18 Purchase Register Android UI STAGING
on:
  push:
    branches: [feature/p18-purchase-register-android-ui-20261014]
    paths: [.github/workflows/p18-register-deploy.yml]
permissions:
  contents: read
concurrency:
  group: assam-p18-purchase-register
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP patch syntax
        run: php -l deployment/live-fixes/P18_PURCHASE_REGISTER_UI/PATCH_P18.php
      - name: Configure secure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" || test -n "$SSH_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Deploy single view with backup and authenticated page rendering check
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
            SCP=(scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -P "$SSH_PORT")
          else
            export SSHPASS="$SSH_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -p "$SSH_PORT")
            SCP=(sshpass -e scp -o StrictHostKeyChecking=accept-new -P "$SSH_PORT")
          fi
          REMOTE="$SSH_USER@$SSH_HOST"
          "${SSH[@]}" "$REMOTE" 'mkdir -p ~/assam-p18-purchase'
          "${SCP[@]}" deployment/live-fixes/P18_PURCHASE_REGISTER_UI/PATCH_P18.php "$REMOTE:~/assam-p18-purchase/PATCH_P18.php"
          "${SSH[@]}" "$REMOTE" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/domains/assammotors.com/assam-erp-staging"
          PATCH="$HOME/assam-p18-purchase/PATCH_P18.php"
          VIEW="$ROOT/resources/views/purchases/index.blade.php"
          test -f "$ROOT/artisan" && test -f "$VIEW"
          php "$PATCH" check "$ROOT"
          OUT="$(php "$PATCH" apply "$ROOT")"
          printf '%s\n' "$OUT"
          BACKUP="$(printf '%s\n' "$OUT" | sed -n 's/^P18_APPLIED_BACKUP=//p')"
          test -n "$BACKUP" && test -f "$BACKUP"
          rollback(){
            echo P18_RENDER_QA_FAILED_ROLLBACK
            cp "$BACKUP" "$VIEW"
            (cd "$ROOT" && php artisan view:clear >/dev/null 2>&1) || true
          }
          trap rollback ERR
          cd "$ROOT"
          php artisan view:clear >/dev/null
          php artisan view:cache >/dev/null
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $admin=\App\Models\ErpAuthUser::query()->where('active',1)->get()->first(fn($u)=>$u->isAdmin());
          if(!$admin){echo 'P18_NO_GO_ADMIN_NOT_FOUND'.PHP_EOL;exit(2);}
          \Illuminate\Support\Facades\Auth::guard('web')->setUser($admin);
          \Illuminate\Support\Facades\View::share('errors',new \Illuminate\Support\ViewErrorBag());
          try {
            $html=\Illuminate\Support\Facades\View::make('purchases.index',['rows'=>collect(),'filters'=>['q'=>'','type'=>'']])->render();
          } catch(\Throwable $e){echo 'P18_RENDER_ERROR_CLASS='.get_class($e).PHP_EOL;exit(3);}
          foreach(['p18-purchase-register','p18-hero','p18-actions','p18-osl','p18-parts','p18-filter','p18-register-table'] as $marker){
            if(!str_contains($html,$marker)){echo 'P18_NO_GO_MISSING_RENDER_MARKER_'.$marker.PHP_EOL;exit(4);}
          }
          if(substr_count($html,'New OSL Purchase')!==1 || substr_count($html,'New Parts Purchase')!==1){
            echo 'P18_NO_GO_DUPLICATE_OR_MISSING_BUTTONS'.PHP_EOL;exit(5);
          }
          if(!preg_match('~<nav class="p18-actions"[^>]*>.*?New OSL Purchase.*?New Parts Purchase.*?</nav>~s',$html)){
            echo 'P18_NO_GO_BUTTONS_NOT_IN_SAME_ROW'.PHP_EOL;exit(6);
          }
          foreach(['erp.purchases.osl.create','erp.purchases.create','erp.purchases.show','erp.purchases.index'] as $name){
            if(!\Illuminate\Support\Facades\Route::has($name)){echo 'P18_NO_GO_ROUTE_MISSING'.PHP_EOL;exit(7);}
          }
          echo 'P18_REAL_ADMIN_PAGE_RENDER_PASS'.PHP_EOL;
          echo 'P18_BOTH_CREATE_BUTTONS_SAME_ROW_PASS'.PHP_EOL;
          echo 'P18_RESPONSIVE_STYLE_MARKERS_PASS'.PHP_EOL;
          echo 'P18_NO_PURCHASE_DATA_OR_SERVER_CALCULATION_CHANGED'.PHP_EOL;
          PHP
          trap - ERR
          echo P18_STAGING_PURCHASE_REGISTER_UI_PASS
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
